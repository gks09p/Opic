function cleanRun(x){
  try{
    if(!x||typeof x!=="object")return null;
    const unit=x.unit;
    if(unit!=="boss"&&unit!=="rand"&&!TEMPLATES.some(t=>t.id===unit))return null;
    if(!Array.isArray(x.qs)||x.qs.length<1||x.qs.length>20)return null;
    const int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
    const qs=[];
    for(const q of x.qs){
      if(!q||!BYID[q.id]||!GTYPES[q.type])return null;
      const o={id:q.id,type:q.type};
      if(q.type==="start"||q.type==="key"||q.type==="bracket"){
        if(!Array.isArray(q.opts)||q.opts.length<2||q.opts.length>4||!q.opts.every(t=>typeof t==="string"&&t.length<200)||!int(q.ans,0,q.opts.length-1))return null;
        o.opts=q.opts.slice();o.ans=q.ans;
        if(int(q.pick,0,q.opts.length-1))o.pick=q.pick;
        if(q.type==="start"){if(!int(q.n,1,5))return null;o.n=q.n}
        if(q.type==="bracket"){if(!SEG[q.id]||!int(q.i,0,SEG[q.id].length-1))return null;o.i=q.i}
      }else if(q.type==="order"){
        const m=Array.isArray(q.chunks)?q.chunks.length:0;
        if(m<2||m>12||!q.chunks.every(t=>typeof t==="string"))return null;
        if(!Array.isArray(q.pool)||q.pool.length!==m||!q.pool.every(v=>int(v,0,m-1))||new Set(q.pool).size!==m)return null;
        const pl=Array.isArray(q.placed)?q.placed:[];
        if(!pl.every(v=>int(v,0,m-1))||new Set(pl).size!==pl.length)return null;
        o.chunks=q.chunks.slice();o.pool=q.pool.slice();o.placed=pl.slice();
      }else if(q.type==="say"){
        o.shown=false;
      }else{
        if(!int(q.n,1,5))return null;
        o.n=q.n;o.text=typeof q.text==="string"?q.text.slice(0,200):"";o.hint=!!q.hint;
      }
      qs.push(o);
    }
    if(!int(x.i,0,qs.length-1)||!int(x.hearts,0,3))return null;
    const n=(v,max)=>Number.isInteger(v)&&v>=0?Math.min(v,max||99999):0;
    let res=null;
    if(x.res&&typeof x.res==="object"){
      res={ok:!!x.res.ok,gain:n(x.res.gain),mult:int(x.res.mult,1,3)?x.res.mult:1,msg:typeof x.res.msg==="string"?x.res.msg.slice(0,120):"",
        notes:Array.isArray(x.res.notes)?x.res.notes.filter(t=>typeof t==="string").slice(0,6).map(t=>t.slice(0,120)):[]};
    }
    return {unit:unit,qs:qs,i:x.i,hearts:x.hearts,combo:n(x.combo,99),maxCombo:n(x.maxCombo,99),correct:n(x.correct,99),xp:n(x.xp),res:res,
      badges:(Array.isArray(x.badges)?x.badges:[]).filter(id=>BADGES.some(b=>b.id===id)),lvUp:n(x.lvUp,999),
      bonus:Array.isArray(x.bonus)?x.bonus.filter(t=>typeof t==="string").slice(0,4):[]};
  }catch(e){return null}
}

function beep(seq){

      o.connect(gn);gn.connect(GAC.destination);o.start(t);o.stop(t+x[1]+0.02);
      t+=x[1]*0.9;
    });
  }catch(e){}
}
const SND={ok:[[660,.08],[880,.12]],combo:[[660,.07],[880,.07],[1100,.14]],no:[[220,.16],[160,.26]],clear:[[523,.1],[659,.1],[784,.1],[1046,.3]],fail:[[300,.2],[230,.2],[160,.36]]};

/* ----- 문제 만들기 ----- */
const G={mode:"home",run:null};
const wordsOf=c=>c.en.split(" ");
const startN=c=>wordsOf(c).length<=6?2:3;
const startOf=(c,n)=>wordsOf(c).slice(0,n).join(" ");
function chunkize(en){                    // 문장을 3~8덩어리로 나눔
  const w=en.split(" "),n=w.length,k=Math.max(3,Math.min(8,Math.round(n/3))),out=[];
  let s=0;
  for(let i=0;i<k;i++){const e=Math.round((i+1)*n/k);if(e>s)out.push(w.slice(s,e).join(" "));s=e}
  return out;
}
function uniq(list,not){const seen=new Set(not.map(x=>x.toLowerCase())),out=[];list.forEach(x=>{const k=x.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(x)}});return out}
function makeQ(c,type){
  const q={id:c.id,type:type};
  const others=shuffle(ALL.filter(x=>x.id!==c.id));
  const same=others.filter(x=>x.tid===c.tid);
  if(type==="start"){
    const n=startN(c),ans=startOf(c,n);
    const cand=uniq(same.concat(others).map(x=>startOf(x,n)),[ans]);
    const dis=cand.slice(0,3);
    q.n=n;q.opts=shuffle(dis.concat([ans]));q.ans=q.opts.indexOf(ans);
  }else if(type==="key"){
    const low=c.en.toLowerCase();
    const wc=c.key.split(" ").length;
    const cand=uniq(others.map(x=>x.key).filter(k=>!low.includes(k.toLowerCase())),[c.key]);
    cand.sort((a,b)=>Math.abs(a.split(" ").length-wc)-Math.abs(b.split(" ").length-wc));   // 길이가 비슷한 보기를 우선
    const dis=shuffle(cand.slice(0,8)).slice(0,3);
    q.opts=shuffle(dis.concat([c.key]));q.ans=q.opts.indexOf(c.key);
  }else if(type==="order"){
    q.chunks=chunkize(c.en);
    let pool=q.chunks.map((_,i)=>i);
    for(let t=0;t<12;t++){pool=shuffle(pool);if(pool.some((v,i)=>v!==i))break}
    q.pool=pool;q.placed=[];
  }else if(type==="bracket"){
    const bl=brBlanks(c,1);
    if(!bl.length)return makeQ(c,"key");
    const o=brOpts(c.id,SEG[c.id][bl[0]][0]);
    q.i=bl[0];q.opts=o.opts;q.ans=o.ans;
  }else if(type==="say"){
    q.shown=false;
  }else{
    q.n=Math.min(3,wordsOf(c).length-1);q.text="";q.hint=false;
  }
  return q;
}
const RAND_N=20;                          // 랜덤 도전 문제 수
function pickPool(unit){                  // 모르겠다고 한 문장, 틀린 문장을 먼저 내고 나머지는 무작위
  if(unit==="rand"){                       // 랜덤 도전: 한 번도 안 해본 문장을 무작위 순서로 먼저, 다 나오면 틀린 문장이 더 자주 나오는 나머지로 채움
    const ids=active().map(c=>c.id);
    const fresh=shuffle(ids.filter(id=>!seenOf(id)));
    const rest=wpick(ids.filter(id=>seenOf(id)),ids.length);
    return fresh.concat(rest).slice(0,RAND_N).map(id=>BYID[id]);
  }
  const list=unit==="boss"?ALL:ALL.filter(c=>c.tid===unit);
  return list.map(c=>[c,(statusOf(c.id)==="m"?2:0)+(wrongOf(c.id)>0?1:0)+Math.random()*0.9])
    .sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function startRun(unit){
  audioStop();listStop();
  const pool=pickPool(unit);
  if(!pool.length)return;
  const rnd=unit==="rand",boss=unit==="boss"||rnd;
  const N=unit==="boss"?12:rnd?RAND_N:Math.min(8,pool.length*3);
  const qs=[];
  for(let i=0;i<N;i++){
    const k=i%pool.length,r=Math.floor(i/pool.length);
    let type=rnd?GCYC[Math.floor(Math.random()*GCYC.length)]:GCYC[(r+k)%GCYC.length];
    if(boss?i%6===5:(i===N-1&&N>=6))type="typed";
    qs.push(makeQ(pool[k],type));
  }
  G.run={unit:unit,qs:qs,i:0,hearts:GMAXH,combo:0,maxCombo:0,correct:0,xp:0,res:null,badges:[],lvUp:0,cleared:false,stars:0,bonus:[]};
  G.mode="run";
  persistRun();save();
  renderGame();
}

/* ----- 정답 처리 ----- */
function answer(ok,hinted){
  const r=G.run,q=r.qs[r.i],c=BYID[q.id],g=GS();
  if(r.res)return;
  const en=entry(c.id);en.n=(en.n||0)+1;
  const before=lvOf(g.xp).lv;
  const base={order:15,start:10,key:10,typed:25,bracket:12,say:10}[q.type]*(q.hint?0.5:1);
  const res={ok:ok,gain:0,mult:1,msg:"",notes:[]};
  if(ok){
    r.combo++;r.correct++;rsGood(c.id);
    if(r.combo>r.maxCombo)r.maxCombo=r.combo;
    res.mult=r.combo>=6?3:r.combo>=3?2:1;
    res.gain=Math.round(base*res.mult);
    g.stat.correct++;if(r.combo>g.stat.combo)g.stat.combo=r.combo;
    touchStreak(g);
    const d=dayState(g);d.q++;
    if(d.q>=GQUEST_Q&&!d.a){d.a=1;res.gain+=GQUEST_XP;res.notes.push("🎁 퀘스트 완료! 정답 "+GQUEST_Q+"개 · +"+GQUEST_XP+" XP")}
    res.msg=r.combo===3?"🔥 3콤보! 점수가 2배가 돼요":r.combo===6?"🔥🔥 6콤보! 점수가 3배가 돼요":GOK[Math.floor(Math.random()*GOK.length)];
    beep(r.combo===3||r.combo===6?SND.combo:SND.ok);
  }else{
    if(q.type!=="say")r.hearts--;                 // 말하기는 스스로 채점하므로 하트는 깎지 않아요
    r.combo=0;addWrong(c.id);
    if(r.unit==="rand"&&r.qs.length<16){                       // 랜덤 도전: 틀린 문장은 몇 문제 뒤에 다른 유형으로 또 나와요
      const ts=GCYC.filter(t=>t!==q.type);
      r.qs.splice(Math.min(r.i+4,r.qs.length),0,makeQ(c,ts[Math.floor(Math.random()*ts.length)]||"key"));
    }
    res.msg=GNO[Math.floor(Math.random()*GNO.length)];
    beep(SND.no);
  }
  g.xp+=res.gain;r.xp+=res.gain;
  const lv=lvOf(g.xp).lv;
  if(lv>before){res.notes.push("🎉 레벨 "+lv+" · "+GTITLES[Math.min(lv,GTITLES.length)-1]);r.lvUp=lv}
  checkBadges(g).forEach(b=>{r.badges.push(b);res.notes.push("🏅 새 배지 · "+b.icon+" "+b.name)});
  r.res=res;
  persistRun();
  save();
  gameSay(c.en);
  renderGame();
}
function nextQ(){
  const r=G.run;
  if(!r||!r.res)return;
  audioStop();
  if(r.hearts<=0)return endRun(false);
  r.i++;
  if(r.i>=r.qs.length)return endRun(true);
  r.res=null;
  persistRun();save();
  renderGame();
}
function endRun(cleared){
  const r=G.run,g=GS();
  const before=lvOf(g.xp).lv;
  r.cleared=cleared;
  g.stat.runs++;
  if(cleared){
    r.stars=r.hearts>=3?3:r.hearts===2?2:1;
    const bonus=30+20*r.stars;
    g.xp+=bonus;r.xp+=bonus;r.bonus.push("스테이지 클리어 +30 XP, 별 "+r.stars+"개 +"+(20*r.stars)+" XP");
    g.stat.clears++;if(r.stars===3)g.stat.perfect++;if(r.unit==="boss")g.stat.boss++;
    if(r.unit!=="rand"&&(!g.best[r.unit]||g.best[r.unit]<r.stars))g.best[r.unit]=r.stars;
    touchStreak(g);
    const d=dayState(g);d.c++;
    if(d.c>=1&&!d.b){d.b=1;g.xp+=GQUEST_XP;r.xp+=GQUEST_XP;r.bonus.push("🎁 퀘스트 완료! 스테이지 클리어 · +"+GQUEST_XP+" XP")}
  }
  const lv=lvOf(g.xp).lv;
  if(lv>before)r.lvUp=lv;
  checkBadges(g).forEach(b=>r.badges.push(b));
  g.run=null;
  save();renderStats();
  beep(cleared?SND.clear:SND.fail);
  G.mode="end";
  renderGame();
}

function bindRun(v,q,c){
  const r=G.run;
  $("#gquit").onclick=()=>{audioStop();persistRun();save();G.mode="home";G.run=null;renderGame()};
  if(r.res){bindAudio(v,c.en);$("#gnext").onclick=nextQ;return}
  if(q.type==="say"){
    const sh=$("#gshow");if(sh)sh.onclick=()=>{q.shown=true;renderRun(v)};
    const gr=ok=>{const e=entry(c.id);e.s=ok?"k":"m";answer(ok)};
    const y=$("#gsyes"),n=$("#gsno");if(y)y.onclick=()=>gr(true);if(n)n.onclick=()=>gr(false);
    return;
  }
  if(q.type==="start"||q.type==="key"||q.type==="bracket"){
    v.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{q.pick=+b.dataset.o;answer(q.pick===q.ans)});
  }else if(q.type==="order"){
    v.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{if(G.dragged)return;q.placed.push(+b.dataset.add);renderRun(v)});
    v.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{if(G.dragged)return;q.placed.splice(+b.dataset.rm,1);renderRun(v)});
    bindDrag(v,q);
    $("#greset").onclick=()=>{q.placed=[];renderRun(v)};
    $("#gcheck").onclick=()=>{
      if(q.placed.length!==q.chunks.length)return;
      answer(q.placed.map(i=>q.chunks[i]).join(" ")===c.en);
    };
  }else{
    const inp=$("#gtext");
    inp.oninput=()=>{q.text=inp.value};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#gcheck").click()}};
    $("#ghint").onclick=()=>{q.text=inp.value;q.hint=true;renderRun(v)};
    $("#gidk").onclick=()=>{q.text=inp.value;answer(false)};
    $("#gcheck").onclick=()=>{
      q.text=inp.value;
      const exp=norm(wordsOf(c).slice(0,q.n).join(" ")),got=norm(q.text);
      const m=lcsMark(exp,got);
      answer(m.score===1&&got.length===exp.length);
    };
    try{inp.focus({preventScroll:true})}catch(e){}
  }
}

/* ----- 조각 끌어다 놓기 (마우스·터치 모두) ----- */
function bindDrag(v,q){
  const slot=v.querySelector(".slotline");
  if(!slot||!window.PointerEvent)return;
  v.querySelectorAll(".chunk[data-add],.chunk[data-rm]").forEach(el=>{
    el.addEventListener("pointerdown",e=>{
      if(e.button>0)return;
      const src=el.dataset.add!==undefined?{from:"pool",idx:+el.dataset.add}:{from:"placed",pos:+el.dataset.rm};
      const sx=e.clientX,sy=e.clientY;
      let ghost=null,ins=-1,over=false;
      const chips=()=>Array.from(slot.querySelectorAll(".chunk"));
      const clear=()=>{chips().forEach(c=>c.classList.remove("insb"));slot.classList.remove("inse");slot.classList.remove("over")};
      const stop=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",cancel)};
      function move(ev){
        if(!ghost){
          if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<8)return;
          ghost=el.cloneNode(true);ghost.removeAttribute("data-add");ghost.removeAttribute("data-rm");
          ghost.className="chunk gghost";
          document.body.appendChild(ghost);el.classList.add("dragging");G.dragged=true;
        }
        ghost.style.left=(ev.clientX-ghost.offsetWidth/2)+"px";
        ghost.style.top=(ev.clientY-ghost.offsetHeight/2)+"px";
        const r=slot.getBoundingClientRect();
        over=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top-24&&ev.clientY<=r.bottom+24;
        clear();ins=-1;
        if(over){
          slot.classList.add("over");
          const cs=chips();ins=cs.length;
          for(let i=0;i<cs.length;i++){
            const b=cs[i].getBoundingClientRect();
            if(ev.clientY<b.top||(ev.clientY<=b.bottom&&ev.clientX<b.left+b.width/2)){ins=i;break}
          }
          if(ins<cs.length)cs[ins].classList.add("insb");else slot.classList.add("inse");
        }
      }
      function cancel(){stop();if(ghost){ghost.remove();el.classList.remove("dragging");clear();setTimeout(()=>{G.dragged=false},0)}}
      function up(){
        stop();
        if(!ghost)return;                       // 움직이지 않았으면 그냥 클릭
        ghost.remove();setTimeout(()=>{G.dragged=false},0);
        if(over){
          if(src.from==="pool")q.placed.splice(ins,0,src.idx);
          else{const x=q.placed.splice(src.pos,1)[0];q.placed.splice(ins>src.pos?ins-1:ins,0,x)}
        }else if(src.from==="placed")q.placed.splice(src.pos,1);
        renderRun(v);
      }
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up);
      window.addEventListener("pointercancel",cancel);
    });
  });
}

/* ---------- Claude에게 질문: 모르는 표현·문법을 바로 물어보기 ---------- */
const ASK={sample:null,open:false,busy:false,ctl:null,log:[],cur:null,ctxOn:true,deep:false,dead:false};
const ASK_RULES=[
 "너는 한국인 학습자가 OPIc(영어 말하기 시험) IH-AL 등급을 준비하도록 돕는 영어 선생님이야.",
 "답변 규칙:",
 "1. 한국어로 답해. 영어 표현은 영어 그대로 쓰고 뜻을 괄호로 붙여.",
 "2. 핵심을 한두 줄로 가장 먼저 말해.",
 "3. 그다음 쉬운 예문 2개(영어 + 한국어 뜻)를 보여 줘. 시험장에서 바로 말할 수 있는 짧은 문장으로.",
 "4. 문법이 필요하면 규칙은 한두 줄로만 설명해.",
 "5. 전체는 짧게(200~400자 정도) 써. 제목, 표, 목록 기호는 쓰지 말고 강조는 **굵게**만 써.",
 "6. 확실하지 않으면 모른다고 말해. 추측해서 단정하지 마."
].join("\n");
const ASK_CHIPS=["이 문장 쉽게 설명해줘","문법 설명해줘","비슷한 예문 보여줘"];
const ASK_DEAD=["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"];

function curId(){                  // 지금 화면에서 공부 중인 문장
  try{
    if(TAB==="today")return T1.i<T1.q.length?T1.q[T1.i]:null;
    if(TAB==="quiz")return Q.q[Q.i]?Q.q[Q.i].id:null;
    if(TAB==="fill")return F.q[F.i]||null;
    if(TAB==="bracket")return BR.q[BR.i]?BR.q[BR.i].id:null;
    if(TAB==="write")return W.id||null;
    if(TAB==="listen")return LP.playing?LP.ids[LP.idx]:null;
    if(TAB==="game")return G.mode==="run"&&G.run&&G.run.qs[G.run.i]?G.run.qs[G.run.i].id:null;
  }catch(e){}
  return null;
}
function ctxText(c){
  const g=grammarFor(c.en).map(x=>x[0]).join(" / ");
  return "[지금 공부 중인 문장]\n영어: "+c.en+"\n한국어: "+c.ko+"\n핵심 표현: "+c.key+"\n단원: "+c.tname+(g?"\n문법 포인트: "+g:"")+
   "\n질문이 이 문장에 대한 것이면 위 정보를 바탕으로 답해.";
}
function fmtAns(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function askErr(code){
  return ({
   not_granted:"Claude 사용을 허용하지 않아서 질문할 수 없어요.",
   sampling_disabled:"이 계정에서는 질문 기능을 쓸 수 없어요.",
   not_declared:"질문 기능이 꺼져 있어요.",
   capability_disabled:"이 화면에서는 질문 기능을 쓸 수 없어요.",
   capability_removed:"이 화면에서는 질문 기능을 쓸 수 없어요.",
   rate_limited:"요청이 너무 많거나 사용량 한도에 도달했어요. 잠시 후 다시 질문해 주세요.",
   session_expired:"로그인이 만료됐어요. 다시 로그인한 뒤 질문해 주세요.",
   refused:"이 질문에는 답하지 못해요. 다른 표현으로 물어봐 주세요.",
   empty_completion:"답이 비어 있어요. 질문을 조금 바꿔서 다시 물어봐 주세요.",
   prompt_too_large:"질문이 너무 길어요. 짧게 줄여 주세요."
  })[code]||"연결에 문제가 생겼어요. 다시 질문해 주세요.";
}

       (m.a?fmtAns(m.a):(m.busy?'<span class="think">생각하는 중…</span>':''))+
       (m.err?'<p class="aerr">'+esc(m.err)+'</p>':'')+'</div>').join("")
   :'<p class="note" style="margin:0">모르는 표현이나 문법을 적고 물어보세요. 쉬운 예문과 함께 알려드려요.</p>';

async function askSend(raw){
  const q=String(raw||"").trim();
  if(!q||ASK.busy||ASK.dead||!ASK.sample)return;
  const c=ASK.ctxOn&&ASK.cur?BYID[ASK.cur]:null;
  const user=(c?ctxText(c)+"\n\n질문: ":"")+q;
  const turns=[{role:"user",content:ASK_RULES}];
  ASK.log.filter(m=>m.a&&!m.err&&m.u).slice(-3).forEach(m=>{
    turns.push({role:"user",content:m.u});turns.push({role:"assistant",content:m.a});
  });
  turns.push({role:"user",content:user});
  const m={q:q,u:user,a:"",err:"",busy:true};
  ASK.log.push(m);ASK.busy=true;ASK.ctl=new AbortController();
  const inp=$("#askq");if(inp)inp.value="";
  askUI();askRender();
  try{
    const r=await ASK.sample(turns,{
      cache:false,signal:ASK.ctl.signal,modelTier:ASK.deep?"default":"quick",
      onText:u=>{m.a=u.text;askRender()}
    });
    m.a=r.text;
    if(r.truncated)m.err="답이 길어서 중간에 끊겼어요. 나눠서 물어봐 주세요.";
  }catch(e){
    const code=e&&e.code;
    if(code==="refused")m.a="";
    else if(e&&e.text)m.a=e.text;
    if(code==="cancelled"){if(!m.a)m.err="중지했어요."}
    else m.err=askErr(code);
    if(ASK_DEAD.includes(code))ASK.dead=true;
  }finally{
    m.busy=false;ASK.busy=false;ASK.ctl=null;
    askUI();askRender();
  }
}

function initAsk(){
  const form=$("#askform");
  if(!form)return;
  form.onsubmit=e=>{e.preventDefault();askSend($("#askq").value)};
  $("#askfab").onclick=askOpen;
  $("#askclose").onclick=askClose;
  $("#askstop").onclick=()=>{if(ASK.ctl)ASK.ctl.abort()};
  $("#asknew").onclick=()=>{ASK.log=[];askUI();askRender()};
  $("#askctxon").onchange=e=>{ASK.ctxOn=e.target.checked};
  $("#askdeep").onchange=e=>{ASK.deep=e.target.checked};
  const chips=$("#askchips");
  if(chips){
    chips.innerHTML=ASK_CHIPS.map(t=>'<button type="button" class="btn ghost">'+esc(t)+'</button>').join("");
    chips.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>askSend(ASK_CHIPS[i]));

/* ----- 질문창 옮기기·크기 조절: 제목줄을 끌면 이동, 오른쪽 아래 모서리를 끌면 크기 변경 ----- */
ASK.pos=null;
function initAskMove(){
  const pn=$("#askpanel"),hd=pn&&pn.querySelector(".askhead"),gr=$("#askgrip"),rs=$("#askreset");
  if(!pn||!hd||!gr||!rs||!window.PointerEvent)return;
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function apply(){
    const p=ASK.pos;
    if(!p){pn.classList.remove("free");["left","top","width","height"].forEach(k=>{pn.style[k]=""});rs.hidden=true;return}
    const vw=window.innerWidth,vh=window.innerHeight;
    p.w=clamp(p.w,Math.min(280,vw),vw);p.h=clamp(p.h,Math.min(220,vh),vh);
    p.l=clamp(p.l,0,vw-p.w);p.t=clamp(p.t,0,vh-p.h);          // 창이 화면 밖으로 나가지 않게
    pn.classList.add("free");
    pn.style.left=p.l+"px";pn.style.top=p.t+"px";pn.style.width=p.w+"px";pn.style.height=p.h+"px";
    rs.hidden=false;
  }
  function track(e,mode){
    if(e.button>0)return;
    const r=pn.getBoundingClientRect();
    if(!ASK.pos)ASK.pos={l:r.left,t:r.top,w:r.width,h:r.height};
    const s={x:e.clientX,y:e.clientY,p:Object.assign({},ASK.pos)};
    e.preventDefault();
    pn.classList.add("moving");
    const mv=ev=>{
      const dx=ev.clientX-s.x,dy=ev.clientY-s.y;
      const P=ASK.pos,o=s.p,MINW=Math.min(280,window.innerWidth),MINH=Math.min(220,window.innerHeight);
      if(mode==="move"){P.l=o.l+dx;P.t=o.t+dy}
      else{                                   // 모서리·가장자리 어디서든 크기 조절 (e,w,s,n 조합)
        if(mode.includes("e"))P.w=Math.max(MINW,o.w+dx);
        if(mode.includes("s"))P.h=Math.max(MINH,o.h+dy);
        if(mode.includes("w")){P.w=Math.max(MINW,o.w-dx);P.l=o.l+o.w-P.w}
        if(mode.includes("n")){P.h=Math.max(MINH,o.h-dy);P.t=o.t+o.h-P.h}
      }
      apply();
    };
    const up=()=>{
      window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
      pn.classList.remove("moving");
    };
    window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
  }
  hd.addEventListener("pointerdown",e=>{if(e.target.closest("button,input,label"))return;track(e,"move")});
  gr.addEventListener("pointerdown",e=>track(e,"se"));
  ["n","s","e","w","ne","nw","sw"].forEach(m=>{
    const d=document.createElement("div");d.className="askedge ed-"+m;d.setAttribute("aria-hidden","true");
    d.addEventListener("pointerdown",e=>track(e,m));pn.appendChild(d);
  });
  rs.onclick=()=>{ASK.pos=null;apply()};
  window.addEventListener("resize",()=>{if(ASK.pos)apply()});
}

const LG={open:false,date:null,item:"today",unit:"",min:30,del:null,msg:""};
function addPast(k,item,unit,min){          // 문제가 있으면 안내 문구를, 성공하면 "" 반환
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return "날짜를 골라 주세요.";
  if(k>dayKey())return "오늘 이후 날짜는 넣을 수 없어요.";

/* ---------- 주제 연습 진도 데이터 (학습 탭의 "외운 주제" 범위에서 사용) ---------- */
// S.plan = { t: {주제 id: [공부한 날짜…]}, ... } — 지난 "오늘 계획" 기능이 쓰던 기록을 보존용으로만 읽음
const plUnits=()=>TEMPLATES.filter(t=>t.group==="주제 연습");
function cleanPlan(x){
  const out={n:3,t:{},chk:{k:"",v:{}}};
  try{
    x=x||{};
    if(Number.isInteger(x.n)&&x.n>=1&&x.n<=6)out.n=x.n;
    const ok=k=>typeof k==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(k);
    const topic=id=>TEMPLATES.some(t=>t.id===id&&t.group==="주제 연습");
    Object.keys(x.t||{}).forEach(id=>{
      if(!topic(id)||!Array.isArray(x.t[id]))return;
      const a=[...new Set(x.t[id].filter(ok))].sort().slice(0,4);
      if(a.length)out.t[id]=a;
    });
    const c=x.chk||{};
    if(ok(c.k)){
      out.chk.k=c.k;
      Object.keys(c.v||{}).forEach(id=>{const m=c.v[id];if(topic(id)&&Number.isInteger(m)&&m>=0&&m<32)out.chk.v[id]=m});
    }
  }catch(e){}
  return out;
}
function plS(){return S.plan||(S.plan=cleanPlan(null))}
const plDates=id=>plS().t[id]||[];
const plN=id=>plDates(id).length;
/* ---------- 학습 범위 바로 고르기 (주제 연습 / 외운 주제 / 템플릿 / 전체) ---------- */
const SCOPES=[["topic","📚 주제 연습"],["done","✅ 외운 주제"],["tpl","템플릿"],["all","전체"]];
function scopeIds(k){
  if(k==="topic")return plUnits().map(t=>t.id);
  if(k==="done")return plUnits().filter(t=>plN(t.id)>0).map(t=>t.id);
  if(k==="tpl")return TEMPLATES.filter(t=>t.group!=="주제 연습").map(t=>t.id);
  return TEMPLATES.map(t=>t.id);
}
function scopeRow(){
  const cur=new Set(S.units||TEMPLATES.map(t=>t.id));
  return '<div class="filter scope" role="group" aria-label="범위 바로 고르기">'+SCOPES.map(s=>{
    const ids=scopeIds(s[0]);
    const on=ids.length>0&&ids.length===cur.size&&ids.every(id=>cur.has(id));
    return '<button type="button" data-sc="'+s[0]+'" aria-pressed="'+on+'"'+(ids.length?'':' disabled')+'>'+s[1]+'</button>';
  }).join("")+'</div>';
}

/* ---------- 모의고사 (주제 연습 설문 질문만 사용) ---------- */
const MK={phase:"home",n:15,sec:60,items:[],i:0,remain:0,timer:null,revealed:false,showKo:false,startedAt:0,elapsed:0};
const MK_N=[8,12,15];
const MK_SEC=[40,60,90];
function mkBuild(n){                      // 주제를 무작위로 골라 그 주제의 설문 질문을 묶음(세트)째로 담음
  const pool=shuffle(TOPIC_IDS.slice());
  const items=[];
  for(const tid of pool){
    if(items.length>=n)break;
    const tpl=TEMPLATES.find(t=>t.id===tid);
    if(!tpl||!Array.isArray(tpl.qs)||!tpl.qs.length)continue;
    tpl.qs.forEach((q,qi)=>items.push({tid:tpl.id,tname:tpl.name,en:q[0],ko:q[1]||"",first:qi===0}));
  }
  return items;
}

function mkFmt(s){s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

    MK.remain--;
    const t=v.querySelector(".mktimer");
    if(t){t.textContent=mkFmt(MK.remain);t.classList.toggle("low",MK.remain<=10)}
    if(MK.remain<=0)mkReveal();
  },1000);
}
function mkReveal(){
  mkClearTimer();
  MK.revealed=true;
  audioStop();
  renderMockTest($("#v-mock"));
}
function mkNext(){
  audioStop();mkClearTimer();
  MK.i++;
  if(MK.i>=MK.items.length){MK.phase="end";MK.elapsed=Date.now()-MK.startedAt;renderMock();return}
  mkEnterQuestion();
}
function mkQuit(){audioStop();mkClearTimer();MK.phase="home";renderMock()}
function renderMock(){
  const v=$("#v-mock");
  if(MK.phase==="test")renderMockTest(v);
  else if(MK.phase==="end")renderMockEnd(v);
  else renderMockHome(v);
}
function renderMockHome(v){
  v.innerHTML=
   '<div class="gcard"><h2 class="gh">실전처럼 모의고사 보기</h2>'+
   '<p class="note">실제 오픽은 보통 자기소개와 설문 주제, 역할극, 돌발 주제를 합쳐 한 세트에 12~15문항이 나와요. '+
   '이 모의고사는 지금까지 외운 <b>주제 연습 '+TOPIC_IDS.length+'개 주제의 실제 설문 질문</b>만 사용해요. 자기소개·역할극·돌발 상황 질문은 들어 있지 않아요.</p>'+
   '<p class="note" style="margin-top:8px">질문이 나오면 자동으로 한 번 읽어 줘요. 답변 시간이 끝나면 모범 답안이 나타나니, 직접 소리 내어 말한 것과 비교해 보세요.</p></div>'+
   '<div class="gcard"><p class="note" style="margin:0 0 8px">문항 수</p><div class="filter" role="group" aria-label="문항 수">'+
    MK_N.map(n=>'<button type="button" data-mkn="'+n+'" aria-pressed="'+(n===MK.n)+'">'+n+'문항</button>').join("")+'</div>'+
   '<p class="note" style="margin:14px 0 8px">문항당 답변 시간</p><div class="filter" role="group" aria-label="답변 시간">'+
    MK_SEC.map(s=>'<button type="button" data-mks="'+s+'" aria-pressed="'+(s===MK.sec)+'">'+s+'초</button>').join("")+'</div></div>'+
   '<button class="gboss" id="mkstart" type="button"><span class="gbi" aria-hidden="true">🎤</span><span class="st"><b>모의고사 시작</b><small>'+MK.n+'문항 · 문항당 '+MK.sec+'초</small></span></button>';
  v.querySelectorAll("[data-mkn]").forEach(b=>b.onclick=()=>{MK.n=+b.dataset.mkn;renderMockHome(v)});
  v.querySelectorAll("[data-mks]").forEach(b=>b.onclick=()=>{MK.sec=+b.dataset.mks;renderMockHome(v)});
  $("#mkstart").onclick=mkStart;
}
function renderMockTest(v){
  const item=MK.items[MK.i];
  const cards=ALL.filter(c=>c.tid===item.tid);
  const script=MK.revealed?'<div class="reveal"><p class="hint" style="margin-bottom:8px">모범 답안 · '+esc(item.tname)+'</p>'+
    cards.map(c=>'<p class="en">'+highlight(c)+'</p><p class="hint" style="margin:2px 0 10px">'+esc(c.ko)+'</p>').join("")+'</div>':"";
  v.innerHTML=
   '<div class="ghud"><button class="btn ghost" id="mkquit" type="button">⏸ 그만하기</button>'+
    '<span class="chip">'+(MK.i+1)+' / '+MK.items.length+'</span></div>'+
   '<div class="progress"><i style="width:'+Math.round(MK.i/MK.items.length*100)+'%"></i></div>'+
   '<div class="card"><div class="chips"><span class="chip">'+esc(item.tname)+'</span></div>'+
   '<p class="cue">'+esc(item.en)+'</p>'+
   (MK.showKo&&item.ko?'<p class="hint">'+esc(item.ko)+'</p>':'')+
   (item.ko?'<div class="row" style="margin-top:6px"><button class="btn ghost" id="mkko" type="button">'+(MK.showKo?'질문 번역 숨기기':'질문 번역 보기')+'</button></div>':'')+
   '<p class="mktimer'+(MK.remain<=10?' low':'')+'">'+mkFmt(MK.remain)+'</p><p class="mklabel">남은 답변 시간 · 소리 내어 답해 보세요</p>'+
   '<div class="row">'+audioBar()+'</div>'+
   script+
   '<div class="row">'+(MK.revealed?'':'<button class="btn ghost" id="mkreveal" type="button">모범 답안 보기</button>')+
   '<button class="btn primary" id="mknext" type="button">'+(MK.i+1>=MK.items.length?'결과 보기':'다음 질문 ▶')+'</button></div></div>';
  bindAudio(v,item.en);
  $("#mkquit").onclick=mkQuit;
  const ko=$("#mkko");if(ko)ko.onclick=()=>{MK.showKo=!MK.showKo;renderMockTest(v)};
  const rv=$("#mkreveal");if(rv)rv.onclick=mkReveal;
  $("#mknext").onclick=mkNext;
}
function renderMockEnd(v){
  const topics=[...new Set(MK.items.map(i=>i.tname))];
  const mm=Math.floor(MK.elapsed/60000),ss=Math.floor((MK.elapsed%60000)/1000);
  v.innerHTML=
   '<div class="gcard"><h2 class="gh">모의고사 완료!</h2>'+
   '<p class="note">총 '+MK.items.length+'문항 · '+topics.length+'개 주제 · 소요 시간 '+mm+'분 '+String(ss).padStart(2,"0")+'초</p></div>'+
   '<div class="gcard"><p class="note" style="margin:0 0 8px">이번에 나온 주제</p><div class="chips">'+
    topics.map(t=>'<span class="chip">'+esc(t)+'</span>').join("")+'</div></div>'+
   '<button class="gboss" id="mkagain" type="button"><span class="gbi" aria-hidden="true">🔁</span><span class="st"><b>다시 보기</b><small>새 모의고사를 시작해요</small></span></button>'+
   '<div class="row"><button class="btn ghost" id="mkhome" type="button">학습으로 돌아가기</button></div>';
  $("#mkagain").onclick=()=>{MK.phase="home";renderMock()};
  $("#mkhome").onclick=()=>setTab("game");
}

/* ---------- 전체 보기 / 검색 ---------- */
const SR={q:"",group:""};
function markHit(text,q){
  if(!q)return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function srCards(){
  const q=SR.q.trim(),grp=SR.group,needle=q.toLowerCase();
  const out=[];
  TEMPLATES.forEach(t=>{
    if(grp&&t.group!==grp)return;
    const nameHit=!q||t.name.toLowerCase().includes(needle);
    const keep=(!q||nameHit)?t.cards.slice():t.cards.filter(c=>c[0].toLowerCase().includes(needle)||c[1].toLowerCase().includes(needle));
    if(keep.length)out.push({t:t,keep:keep});
  });
  return out;
}
function renderSearch(){
  const v=$("#v-search");
  const groups=[...new Set(TEMPLATES.map(t=>t.group))];
  v.innerHTML=
   '<div class="gcard"><h2 class="gh">전체 템플릿 암기장</h2>'+
   '<p class="note">'+TEMPLATES.length+'개 주제 · '+ALL.length+'개 문장을 모두 보고 검색할 수 있어요.</p>'+
   '<input type="search" id="srq" class="srinput" placeholder="영어나 한글로 검색…" value="'+esc(SR.q)+'" aria-label="검색" autocomplete="off">'+
   '<div class="filter" role="group" aria-label="영역" style="margin-top:10px">'+
    '<button type="button" data-srg="" aria-pressed="'+(SR.group===""?"true":"false")+'">전체</button>'+
    groups.map(g=>'<button type="button" data-srg="'+esc(g)+'" aria-pressed="'+(SR.group===g?"true":"false")+'">'+esc(g)+'</button>').join("")+
   '</div></div>'+
   '<div id="srresults"></div>';
  const inp=$("#srq");
  inp.oninput=()=>{SR.q=inp.value;srRenderResults()};
  v.querySelectorAll("[data-srg]").forEach(b=>b.onclick=()=>{SR.group=b.dataset.srg;renderSearch()});
  srRenderResults();
}
function srRenderResults(){
  const box=$("#srresults");if(!box)return;
  const q=SR.q.trim();
  const results=srCards();
  const totalCards=results.reduce((s,x)=>s+x.keep.length,0);
  box.innerHTML=
   '<p class="note" style="margin:0 0 10px">'+(q?"검색 결과 ":"")+results.length+'개 주제 · '+totalCards+'개 문장</p>'+
   (results.length?results.map(({t,keep})=>
     '<details class="units"'+(q?' open':'')+'><summary><span>'+markHit(t.name,q)+'</span><span class="ucount">'+keep.length+'</span></summary><div class="ubody">'+
      keep.map(c=>'<div class="srcard"><p class="en">'+markHit(c[0],q)+'</p><p class="hint">'+markHit(c[1],q)+'</p></div>').join("")+
     '</div></details>'
   ).join(""):'<p class="note">검색 결과가 없어요.</p>');
}

/* ---------- 탭과 시작 ---------- */
const RENDER={game:renderGame,mock:renderMock,search:renderSearch,today:renderToday,quiz:renderQuiz,write:renderWrite,fill:renderFill,bracket:renderBracket,listen:renderListen,wrong:renderWrong,log:renderLog};
let TAB="game";
function renderAll(){renderStats();renderUnits();RENDER[TAB]()}
function setTab(t){
  audioStop();listStop();WARM=false;LG.del=null;mkClearTimer();
  TAB=t;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t?"true":"false"));
  ["game","mock","search","today","quiz","fill","bracket","write","listen","wrong","log"].forEach(k=>{$("#v-"+k).hidden=k!==t});
  if(t==="today"&&T1.i>=T1.q.length&&T1.total===0)startToday();
  renderUnits();
  RENDER[t]();
  refreshAsk();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

(function boot(){
  const local=lsLoad();
  S=normalize(local||{});
  showSync();
  startToday();
  renderAll();
  initStore();
})();
</script>
