Object.assign(SEG,{"t1-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["the place where I live.", "제가 살고 있는 곳이에요."]], "t1-1": [["It is located in a quiet neighborhood in Incheon,", "인천의 조용한 동네에 있고,"], ["and it has a very cozy and peaceful atmosphere.", "아주 아늑하고 평화로운 분위기예요."]], "t1-2": [["When you come in,", "들어서면,"], ["the first thing you notice is", "가장 먼저 눈에 들어오는 건"], ["the open living room connected to the kitchen.", "주방과 연결된 탁 트인 거실이에요."]], "t1-3": [["It has three rooms…", "방이 세 개 있어요…"], ["a bedroom, a living room, and a small study,", "침실, 거실, 그리고 작은 서재가 있고,"], ["and the overall vibe is modern and clean.", "전체적인 분위기는 모던하고 깔끔해요."]], "t1-4": [["Through the windows,", "창문을 통해서는,"], ["I can see trees and a small park.", "나무들과 작은 공원이 보여요."]], "t1-5": [["One thing I like about my home is", "제 집에서 제가 좋아하는 한 가지는"], ["how warm and bright it feels because of the sunlight.", "햇빛 덕분에 얼마나 따뜻하고 밝게 느껴지는가예요."]], "t1-6": [["It also has a small balcony and a quiet environment,", "작은 발코니와 조용한 환경도 있어서,"], ["which makes it even better.", "그게 집을 더 좋게 만들어 줘요."]], "t1-7": [["Every time I stay home,", "집에 있을 때마다,"], ["I feel really calm and comfortable.", "정말 차분하고 편안해져요."]], "t1-8": [["That's why", "그래서"], ["I love my apartment.", "저는 우리 아파트를 정말 좋아해요."]], "t2-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["housing issues in Korea.", "한국의 주택 문제예요."]], "t2-1": [["It's something we're actually pretty concerned about", "그건 우리가 사실 꽤 걱정하는 문제인데,"], ["because housing prices and rent can be really high,", "집값과 월세가 정말 비쌀 수 있기 때문이에요,"], ["especially in big cities like Seoul.", "특히 서울 같은 대도시에서요."]], "t2-2": [["You'll notice how competitive the whole system feels,", "전체 제도가 얼마나 경쟁적으로 느껴지는지,"], ["and how many people talk about things like rent deposits and monthly payments,", "얼마나 많은 사람들이 보증금과 월세 같은 이야기를 하는지 알게 되실 거고,"], ["and most people see this as something worth protecting,", "대부분의 사람들은 이걸 지킬 가치가 있는 것으로 보는데,"], ["because housing feels tied to stability and your future.", "집이 안정과 미래에 묶여 있다고 느껴지기 때문이에요."]], "t2-3": [["Personally, I think it really shows", "개인적으로, 그건 정말 보여 준다고 생각해요"], ["what we value as a society…", "우리가 사회로서 가치 있게 여기는 것을…"], ["security, fairness, and having a stable life.", "안전, 공정함, 그리고 안정된 삶이에요."]], "t2-4": [["So yeah, housing isn't just a personal issue here…", "그러니까요, 여기서 주거는 단순한 개인 문제가 아니라…"], ["it's something a lot of people care about and seriously discuss.", "많은 사람들이 신경 쓰고 진지하게 논의하는 문제예요."]], "t3-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["my neighborhood.", "우리 동네예요."]], "t3-1": [["It is located in the southern part of Seoul,", "서울 남쪽에 있고,"], ["and it has a very safe and family-friendly atmosphere.", "아주 안전하고 가족 친화적인 분위기예요."]], "t3-2": [["When you walk around,", "걸어 다녀 보면,"], ["the first thing you notice is", "가장 먼저 눈에 들어오는 건"], ["the wide sidewalks and many trees along the road.", "넓은 인도와 길을 따라 늘어선 많은 나무예요."]], "t3-3": [["It has a park, a library, a few cafes, and some convenience stores,", "공원, 도서관, 카페 몇 군데, 그리고 편의점 몇 곳이 있고,"], ["and the overall vibe is relaxed and pleasant.", "전체적인 분위기는 여유롭고 쾌적해요."]], "t3-4": [["There are also playgrounds", "놀이터도 있고"], ["and a small community center nearby.", "근처에 작은 주민센터도 있어요."]], "t3-5": [["People usually walk their dogs or exercise here,", "사람들은 보통 여기서 강아지를 산책시키거나 운동하고,"], ["and I also go out for a walk almost every day.", "저도 거의 매일 산책하러 나가요."]], "t3-6": [["Every time I spend time in my neighborhood,", "우리 동네에서 시간을 보낼 때마다,"], ["I feel really refreshed.", "정말 상쾌해져요."]], "t3-7": [["That's why", "그래서"], ["I really like living here.", "저는 여기 사는 게 정말 좋아요."]], "t4-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["my neighbor… my older sister.", "제 이웃이자… 언니예요."]], "t4-1": [["She's really thoughtful and dependable,", "언니는 정말 사려 깊고 믿음직한 사람이고,"], ["and what stands out the most is", "가장 눈에 띄는 점은"], ["how she always checks in on me, even when she's busy.", "바쁠 때조차 언니가 늘 저를 챙겨 준다는 거예요."]], "t4-2": [["Whenever I bump into her in the hallway or chat with her,", "복도에서 우연히 마주치거나 이야기를 나눌 때마다,"], ["I feel relieved and supported.", "마음이 놓이고 힘이 돼요."]], "t4-3": [["One time, I was sick,", "한번은 제가 아팠는데,"], ["and she brought me homemade soup without me even asking.", "제가 부탁하지도 않았는데 언니가 집에서 만든 수프를 가져다줬어요."]], "t4-4": [["That made me appreciate her even more.", "그 일로 언니가 더 고맙게 느껴졌어요."]], "t4-5": [["So yeah, she's not just my family…", "그러니까요, 언니는 단순한 가족이 아니라…"], ["she's the best neighbor I could ask for.", "제가 바랄 수 있는 최고의 이웃이에요."]], "t5-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["one of my favorite singers, Brown Eyed Soul.", "제가 가장 좋아하는 가수 중 한 팀인 브라운 아이드 소울이에요."]], "t5-1": [["They're really emotional and soulful,", "그들은 정말 감성적이고 소울풀하고,"], ["and what stands out the most is", "가장 눈에 띄는 점은"], ["how their harmonies create such a rich, warm sound", "그들의 하모니가 얼마나 풍부하고 따뜻한 소리를 만들어 내는지"], ["that touches your heart.", "그 소리가 마음을 울린다는 거예요."]], "t5-2": [["Whenever I listen to their songs, especially late at night,", "그들의 노래를 들을 때마다, 특히 늦은 밤에는,"], ["I feel calm and deeply moved.", "차분해지고 깊은 감동을 받아요."]], "t5-3": [["One time, I was feeling really overwhelmed,", "한번은 제가 정말 벅차고 지쳐 있었는데,"], ["and their song “Love Ballad” helped me feel at peace,", "그들의 노래 “Love Ballad”가 마음을 편안하게 해 줬고,"], ["which made me appreciate Brown Eyed Soul even more.", "그 덕분에 브라운 아이드 소울이 더 고맙게 느껴졌어요."]], "t5-4": [["So yeah, they really mean a lot to me.", "그러니까요, 그들은 저에게 정말 큰 의미가 있어요."]], "t6-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["my wireless earbuds and my phone.", "제 무선 이어버드와 휴대폰이에요."]], "t6-1": [["They're really convenient and comfortable,", "정말 편리하고 편해서,"], ["and what stands out the most is", "가장 눈에 띄는 점은"], ["the active noise canceling and clear sound… even at low volume…", "액티브 노이즈 캔슬링과 낮은 볼륨에서도 선명한 소리…"], ["plus a long battery life with the charging case.", "거기에 충전 케이스까지 있어서 배터리가 오래 간다는 거예요."]], "t6-2": [["Whenever I stream music on my phone (using Spotify/YouTube Music)", "휴대폰으로 (스포티파이나 유튜브 뮤직으로) 음악을 스트리밍하고,"], ["and connect via Bluetooth,", "블루투스로 연결할 때마다,"], ["I feel focused and relaxed.", "집중되고 편안해져요."]], "t6-3": [["One time, I was working in a noisy café,", "한번은 시끄러운 카페에서 일하고 있었는데,"], ["but the earbuds blocked most of the background noise,", "이어버드가 주변 소음 대부분을 막아 줬고,"], ["and the earbuds fit snugly for hours,", "이어버드가 몇 시간 동안 딱 맞게 착용됐고,"], ["and that made me appreciate this setup even more.", "그 일로 이 구성이 더 고맙게 느껴졌어요."]], "t6-4": [["So yeah, this combo (earbuds + phone)", "그러니까요, 이 조합(이어버드 + 휴대폰)은"], ["means a lot to me.", "저에게 큰 의미가 있어요."]], "t7-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["the Marvel series.", "마블 시리즈예요."]], "t7-1": [["It's really exciting and well-made,", "정말 흥미진진하고 완성도가 높고,"], ["and what stands out the most is", "가장 눈에 띄는 점은"], ["how all the characters and stories are connected across movies and shows.", "모든 인물과 이야기가 영화와 드라마 전반에 걸쳐 연결되어 있다는 거예요."]], "t7-2": [["Whenever I watch something from Marvel,", "마블 작품을 볼 때마다,"], ["I feel pulled into the story and totally entertained.", "이야기에 빨려 들어가고 완전히 즐거워져요."]], "t7-3": [["One time, I watched Avengers: Infinity War in a packed theater,", "한번은 사람들이 꽉 찬 극장에서 어벤져스: 인피니티 워를 봤는데,"], ["and everyone gasped at the ending,", "엔딩에서 모두가 헉 하고 숨을 들이켰고,"], ["which made me appreciate it even more.", "그 일로 마블이 더 고맙게 느껴졌어요."]], "t7-4": [["So yeah, Marvel has been a big part of my free time,", "그러니까요, 마블은 제 여가 시간의 큰 부분이었고,"], ["and I never get tired of it.", "아무리 봐도 질리지 않아요."]], "t8-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["my favorite reality show… Street Woman Fighter.", "제가 가장 좋아하는 리얼리티 쇼… 스트릿 우먼 파이터예요."]], "t8-1": [["It's really energetic and inspiring,", "정말 에너지가 넘치고 영감을 주고,"], ["and what stands out the most is", "가장 눈에 띄는 점은"], ["the passion the dancers show in every performance.", "댄서들이 모든 무대에서 보여 주는 열정이에요."]], "t8-2": [["Whenever I watch it,", "그걸 볼 때마다,"], ["I feel amazed and motivated.", "감탄하고 의욕이 생겨요."]], "t8-3": [["One time, I got goosebumps during a team battle", "한번은 팀 배틀 중에 소름이 돋았는데,"], ["because the choreography was perfect,", "안무가 완벽했기 때문이에요,"], ["and that made me respect the dancers even more.", "그 일로 댄서들을 더 존경하게 됐어요."]], "t8-4": [["So yeah, Street Woman Fighter", "그러니까요, 스트릿 우먼 파이터는"], ["is one of the few shows I always look forward to.", "제가 늘 기다리는 몇 안 되는 프로그램 중 하나예요."]], "t9-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["a café I often go to.", "제가 자주 가는 카페예요."]], "t9-1": [["It is located near my school,", "학교 근처에 있고,"], ["and it has a very cozy and quiet atmosphere.", "아주 아늑하고 조용한 분위기예요."]], "t9-2": [["When you go there,", "거기 가면,"], ["the first thing you notice is", "가장 먼저 눈에 들어오는 건"], ["the warm lighting and the smell of freshly brewed coffee.", "따뜻한 조명과 갓 내린 커피 향이에요."]], "t9-3": [["It has wooden tables, soft chairs, and some indoor plants,", "나무 테이블, 푹신한 의자, 그리고 실내 식물 몇 개가 있고,"], ["and the overall vibe is calm and comfortable.", "전체적인 분위기는 차분하고 편안해요."]], "t9-4": [["One thing I like about this café is", "이 카페에서 제가 좋아하는 한 가지는"], ["that they play soft jazz music,", "부드러운 재즈 음악을 틀어 준다는 거예요,"], ["which helps me focus when I study.", "그게 공부할 때 집중하는 데 도움이 돼요."]], "t9-5": [["It also has free Wi-Fi and a quiet study room,", "무료 와이파이와 조용한 스터디룸도 있어서,"], ["which makes it even better.", "그게 더 좋게 만들어 줘요."]], "t9-6": [["I usually go there about twice a week,", "저는 보통 일주일에 두 번 정도 가는데,"], ["and every time I visit,", "갈 때마다,"], ["I feel really relaxed and productive.", "정말 편안하고 일이 잘 되는 느낌이에요."]], "t9-7": [["That's why this café", "그래서 이 카페는"], ["is one of my favorite places to spend time.", "제가 시간을 보내기 가장 좋아하는 장소 중 하나예요."]], "t10-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["a bar I sometimes go to with my friends.", "제가 가끔 친구들과 가는 바예요."]], "t10-1": [["It is located in the Hongdae area of Seoul,", "서울 홍대 지역에 있고,"], ["and it has a very lively and trendy atmosphere.", "아주 활기차고 트렌디한 분위기예요."]], "t10-2": [["When you go there,", "거기 가면,"], ["the first thing you notice is", "가장 먼저 눈에 들어오는 건"], ["the colorful neon lights and upbeat music playing in the background.", "알록달록한 네온 불빛과 배경에 흐르는 신나는 음악이에요."]], "t10-3": [["It has a long bar counter, several high tables, and private booths,", "긴 바 카운터, 높은 테이블 여러 개, 그리고 프라이빗 부스가 있고,"], ["and the overall vibe is casual but stylish.", "전체적인 분위기는 캐주얼하지만 세련됐어요."]], "t10-4": [["One thing I like about this bar is", "이 바에서 제가 좋아하는 한 가지는"], ["that they serve unique cocktails", "독특한 칵테일을 낸다는 것과"], ["and sometimes have live DJs on weekends.", "주말에는 가끔 라이브 DJ도 있다는 거예요."]], "t10-5": [["It also has friendly staff and a fun crowd,", "친절한 직원들과 즐거운 손님들도 있어서,"], ["which makes it even better.", "그게 더 좋게 만들어 줘요."]], "t10-6": [["I usually go there once or twice a month,", "저는 보통 한 달에 한두 번 가는데,"], ["and every time I visit,", "갈 때마다,"], ["I feel really recharged and excited.", "정말 에너지가 충전되고 신나요."]], "t10-7": [["That's why this bar", "그래서 이 바는"], ["is one of my favorite places to hang out with friends.", "친구들과 어울리기 가장 좋아하는 장소 중 하나예요."]], "t11-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["a park I often visit.", "제가 자주 가는 공원이에요."]], "t11-1": [["It is located near my apartment,", "우리 아파트 근처에 있고,"], ["and it has a very peaceful and natural atmosphere.", "아주 평화롭고 자연스러운 분위기예요."]], "t11-2": [["When you enter the park,", "공원에 들어서면,"], ["the first thing you notice is", "가장 먼저 눈에 들어오는 건"], ["the green grass and the walking trails.", "푸른 잔디와 산책로예요."]], "t11-3": [["It has tall trees, benches, and a small pond,", "키 큰 나무들, 벤치, 그리고 작은 연못이 있고,"], ["and the overall vibe is quiet and relaxing.", "전체적인 분위기는 조용하고 편안해요."]], "t11-4": [["One thing I like about this park is", "이 공원에서 제가 좋아하는 한 가지는"], ["the sound of birds and the fresh air.", "새소리와 맑은 공기예요."]], "t11-5": [["I usually come here to walk, jog, or have a picnic,", "저는 보통 여기에 와서 걷거나, 조깅하거나, 소풍을 즐기고,"], ["and I go there almost every weekend.", "거의 매 주말에 가요."]], "t11-6": [["Every time I visit the park,", "공원에 갈 때마다,"], ["I feel really refreshed.", "정말 상쾌해져요."]], "t11-7": [["That's why", "그래서"], ["it's one of my favorite places.", "그곳은 제가 가장 좋아하는 장소 중 하나예요."]], "t12-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["my favorite beach.", "제가 가장 좋아하는 해변이에요."]], "t12-1": [["It is located in Gangwon-do,", "강원도에 있고,"], ["and it has a very open and beautiful atmosphere.", "아주 탁 트이고 아름다운 분위기예요."]], "t12-2": [["When you arrive,", "도착하면,"], ["the first thing you notice is", "가장 먼저 눈에 들어오는 건"], ["the soft sand and the sound of waves.", "부드러운 모래와 파도 소리예요."]], "t12-3": [["It has clean water, lots of space, and some snack shops nearby,", "깨끗한 물, 넓은 공간, 그리고 근처에 간식 가게 몇 곳이 있고,"], ["and the overall vibe is very relaxing.", "전체적인 분위기는 아주 편안해요."]], "t12-4": [["One thing I like about this beach is", "이 해변에서 제가 좋아하는 한 가지는"], ["the amazing sunset view in the evening.", "저녁에 보이는 멋진 노을 풍경이에요."]], "t12-5": [["I usually come here to swim, take pictures, or just relax,", "저는 보통 여기에 와서 수영하거나, 사진을 찍거나, 그냥 쉬고,"], ["and I go there every summer.", "매년 여름마다 가요."]], "t12-6": [["Every time I go to this beach,", "이 해변에 갈 때마다,"], ["I feel really happy and free.", "정말 행복하고 자유로워져요."]], "t12-7": [["That's why", "그래서"], ["I really love it.", "저는 그곳을 정말 사랑해요."]], "t13-0": [["I'd like to tell you about", "말씀드리고 싶은 건"], ["a camping site I often go to.", "제가 자주 가는 캠핑장이에요."]], "t13-1": [["It is located in a forest area in Gangwon-do,", "강원도의 숲 지역에 있고,"], ["and it has a very quiet and natural atmosphere.", "아주 조용하고 자연스러운 분위기예요."]], "t13-2": [["When you get there,", "거기 도착하면,"], ["the first thing you notice is", "가장 먼저 눈에 들어오는 건"], ["the tall trees and the fresh smell of the woods.", "키 큰 나무들과 숲의 상쾌한 향기예요."]], "t13-3": [["It has places for tents, a campfire area, and a small river nearby,", "텐트를 칠 자리, 모닥불 구역, 그리고 근처에 작은 강이 있고,"], ["and the overall vibe is peaceful.", "전체적인 분위기는 평화로워요."]], "t13-4": [["One thing I like about this campsite is", "이 캠핑장에서 제가 좋아하는 한 가지는"], ["the night sky full of stars.", "별이 가득한 밤하늘이에요."]], "t13-5": [["I usually come here to relax and enjoy nature,", "저는 보통 쉬면서 자연을 즐기려고 여기에 오고,"], ["and I go camping about twice a year.", "1년에 두 번 정도 캠핑을 가요."]], "t13-6": [["Every time I go,", "갈 때마다,"], ["I feel really peaceful and recharged.", "정말 평화롭고 에너지가 충전돼요."]], "t13-7": [["That's why", "그래서"], ["I enjoy camping so much.", "저는 캠핑을 정말 즐겨요."]]});
Object.assign(SEG,{"t14-0": [["I'd like to tell you about my neighbor...my older sister.", "저는 저희 이웃이자 언니에 대해 이야기해보고 싶어요."]], "t14-1": [["She is very thoughtful and dependable. She always checks on me. She does this even when she is busy.", "언니는 정말 사려 깊고 믿음직해요. 언니는 항상 저를 챙겨줘요. 바쁠 때도 그렇게 해줘요."]], "t14-2": [["Whenever I bump into her in the hallway or chat with her, I feel relieved and supported.", "바쁜 와중에도 항상 저를 챙겨주는 모습이 가장 인상적이에요."]], "t14-3": [["One time, I was sick, and she brought me homemade soup without me even asking.", "복도에서 우연히 마주치거나 잠깐 얘기만 나눠도 마음이 놓이고 위로가 됩니다."]], "t14-4": [["That made me appreciate her even more.", "한 번은 제가 아플 때, 아무 말도 안 했는데 언니가 직접 끓인 수프를 가져다 줬어요."]], "t14-5": [["So yeah, she's not just my family...she's the best neighbor I could ask for.", "그 일 덕분에 언니에 대한 고마움이 더 커졌어요. 그래서 저에게 언니는 단순한 가족이 아니라, 가장 든든한 이웃이기도 해요."]], "t15-0": [["I'd like to tell you about one of my favorite singers, Brown Eyed Soul.", "제가 가장 좋아하는 가수 중 하나는 브라운 아이드 소울이에요."]], "t15-1": [["They are really emotional and soulful. Their harmonies sound rich and warm. This touches my heart.", "이 팀은 정말 감성적이고 소울풀해요. 하모니가 풍부하고 따뜻해요. 그래서 마음이 울려요."]], "t15-2": [["Whenever I listen to their songs, especially late at night, I feel calm and deeply moved.", "저는 특히 밤에 이들의 노래를 들을 때마다, 정말 마음이 차분해지고 깊은 감동을 받아요."]], "t15-3": [["One time, I was feeling really overwhelmed. Their song “Love Ballad” helped me feel at peace. This made me appreciate Brown Eyed Soul even more.", "한 번은 정신적으로 너무 지쳐 있었어요. 그런데 'Love Ballad'라는 노래를 듣고 마음이 편해졌어요. 그래서 브라운 아이드 소울이 더 좋아졌어요."]], "t15-4": [["So yeah, they really mean a lot to me.", "그래서 저에게 브라운 아이드 소울은 정말 의미 있는 팀이에요."]], "t16-0": [["I'd like to tell you about my wireless earbuds and my phone.", "저는 무선 이어버드와 휴대폰에 대해 말하고 싶어요."]], "t16-1": [["They are really convenient and comfortable. They have active noise canceling. The sound is clear, even at low volume. The battery lasts a long time with the charging case.", "둘 다 정말 편하고 실용적이에요. 액티브 노이즈 캔슬링 기능이 있어요. 낮은 볼륨에서도 소리가 선명해요. 충전 케이스 덕분에 배터리도 오래가요."]], "t16-2": [["Whenever I stream music on my phone (using Spotify/YouTube Music) and connect via Bluetooth, I feel focused and relaxed.", "저는 휴대폰으로 음악 스트리밍 앱(스포티파이/유튜브 뮤직)을 켜서 블루투스로 연결할 때 집중되고 편안한 느낌이 들어요."]], "t16-3": [["One time, I was working in a noisy café. The earbuds blocked most of the noise. They also fit well for hours. This made me like this setup even more.", "한 번은 시끄러운 카페에서 일하고 있었어요. 이어폰이 소음을 대부분 막아줬어요. 착용감도 오래 편했어요. 그래서 이 세팅이 더 좋아졌어요."]], "t16-4": [["So yeah, this combo (earbuds + phone) means a lot to me.", "그래서 이어버드+휴대폰 조합이 저에게는 정말 소중해요."]], "t17-0": [["I'd like to tell you about a café I often go to.", "제가 자주 가는 카페에 대해 소개해드릴게요."]], "t17-1": [["It is located near my school, and it has a very cozy and quiet atmosphere.", "학교 근처에 위치해 있고, 아늑하고 조용한 분위기가 매력적인 곳이에요."]], "t17-2": [["When you go there, the first thing you notice is the warm lighting and the smell of freshly brewed coffee.", "그곳에 들어서면 가장 먼저 느껴지는 건 따뜻한 조명과 갓 내린 커피 향기예요."]], "t17-3": [["It has wooden tables, soft chairs, and some indoor plants, and the overall vibe is calm and comfortable.", "나무 테이블, 푹신한 의자, 그리고 실내 식물들이 있어서 전체적인 분위기가 차분하고 편안해요."]], "t17-4": [["One thing I like about this café is the soft jazz music. It helps me focus when I study.", "이 카페에서 제가 좋아하는 점 중 하나는 부드러운 재즈 음악이에요. 공부할 때 집중하는 데 도움이 돼요."]], "t17-5": [["It also has free Wi-Fi. It has a quiet study room too. These things make it even better.", "무료 와이파이도 있어요. 조용한 스터디룸도 있어요. 이런 점들이 카페를 더 좋게 만들어줘요."]], "t17-6": [["I usually go there about twice a week, and every time I visit, I feel really relaxed and productive.", "저는 일주일에 보통 두 번 정도 가는데, 갈 때마다 기분이 편안해지고, 일도 잘 되는 느낌이에요."]], "t17-7": [["That's why this café is one of my favorite places to spend time.", "그래서 이 카페는 제가 시간을 보내기에 가장 좋아하는 장소 중 하나예요"]], "t18-0": [["I'd like to tell you about a bar I sometimes go to with my friends.", "가끔 친구들이랑 함께 가는 바에 대해 소개해드릴게요."]], "t18-1": [["It is located in the Hongdae area of Seoul, and it has a very lively and trendy atmosphere.", "서울 홍대에 위치한 곳인데, 분위기가 정말 활기차고 트렌디해요."]], "t18-2": [["When you go there, the first thing you notice is the colorful neon lights and upbeat music playing in the background.", "그곳에 들어서면 가장 먼저 보이는 건 형형색색의 네온 조명과 신나는 배경 음악이에요."]], "t18-3": [["It has a long bar counter, several high tables, and private booths, and the overall vibe is casual but stylish.", "긴 바 카운터, 높은 테이블들, 그리고 프라이빗한 부스 자리들이 있어서 전체적으로 편안하면서도 세련된 분위기예요."]], "t18-4": [["One thing I like about this bar is that they serve unique cocktails and sometimes have live DJs on weekends.", "이 바에서 제가 가장 좋아하는 점은, 독특한 칵테일을 제공하고, 주말에는 가끔 라이브 DJ 공연도 있다는 거예요."]], "t18-5": [["It also has friendly staff. The crowd is fun too. These things make it even better.", "직원들도 친절해요. 손님들도 활기차요. 이런 점들이 더 즐겁게 만들어줘요."]], "t18-6": [["I usually go there once or twice a month, and every time I visit, I feel really recharged and excited.", "저는 보통 한 달에 한두 번쯤 가는데, 갈 때마다 기분이 전환되고 에너지가 생기는 느낌이에요."]], "t18-7": [["That's why this bar is one of my favorite places to hang out with friends.", "그래서 이 바는 친구들과 어울리기에 가장 좋아하는 장소 중 하나예요."]], "t19-0": [["I'd like to tell you about a park I often visit.", "제가 자주 가는 공원에 대해 이야기해드릴게요."]], "t19-1": [["It is located near my apartment, and it has a very peaceful and natural atmosphere.", "집 근처에 있는 공원인데, 분위기가 정말 평화롭고 자연 친화적이에요."]], "t19-2": [["When you enter the park, the first thing you notice is the green grass and the walking trails.", "공원에 들어서면 가장 먼저 보이는 건 푸른 잔디밭과 산책로예요."]], "t19-3": [["It has tall trees, benches, and a small pond, and the overall vibe is quiet and relaxing.", "키 큰 나무들과 벤치, 작은 연못도 있어서 전체적으로 조용하고 여유로운 분위기를 느낄 수 있어요."]], "t19-4": [["One thing I like about this park is the sound of birds and the fresh air.", "제가 이 공원을 좋아하는 이유는, 새소리와 맑은 공기 덕분에 기분이 맑아진다는 점이에요."]], "t19-5": [["I usually come here to walk, jog, or have a picnic, and I go there almost every weekend.", "저는 보통 여기서 산책하거나 조깅을 하고, 가끔은 피크닉도 즐기는데, 거의 매주 주말마다 방문해요."]], "t19-6": [["Every time I visit the park, I feel really refreshed. That's why it's one of my favorite places.", "공원에 갈 때마다 몸과 마음이 상쾌해지는 느낌이 들어서 이곳은 제가 가장 좋아하는 장소 중 하나예요.장소 묘사하기 템플릿 A"]], "t20-0": [["I'd like to tell you about my favorite beach.", "제가 가장 좋아하는 해변에 대해 이야기해드릴게요."]], "t20-1": [["It is located in Gangwon-do, and it has a very open and beautiful atmosphere.", "강원도에 위치한 곳인데, 분위기가 정말 탁 트이고 아름다워요."]], "t20-2": [["When you arrive, the first thing you notice is the soft sand and the sound of waves.", "해변에 도착하면 가장 먼저 눈에 띄는 건 부드러운 모래와 파도 소리예요."]], "t20-3": [["It has clean water, lots of space, and some snack shops nearby, and the overall vibe is very relaxing.", "물이 맑고 공간도 넓으며, 근처에는 간단한 간식 가게들도 있어서 전체적인 분위기가 정말 편안하고 여유로워요."]], "t20-4": [["One thing I like about this beach is the amazing sunset view in the evening.", "제가 이 해변을 좋아하는 이유 중 하나는 저녁에 볼 수 있는 멋진 노을 풍경이에요."]], "t20-5": [["I usually come here to swim, take pictures, or just relax, and I go there every summer.", "보통 여기서 수영을 하거나, 사진을 찍거나, 그냥 쉬기도 하고, 매년 여름마다 꼭 방문해요."]], "t20-6": [["Every time I go to this beach, I feel really happy and free. That's why I really love it.", "이 해변에 갈 때마다 기분이 정말 행복하고 자유로워져서, 그래서 이곳을 정말 사랑하게 되었어요."]], "t21-0": [["I'd like to tell you about a camping site I often go to.", "제가 자주 가는 캠핑장에 대해 말씀드릴게요."]], "t21-1": [["It is located in a forest area in Gangwon-do, and it has a very quiet and natural atmosphere.", "그곳은 강원도 숲속에 위치해 있고, 아주 조용하고 자연스러운 분위기를 가지고 있습니다."]], "t21-2": [["When you get there, the first thing you notice is the tall trees and the fresh smell of the woods.", "그곳에 도착하면 가장 먼저 눈에 띄는 것은 키 큰 나무들과 숲의 상쾌한 향기예요."]], "t21-3": [["It has places for tents, a campfire area, and a small river nearby, and the overall vibe is peaceful.", "텐트를 칠 수 있는 공간, 모닥불을 피울 수 있는 구역, 그리고 근처에 작은 강이 있어서 전체적으로 매우 평화로운 느낌이 납니다."]], "t21-4": [["One thing I like about this campsite is the night sky full of stars.", "이 캠핑장에서 제가 가장 좋아하는 점은 별이 가득한 밤하늘이에요."]], "t21-5": [["I usually come here to relax and enjoy nature, and I go camping about twice a year.", "저는 주로 휴식을 취하고 자연을 즐기기 위해 이곳에 오는데, 1년에 두 번 정도 캠핑을 갑니다."]], "t21-6": [["Every time I go, I feel really peaceful and recharged.", "갈 때마다 정말 평화롭고 에너지가 충전되는 느낌이에요."]], "t21-7": [["That's why I enjoy camping so much.", "그래서 저는 캠핑을 정말 좋아합니다."]], "t22-0": [["I'd like to tell you about new technology in Korean homes. We are proud of this. Our homes have become very high-tech.", "한국 가정의 새로운 기술에 대해 이야기해볼게요. 우리는 이걸 자랑스러워해요. 요즘 집들은 정말 하이테크가 되었어요."]], "t22-1": [["You'll notice things like smart lighting, voice-controlled devices, and energy-saving systems in many apartments today.", "이건 우리가 꽤 자랑스러워하는 부분이에요, 왜냐면 요즘 집들이 정말 하이테크(첨단화) 되었거든요."]], "t22-2": [["Most people see this as a sign of new technology.", "요즘 아파트에 가보면 스마트 조명, 음성 인식 기기, 에너지 절약 시스템 같은 걸 쉽게 볼 수 있어요."]], "t22-3": [["Personally, I think it shows how much we value efficiency and innovation.", "대부분의 사람들은 이런 걸 기술 발전의 상징으로 보고요, 저 개인적으로는 이게 우리가 얼마나 효율성과 혁신을 중요하게 생각하는지 보여준다고 생각해요."]], "t22-4": [["Smart housing is more than just a system here. It is something we are proud of.", "그래서 스마트 하우징은 단순한 시스템이 아니라, 우리가 자부심을 느끼는 문화의 한 부분인 것 같아요."]], "t23-0": [["I'd like to tell you about my sofa at home.", "저는 우리 집 소파에 대해 이야기하고 싶어요."]], "t23-1": [["It's really comfortable and cozy. It's perfect for relaxing after a long day.", "정말 편하고 아늑한 소파예요. 긴 하루 끝에 쉬기에 딱 좋아요."]], "t23-2": [["Whenever I lie down and watch something on my phone or just take a nap, I feel completely at ease.", "저는 거기 누워서 핸드폰으로 영상 보거나 잠깐 눈 붙일 때마다, 정말 편안함을 느껴요."]], "t23-3": [["One time, I fell asleep there while reading a book. I slept better than I do in my bed. This made me appreciate that sofa even more.", "한 번은 책을 읽다가 거기서 잠들었어요. 침대보다 더 잘 잤어요. 그래서 그 소파가 더 소중하게 느껴졌어요."]], "t23-4": [["So yeah, that sofa means a lot to me.", "그래서 저한테 그 소파는 참 의미 있는 가구예요."]], "t24-0": [["Well, if I had to point out one thing about the kinds of movie topics we talk about, it would be social messages in films.", "영화에 대해 이야기할 때 한 가지를 꼽자면 영화 속 사회적 메시지인 것 같아요."]], "t24-1": [["I say this because my friends like talking about movies. They like how movies show real issues. These issues include mental health, equality, and the environment.", "이렇게 말하는 이유는 제 친구들이 영화에 대해 이야기하는 걸 좋아하기 때문이에요. 친구들은 영화가 실제 문제를 어떻게 보여주는지 좋아해요. 이런 문제에는 정신 건강, 평등, 환경 문제가 있어요."]], "t24-2": [["That's the main thing I notice about our movie talks. I think it's worth mentioning.", "이게 저희 영화 대화에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요."]], "t24-3": [["These issues are interesting to them. These issues make people think more deeply about society. They are also important. Movies can influence people's awareness and behavior.", "이런 주제들은 사람들에게 흥미로워요. 사람들이 사회를 더 깊이 생각하게 만들기 때문이에요. 이런 주제들은 또한 중요해요. 영화가 사람들의 인식과 행동에 영향을 줄 수 있기 때문이에요."]], "t25-0": [["I'd like to tell you about music gadgets and audio equipment in Korea.", "한국의 음악 기기랑 오디오 장비에 대해 이야기해보려고 해요."]], "t25-1": [["We are proud of this because Korea has a strong tech culture. People compare brands carefully and read reviews. Some people even customize their setups with high-end headphones, Bluetooth speakers, or digital audio players.", "우리는 이걸 꽤 자랑스러워해요. 한국은 기술 문화가 강하기 때문이에요. 사람들은 브랜드를 꼼꼼히 비교하고 리뷰도 찾아봐요. 어떤 사람들은 고급 헤드폰, 블루투스 스피커, 디지털 오디오 플레이어로 자신만의 세팅을 만들기도 해요."]], "t25-2": [["Most people see this as a lifestyle choice. I think it shows what our society values. We value things like quality and trends.", "대부분의 사람들은 이걸 라이프스타일의 한 부분으로 봐요. 저는 이게 우리 사회가 중요하게 여기는 걸 보여준다고 생각해요. 우리는 품질과 트렌드 같은 걸 중요하게 생각해요."]], "t25-3": [["Music gadgets in Korea are more than just tools. They are something we are proud of.", "한국의 음악 기기들은 단순한 도구가 아니에요. 우리가 자부심을 느끼는 부분이에요."]], "t26-0": [["Well, if I had to point out one thing about technology in my country, it would be how deeply AI and mobile technology are integrated into daily life.", "음, 제 나라의 기술에 대해 한 가지 말해야 한다면, AI랑 모바일 기술이 일상 속에 얼마나 깊게 스며들어 있는지를 꼽을 것 같아요."]], "t26-1": [["I say this because people use smart devices, payment apps, and AI tools for everything. They use them for studying, shopping, and managing schedules. This is the main thing I notice about technology in Korea. I think it's worth mentioning.", "그 이유는 사람들이 스마트기기, 결제 앱, AI 도구를 모든 일에 사용하기 때문이에요. 공부할 때, 쇼핑할 때, 일정을 관리할 때도 사용해요. 이게 한국 기술에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요."]], "t27-0": [["Well, if I had to point out one thing about local fashion in my country, it would be how neat and season-focused it is.", "(현지 복장) 우리나라 현지 복장에 대해 한 가지를 꼽자면 깔끔하고 계절에 맞게 입는 스타일이에요."]], "t27-1": [["I say this because people dress for the weather. They dress formally at work. They dress more comfortably on weekends.", "그렇게 말하는 이유는 사람들이 날씨에 맞게 옷을 입기 때문이에요. 출근할 때는 단정하게 입어요. 주말에는 더 편하게 입어요."]], "t27-2": [["That's the main thing I notice about Korean fashion. I think it's worth mentioning.", "이게 한국 패션에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요."]], "t28-0": [["Well, if I had to point out one thing about popular food in my country, it would be Korean barbecue.", "우리나라의 인기 있는 음식을 한 가지 꼽자면 한국식 바비큐(고기구이) 예요."]], "t28-1": [["I say this because people love grilling meat together at the table. It is not just about the taste. It is also about spending time together.", "그렇게 말하는 이유는 사람들이 함께 테이블에서 고기를 구워 먹는 걸 좋아하기 때문이에요. 이건 맛 때문만이 아니에요. 함께 시간을 보내는 것도 중요해요."]], "t28-2": [["That's the main thing I notice about Korean food culture. I think it's worth mentioning.", "이게 한국 음식 문화에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요."]], "t29-0": [["Well, if I had to point out one thing about my personal fashion style, it would be clean and comfortable basics.", "제 개인 패션 스타일에서 한 가지를 꼽자면 깔끔하고 편안한 기본템 위주의 스타일이에요."]], "t29-1": [["I say this because I like simple outfits. They look neat. They also let me move freely all day.", "그렇게 말하는 이유는 단순한 옷을 좋아하기 때문이에요. 깔끔해 보여요. 또 하루 종일 편하게 움직일 수 있어요."]], "t29-2": [["That's the main thing I notice about my style. I think it's worth mentioning.", "이게 제 스타일에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요."]], "t30-0": [["Well, if I had to point out one thing about my hair salon, it would be its calm, cozy vibe.", "제 미용실에 대해 한 가지만 꼽자면, 아늑하고 차분한 분위기예요."]], "t30-1": [["I say this because the space is small but nicely designed. It has soft lighting, light-wood mirrors, and quiet indie music. So I can relax while I get my hair done.", "그렇게 말하는 이유는 공간은 작지만 멋지게 꾸며져 있기 때문이에요. 조명도 부드럽고, 원목 거울과 잔잔한 음악도 있어요. 그래서 머리를 하는 동안 편하게 쉴 수 있어요."]], "t30-2": [["That's the main thing I notice about this place. I also prefer it because the stylist remembers my preferences and doesn't rush. The results always look natural.", "이게 이곳에서 가장 눈에 띄는 점이에요. 또 디자이너가 제 취향을 기억하고 서두르지 않아서 좋아요. 결과도 항상 자연스러워요."]], "t31-0": [["Well, if I had to point out one thing about my dental clinic, it would be how clean and efficiently organized it is.", "음, 제가 다니는 치과에 대해 한 가지 말해야 한다면, 정말 깨끗하고 효율적으로 잘 정돈되어 있다는 점을 꼽을 것 같아요."]], "t31-1": [["I say this because it's located on the 3rd floor near the subway. Inside, everything feels organized. There is a bright reception area, consultation rooms, and modern equipment.", "그 이유는 지하철 근처 3층에 있기 때문이에요. 안에 들어가면 모든 게 잘 정돈되어 있어요. 밝은 접수대, 진료실, 최신 장비가 있어요."]], "t31-2": [["That's the main thing I notice about this clinic. I think it's worth mentioning.", "이게 이 치과에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요."]], "t32-0": [["I'd like to talk about banks in my country.", "저는 우리나라의 은행들에 대해 이야기하고 싶어요."]], "t32-1": [["They're usually located in busy downtown areas or near subway stations, and they've got a really clean and professional vibe.", "은행들은 주로 도심 지역이나 지하철역 근처에 위치해 있고, 전체적으로 깔끔하고 전문적인 분위기예요."]], "t32-2": [["The first thing you notice is the bright lighting and digital kiosks. Staff also help customers with online banking. Overall, it feels modern and efficient.", "가장 먼저 눈에 띄는 건 밝은 조명과 디지털 키오스크예요. 직원들도 온라인 뱅킹을 도와줘요. 전체적으로 현대적이고 효율적인 느낌이에요."]], "t32-3": [["What I like most is the service. It is organized and polite. It always makes me feel safe and well taken care of.", "제가 가장 좋아하는 점은 서비스예요. 서비스가 체계적이고 친절해요. 항상 안전하고 잘 보살핌을 받는 느낌이 들어요."]], "t32-4": [["That's basically why I like this place.", "제가 가장 좋아하는 점은 서비스가 매우 체계적이고 직원들이 친절하다는 점이에요."]], "t32-5": [["Oh, and most banks are open from around 9 a.m. to 4 p.m. on weekdays, but they're closed on weekends.", "그래서 갈 때마다 안심되고 잘 돌봄을 받는 느낌이 들어요. 그래서 저는 은행을 꽤 좋아해요. 아, 그리고 대부분의 은행은 평일 오전 9시부터 오후 4시까지 운영하고, 주말에는 문을 닫아요."]], "t33-0": [["I'd like to talk about the geography of my country, Korea.", "저는 한국의 지리에 대해 이야기하고 싶어요."]], "t33-1": [["It's in East Asia, and it's got a really beautiful and natural vibe with lots of mountains and rivers.", "한국은 동아시아에 있고, 산과 강이 많아서 자연이 참 아름다워요."]], "t33-2": [["The first thing you notice is the mountains. They are almost everywhere. There is also a big river called the Han River. It runs through Seoul.", "가장 먼저 눈에 띄는 건 산이에요. 거의 모든 곳에 산이 있어요. 한강이라는 큰 강도 있어요. 이 강은 서울을 가로질러 흘러요."]], "t33-3": [["Overall, it feels peaceful and green. There are beaches, islands, and small towns around the country.", "전체적으로 평화롭고 초록빛이 가득해요. 해변, 섬, 작은 마을들이 나라 곳곳에 있어요."]], "t33-4": [["What I like most is that you can see many different kinds of nature nearby. You don't have to travel far. This always makes me feel relaxed and proud.", "제가 가장 좋아하는 점은 가까운 곳에서도 다양한 자연을 볼 수 있다는 거예요. 멀리 갈 필요가 없어요. 그래서 항상 편안하고 자랑스러운 느낌이 들어요."]], "t33-5": [["That's basically why I like this place.", "그래서 여행할 때마다 편안하고 자랑스러운 느낌이 들어요. 그래서 저는 우리나라의 지리를 정말 좋아해요."]], "t34-0": [["I'd like to tell you about recycling in Korea.", "한국의 재활용 문화에 대해 이야기해보려고 해요."]], "t34-1": [["We are proud of this. It is well-organized and efficient.", "우리는 이걸 자랑스러워해요. 체계적이고 효율적으로 운영되고 있어요."]], "t34-2": [["You will see color-coded bins for plastics, cans, and glass in many neighborhoods. You will also see RFID machines for food waste. Most people see this as a normal daily habit. We also use special trash bags and stickers for big items.", "많은 동네에서 플라스틱, 캔, 유리병을 색깔별로 분리하는 쓰레기통을 볼 수 있어요. 음식물 쓰레기용 RFID 기계도 있어요. 대부분의 사람들은 이걸 당연한 일상 습관으로 여겨요. 종량제 봉투나 큰 물건용 스티커도 사용해요."]], "t34-3": [["I think this shows what our society values. We value order and shared responsibility. Recycling is more than just a system here. It is something we are proud of.", "저는 이게 우리 사회가 중요하게 여기는 걸 보여준다고 생각해요. 우리는 질서와 공동 책임을 중요하게 생각해요. 재활용은 단순한 시스템이 아니에요. 우리가 자부심을 느끼는 부분이에요."]], "t35-0": [["I'd like to tell you about Chuseok, one of the major holidays in Korea.", "한국의 대표 명절 중 하나인 추석에 대해 말씀드릴게요."]], "t35-1": [["It's something we're actually pretty proud of because it's meaningful and brings families together.", "가족이 함께 모여 의미 있는 시간을 보내는 날이라 우리가 정말 자부심을 갖고 있어요."]], "t35-2": [["During Chuseok, people travel to their hometowns. They cook traditional food like songpyeon. They also visit family graves to show respect. Most people use this time to thank their family and relax a little.", "추석에는 사람들이 고향에 내려가요. 송편 같은 전통 음식을 만들어요. 조상님 묘소에도 가서 성묘를 해요. 대부분 이 시간에 가족에게 감사하고 조금 쉬어요."]], "t35-3": [["Personally, I think it really shows what we value as a society… family, respect, and tradition.", "개인적으로 이건 우리가 사회적으로 중요하게 여기는 가족, 존중, 전통을 잘 보여준다고 생각해요."]], "t35-4": [["So yeah, Chuseok isn't just a holiday here… it's something we take pride in.", "그래서 추석은 단순한 명절이 아니라 우리가 자부심을 갖는 문화예요."]], "t36-0": [["I'd like to tell you about the public transportation system in Korea.", "한국의 대중교통 시스템에 대해 말씀드릴게요."]], "t36-1": [["It's something we're actually pretty proud of because it's clean, fast, and incredibly efficient.", "깨끗하고 빠르며 정말 효율적이라 우리가 자부심을 갖고 있어요."]], "t36-2": [["Subways, buses, and trains all run on time. People can use one transit card for everything. This makes transferring very easy.", "지하철, 버스, 기차가 모두 제시간에 운행돼요. 사람들은 교통카드 하나로 모든 걸 이용할 수 있어요. 그래서 환승이 정말 쉬워요."]], "t36-3": [["Most people see it as a daily habit and a symbol of convenience and order in city life.", "대부분의 사람들은 이를 도시 생활의 편리함과 질서를 상징하는 일상의 일부로 생각해요."]], "t36-4": [["Personally, I think it really shows what we value as a society… punctuality, organization, and public responsibility.", "개인적으로 이건 우리가 사회적으로 중요하게 여기는 시간 엄수, 체계성, 공공의식을 잘 보여준다고 생각해요."]], "t36-5": [["So yeah, our transportation system isn't just a system here… it's something we take pride in.", "그래서 한국의 교통 시스템은 단순한 서비스가 아니라 우리가 자부심을 갖는 문화예요."]], "t37-0": [["Parks in my country have one problem. They are not well maintained these days. They are also not very clean.", "우리나라 공원에는 한 가지 문제가 있어요. 요즘 관리가 잘 안 돼요. 그리고 별로 깨끗하지도 않아요."]], "t37-1": [["Many parks have trash bins that are always full. Some benches are broken. Also, some people don't follow the rules, like cleaning up after a picnic or keeping their dog on a leash.", "많은 공원에 쓰레기통이 항상 넘쳐요. 벤치가 망가진 곳도 있어요. 또 어떤 사람들은 규칙을 안 지켜요. 예를 들면 피크닉 후에 청소를 안 하거나 반려견 목줄을 안 해요."]], "t37-2": [["That's the biggest problem I see in parks these days. To fix it, people need to be more careful with their trash. Local governments should also spend more money on cleaning and better facilities.", "이게 요즘 공원에서 제가 가장 크게 느끼는 문제예요. 이걸 해결하려면 사람들이 쓰레기를 더 조심해서 버려야 해요. 지자체도 청소와 시설 개선에 돈을 더 써야 해요."]], "t38-0": [["I'd like to tell you about AI, which is a rising industry in my country.", "제가 이야기하고 싶은 것은 AI, 즉 우리나라에서 떠오르는 산업이에요."]], "t38-1": [["AI is really smart and powerful. It stands out the most in education, healthcare, and even art.", "AI는 정말 똑똑하고 강력해요. 특히 교육, 의료, 그리고 예술 분야에서 가장 눈에 띄어요."]], "t38-2": [["Whenever I use AI tools like ChatGPT, I feel more confident and focused.", "저는 ChatGPT 같은 AI 도구를 사용할 때마다 자신감이 생기고 집중력이 높아지는 느낌이 들어요."]], "t38-3": [["One time, I used it to prepare a project very quickly. It saved me a lot of time. That made me appreciate AI even more.", "한 번은 AI를 사용해서 프로젝트를 아주 빠르게 준비했어요. 시간을 많이 절약할 수 있었어요. 그 일로 AI가 더 고마워졌어요."]], "t38-4": [["Sometimes, AI makes mistakes. This can be disappointing, especially if you pay for it. But I think it's still improving.", "가끔 AI가 실수를 해요. 특히 유료 버전을 쓸 때는 좀 실망스러울 수 있어요. 하지만 아직 발전하는 중이라고 생각해요."]], "t38-5": [["So yeah, AI means a lot to me and to our future.", "물론 가끔은 유료 버전을 사용해도 실수를 할 때가 있어서 실망스러울 때도 있지만, 아직 발전 중인 기술이라 이해해요. 그래서 저는 AI가 저뿐만 아니라 우리의 미래에도 아주 중요한 의미가 있다고 생각해요.장소"]], "t39-0": [["I'd like to talk about a dry cleaner I go to often.", "제가 자주 가는 세탁소 한 곳에 대해 이야기해 볼게요."]], "t39-1": [["It's in my neighborhood, right across the street from my apartment, and it's got a really clean and reliable vibe.", "제 집 바로 맞은편, 같은 동네에 있고, 분위기는 정말 깔끔하고 믿음직한 편이에요."]], "t39-2": [["The first thing you notice is how organized everything is. The clothes are arranged neatly, and there's a simple counter. Overall, it feels pretty casual and efficient.", "들어가면 가장 먼저 모든 게 정리되어 있다는 걸 느껴요. 옷들이 깔끔하게 정리돼 있고, 카운터도 단순해요. 전체적으로 편안하면서 효율적인 느낌이에요."]], "t39-3": [["What I like most is their same-day pickup service, and it always makes me feel relieved and stress-free when I'm there.", "제가 가장 좋아하는 건 당일 수거 서비스인데, 그곳에 가면 항상 마음이 놓이고 스트레스가 줄어드는 기분이 들어요."]], "t39-4": [["That's basically why I like this place.", "그래서 이 세탁소를 좋아해요."]], "t40-0": [["I'd like to talk about a post office I go to often.", "제가 자주 가는 우체국 한 곳에 대해 이야기해 볼게요."]], "t40-1": [["It's in my neighborhood near the subway station, and it's got a really busy but efficient vibe.", "집 근처 지하철역 근처에 있고, 분위기는 바쁘지만 효율적인 편이에요."]], "t40-2": [["The first thing you notice is the ticket machine. There are also counters with glass dividers. Overall, it feels pretty clean and organized.", "들어가면 가장 먼저 번호표 기계가 보여요. 유리 칸막이가 있는 창구들도 있어요. 전체적으로 깔끔하고 정돈된 느낌이에요."]], "t40-3": [["What I like most is the self-service area. There, I can weigh and label my own packages. It always makes me feel productive.", "제가 가장 좋아하는 건 셀프 서비스 공간이에요. 거기서 소포 무게도 재고 라벨도 직접 붙일 수 있어요. 그걸 할 때마다 뭔가 생산적인 기분이 들어요."]], "t40-4": [["That's basically why I like this place.", "그래서 이곳을 좋아해요."]], "t41-0": [["I'd like to talk about a library I go to often.", "제가 자주 가는 도서관 한 곳에 대해 이야기해 볼게요."]], "t41-1": [["It's in my neighborhood near the park, and it's got a really quiet and cozy vibe.", "동네 공원 근처에 있고, 분위기는 조용하고 아늑한 편이에요."]], "t41-2": [["The first thing you notice is the big windows and wooden bookshelves, and overall it feels pretty calm and relaxing.", "들어가면 가장 먼저 큰 창문이랑 나무 책장이 눈에 띄고, 전체적으로 차분하고 편안한 느낌이에요."]], "t41-3": [["What I like most is the study zone and computer area, and it always makes me feel focused and recharged when I'm there.", "제가 가장 좋아하는 건 스터디존이랑 컴퓨터 공간인데, 그곳에 있으면 항상 집중도 잘 되고 리프레시되는 기분이 들어요."]], "t41-4": [["That's basically why I like this place.", "그래서 이 도서관을 좋아해요."]], "t42-0": [["I'd like to tell you about my older sister.", "저는 제 언니에 대해 말씀드리고 싶어요."]], "t42-1": [["She's really energetic and disciplined, and what stands out the most is how consistent she is with her routine.", "언니는 정말 활기차고 자기관리가 잘 되는 사람인데, 특히 생활 루틴을 꾸준히 지킨다는 점이 가장 인상 깊어요."]], "t42-2": [["She's fit with clear skin, and she usually looks well-rested.", "몸이 건강해 보이고 피부도 맑은 편이고, 보통 피곤해 보이지 않아요."]], "t42-3": [["Whenever I spend time with her, I notice a few things. She eats balanced meals. She works out regularly. She also gets enough sleep.", "언니와 시간을 보낼 때마다 몇 가지가 눈에 보여요. 균형 잡힌 식사를 해요. 규칙적으로 운동도 해요. 잠도 충분히 자요."]], "t42-4": [["One time, she stuck to her healthy habits even during a very busy time at work, and that made me appreciate her mindset even more.", "한번은 일이 아주 바쁜 시기에도 건강한 습관을 계속 유지하는 모습을 보고, 언니의 마인드를 더 존경하게 됐어요."]], "t42-5": [["So yeah, that's why I think she's a healthy person.", "그래서 저는 언니가 건강한 사람이라고 생각해요."]], "t43-0": [["Ah, my free time… that's a good question.", "아, 제 여가 시간이요… 좋은 질문이네요."]], "t43-1": [["I usually try to balance being active and relaxing.", "저는 보통 활동적인 시간과 휴식 시간을 균형 있게 보내려고 해요."]], "t43-2": [["I work out a few times a week, and I also like going to cafés where I can listen to music and unwind.", "일주일에 몇 번은 운동을 하고, 음악을 들으면서 카페에 가서 쉬는 것도 좋아해요."]], "t43-3": [["When I want to fully relax, I watch Netflix.", "완전히 쉬고 싶을 때는 넷플릭스를 봐요."]], "t43-4": [["Lately, I've been watching a show called The Witcher, and I've been enjoying it a lot.", "요즘에는 The Witcher 라는 드라마를 보고 있는데, 정말 재미있게 보고 있어요."]], "t43-5": [["Overall, I use my free time to recharge and enjoy myself.", "전반적으로 저는 여가 시간을 재충전하고 즐기는 데 사용해요."]], "t44-0": [["Something I do pretty often is just chill at home, and um, it's honestly become part of my lifestyle.", "저는 집에서 그냥 쉬는 걸 자주 해요."]], "t44-1": [["It might sound simple, but yeah, it really shows a lot about daily life here in Korea.", "음… 이제는 진짜 제 생활의 일부가 된 것 같아요."]], "t44-2": [["The whole thing's pretty relaxing, and what I notice most is just how comfortable and peaceful it feels to have my own space.", "좀 단순하게 들릴 수도 있지만, 이게 한국에서의 일상을 잘 보여주는 것 같아요."]], "t44-3": [["People say staying home is one of the best ways to recharge, and I'd say I totally agree with that.", "전체적으로 되게 편안하고, 특히 자기 공간에서 느껴지는 여유로움이 제일 좋아요."]], "t44-4": [["Whenever I watch Netflix or cook something simple, I feel more connected to myself and get to kinda slow down after a busy day.", "많은 사람들이 집콕이 제일 좋은 휴식 방법이라고 하는데, 저도 완전 공감해요."]], "t44-5": [["Oh, and one time, I tried baking bread for the first time and… that moment really stuck with me.", "저는 집에서 넷플릭스 보거나 간단하게 요리할 때, 마음이 좀 편해지고 하루의 피로가 풀리는 느낌이에요."]], "t44-6": [["So yeah, staying home isn't just a habit for me. It's a small but meaningful part of my everyday life.", "그래서 저한테 집에 있는 건 단순한 습관이 아니에요. 제 일상에서 작지만 의미 있는 부분이에요."]], "t45-0": [["Something I do pretty often is clean and organize my home, and um, it's honestly become part of my lifestyle.", "제가 자주 하는 건 집을 청소하고 정리하는 거예요."]], "t45-1": [["It might sound simple, but yeah, it really shows a lot about how much we care about our living space.", "이것도 이제 제 라이프스타일의 일부가 됐어요."]], "t45-2": [["The whole thing's pretty satisfying, and what I notice most is just how much calmer it feels after cleaning.", "단순하지만, 사람들이 얼마나 집을 중요하게 생각하는지 보여주는 것 같아요."]], "t45-3": [["Whenever I clean up or cook with my family, I feel more connected and get to kinda create a cozy vibe at home.", "보통은 뿌듯하고, 청소 끝나고 집이 훨씬 편안해지는 게 제일 좋아요."]], "t45-4": [["So yeah, doing household chores is more than just a habit for me. It's a small but meaningful part of life here.", "그래서 집안일은 저한테 단순한 습관 이상이에요. 여기서의 일상 속 작지만 의미 있는 부분이에요."]], "t46-0": [["Something I do pretty often is spend my vacation at home, and um, it's honestly become part of my lifestyle.", "저는 휴가 때 집에서 보내는 걸 자주 해요."]], "t46-1": [["It might sound simple, but yeah, it really shows a lot about how I like to rest and recharge.", "음… 이제는 진짜 제 생활의 일부가 된 것 같아요."]], "t46-2": [["The whole thing's pretty peaceful, and what I notice most is just how nice it feels to relax without any plans or pressure.", "좀 단순하게 들릴 수도 있지만, 제가 어떻게 쉬고 충전하는지 잘 보여주는 것 같아요."]], "t46-3": [["People say traveling is the best way to spend a vacation, but honestly, I totally enjoy just staying home and doing nothing for a change.", "전체적으로 되게 평화롭고, 특히 아무 계획이나 부담 없이 푹 쉬는 그 느낌이 너무 좋아요."]], "t46-4": [["Whenever I watch movies, take long naps, or order good food, I feel recharged. I also get to slow down and enjoy my own space.", "영화를 보거나, 낮잠을 자거나, 맛있는 음식을 시켜 먹을 때마다 재충전되는 느낌이에요. 그리고 천천히 제 공간을 즐길 수 있어요."]], "t46-5": [["Oh, and one time, I spent the whole day in pajamas watching dramas, and… that moment really stuck with me.", "집에서 영화 보고, 낮잠 자고, 맛있는 거 시켜 먹을 때, 몸도 마음도 충전되는 느낌이에요."]], "t46-6": [["So yeah, staying home for vacation isn't boring at all. It's actually a small but meaningful way for me to rest.", "그래서 집에서 보내는 휴가는 전혀 지루하지 않아요. 저한테는 작지만 의미 있는 휴식 방법이에요."]], "t47-0": [["Something I do pretty regularly is watch stuff with family on Netflix, and it's actually become a part of my lifestyle.", "저는 가족이랑 넷플릭스로 이것저것 보는 걸 자주 해요."]], "t47-1": [["It may sound simple, but it really shows something about how these platforms changed everything.", "이제는 진짜 제 생활의 일부가 된 것 같아요."]], "t47-2": [["It's usually convenient and what stands out is how easy it is to satisfy my family's different tastes.", "좀 단순하게 들릴 수도 있지만, 이런 플랫폼들이 우리의 일상을 얼마나 바꿨는지를 잘 보여주는 것 같아요."]], "t47-3": [["Also, whenever we eat snacks and scroll through Netflix to pick something, we usually watch it together. I feel like I can relax and spend real quality time with them.", "또 간식을 먹으면서 넷플릭스에서 뭘 볼지 고를 때, 보통 같이 봐요. 그럴 때 마음이 편해지고 가족과 좋은 시간을 보내는 느낌이 들어요."]], "t47-4": [["One time, we ended up marathoning a whole series in one night, and I still remember that.", "그리고 간식 먹으면서 넷플릭스에서 뭐 볼지 고르고 같이 볼 때, 정말 편하게 쉴 수 있고 가족이랑 진짜 좋은 시간을 보내는 느낌이에요."]], "t47-5": [["So yeah, watching stuff together at home is just a small thing, but it really matters to me.", "예전에 하룻밤 동안 시리즈 한 시즌을 다 본 적이 있는데, 그때가 아직도 기억에 남아요. 그래서 그런지 집에서 가족이랑 같이 보는 시간은 작은 일이지만, 저한테는 정말 의미 있는 시간이 된 것 같아요."]], "t48-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 음악이 어떻게 들어가는지 말하자면… 글쎄요, 흠… 저는 출퇴근할 때나 책상에서 일할 때 휴대폰으로 음악을 자주 들어요."]], "t48-1": [["Something I do pretty regularly is listen to music on my phone when I'm commuting or working at my desk.", "별건 아니고요, 보통은 이어폰을 끼고, 유튜브 뮤직을 켜서 자주 듣는 플레이리스트를 틀어요."]], "t48-2": [["It's nothing fancy. Usually, I put on my headphones and open YouTube Music. I play my go-to playlist. It helps me focus or just clear my head a bit.", "별거 아니에요. 보통 이어폰을 끼고 유튜브 뮤직을 켜요. 자주 듣는 플레이리스트를 틀어요. 그러면 집중이 잘 되거나 머리가 좀 맑아져요."]], "t48-3": [["I don't even think about it anymore. It's just one of my small habits. It keeps my day flowing and sets the mood, without me even noticing.", "이제는 딱히 의식하지도 않아요. 그냥 제 작은 습관 중 하나예요. 하루의 흐름을 만들어주고 분위기도 잡아주는데, 저도 모르게 그렇게 돼요."]], "t48-4": [["Oh, and once in a while, I do go to small concerts or live café gigs, but most of the time, it's just me and my playlist.", "아, 가끔은 작은 콘서트나 라이브 카페 공연에도 가지만, 대부분은 그냥 저랑 제 플레이리스트만의 시간이에요."]], "t48-5": [["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변인 것 같아요."]], "t49-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 카페가 어떻게 들어가는지 말하자면… 글쎄요, 흠… 저는 노트북 가지고 카페에 가서 일하거나 공부하는 걸 자주 해요."]], "t49-1": [["Something I do pretty regularly is go to cafés to work or study on my laptop.", "별거 대단한 건 아니고요, 보통은 아이스 아메리카노를 사서 조용한 자리 잡고, 배경음악을 틀어두면 그게 집중도 잘 되고 생산적인 기분으로 만들어줘요."]], "t49-2": [["It's nothing fancy. Usually, I grab an iced Americano and find a quiet corner. I put on some background music. It helps me focus and get into a productive mood.", "별거 아니에요. 보통 아이스 아메리카노를 사고 조용한 자리를 잡아요. 배경음악을 틀어요. 그러면 집중도 잘 되고 생산적인 기분이 들어요."]], "t49-3": [["I don't even think about it that much anymore… like… it's just one of those little habits that keep my days balanced and make me feel calm.", "아, 가끔은 친구들이나 동료들이랑 만나서 얘기하거나 계획을 세우기도 하는데, 대부분은 그냥 저랑 제 노트북만의 시간이에요."]], "t49-4": [["Oh, and sometimes I meet friends or coworkers there to talk or plan something, but most of the time, it's just me and my laptop. But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변인 것 같아요."]], "t50-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 술집이 어떻게 들어가는지 말하자면… 글쎄요, 흠… 저는 한 주가 끝날 때쯤 가까운 친구들이랑 술집에 가는 걸 자주 해요."]], "t50-1": [["Something I do pretty regularly is go to a bar with a few close friends after a long week.", "특별한 건 없고요, 보통은 아늑한 자리 잡고, 칵테일이나 생맥주 몇 잔 시키고, 안주도 같이 시켜서 수다 떨다 보면 그게 스트레스도 풀리고 그냥 삶에 대해 이야기할 수 있는 시간이 돼요."]], "t50-2": [["It's nothing fancy. Usually, we find a cozy spot and order a few cocktails or some draft beer. We also share a couple of side dishes. It helps me unwind and just talk about life.", "별거 아니에요. 보통 아늑한 자리를 잡고 칵테일이나 생맥주를 몇 잔 시켜요. 안주도 같이 시켜요. 그러면 스트레스가 풀리고 그냥 삶에 대해 이야기할 수 있어요."]], "t50-3": [["I don't even think about it that much anymore… like… it's just one of those little habits that let me recharge and stay connected with my friends.", "아, 예전에 얘기하다가 술집 문 닫을 때까지 있었는데 벌써 새벽 3시가 다 된 거예요, 그때가 아직도 기억에 남아요."]], "t50-4": [["Oh, and one time, we kept talking until the bar closed. We realized it was almost 3 a.m. I still remember that. But yeah, I'd say that's my answer.", "아, 그리고 한 번은 술집이 문 닫을 때까지 계속 얘기했어요. 벌써 새벽 3시가 다 된 걸 알았죠. 그때가 아직도 기억에 남아요. 음, 네, 그게 제 답변인 것 같아요."]], "t51-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 공원이 어떻게 들어가는지 말하자면… 글쎄요, 흠… 저는 일주일에 두세 번 정도, 보통 늦은 오후에 공원에 가요."]], "t51-1": [["Something I do pretty regularly is head to the park a couple of times a week, usually in the late afternoon.", "별거 대단한 건 아니고요, 보통 근처에서 커피를 사고, 폰으로 걷기 코스를 켜고, 가벼운 팟캐스트를 틀면 그게 머리가 맑아지고 하루를 리셋하는 데 도움이 돼요."]], "t51-2": [["It's nothing fancy. Usually, I grab a coffee nearby and start a walking route on my phone. I put on a light podcast. It helps me clear my head and reset after the day.", "별거 아니에요. 보통 근처에서 커피를 사고 폰으로 걷기 코스를 켜요. 가벼운 팟캐스트를 틀어요. 그러면 머리가 맑아지고 하루를 리셋하는 데 도움이 돼요."]], "t51-3": [["I don't even think about it that much anymore. It's just one of those little habits. It keeps my mood steady. It also gets me moving without me overthinking it.", "이제는 딱히 의식하지도 않아요. 그냥 작은 습관 중 하나예요. 기분을 안정시켜줘요. 또 너무 깊게 생각하지 않고 몸을 움직이게 해줘요."]], "t51-4": [["From the moment I arrive, I do a few things. I stretch a bit by the entrance. I do a brisk lap. I slow down near the trees to cool off. Then I sit on a bench to journal or check in with family.", "도착하면 몇 가지를 해요. 입구 쪽에서 가볍게 스트레칭을 해요. 빠르게 한 바퀴 돌아요. 나무가 많은 쪽에서는 속도를 줄여서 몸을 식혀요. 그다음 벤치에 앉아서 일기를 쓰거나 가족에게 연락해요."]], "t51-5": [["Before I leave, I do a few more stretches. I refill my water and log my steps. And then I'm out. But yeah, I'd say that's my answer.", "나가기 전에는 스트레칭을 한 번 더 해요. 물도 채우고 걸음 수도 기록해요. 그러고 나서 나가요. 음, 네, 그게 제 답변인 것 같아요."]], "t52-0": [["Well… Hmm…", "음… 흐음… 별건 아니고요… 보통은 운동하기 전에 스트레칭으로 몸을 제대로 풀어주는 편이에요."]], "t52-1": [["It's nothing fancy. Usually, I warm up first by doing some stretches. This helps me avoid injury during my little workout.", "별거 아니에요. 보통 운동 전에 스트레칭으로 먼저 몸을 풀어요. 이렇게 하면 작은 운동이라도 부상 없이 할 수 있어요."]], "t52-2": [["I don't even think about it that much anymore. It's just one of those little habits that keeps me safe. Honestly, I didn't even know it was a routine of mine.", "이제는 딱히 크게 생각하지도 않아요. 그냥 나를 안전하게 지켜주는 작은 습관 중 하나예요. 솔직히 이게 제 루틴인 줄도 몰랐어요."]], "t52-3": [["But yeah, I'd say that's my answer.", "네, 그게 제 답인 것 같아요."]], "t53-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 가구를 사는 게 어떻게 진행되는지 말하자면… 글쎄요, 흠… 저는 새 가구를 살 때 보통 온라인으로 찾아보거나, 결정하기 전에 몇 군데 매장을 들러요."]], "t53-1": [["Something I do pretty regularly is browse for new furniture online or visit a few stores before deciding what to buy.", "특별한 건 없고요, 보통 집 공간을 먼저 재보고, 여러 사이트에서 스타일이랑 가격을 비교하면서, 방 분위기에 어울리는 사진들을 저장해둬요."]], "t53-2": [["It's nothing fancy. Usually, I measure the space at home and compare styles and prices on different websites. I also save photos that match my room's vibe. This helps me picture how everything will fit together.", "별거 아니에요. 보통 집 공간을 재보고 여러 사이트에서 스타일과 가격을 비교해요. 제 방 분위기에 맞는 사진도 저장해둬요. 그러면 전체적인 배치를 미리 상상할 수 있어요."]], "t53-3": [["I don't even think about it that much anymore… like… it's just one of those little habits that keep my place organized and make it feel more like home.", "이제는 딱히 의식하지도 않아요… 그냥 집을 깔끔하게 정리하고, 내 공간을 더 내답게 만드는 작은 습관인 것 같아요."]], "t53-4": [["When it comes to big pieces, I ask my family for opinions. Sometimes I bring a friend along to check the quality in person. But for smaller items, I just order online.", "큰 가구를 살 때는 가족에게 의견을 물어봐요. 가끔은 친구랑 같이 가서 품질을 직접 확인하기도 해요. 하지만 작은 물건은 그냥 온라인으로 주문해요."]], "t53-5": [["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변인 것 같아요."]], "t54-0": [["Something I do pretty regularly is going to the beach, and it's actually become a part of my lifestyle.", "제가 꽤 자주 하는 것 중 하나는 해변에 가는 것인데, 이게 이제는 제 라이프스타일의 한 부분이 되었어요."]], "t54-1": [["It may sound simple, but it really shows something about daily life here.", "단순하게 들릴 수도 있지만, 이걸 보면 여기서의 일상적인 삶이 어떤지 느껴질 수 있어요."]], "t54-2": [["It's usually super relaxing there. I love the vibe. There's salty air, the sound of waves, and people just relaxing.", "거기는 보통 정말 편안해요. 분위기가 마음에 들어요. 짠 바닷바람이 불고, 파도 소리가 들리고, 사람들이 그냥 쉬고 있어요."]], "t54-3": [["Whenever I arrive, I feel like I can reset my mood. So I usually find a spot and put my stuff down. Then I take a few minutes just to look at the ocean.", "도착할 때마다 기분이 리셋되는 느낌이 들어요. 그래서 보통 자리를 잡고 짐을 내려놓아요. 그다음 잠깐 바다를 바라보는 시간을 가져요."]], "t54-4": [["One time, I got there a bit early. The beach was almost empty. I still remember that.", "한 번은 조금 일찍 도착했어요. 해변이 거의 비어 있었어요. 아직도 그 기억이 남아 있어요."]], "t54-5": [["So yeah, my beach routine is just a small thing, but it really matters to me.", "그래서 제 해변 루틴은 작은 일이지만, 저한테는 정말 의미가 있어요."]], "t55-0": [["Something I do pretty regularly is go camping with my friends, and it's actually become a part of my lifestyle.", "제가 자주 하는 일 중 하나는 친구들이랑 캠핑 가는 거예요."]], "t55-1": [["It may sound simple, but it really shows something about how people here enjoy nature.", "이게 이제 제 라이프스타일의 일부가 된 것 같아요."]], "t55-2": [["It's usually peaceful, and what stands out is the view and fresh air.", "단순하게 들릴 수도 있지만, 한국 사람들이 자연을 얼마나 즐기는지 잘 보여주는 것 같아요."]], "t55-3": [["Whenever I set up the tent and cook together, I feel like I can just unwind.", "보통은 되게 평화롭고, 특히 공기랑 풍경이 진짜 좋아요."]], "t55-4": [["One time, we talked by the fire all night, and I still remember that.", "텐트 치고 같이 요리할 때, 그냥 완전히 쉬는 느낌이에요."]], "t55-5": [["So yeah, camping is just a small thing, but it really matters to me.", "한 번은 밤새 모닥불 옆에서 얘기했는데, 아직도 기억에 남아요. 그래서 캠핑은 작은 일이지만, 저한테는 진짜 의미 있는 시간이에요."]], "t56-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 흠… 저는 매일 아침 버스나 지하철 타고 출근해요."]], "t56-1": [["Something I do pretty regularly is take the subway or bus to work every morning.", "특별한 건 없고요, 보통 이어폰 끼고, 자리가 있으면 앉고, 메시지를 확인하면서 시간을 보내요."]], "t56-2": [["I don't do anything special. I usually put on my earphones and check my messages. I sit down if there's a seat. This helps me wake up slowly and get ready for work.", "특별한 건 없어요. 보통 이어폰을 끼고 메시지를 확인해요. 자리가 있으면 앉아요. 이렇게 하면 천천히 깨어나고 일할 준비가 돼요."]], "t56-3": [["I don't think about it much anymore. It's just a small habit for me now. It keeps my day on time.", "이제는 별로 신경 쓰지 않아요. 그냥 작은 습관이 됐어요. 이게 하루를 제시간에 맞게 해줘요."]], "t56-4": [["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요."]], "t57-0": [["Something I do pretty regularly is sorting the trash ASAP, and it's actually become a part of my lifestyle.", "제가 꽤 자주 하는 일은 쓰레기가 생기면 바로바로 분리수거하는 거예요."]], "t57-1": [["It may sound simple, but it really shows something about daily life here.", "이제는 제 생활 패턴의 한 부분이 되었어요."]], "t57-2": [["It's usually pretty straightforward, and what stands out is it's become such an automatic thing now.", "단순하게 들릴 수도 있지만, 이게 한국의 일상적인 모습을 잘 보여주는 행동이기도 해요."]], "t57-3": [["Whenever I finish using something, like a bottle, a can, or cardboard, I sort it right away. This keeps my home cleaner. It also saves me trouble later.", "병, 캔, 박스 같은 걸 다 쓰면 바로 분리해요. 이렇게 하면 집이 더 깨끗해져요. 나중에 번거로운 일도 줄어들어요."]], "t57-4": [["One time, I forgot to sort some plastic containers. It took forever to recycle everything. I still remember that.", "한 번은 플라스틱 용기들을 분리 안 했어요. 그래서 다 분리수거하는 데 한참 걸렸어요. 그 일이 아직도 기억나요."]], "t58-0": [["Something I do pretty often is go hiking or walk along rivers, and um, it's honestly become part of my lifestyle.", "제가 자주 하는 건 등산하거나 강가를 걷는 거예요."]], "t58-1": [["It might sound simple, but yeah, it really shows a lot about how people here enjoy nature.", "이제는 제 생활의 일부가 된 것 같아요."]], "t58-2": [["The whole thing's pretty energizing, and what I notice most is just how clean and easy the trails are.", "단순하지만, 한국 사람들이 자연을 얼마나 즐기는지 잘 보여주는 것 같아요."]], "t58-3": [["Whenever I go for a hike or take a riverside walk, I feel more connected and get to kinda refresh my mind and body.", "보통은 활기차고 기분이 좋아지고, 특히 길이 깨끗하고 걷기 편해서 좋아요."]], "t58-4": [["So I think enjoying outdoor activities is more than just a habit for me. It's a small but meaningful part of my life here.", "그래서 야외 활동을 즐기는 건 저에게 단순한 습관 그 이상인 것 같아요. 제 삶에서 작지만 의미 있는 부분이에요."]], "t59-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 글쎄요, 흠… 저는 명절이나 휴일엔 가족들이랑 부모님 댁에서 시간을 보내요."]], "t59-1": [["Something I do pretty regularly is spend the holidays with my family, usually at my parents' place.", "특별한 건 없고요, 보통 같이 음식 준비하고, 저녁 먹은 뒤엔 영화 보거나 디저트 먹으면서 얘기해요."]], "t59-2": [["I don't do anything special. I usually help prepare food. After dinner, we watch a movie and chat over dessert. This makes me feel grounded and thankful.", "특별한 건 없어요. 보통 음식 준비를 도와요. 저녁 먹고 나서 영화 보고 디저트 먹으면서 얘기해요. 이렇게 하면 마음이 편안하고 감사한 기분이 들어요."]], "t59-3": [["I don't think about it much anymore. It's just a small habit for me now. It keeps my family relationships strong. It reminds me what matters most.", "이제는 별로 신경 쓰지 않아요. 그냥 작은 습관이 됐어요. 이게 가족 관계를 단단하게 해줘요. 그리고 가장 중요한 게 뭔지 다시 생각하게 해줘요."]], "t59-4": [["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요."]], "t60-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 흠… 어릴 때는 두세 달에 한 번씩 치과 검진을 받으러 갔어요."]], "t60-1": [["Something I used to do pretty regularly as a kid was go to the dentist every few months for checkups.", "특별한 건 없고요, 보통 큰 의자에 앉아서 윙윙거리는 소리를 들으면서 긴장 안 하려고 노력했어요."]], "t60-2": [["It wasn't anything special. I usually sat in the big chair and listened to the buzzing sound. I tried not to get scared. This helped me stay calm around doctors later.", "특별한 건 없었어요. 보통 큰 의자에 앉아서 윙윙거리는 소리를 들었어요. 무서워하지 않으려고 노력했어요. 이게 나중에 병원에서 차분하게 있는 데 도움이 됐어요."]], "t60-3": [["I don't think about it much anymore. It's just a memory that stayed with me. It made me less scared of hospitals later on.", "이제는 별로 생각하지 않아요. 그냥 기억에 남은 일이에요. 이게 나중에 병원을 덜 무서워하게 해줬어요."]], "t60-4": [["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요."]], "t61-0": [["I first started going to the gym a few years ago… you know…", "제가 헬스장에 처음 다니기 시작한 건 몇 년 전이었어요… 그거 아시죠…"]], "t61-1": [["I wanted to drop some weight and… get fit.", "살도 좀 빼고… 몸도 좀 만들고 싶어서요."]], "t61-2": [["As for my routine, I follow a three-day split. I do a pull day, a push day, and a leg day.", "루틴은 3분할로 하고 있어요. 풀 데이, 푸시 데이, 레그 데이로 나눠서 해요."]], "t61-3": [["On my pull days, I do my back and forceps…On my push day I do my chest and triceps… and umm.. on my leg days, I do my legs.", "풀 데이에는 등이랑 이두 운동하고요, 푸시 데이에는 가슴이랑 삼두 운동해요."]], "t61-4": [["It's nothing special.", "그리고 음… 레그 데이에는 그냥 하체 운동을 해요. 특별한 건 없어요."]], "t62-0": [["Honestly, going to the gym had a big impact on my health.", "솔직히 말하면, 헬스장에 다니는 건 제 건강에 정말 큰 영향을 줬어요."]], "t62-1": [["Physically, it gave me more energy and stamina, so I don't get tired as easily during the day.", "신체적으로는 에너지랑 체력이 좋아져서 하루 중에 쉽게 피곤해지지 않게 됐어요."]], "t62-2": [["It also helped with posture and muscle balance, especially since I sit a lot.", "또 제가 오래 앉아 있는 편이라 자세나 근육 밸런스에도 도움이 됐어요."]], "t62-3": [["My body just feels less stiff and sore.", "몸이 전보다 덜 뻐근하고 덜 아파요."]], "t62-4": [["Mentally, it helped even more.", "정신적인 면에서는 오히려 그 효과가 더 컸어요."]], "t62-5": [["After a workout, I feel less stressed. My mood gets better too. I also sleep better at night. Overall, the gym helps me stay healthy, both physically and mentally. That's why I try to make it part of my routine.", "운동하고 나면 스트레스가 줄어요. 기분도 더 좋아져요. 밤에 잠도 더 잘 자요. 전반적으로 헬스장은 몸과 마음 모두 건강하게 해줘요. 그래서 이걸 제 일상의 한 부분으로 유지하려고 해요."]], "t63-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 글쎄요, 흠… 저는 두 달에 한 번 정도 미용실에 가서 머리를 다듬고 앞머리를 정리해요."]], "t63-1": [["Something I do pretty regularly is go to the salon every couple of months to get a haircut and trim my bangs.", "특별한 건 없고요, 보통 디자이너에게 인사하고, 자리에 앉아서 참고 사진 몇 장을 보여줘요."]], "t63-2": [["I don't do anything special. I usually say hi to my stylist and sit down. Then I show a few reference photos. This helps me get exactly the look I want, without thinking too much.", "특별한 건 없어요. 보통 디자이너에게 인사하고 자리에 앉아요. 그리고 참고 사진 몇 장을 보여줘요. 이렇게 하면 너무 고민하지 않고도 딱 원하는 스타일로 할 수 있어요."]], "t63-3": [["I don't think about it much anymore. It's just a small habit now. It keeps me looking fresh and feeling put together. Honestly, I didn't even realize it was a routine of mine.", "이제는 별로 신경 쓰지 않아요. 그냥 작은 습관이 됐어요. 이게 저를 깔끔하고 정돈된 느낌으로 만들어줘요. 사실 이게 제 루틴인지도 몰랐어요."]], "t63-4": [["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요."]], "t64-0": [["Something I do pretty regularly is stay at hotels when I travel, and it's actually become a part of my lifestyle.", "제가 가끔 하는 일은 여행할 때 호텔에 머무는 거예요."]], "t64-1": [["It may sound simple, but it really shows something about how people value comfort.", "이것도 이제 제 생활 패턴 중 하나가 됐어요."]], "t64-2": [["It's usually relaxing, and what stands out is the clean rooms and cozy vibe.", "단순하지만, 사람들이 얼마나 편안함을 중요하게 생각하는지 보여주는 것 같아요."]], "t64-3": [["Whenever I check in and lie on the bed, I feel like I can totally recharge.", "보통은 되게 편하고, 특히 깨끗한 방이랑 아늑한 분위기가 좋아요."]], "t64-4": [["One time, I watched the sunrise from my hotel window, and I still remember that.", "체크인하고 침대에 눕는 순간, 그냥 모든 피로가 사라지는 느낌이에요."]], "t64-5": [["So yeah, staying at hotels is just a small thing, but it really matters to me.", "한 번은 호텔 창문 너머로 해 뜨는 걸 봤는데, 아직도 그게 기억에 남아요. 그래서 호텔에서 쉬는 시간은 작지만, 저한테는 꽤 소중해요."]], "t65-0": [["Something I do pretty often is use my phone and laptop for almost everything, and um, it's honestly become part of my lifestyle.", "제가 자주 하는 일 중 하나는 휴대폰이랑 노트북을 거의 매일 쓰는 거예요."]], "t65-1": [["It might sound simple, but yeah, it really shows a lot about how digitalized life is here in Korea.", "이제는 완전히 제 생활의 일부가 됐어요."]], "t65-2": [["The whole thing's pretty convenient, and what I notice most is just how easy everything feels.", "단순하게 들릴 수도 있지만, 한국이 얼마나 디지털화된 사회인지 잘 보여주는 것 같아요."]], "t65-3": [["Whenever I use AI tools or manage my schedule on my phone, I feel more connected and get to kinda save time and stay organized.", "보통은 되게 편하고, 특히 모든 게 쉽게 연결되어 있다는 점이 좋아요."]], "t65-4": [["So I think using technology is more than just a habit for me. It's a small but meaningful part of my life here.", "그래서 기술을 사용하는 건 저에게 단순한 습관 그 이상인 것 같아요. 제 삶에서 작지만 의미 있는 부분이에요."]], "t66-0": [["Something we do pretty often is trying to live an active and balanced lifestyle, and um, it's honestly become part of our daily routine.", "저희가 꽤 자주 하는 것 중 하나는 활동적이고 균형 잡힌 생활을 하려고 노력하는 것인데요, 솔직히 이제는 일상 루틴의 일부가 됐어요."]], "t66-1": [["It might sound simple, but yeah, it really shows a lot about everyday life here.", "단순하게 들릴 수도 있지만, 이런 모습이 여기서의 일상생활을 잘 보여준다고 생각해요."]], "t66-2": [["The whole thing's pretty practical, and what we notice most is just how much people focus on consistency rather than extremes.", "전반적으로 꽤 실용적인 방식이고, 특히 극단적인 방법보다는 꾸준함을 중요하게 여긴다는 점이 가장 눈에 띄어요."]], "t66-3": [["Whenever we eat balanced meals, walk a lot, or work out regularly, we feel more energized and get to maintain both our physical and mental health.", "저희는 균형 잡힌 식사를 하고, 많이 걷거나 규칙적으로 운동할 때, 몸과 마음이 더 활력 있어지는 걸 느껴요."]], "t66-4": [["So I think staying healthy is more than just a habit for us. It's a small but meaningful part of life here.", "그래서 건강을 유지하는 건 단순한 습관 그 이상인 것 같아요. 여기서의 삶에서 작지만 의미 있는 부분이에요."]], "t67-0": [["When I have free time, I usually like to slow down and relax.", "자유 시간이 있을 때는 보통 천천히 쉬는 편이에요."]], "t67-1": [["Most evenings, I watch Netflix after dinner to unwind.", "대부분의 저녁에는 저녁을 먹고 나서 넷플릭스를 보면서 하루를 마무리해요."]], "t67-2": [["I usually watch just one episode so it doesn't take up too much time.", "시간을 너무 많이 쓰지 않으려고 보통 한 편만 보는 편이에요."]], "t67-3": [["Lately, I've been watching The Witcher, and it's been a great way for me to relax.", "요즘에는 [The Witcher](chatgpt://generic-entity?number=0)라는 드라마를 보고 있는데, 편하게 쉬기에 딱 좋아요."]], "t67-4": [["So overall, my free-time routine is pretty simple and helps me recharge.", "그래서 제 여가 시간 루틴은 전반적으로 단순하고, 재충전하는 데 도움이 돼요."]], "t68-0": [["Hmm… what food do I usually eat?", "음… 제가 보통 어떤 음식을 먹냐고요?"]], "t68-1": [["As a Korean, I'm not sure if you know this, but rice is on my plate three meals a day, every day.", "한국 사람이라서 아실지 모르겠지만, 제 식탁에는 매일 세 끼 모두 밥이 올라와요."]], "t68-2": [["But it's not just rice.", "하지만 밥만 먹는 건 아니고요."]], "t68-3": [["I also have some side dishes and meat.", "반찬도 먹고 고기도 같이 먹어요."]], "t68-4": [["Honestly, that's just how I've eaten my whole life, so I don't really think much about it.", "솔직히 이런 식으로 평생 먹어 와서 평소에는 별로 의식하지 않는 것 같아요."]], "t69-0": [["I wanna tell you about a memorable experience I had in my neighborhood park.", "제가 이야기하고 싶은 기억에 남는 경험은 동네 공원에서 있었던 일이에요."]], "t69-1": [["Honestly, I don't usually go to the park at night. But I decided to try it once. I'm glad I did.", "솔직히 저는 보통 밤에 공원에 잘 안 가요. 하지만 그날은 한 번 가보기로 했어요. 그리고 정말 잘한 선택이었어요."]], "t69-2": [["It was last spring. I was there with one of my neighbors. This neighbor also likes taking evening walks.", "지난 봄이었어요. 동네 이웃 한 명과 함께 있었어요. 그 이웃도 저녁 산책을 좋아해요."]], "t69-3": [["We walked around the park. We talked about life and enjoyed the cool breeze. At first, I wasn't that into it.", "우리는 공원을 걸었어요. 이런저런 이야기를 하고 시원한 밤공기를 즐겼어요. 처음엔 별로 내키지 않았어요."]], "t69-4": [["But it turned out to be really relaxing, and it totally changed how I see my neighborhood.", "하지만 정말 편안한 경험이었고, 제 동네에 대한 인식이 완전히 바뀌었어요."]], "t69-5": [["Now I actually take short evening walks there a few times a week, which still surprises me.", "이제는 일주일에 여러 번 저녁 산책을 나갈 정도로 좋아하게 되었어요, 저도 아직 놀라워요."]], "t70-0": [["I wanna tell you about a memorable experience I had at home.", "집에서 겪었던 기억에 남는 경험에 대해 이야기 해 볼게요."]], "t70-1": [["Honestly, I don't usually deal with home maintenance myself. But I decided to handle it once. I'm glad I did.", "솔직히 저는 보통 집 수리를 직접 하지 않아요. 하지만 한 번 제가 해결해보기로 했어요. 그리고 정말 잘한 결정이었어요."]], "t70-2": [["So..", "그러다가 주방 싱크대 아래에서 물이 새는 걸 발견했는데, 처음에는 일이 복잡할 것 같아서 고치고 싶은 마음이 별로 없었어요."]], "t70-3": [["I noticed that water was leaking under the kitchen sink. At first, I didn't want to fix it. I thought it would be complicated.", "주방 싱크대 아래에서 물이 새는 걸 발견했어요. 처음에는 고치고 싶지 않았어요. 복잡할 것 같았거든요."]], "t70-4": [["But it turned out to be easier than I expected. It actually felt meaningful to solve it myself. Now I do most home repairs myself. That still surprises me.", "그런데 생각보다 훨씬 쉽게 해결했어요. 혼자 해결했다는 게 꽤 의미 있게 느껴졌어요. 이제는 집에서 생기는 수리를 거의 직접 해요. 그게 아직도 좀 놀라워요."]], "t71-0": [["I wanna tell you about a memorable experience I had during a staycation at home.", "제가 이야기하고 싶은 기억에 남는 경험은 집에서 보낸 스테이케이션이에요."]], "t71-1": [["Honestly, I don't usually spend my vacation at home. But I decided to try it once. I'm glad I did.", "솔직히 저는 평소에 휴가를 집에서 보내지 않아요. 하지만 그때는 한 번 해보기로 했어요. 그리고 정말 만족했어요."]], "t71-2": [["It was last summer break, and I was with my family at home.", "그게 지난 여름 방학이었고, 가족들과 집에 함께 있었어요."]], "t71-3": [["We ordered good food. We watched movies all day and just rested. At first, I wasn't that excited about it.", "맛있는 음식을 시켜 먹었어요. 하루 종일 영화를 보고 그냥 쉬었어요. 처음엔 별로 기대되지 않았어요."]], "t71-4": [["But it turned out to be really meaningful and refreshing, and it totally changed how I see staycations.", "하지만 정말 의미 있고 힐링되는 경험이었고, 집에서 보내는 휴가에 대한 제 생각이 완전히 달라졌어요."]], "t71-5": [["Now I actually look forward to resting at home during long breaks, which still surprises me.", "이제는 긴 방학 때 집에서 쉬는 걸 기대할 정도로 좋아하게 되었어요, 저도 아직 신기해요."]], "t72-0": [["Well, that's easy.", "음, 그건 쉬운 질문이에요."]], "t72-1": [["Why wouldn't you want to stay home during your vacation?", "휴가 때 집에 있고 싶지 않을 이유가 있나요?"]], "t72-2": [["It's the best place there is to go… at least for me it is.", "저한테는요… 집이 사실 가장 좋은 휴가지거든요."]], "t72-3": [["I can't speak for everyone. But I think many of us stay home because our vacation days are short. Also, vacations are for relaxing. And it's much more relaxing to lie in bed and look at your phone than to travel.", "모두를 대표해서 말할 수는 없어요. 하지만 많은 사람들이 집에 머무는 이유는 휴가가 짧기 때문인 것 같아요. 그리고 휴가는 원래 쉬려고 있는 거잖아요. 여행보다 침대에 누워서 핸드폰 보는 게 훨씬 편하죠."]], "t72-4": [["So yeah, I guess that's why some people stay home.", "그래서 뭐, 그런 이유로 집에서 휴가를 보내는 사람들이 있는 것 같아요."]], "t73-0": [["Something I do pretty regularly for vacations is staying at home, and once my water pipes just burst, completely out of the blue.", "휴가 때 내가 꽤 자주 하는 건 집에 머무르는 건데, 어느 한 번은 정말 예상도 못 하게 집 수도관이 갑자기 터졌어."]], "t73-1": [["Water started flooding the floor. I had to deal with it right away. So I canceled my plans immediately.", "물이 바닥으로 쏟아지기 시작했어요. 바로 처리해야 했어요. 그래서 바로 약속을 취소했어요."]], "t73-2": [["I already called the repair guy, but honestly, I wasn't sure how long it would take.", "이미 수리 기사님은 불렀지만, 솔직히 얼마나 걸릴지는 잘 모르겠더라."]], "t73-3": [["To make it up to my friend, I offered to buy dinner or go somewhere nice. They were totally okay with it.", "친구한테 미안해서 저녁을 사거나 어디 괜찮은 곳에 가자고 했어요. 친구도 흔쾌히 좋다고 했어요."]], "t73-4": [["It was unexpected and stressful, but you know things happen.", "완전 예상 밖의 일이라 스트레스도 받았지만, 뭐 이런 일도 생기잖아."]], "t74-0": [["Hmm, I think I'll talk about the first time I went to a coffee shop.", "음… 처음 카페에 갔던 때에 대해 이야기해볼게요."]], "t74-1": [["To be honest, it was such a long time ago that I don't remember all the details clearly.", "솔직히 너무 오래전이라 모든 디테일이 선명하게 기억나는 건 아니에요."]], "t74-2": [["I just remember it was exciting. Everything felt new to me. I remember the smell of coffee, the cozy lights, and the quiet atmosphere.", "그냥 신기하고 재미있었던 기억만 남아 있어요. 모든 게 새로웠거든요. 커피 향, 따뜻한 조명, 조용한 분위기가 기억나요."]], "t74-3": [["Nothing big happened. It was just a typical first experience for a kid. I mainly went there because my parents wanted to grab a drink and take a break.", "특별한 일은 없었어요. 그냥 어린아이의 평범한 첫 경험이었어요. 부모님이 잠깐 쉬면서 음료를 마시고 싶어서 간 거였어요."]], "t74-4": [["Looking back now, it's not a super special memory. But it's still nice to think about sometimes. That small café is why I like coffee shops today.", "지금 돌이켜보면 엄청 특별한 기억은 아니에요. 하지만 가끔 생각하면 여전히 좋아요. 그 작은 카페 덕분에 지금도 카페를 좋아하게 됐어요."]], "t75-0": [["This one's kinda random, but I ran into someone I knew at a bar near my neighborhood.", "이건 좀 랜덤한 이야기인데, 제가 아는 사람을 동네 근처 술집에서 우연히 마주친 적이 있어요."]], "t75-1": [["I wasn't expecting to see them there, so it kinda caught me off guard.", "거기서 그 사람을 볼 거라고 전혀 예상하지 못해서, 순간 조금 당황했어요."]], "t75-2": [["We ended up talking for a bit. We caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 근황도 나누고 이것저것 얘기했어요. 그날 하루가 훨씬 좋아졌어요."]], "t75-3": [["It felt nice to see a familiar face out of nowhere… I don't know, it just reminded me how small the world can be.", "아무 준비도 없이 익숙한 얼굴을 마주치니까 기분이 묘하게 좋았고… 글쎄요, 세상이 참 좁다는 생각이 다시 들었어요."]], "t75-4": [["I had been feeling a bit stressed that day. Talking with them and laughing over a drink really helped. It helped me relax and feel better.", "그날 좀 스트레스를 받고 있었어요. 그 친구랑 얘기하고 웃으면서 마시니까 도움이 많이 됐어요. 기분이 풀리고 편안해졌어요."]], "t76-0": [["Hmm, I think I'll talk about the first time I really got interested in listening to music.", "음… 제가 처음 음악 듣기에 관심을 가졌던 때에 대해 이야기해볼게요."]], "t76-1": [["To be honest, it was such a long time ago that I don't remember all the details clearly.", "솔직히 너무 오래전이라 모든 세부 내용이 선명하게 기억나는 건 아니에요."]], "t76-2": [["I just remember that it was pretty fun. Everything sounded new and catchy to me. When I was young, I mostly listened to simple pop songs. Those songs were popular on TV.", "그냥 정말 재밌었던 것만 기억나요. 모든 게 새롭고 귀에 잘 들어왔어요. 어릴 때는 주로 단순한 팝송을 들었어요. 그 노래들은 TV에서 인기였어요."]], "t76-3": [["Nothing huge happened. It was just a normal childhood moment. My favorite song back then was an upbeat kids' pop song. I played it over and over again.", "특별한 일은 없었어요. 그냥 평범한 어린 시절의 순간이었어요. 그때 제가 가장 좋아했던 노래는 신나는 어린이 팝송이었어요. 그 노래를 계속 반복해서 들었어요."]], "t76-4": [["Looking back now, it's not a super special memory. But it's nice to think about once in a while. My taste has changed a lot. Now I enjoy calmer, more relaxing music instead of loud pop.", "지금 돌아보면 엄청 특별한 기억은 아니에요. 하지만 가끔 생각하면 좋아요. 제 취향이 많이 바뀌었어요. 지금은 시끄러운 팝 음악보다 차분하고 편안한 음악을 더 좋아해요."]], "t77-0": [["Umm… one of the movies I watched as a kid was Finding Nemo.", "음… 제가 어릴 때 봤던 영화 중 하나가 파인딩 니모였어요."]], "t77-1": [["Everyone was talking about it. I don't really like following trends, but I ended up watching it anyway. I'm glad I did. It became one of my favorite movies.", "다들 그 얘기만 했어요. 저는 유행을 따라가는 걸 별로 안 좋아하지만, 어쨌든 보게 됐어요. 보길 잘했다고 생각해요. 그 영화는 제가 가장 좋아하는 영화 중 하나가 됐어요."]], "t77-2": [["I don't remember any specific scenes now. It was so long ago. But it was an animation-adventure movie. It was super creative.", "지금은 구체적인 장면이 기억나지 않아요. 너무 오래전 일이거든요. 하지만 애니메이션 어드벤처 영화였어요. 정말 창의적이었어요."]], "t77-3": [["It totally changed how I feel about animated movies.", "제 최애 영화 중 하나가 됐거든요."]], "t77-4": [["There's a whole series you can watch, so I'd definitely recommend it.", "구체적인 장면은 이제 잘 기억은 안 나요. 워낙 오래됐으니까요. 그래도 모험 느낌의 애니메이션이었는데, 진짜 너무 창의적이었어요. 그 영화를 보고 나서, 제가 애니메이션을 바라보는 시각 자체가 완전 바뀌었어요. 시리즈도 있어서 계속 볼 수 있고, 저는 정말 추천하고 싶어요."]], "t78-0": [["Umm… one of the tv shows I watched as a kid was Coffee Prince.", "음… 제가 어릴 때 봤던 TV 쇼 중 하나가 <커피프린스>였어요."]], "t78-1": [["Everyone was talking about it. I don't really like following trends, but I ended up watching it anyway. I'm glad I did. It became one of my favorites.", "다들 그 얘기만 했어요. 저는 유행을 따라가는 걸 별로 안 좋아하지만, 어쨌든 보게 됐어요. 보길 잘했다고 생각해요. 그게 제가 가장 좋아하는 것 중 하나가 됐어요."]], "t78-2": [["I don't remember any specific scenes now. It was so long ago. But it was a romance comedy TV show. It was super creative.", "지금은 구체적인 장면이 기억나지 않아요. 너무 오래전 일이거든요. 하지만 로맨스 코미디 드라마였어요. 정말 창의적이었어요."]], "t78-3": [["It totally changed how I feel about k-dramas.", "제 최애 중 하나가 됐거든요."]], "t78-4": [["There's a whole series you can watch, so I'd definitely recommend it.", "구체적인 장면은 이제 잘 기억은 안 나요. 워낙 오래됐으니까요. 그래도 로맨스 코미디 장르의 드라마였는데, 진짜 너무 창의적이었어요. 그 드라마를 보고 나서, 제가 K-드라마를 바라보는 시각 자체가 완전 바뀌었어요. 시리즈도 그대로 있어서 쭉 볼 수 있고, 저는 정말 추천하고 싶어요."]], "t79-0": [["Umm… one of the movies I watched as a kid was Infinity Challenge.", "음… 어릴 때 봤던 영화 중 하나가 니모를 찾아서 였어요."]], "t79-1": [["Everyone was talking about it. I don't really like following trends, but I ended up watching it anyway. I'm glad I did. It became one of my favorites.", "다들 그 얘기만 했어요. 저는 유행을 따라가는 걸 별로 안 좋아하지만, 어쨌든 보게 됐어요. 보길 잘했다고 생각해요. 그게 제가 가장 좋아하는 것 중 하나가 됐어요."]], "t79-2": [["I don't remember any specific scenes now. It was so long ago. But it was a reality TV show about crazy challenges. It was super creative.", "지금은 구체적인 장면이 기억나지 않아요. 너무 오래전 일이거든요. 하지만 특이한 도전들을 보여주는 리얼리티 TV 쇼였어요. 정말 창의적이었어요."]], "t79-3": [["It totally changed how I feel about reality TV shows.", "정확한 장면들은 오래돼서 잘 기억은 안 나지만, 애니메이션 어드벤처 장르였고 전체 스토리가 정말 창의적이었어요."]], "t79-4": [["There's a whole series you can watch, so I'd definitely recommend it.", "그 영화 때문에 애니메이션 영화에 대한 제 생각도 완전 바뀌었어요. 시리즈도 있고 스핀오프도 있어서 한번 정주행해보라고 추천하고 싶어요."]], "t80-0": [["I'd like to tell you about a memorable experience I had at a park.", "제가 공원에서 겪었던 기억에 남는 경험에 대해 이야기해보고 싶어요."]], "t80-1": [["To be honest, I normally didn't go there very often.", "솔직히 저는 평소에 그곳에 자주 가는 편이 아니었어요."]], "t80-2": [["But this time, I decided to try something different… and I'm so glad I did.", "하지만 그날은 뭔가 다르게 해보고 싶었고… 정말 잘한 선택이었어요."]], "t80-3": [["It happened quite recently, and I was with a friend.", "그 일은 꽤 최근에 있었고, 저는 친구와 함께 있었어요."]], "t80-4": [["We were going for a jog, and at first, I wasn't really excited about it.", "우리는 조깅을 하고 있었는데, 처음에는 사실 별로 기대되지 않았어요."]], "t80-5": [["We kept walking a little further. Then we found a small outdoor concert. It was really relaxing.", "우리는 좀 더 걸어갔어요. 그러다가 작은 야외 콘서트를 발견했어요. 정말 편안했어요."]], "t80-6": [["That experience completely changed my opinion.", "그 경험은 제 생각을 완전히 바꿔 놓았어요."]], "t80-7": [["Before that day, I thought parks were boring.", "그날 전까지 저는 공원이 지루한 곳이라고 생각했거든요."]], "t80-8": [["But after trying it myself, I felt differently.", "하지만 직접 경험해보니까 느낌이 달라졌어요."]], "t80-9": [["Now, I go more often and even recommend it to others.", "지금은 더 자주 가기도 하고, 다른 사람들에게 추천까지 해요."]], "t80-10": [["I still think about this memory. It helped me try something new. It gave me a new way of thinking.", "저는 이 기억을 지금도 종종 떠올려요. 그 경험은 저에게 새로운 걸 시도하게 해줬어요. 그리고 새로운 생각의 방식을 갖게 해줬어요."]], "t81-0": [["I'd like to tell you about a memorable experience I had at a park.", "제가 공원에서 겪었던 기억에 남는 경험에 대해 이야기해보고 싶어요."]], "t81-1": [["To be honest, I normally didn't go there very often.", "솔직히 저는 평소에 그곳에 자주 가는 편이 아니었어요."]], "t81-2": [["But this time, I decided to try something different… and I'm so glad I did.", "하지만 그날은 뭔가 다르게 해보고 싶었고… 정말 잘한 선택이었어요."]], "t81-3": [["It happened quite recently, and I was with a friend.", "그 일은 꽤 최근에 있었고, 저는 친구와 함께 있었어요."]], "t81-4": [["We were going for a jog, and at first, I wasn't really excited about it.", "우리는 조깅을 하고 있었는데, 처음에는 사실 별로 기대되지 않았어요."]], "t81-5": [["We kept walking a little further. Then we found a small outdoor concert. It was really relaxing.", "우리는 좀 더 걸어갔어요. 그러다가 작은 야외 콘서트를 발견했어요. 정말 편안했어요."]], "t81-6": [["That experience completely changed my opinion.", "그 경험은 제 생각을 완전히 바꿔 놓았어요."]], "t81-7": [["Before that day, I thought parks were boring.", "그날 전까지 저는 공원이 지루한 곳이라고 생각했거든요."]], "t81
