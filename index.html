le and convenient.", "하지만 막상 해보니까 의외로 편하고 효율적인 경험이라는 걸 알게 됐어요."]], "t83-6": [["That experience completely changed my opinion.", "그 경험 덕분에 차박에 대한 제 생각이 완전히 바뀌었어요."]], "t84-0": [["This one's kinda random, but I ran into someone I knew at my regular hair salon.", "이건 좀 뜬금없긴 한데, 제가 다니는 단골 미용실에서 아는 사람을 우연히 만났어요."]], "t84-1": [["I wasn't expecting to see them there, so it kinda caught me off guard.", "거기서 볼 줄은 전혀 몰라서 순간 좀 당황했죠."]], "t84-2": [["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요."]], "t84-3": [["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요."]], "t85-0": [["This one is a bit random. I ran into someone I knew at my dentist. I wasn't expecting to see them there. It caught me off guard.", "이건 좀 랜덤한 이야기예요. 치과에서 아는 사람을 만났어요. 거기서 그 사람을 볼 줄은 몰랐어요. 그래서 좀 당황했어요."]], "t85-1": [["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요."]], "t85-2": [["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요."]], "t86-0": [["This one is a bit random. I ran into someone I knew at my dentist. I wasn't expecting to see them there. It caught me off guard.", "이건 좀 랜덤한 이야기예요. 치과에서 아는 사람을 만났어요. 거기서 그 사람을 볼 줄은 몰랐어요. 그래서 좀 당황했어요."]], "t86-1": [["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요."]], "t86-2": [["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요."]], "t87-0": [["This one's kinda random, but I ran into someone I knew at the bank.", "이건 좀 뜬금없는 얘기인데, 은행에서 아는 사람을 우연히 만났어요."]], "t87-1": [["I went in to open a new account. I wasn't expecting to see them there. It kinda caught me off guard.", "저는 새 계좌를 만들려고 들어갔어요. 거기서 그 사람을 볼 줄은 몰랐어요. 그래서 좀 당황했어요."]], "t87-2": [["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요."]], "t87-3": [["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요."]], "t88-0": [["Okay, great, so a problem hmm...", "좋아, 그러니까… 문제 하나가 딱 떠오르는데요."]], "t88-1": [["Alright, I only have one thing on my mind and it's this.", "음… 솔직히 이것밖에 생각이 안 나요."]], "t88-2": [["The last time I went to the bank, there wasn't a single bathroom in the vicinity.", "마지막으로 은행에 갔을 때였는데, 근처에 화장실이 하나도 없는 거예요."]], "t88-3": [["I know this isn't really related to the question. But it was a horrifying experience. It was also a very real problem.", "질문이랑 완전히 관련 있는 이야기는 아니에요. 하지만 정말 끔찍한 경험이었어요. 그리고 진짜 현실적인 문제이기도 했어요."]], "t88-4": [["I was trying to find a bathroom. I almost died doing it. But thank God, I found one in another store nearby.", "저는 화장실을 찾고 있었어요. 거의 죽을 것 같았어요. 그런데 다행히 근처 다른 가게에서 화장실을 찾았어요."]], "t88-5": [["I swear, it was a horrible memory.", "진짜로 맹세하는데, 아직도 생각하면 끔찍한 기억이에요."]], "t89-0": [["Ah… this is such a difficult question because… like, c'mon it's recycling.", "아… 이건 좀 어려운 질문이네요, 왜냐면… 솔직히 말해서 이거 재활용이잖아요."]], "t89-1": [["I don't think you can have a memorable experience with recycling. Let me think for a second. Honestly, I can't remember anything special about recycling. So, that's all I have for this one.", "재활용에는 특별히 기억에 남는 경험이 있을 수 없다고 생각해요. 잠깐 생각해볼게요. 솔직히 재활용에 관해서는 특별히 기억나는 게 없어요. 그래서 이 질문에 대해서는 이 정도가 다예요."]], "t90-0": [["Okay, so one problem I had while recycling happened a few weeks ago.", "재활용을 하다가 한 번 문제가 생긴 적이 있는데, 몇 주 전에 있었던 일이에요."]], "t90-1": [["I think I was just tired or something. I put all the plastics in the paper bins. I also put all the paper in the vinyl bins. It was a mess.", "그냥 좀 피곤했던 것 같아요. 플라스틱을 전부 종이함에 넣었어요. 종이도 전부 비닐함에 넣었어요. 완전 엉망이었어요."]], "t90-2": [["I still don't know why I made such a silly mistake. I had to spend my whole Sunday evening fixing it. I had to re-recycle everything.", "왜 그런 멍청한 실수를 했는지 아직도 모르겠어요. 일요일 저녁 내내 그걸 고쳐야 했어요. 모든 걸 다시 재활용해야 했어요."]], "t90-3": [["It was the worst.", "정말 최악이었어요."]], "t91-0": [["So, unfortunately, I think this is going to be it for this one.", "최근에 겪었던 한 가지 경험에 대해 이야기해볼게요."]], "t91-1": [["I'd like to talk about a recent experience I had.", "이번 달 초에 휴대폰으로 뉴스를 보다가 제가 사는 도시의 새로운 재활용 규정에 관한 기사를 보게 됐어요."]], "t91-2": [["Earlier this month, I was reading the news on my phone and came across an article about new recycling laws in my city.", "처음에는 별 기대를 안 했는데, 기름이 묻은 음식 용기처럼 재활용이 된다고 생각했던 것들이 사실은 안 된다는 걸 알게 됐어요."]], "t91-3": [["I didn't expect much at first. But I learned something new. Some items I thought were recyclable are actually not recyclable. For example, oily food containers can't be recycled.", "처음에는 큰 기대를 안 했어요. 그런데 새로운 걸 알게 됐어요. 재활용이 된다고 생각했던 것들이 사실은 안 되는 경우가 있었어요. 예를 들어 기름 묻은 음식 용기는 재활용이 안 돼요."]], "t91-4": [["Since then, I've been more careful about how I recycle at home. Overall, it was a small but memorable experience.", "전반적으로 작지만 기억에 남는 경험이었어요."]], "t92-0": [["Okay, so one problem I had while I was taking the bus home, happened a few weeks ago.", "알겠어요."]], "t92-1": [["I think I was just tired or something. I took the wrong bus. I was also on the wrong side. It was a mess.", "그냥 좀 피곤했던 것 같아요. 버스를 잘못 탔어요. 반대편에서 탔던 것 같아요. 완전 엉망이었어요."]], "t92-2": [["I still don't know why I made such a silly mistake. I had to spend my whole evening traveling back home again.", "왜 그런 멍청한 실수를 했는지 아직도 모르겠어요. 저녁 내내 다시 집으로 돌아가야 했어요."]], "t93-0": [["Honestly, I don't usually get excited about holidays or family gatherings. But I decided to try it once. I'm glad I did.", "솔직히 저는 보통 명절이나 가족 모임에 그렇게 신나하는 편은 아니에요. 그런데 한 번 제대로 해보기로 했어요. 해보길 잘했다고 생각해요."]], "t93-1": [["It was when I was in elementary school, around fourth grade, and I was with my family.", "그때가 초등학교 4학년쯤이었고, 가족들이랑 같이 있었어."]], "t93-2": [["We went to my grandparents' house in the countryside. We cooked holiday food together. We also played games in the living room. At first, I wasn't really into it.", "우리는 시골에 있는 할머니 할아버지 댁에 갔어요. 같이 명절 음식을 만들었어요. 거실에서 게임도 했어요. 처음에는 별로 흥미가 없었어요."]], "t93-3": [["But it turned out to be really fun and meaningful, and it totally changed how I see it.", "근데 막상 해보니까 진짜 재밌고 의미 있더라."]], "t93-4": [["Now I actually enjoy simple family holidays like that. I even look forward to them. That still surprises me.", "지금은 오히려 그런 소소한 가족 명절을 좋아해요. 심지어 기대까지 하게 돼요. 그게 아직도 좀 신기해요."]], "t94-0": [["Well… it was this past Chuseok, and I was with my family.", "음… 지난 추석 때였고, 가족이랑 같이 있었어요."]], "t94-1": [["We went to my grandparents' house in the countryside. We cooked holiday food together, played games in the living room, and even set off fireworks. At first, I wasn't really into it.", "시골에 있는 할머니 할아버지 댁에 갔어요. 같이 명절 음식도 만들고, 거실에서 게임도 하고, 폭죽도 터뜨렸어요. 처음에는 별로 흥미가 없었어요."]], "t94-2": [["But it turned out to be really fun and meaningful, and it totally changed how I see it.", "그런데 알고 보니 정말 재미있고 뜻깊었고, 그게 제가 그걸 보는 방식을 완전히 바꿔 놨어요."]], "t94-3": [["Now I actually enjoy simple family holidays like that. I even look forward to them. That still surprises me.", "지금은 오히려 그런 소소한 가족 명절을 좋아해요. 심지어 기대까지 하게 돼요. 그게 아직도 좀 신기해요."]], "t95-0": [["Well… it was when I this Chuseok, and I was with my family.", "음… 그건 이번 추석이었고, 그리고 저는 가족과 함께 있었어요."]], "t95-1": [["We went to a resort in Jeju Island. At first, I wasn't that into it. I'm more of a city hotel person.", "우리는 제주도에 있는 리조트에 갔어요. 처음에는 별로 끌리지 않았어요. 저는 원래 도시 호텔을 더 좋아하는 편이에요."]], "t95-2": [["But it turned out to be amazing, and it totally changed how I saw resorts.", "하지만 결국 정말 놀라운 경험이었고, 리조트에 대한 제 생각을 완전히 바꿔 놓았어요."]], "t95-3": [["Now I actually look forward to family holidays like that. I also look forward to nature resorts. That still surprises me.", "지금은 오히려 그런 가족 휴가를 기대하게 됐어요. 자연 속 리조트도 기대하게 됐어요. 그게 아직도 좀 신기해요."]], "t96-0": [["I wanna tell you about a memorable experience I had at Jeju Island.", "제주도에서 진짜 독특한 지형을 봤던 경험을 말해볼게."]], "t96-1": [["Honestly, I don't usually pay much attention to nature. But I decided to try it once. I'm glad I did.", "솔직히 저는 보통 자연에 그렇게 관심이 많은 편은 아니에요. 그런데 한 번 제대로 보기로 했어요. 보길 잘했다고 생각해요."]], "t96-2": [["It was back when I was in elementary school on a school trip, and I was with my classmates and teachers.", "그때는 초등학교 때 수학여행이었고, 친구들이랑 선생님들이랑 같이 갔어."]], "t96-3": [["We hiked up to a huge volcanic crater. We looked down into the middle of it. At first, I wasn't that into it.", "우리는 큰 화산 분화구까지 올라갔어요. 그 가운데를 내려다봤어요. 처음에는 별로 흥미가 없었어요."]], "t96-4": [["But it turned out to be really cool, and it totally changed how I see it.", "근데 막상 보니까 진짜 멋있더라, 그래서 내가 자연을 보는 눈이 좀 달라진 것 같아."]], "t96-5": [["Now, when I travel, I like noticing different landforms. For example, I enjoy looking at mountains and cliffs. That still surprises me.", "지금은 여행 갈 때 다양한 지형을 관심 있게 봐요. 예를 들어 산이나 절벽 같은 걸 좋아해요. 그게 아직도 좀 신기해요."]], "t97-0": [["Let me tell you about a hard part of history between Korea and Japan.", "한국과 일본 사이의 어려운 역사 중 하나에 대해 이야기해볼게요."]], "t97-1": [["During World War II, many Korean women were taken by Japan and forced to work as “comfort women.” It was a very painful time.", "2차 세계대전 동안, 많은 한국 여성들이 일본에 의해 끌려가 ‘위안부'로 강제로 일하게 되었어요."]], "t97-2": [["After the war, Korea wanted Japan to say sorry and take responsibility.", "그 시기는 정말 고통스러운 시간이었습니다."]], "t97-3": [["But Japan didn't really apologize for many years.", "전쟁이 끝난 후, 한국은 일본이 사과하고 책임을 인정하길 원했지만, 일본은 오랫동안 제대로 사과하지 않았습니다."]], "t97-4": [["Even now, this issue still causes tension.", "지금까지도 이 문제는 양국 사이에 긴장을 일으켜요."]], "t97-5": [["Many Koreans are still hurt by it, and it affects how the two countries get along.", "많은 한국인들이 여전히 상처를 가지고 있고, 이 때문에 두 나라의 관계에도 영향을 끼칩니다."]], "t98-0": [["Wow!", "와!"]], "t98-1": [["For sure… it was the time I tried Durian for the first time.", "진짜요… 제가 기억에 남는 건 처음으로 두리안을 먹어보려고 했던 때예요."]], "t98-2": [["I was hosting a little get-together at home and my friend brought over a giant durian from an international market.", "집에서 작은 모임을 열었는데, 친구가 국제 마켓에서 엄청 큰 두리안을 사 와서 가져왔거든요."]], "t98-3": [["All I remember is the stench.", "제가 기억하는 건 그 냄새뿐이에요."]], "t98-4": [["The potent, pungent stench.", "강하고, 톡 쏘고, 진짜 말도 안 되게 독한 냄새…"]], "t98-5": [["Man, I tell you, it stunk up the whole house… I was kind of angry at my friend.", "와, 집 전체에 냄새가 퍼져서 순간 친구한테 좀 화도 났어요."]], "t98-6": [["But yeah, that durian. I never ate it. It smelled too bad. That is still my memorable food experience.", "그래도 그 두리안 얘기예요. 저는 결국 못 먹었어요. 냄새가 너무 심했거든요. 그래도 그게 제 기억에 남는 음식 경험이에요."]], "t99-0": [["Well… recently, the technology I've been using the most is my laptop, uh, pretty much every day.", "음… (잠깐 멈춤) 최근에 제가 가장 많이 사용하는 기술은 노트북이에요. 어…, 거의 매일 써요."]], "t99-1": [["I mainly use it for work and studying… ummm… writing documents, making lesson materials, and sometimes editing videos.", "주로 일이랑 공부할 때 쓰는데, 문서 작성도 하고 수업 자료도 만들고, 가끔 영상 편집도 해요."]], "t99-2": [["And you know, I also keep a bunch of tabs open for research, so I try to stay organized with folders and bookmarks.", "그리고 있잖아요, 자료 찾느라 탭을 엄청 많이 열어두는 편이라 폴더랑 북마크로 정리하려고 해요."]], "t99-3": [["Overall, it has been very convenient. Honestly, it helps me get a lot done.", "전체적으로 정말 편리했어요. 솔직히 말하면, 덕분에 일을 훨씬 많이 처리할 수 있어요."]], "t100-0": [["Okay, so one problem I had with my phone, happened a few weeks ago.", "휴대폰을 사용하다가 한 번 문제가 생긴 적이 있는데, 몇 주 전에 있었던 일이에요."]], "t100-1": [["I think I was just tired that day. I dropped my phone so many times. Then I cracked the screen. It was a mess.", "그날은 그냥 너무 피곤했던 것 같아요. 휴대폰을 정말 여러 번 떨어뜨렸어요. 그러다가 화면이 깨졌어요. 완전 난리였죠."]], "t100-2": [["I still don't know why I made such a stupid mistake. I had to go to the repair store. I waited there all evening for my screen to be fixed.", "왜 그런 바보 같은 실수를 했는지 아직도 모르겠어요. 결국 수리점에 가야 했어요. 거기서 화면을 고치는 동안 저녁 내내 기다렸어요."]], "t100-3": [["It was the worst.", "진짜 최악이었어요."]], "t101-0": [["Well… the last piece of furniture I bought was a desk, uh, a few months ago.", "음… 제가 최근에 산 가구는 책상인데요, 어…, 몇 달 전에 샀어요."]], "t101-1": [["I bought it online. I work from home a lot. So I needed something more ergonomic.", "온라인으로 구매했어요. 재택근무를 많이 하거든요. 그래서 좀 더 인체공학적인 책상이 필요했어요."]], "t101-2": [["I didn't go with anyone, but I spent some time kind of comparing reviews and measurements beforehand.", "누구랑 같이 간 건 아니지만, 구매 전에 약간 리뷰랑 사이즈를 비교해 봤어요."]], "t101-3": [["I set it up at home. It made my workspace much more comfortable. Honestly, it really improved my productivity.", "집에 설치했어요. 작업 공간이 훨씬 편해졌어요. 솔직히 말하면, 생산성이 정말 많이 좋아졌어요."]], "t102-0": [["Okay, so one problem I had with a new furniture I got, happened a few weeks ago.", "새로 산 가구 때문에 한 번 문제가 생긴 적이 있는데, 몇 주 전에 있었던 일이에요."]], "t102-1": [["I think I was just tired when I ordered it. I bought a lamp from Temu. It turned out to be a mess.", "주문할 때 그냥 너무 피곤했던 것 같아요. Temu에서 램프를 하나 샀어요. 그런데 결국 완전 난리가 났어요."]], "t102-2": [["It was a lego lamp. I thought it would arrive already built. But it was actually a DIY lego lamp.", "레고 램프였어요. 저는 이미 완성되어 올 줄 알았어요. 그런데 사실은 직접 조립해야 하는 DIY 레고 램프였어요."]], "t102-3": [["I still don't know why I made such a stupid mistake. I had to spend the whole evening building the lamp.", "왜 그런 바보 같은 실수를 했는지 아직도 모르겠어요. 결국 저녁 내내 램프를 조립해야 했어요."]], "t102-4": [["It was the worst.", "진짜 최악이었어요."]], "t103-0": [["Well… (slight pause) the last time I went clothes shopping was a few weeks ago, uh, at a department store near my place.", "음… (잠깐 멈춤) 마지막으로 옷을 사러 간 건 몇 주 전이었고, 어…, 집 근처 백화점에 갔어요."]], "t103-1": [["I went there because I needed some basic everyday clothes, nothing too fancy.", "일상에서 입을 기본 아이템들이 필요해서 그쪽으로 가게 됐어요."]], "t103-2": [["I ended up buying a jacket and a couple of tops. I tried them on a few times. I wanted to check the fit.", "결국 재킷 하나랑 상의 몇 벌을 샀어요. 몇 번 입어봤어요. 핏을 확인하고 싶었거든요."]], "t103-3": [["Overall, the whole experience was pretty smooth, and honestly, it was totally worth it.", "전체적으로 되게 수월한 쇼핑이었고, 솔직히 말하면, 완전 만족스러운 선택이었어요."]], "t104-0": [["This one's kinda random, but I ran into someone I knew at the gym.", "이건 좀 뜬금없는 이야기인데, 헬스장에서 아는 사람을 우연히 만났어요."]], "t104-1": [["I wasn't expecting to see them there, so it kinda caught me off guard.", "거기서 볼 줄은 전혀 몰라서 좀 당황했죠."]], "t104-2": [["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "그래서 잠깐 이야기를 나눴어요. 그냥 근황이랑 이런저런 얘기를 했어요. 덕분에 하루가 기분 좋아졌어요."]], "t104-3": [["It felt nice to see a familiar face out of nowhere. It reminded me that the world is small.", "갑자기 아는 얼굴을 보니까 기분이 좋았어요. 세상이 참 좁다는 생각이 들었어요."]], "t105-0": [["Okay, great, so a problem hmm… Alright, I only have one thing on my mind and it's this.", "음… 좋아요, 그러니까 문제 하나가 있었는데요… 지금 딱 떠오르는 건 이거예요."]], "t105-1": [["The last time I went to the gym, I forgot to bring my smart watch and it just felt so wrong.", "지난번에 헬스장에 갔을 때 스마트워치를 깜빡하고 안 가져온 거예요."]], "t105-2": [["I always log my workouts, so without my watch, everything felt kind of worthless.", "근데 그게 진짜 너무 이상하게 느껴졌어요."]], "t105-3": [["I thought about running home to grab it. But then I would have to come back, and that felt like extra work. So I just did the workout without my watch.", "집에 뛰어가서 가져올까 생각했어요. 그런데 다시 돌아와야 하니까 너무 번거로울 것 같았어요. 그래서 그냥 워치 없이 운동했어요."]], "t105-4": [["I mean, it was not a huge disaster. But it still annoyed me a lot.", "그러니까, 엄청 큰일은 아니었어요. 그런데 그래도 많이 짜증 났어요."]], "t105-5": [["I told myself, “Today is about consistency.” I finished my routine. Later, I wrote down what I did from memory.", "저는 스스로에게 “오늘은 꾸준함이 중요해”라고 말했어요. 루틴을 끝냈어요. 나중에 기억나는 대로 운동한 걸 적었어요."]], "t105-6": [["I swear, it was a horrible memory.", "진짜로 말하면… 꽤 별로였던 기억이에요."]], "t106-0": [["Umm… that's a great question…", "음… 좋은 질문이에요…"]], "t106-1": [["So for my New Year's resolution, I planned to lose weight, but honestly, I didn't fully achieve that goal.", "그래서 새해 목표로는 살을 빼는 걸 계획했었는데, 솔직히 말하면 그 목표를 완전히 이루지는 못했어요."]], "t106-2": [["At first I was disappointed, but over time, my focus shifted.", "처음에는 좀 실망했는데, 시간이 지나면서 생각이 바뀌었어요."]], "t106-3": [["Instead of results, I focused on just going to the gym regularly.", "결과보다는 그냥 꾸준히 헬스장에 가는 것에 집중하게 됐거든요."]], "t106-4": [["I stopped putting pressure on myself, and little by little, the gym became part of my routine.", "스스로에게 부담을 주는 걸 멈추니까, 조금씩 헬스장이 제 일상이 됐어요."]], "t106-5": [["So I didn't reach my original goal. But it was still meaningful. Now going to the gym feels normal, not stressful.", "그래서 처음 목표는 이루지 못했어요. 그래도 충분히 의미 있었어요. 이제는 헬스장에 가는 게 스트레스가 아니라 자연스러운 일이 됐어요."]], "t107-0": [["Yeah, I actually met my best friend at the gym.", "네, 실제로 저는 헬스장에서 절친을 만났어요."]], "t107-1": [["I first noticed him because he was lifting a huge amount of weight. I was honestly impressed.", "그가 정말 무거운 무게를 들고 있어서 처음 눈에 들어왔어요. 솔직히 정말 인상적이었어요."]], "t107-2": [["After his set, I went up to him and asked how long he'd been training.", "그 세트를 끝내고 나서 제가 다가가서 얼마나 오래 운동했는지 물어봤어요."]], "t107-3": [["That simple question started a conversation.", "그 간단한 질문 하나로 대화가 시작됐어요."]], "t107-4": [["After that, we kept running into each other. We worked out together. We started talking more about life, not just the gym. Over time, we got really close. Now he is one of my best friends.", "그 후로 자주 마주치게 됐어요. 같이 운동도 했어요. 헬스장 얘기뿐만 아니라 삶에 대한 얘기도 많이 했어요. 시간이 지나면서 정말 친해졌어요. 지금은 제 가장 친한 친구 중 한 명이에요."]], "t108-0": [["I wanna tell you about a memorable experience I had at my dry cleaner.", "세탁소에서 있었던 기억에 남는 경험 하나를 이야기해 볼게요."]], "t108-1": [["Honestly, I don't usually pay attention to customer service. But I decided to trust them this time. I am glad I did.", "솔직히 저는 보통 고객 서비스에 크게 신경 쓰지 않아요. 그런데 이번에는 한 번 믿어보기로 했어요. 그게 정말 잘한 선택이었어요."]], "t108-2": [["It was a few weeks ago. I went by myself.", "몇 주 전 일이었어요. 혼자 갔어요."]], "t108-3": [["We dropped off my coat. We asked for same-day pickup. At first, I did not expect much.", "코트를 맡겼어요. 당일 수거를 부탁했어요. 처음엔 별 기대가 없었어요."]], "t108-4": [["But it turned out to be really reassuring, and it totally changed how I see it.", "그런데 생각보다 마음이 놓이고 안심되는 경험이었고, 그 이후로 그곳을 바라보는 시선이 완전히 달라졌어요."]], "t108-5": [["Now I actually feel more comfortable using that place regularly. That still surprises me.", "지금은 오히려 그 세탁소를 더 편하게, 자주 이용하게 됐어요. 그게 아직도 좀 놀라워요."]], "t109-0": [["I wanna tell you about a memorable experience I had at the post office.", "우체국에서 있었던 기억에 남는 경험에 대해 이야기해 볼게요."]], "t109-1": [["Honestly, I don't usually talk to people there. But that day, I decided to say hi. I am glad I did.", "솔직히 저는 보통 거기서 사람들과 말을 잘 안 해요. 그런데 그날은 한 번 인사를 해봤어요. 그게 꽤 좋았어요."]], "t109-2": [["It was a few months ago, and I was with just myself.", "몇 달 전 일이었고, 혼자 갔어요."]], "t109-3": [["We stood in line, and at first I wasn't that into it.", "줄을 서 있다가 자연스럽게 대화를 하게 됐는데, 처음엔 크게 관심이 없었어요."]], "t109-4": [["But it turned out to be really fun, and it totally changed how I see it.", "그런데 그게 의외로 재미있고 기분 좋은 경험이었고, 그 이후로 그곳에 대한 생각이 좀 바뀌었어요."]], "t109-5": [["Now I actually don't mind small talk in random places. That still surprises me.", "지금은 오히려 일상적인 장소에서 가벼운 대화를 나누는 것도 괜찮다고 느껴요. 그게 아직도 신기해요."]], "t110-0": [["I wanna tell you about a memorable experience I had at the library.", "도서관에서 있었던 기억에 남는 경험 하나를 이야기해 볼게요."]], "t110-1": [["Honestly, I don't usually run into people from my past. But I decided to talk to them that day. I am glad I did.", "솔직히 저는 보통 과거에 알던 사람을 우연히 만나지 않아요. 그런데 그날은 한 번 말을 걸어봤어요. 그게 정말 잘한 선택이었어요."]], "t110-2": [["It was a couple of years ago. I went alone.", "몇 년 전 일이었어요. 혼자 갔어요."]], "t110-3": [["We bumped into each other. We started catching up. At first, it felt a little awkward.", "우연히 마주쳤어요. 근황을 나누기 시작했어요. 처음엔 조금 어색했어요."]], "t110-4": [["But it turned out to be really meaningful, and it totally changed how I see it.", "그런데 그 시간이 생각보다 의미 있고 따뜻한 경험이었고, 도서관에 대한 인식도 달라졌어요."]], "t110-5": [["Now I actually enjoy reconnecting with people when it happens. That still surprises me.", "지금은 오히려 이렇게 우연히 다시 만나는 걸 즐기게 됐어요. 그게 아직도 놀라워요."]], "t111-0": [["Yeah, I had a health problem before.", "네, 예전에 건강 문제가 있었어요."]], "t111-1": [["I had a bad stomach issue, so I had to stop drinking coffee and avoid greasy food for a while.", "위장에 문제가 생겨서 한동안 커피를 끊고 기름진 음식도 피했어요."]], "t111-2": [["I went to the clinic, took medicine, and rested at home.", "병원에 가서 약을 먹고 집에서 쉬었어요."]], "t111-3": [["After a few days, I recovered and went back to my normal routine.", "며칠 지나고 나서 회복해서 다시 평소 생활로 돌아갔어요."]], "t111-4": [["Now I'm healthy again, and it taught me to take better care of my body.", "지금은 다시 건강해졌고, 몸 관리를 더 잘해야겠다고 느꼈어요."]], "t112-0": [["So, from the get-go, the biggest difference is the overall design, you know?", "처음부터 가장 큰 차이는 전체적인 디자인이에요, 알죠?"]], "t112-1": [["It's way more modern than before. Honestly, I like it that way. It feels more convenient.", "예전보다 훨씬 모던해졌어요. 솔직히 말하면 저는 이런 점이 좋아요. 훨씬 편리하게 느껴지거든요."]], "t112-2": [["Back in the day, homes felt smaller and more closed. Now, it's totally different. Homes are more open and brighter.", "예전에는 집이 좀 더 작고 답답하게 느껴졌어요. 지금은 완전히 달라요. 집이 훨씬 트여 있고 밝아요."]], "t112-3": [["And yeah, I've tried both, and to be real, I prefer newer homes.", "그리고 둘 다 살아본 입장에서 솔직히 말하면, 저는 요즘 집이 더 좋아요."]], "t112-4": [["I still remember one time. My old place had poor insulation. That shows how different things were back then.", "지금도 기억나는 일이 있어요. 예전에 살던 집은 단열이 안 좋았어요. 그걸 보면 그때랑 지금이 얼마나 다른지 알 수 있어요."]], "t112-5": [["So yeah, old and new homes both have their own charm. But I usually go with the modern one. It just feels more like me.", "그래서 결국 옛날 집이랑 요즘 집 둘 다 나름의 매력이 있어요. 하지만 저는 보통 모던한 집을 선택해요. 그냥 제 취향에 더 맞거든요."]], "t113-0": [["To start with, what really stands out is the change in style and functionality.", "먼저 가장 눈에 띄는 점은 스타일과 기능의 변화예요."]], "t113-1": [["These days, furniture feels a lot more minimal and practical. Honestly, that works better for me. It's easier to manage and keep organized.", "요즘 가구는 훨씬 미니멀하고 실용적이에요. 솔직히 저한테는 이게 더 잘 맞아요. 정리하기도 쉽고 관리하기도 편하거든요."]], "t113-2": [["Back then, furniture was heavier and more decorative. Now things have changed. It's lighter, simpler, and often multi-purpose.", "예전에는 가구가 더 무겁고 장식적이었어요. 지금은 많이 달라졌어요. 가볍고 단순하면서 다용도로 쓸 수 있는 가구가 많아졌어요."]], "t113-3": [["I've been through both, and personally, I find modern furniture way more enjoyable.", "둘 다 써봤지만, 개인적으로는 요즘 가구가 훨씬 더 마음에 들어요."]], "t113-4": [["There was even a time when we had a huge wooden cabinet. It took up half the living room. That really shows what furniture used to be like.", "한번은 거실에 큰 나무 장이 있었어요. 거실 절반을 차지할 정도였어요. 그걸 보면 예전 가구 스타일이 어땠는지 잘 알 수 있어요."]], "t113-5": [["All in all, both versions have something special. But if I had to choose, I would stick with the furniture I have now.", "결국 둘 다 나름의 매력이 있어요. 하지만 하나를 골라야 한다면, 지금 쓰는 가구를 선택할 것 같아요."]], "t114-0": [["To start with, what really stands out is how strict chores felt back then.", "먼저 가장 눈에 띄는 점은 어릴 때 집안일이 훨씬 엄격하게 느껴졌다는 점이에요."]], "t114-1": [["These days, chores feel a lot more manageable. Honestly, that works better for me. I have more control over my time.", "요즘은 집안일이 훨씬 부담이 적게 느껴져요. 솔직히 저한테는 이게 더 잘 맞아요. 제 시간을 스스로 조절할 수 있거든요."]], "t114-2": [["Back then, I was in charge of basic chores. I cleaned my room and washed dishes. Now things have changed. I split chores more flexibly on my own schedule.", "예전에는 기본적인 집안일을 맡았어요. 방 청소나 설거지 같은 거였어요. 지금은 많이 달라졌어요. 제 일정에 맞춰 좀 더 자유롭게 나눠서 하고 있어요."]], "t114-3": [["I've been through both, and personally, I find doing chores now way more enjoyable.", "둘 다 경험해 봤지만, 개인적으로는 지금 집안일을 하는 방식이 훨씬 더 좋아요."]], "t114-4": [["There was even a time when I forgot to take out the trash. I got scolded for it. That really shows what things used to be like.", "한번은 쓰레기 버리는 걸 깜빡한 적이 있어요. 그래서 혼났어요. 그걸 보면 예전 분위기가 어땠는지 잘 알 수 있어요."]], "t114-5": [["All in all, both ways have something special. But if I had to choose, I would stick with how chores are handled now.", "결국 두 방식 모두 나름의 의미가 있어요. 하지만 하나를 골라야 한다면, 지금의 방식을 선택할 것 같아요."]], "t115-0": [["So, from the get-go, the biggest difference is how much more built-up and convenient it's gotten, you know?", "처음부터 가장 큰 차이는 주변이 훨씬 더 개발되고 편리해졌다는 점이에요, 알죠?"]], "t115-1": [["It's way more developed than before. Honestly, I like it that way. Everything I need is close by now.", "예전보다 훨씬 발전했어요. 솔직히 말하면 저는 이런 변화가 좋아요. 필요한 게 다 가까이에 있거든요."]], "t115-2": [["Back in the day, the area was quieter. There were fewer places to go. Now, it's totally different. There are more cafés, bigger apartment complexes, and better public facilities.", "예전에는 동네가 더 조용했어요. 갈 만한 곳도 많지 않았어요. 지금은 완전히 달라요. 카페도 많아졌고, 아파트 단지도 더 커졌고, 공공시설도 좋아졌어요."]], "t115-3": [["And yeah, I've experienced both, and to be real, I prefer how it is now.", "그리고 네, 저는 둘 다 겪어 봤고, 솔직히 말해서 지금이 더 좋아요."]], "t115-4": [["I still remember one time. I had to travel far just to find a decent café or a nice study spot. That shows how different things were back then.", "지금도 기억나는 일이 있어요. 괜찮은 카페나 공부할 만한 곳을 찾으려고 멀리까지 가야 했어요. 그걸 보면 그때랑 지금이 얼마나 다른지 알 수 있어요."]], "t115-5": [["So yeah, both the old neighborhood and the current one have their own charm. But I usually go with the newer vibe. It just feels more like me.", "그래서 예전 동네랑 지금 동네 둘 다 나름의 매력이 있어요. 하지만 저는 보통 요즘 분위기를 선택해요. 그냥 제 취향에 더 맞거든요."]], "t116-0": [["To start with, what really stands out is how popular staycations have become.", "먼저 가장 눈에 띄는 점은 요즘 스테이케이션이 정말 흔해졌다는 점이에요."]], "t116-1": [["These days, staycations feel a lot more relaxed and flexible. Honestly, that works better for people. It saves money and reduces travel stress.", "요즘 스테이케이션은 훨씬 여유롭고 유연하게 느껴져요. 솔직히 사람들한테 이게 더 잘 맞아요. 돈도 아끼고 이동 스트레스도 줄여주거든요."]], "t116-2": [["Back then, most families traveled far or visited relatives during vacations. Now things have changed. Many people stay home, go to cafés, or take short local trips instead.", "예전에는 가족들이 멀리 여행을 가거나 친척 집을 방문하는 경우가 많았어요. 지금은 많이 달라졌어요. 집에서 쉬거나 근처 카페에 가거나 짧은 국내 여행을 즐기는 사람이 많아졌어요."]], "t116-3": [["I've been through both, and personally, I find staycations way more enjoyable.", "둘 다 경험해 봤지만, 개인적으로는 스테이케이션이 훨씬 더 좋아요."]], "t116-4": [["There was even a time when my whole family had to travel together during peak season. That really shows what vacations used to be like.", "한번은 성수기에 가족 모두가 함께 이동해야 했던 적이 있어요. 그걸 보면 예전 휴가 문화가 어땠는지 잘 알 수 있어요."]], "t116-5": [["All in all, both ways have something special. But if I had to choose, I would stick with how people vacation these days.", "결국 두 방식 모두 장점이 있어요. 하지만 하나를 골라야 한다면, 요즘 휴가 방식을 선택할 것 같아요."]], "t117-0": [["To start with, what really stands out is the difference in how kids and adults use parks.", "먼저 가장 눈에 띄는 점은 공원을 이용하는 어린이와 성인의 방식 차이예요."]], "t117-1": [["These days, parks feel a lot more multi-purpose. Honestly, that works better. Parks are designed for all age groups now.", "요즘 공원은 훨씬 다목적 공간처럼 느껴져요. 솔직히 이게 더 잘 맞는 것 같아요. 모든 연령대를 고려해서 설계됐거든요."]], "t117-2": [["Back then, kids mainly played on playgrounds. Adults just watched. Now things have changed. Kids play, and adults exercise, walk, or relax at the same time.", "예전에는 아이들은 주로 놀이터에서 놀았어요. 어른들은 그냥 지켜보기만 했어요. 지금은 많이 달라졌어요. 아이들은 놀고, 어른들은 운동하거나 산책하거나 쉬기도 해요."]], "t117-3": [["I've seen both sides, and personally, I find modern parks way more enjoyable.", "두 모습을 다 봐왔지만, 개인적으로는 요즘 공원이 훨씬 더 좋아요."]], "t117-4": [["There was even a time when parks only had basic playground equipment. That really shows what parks used to be like.", "한번은 기본적인 놀이기구만 있는 공원도 있었어요. 그걸 보면 예전 공원이 어땠는지 잘 알 수 있어요."]], "t117-5": [["All in all, both styles have something special. But if I had to choose, I would stick with today's parks.", "결국 두 방식 모두 매력이 있어요. 하지만 하나를 골라야 한다면, 지금의 공원을 선택할 것 같아요."]], "t118-0": [["So, from the get-go, the biggest difference is the atmosphere, you know?", "처음부터 가장 큰 차이는 분위기예요, 알죠?"]], "t118-1": [["It's much more different now. I like that. Each park has a different purpose.", "지금은 훨씬 더 다르게 느껴져요. 저는 그게 좋아요. 공원마다 목적이 달라요."]], "t118-2": [["In the past, one park was small. It was mostly for families. Now it's different. The other park is bigger and more natural.", "예전에는 한 공원이 작았어요. 주로 가족들을 위한 곳이었어요. 지금은 달라요. 다른 공원은 더 크고 더 자연스러워요."]], "t118-3": [["And yeah, I've tried both, and to be real, I prefer the larger park.", "그리고 둘 다 가본 입장에서 솔직히 말하면, 저는 큰 공원이 더 좋아요."]], "t118-4": [["I remember one time. The small park was super crowded. This shows how things were different back then.", "한번 기억나는 게 있어요. 작은 공원이 정말 붐볐어요. 이게 그때랑 지금이 다르다는 걸 보여줘요."]], "t118-5": [["Both parks have their own charm. But I usually choose the bigger one. It just feels more like me.", "두 공원 다 매력이 있어요. 하지만 저는 보통 더 큰 공원을 선택해요. 그게 더 제 취향에 맞아요."]], "t119-0": [["To start with, what really stands out is how flexible travel has become.", "먼저 가장 눈에 띄는 점은 여행이 훨씬 더 유연해졌다는 점이에요."]], "t119-1": [["These days, travel feels more casual. This works better for people. They don't need long breaks to travel anymore.", "요즘은 여행이 훨씬 가벼운 느낌이에요. 이게 사람들에게 더 잘 맞아요. 긴 휴가가 없어도 여행할 수 있거든요."]], "t119-2": [["In the past, families planned one big trip every year. Now things are different. Short trips are more common now.", "예전에는 가족들이 1년에 한 번 큰 여행을 계획했어요. 지금은 달라요. 요즘은 짧은 여행을 더 자주 가요."]], "t119-3": [["I've been through both, and personally, I find modern travel way more enjoyable.", "저는 두 방식 다 경험해 봤는데, 개인적으로는 요즘 여행이 훨씬 더 즐거워요."]], "t119-4": [["There was even a time when everyone traveled during peak season. This really shows how things used to be.", "예전에 모두가 성수기에 한꺼번에 여행 가던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t119-5": [["Both old and new ways of traveling have something special. But if I had to choose, I'd pick how people travel today.", "옛날 방식이랑 요즘 방식 둘 다 나름의 매력이 있어요. 하지만 하나를 골라야 한다면, 저는 요즘 사람들이 여행하는 방식을 선택할 것 같아요."]], "t120-0": [["Back then, movies were more creative and felt new. You would watch a movie and think, 'Wow, this is new.' But nowadays, movies feel different. Now I often think, 'I've seen this before.'", "예전에는 영화가 더 창의적이고 새로운 느낌이었어요. 영화를 보면서 '오, 이거 새롭다'라는 생각이 들었죠. 근데 요즘은 느낌이 달라요. 요즘은 '이거 예전에 본 것 같은데'라는 생각이 자주 들어요."]], "t120-1": [["And this goes across all genres, adventure, romance, history and so forth.", "이건 장르를 가리지 않아요. 모험, 로맨스, 역사물 등 전반적으로 다 그래요."]], "t120-2": [["Personally, I don't care much about the genre. I care more about the quality. But these days, I'm just not feeling it.", "저는 개인적으로 장르는 별로 신경 안 써요. 퀄리티를 더 중요하게 생각해요. 근데 요즘은 그게 잘 느껴지지 않아요."]], "t120-3": [["So, I guess that's my answer.", "그래서… 네, 그게 제 답변이에요."]], "t121-0": [["Back then, music was more creative and felt new. You would listen to a song and think, 'Wow, this is new.' But nowadays, music feels different. Now I often think, 'Oh, this again?'", "예전에는 음악이 더 창의적이고 새로운 느낌이었어요. 노래를 들으면서 '오, 이거 새롭다'라는 생각이 들었죠. 근데 요즘은 느낌이 달라요. 요즘은 '어, 또 이 느낌이야?'라는 생각이 자주 들어요."]], "t121-1": [["And this goes across all genres, kpop, pop, ballads and so forth.", "그리고 이건 장르를 가리지 않아요. 케이팝, 팝, 발라드 등 전반적으로 다 그래요."]], "t121-2": [["Personally, I don't care much about the genre. I care more about the quality. But these days, I'm just not feeling it.", "저는 개인적으로 장르는 별로 신경 안 써요. 퀄리티를 더 중요하게 생각해요. 근데 요즘은 그게 잘 느껴지지 않아요."]], "t121-3": [["So, I guess that's my answer.", "그래서… 네, 그게 제 답변이에요."]], "t122-0": [["Generally speaking, there is mainstream music and indie music. Mainstream musicians are famous, like Ejae, who made the soundtrack for Kpop Demon Hunters. Indie musicians are less famous, like Ed Sheeran before he became famous. The biggest difference between them is fame.", "일반적으로 보면 대중 음악과 인디 음악이 있어요. 대중 음악 뮤지션은 이재(Ejae)처럼 유명한 사람들인데, 이재는 케이팝 데몬 헌터즈의 OST를 만들었어요. 인디 뮤지션은 유명해지기 전의 에드 시런처럼 덜 알려진 사람들이에요. 둘의 가장 큰 차이는 유명세예요."]], "t122-1": [["But other than that, music is just music. I love all kinds of music. Fame isn't everything. So yeah, that's my answer.", "그거 말고는 음악은 그냥 음악이에요. 저는 모든 음악을 다 좋아해요. 유명한 게 다는 아니에요. 그래서 그게 제 답변이에요."]], "t123-0": [["So, from the get-go, the biggest difference is the vibe and the concept, you know?", "처음부터 가장 큰 차이는 분위기랑 콘셉트예요, 그쵸?"]], "t123-1": [["It's much more trendy now. I like that. It feels safer and more comfortable.", "지금은 훨씬 트렌디해졌어요. 저는 그게 좋아요. 더 안전하고 편한 느낌이거든요."]], "t123-2": [["In the past, bars were louder, darker, and pretty basic. Now they're totally different. They're more themed, cleaner, and even good for photos.", "예전에는 술집이 더 시끄럽고 어둡고 단순했어요. 지금은 완전히 달라요. 테마도 있고 더 깔끔하고 사진 찍기도 좋아요."]], "t123-3": [["And yeah, I've tried both, and to be real, I prefer modern bars.", "둘 다 가봤지만, 솔직히 저는 요즘 술집이 더 좋아요."]], "t123-4": [["I remember one time. The old-style place was so smoky and noisy. This shows how different things were back then.", "한번 기억나는 게 있어요. 예전 스타일의 술집은 담배 연기도 많고 너무 시끄러웠어요. 이게 그때랑 지금이 다르다는 걸 보여줘요."]], "t123-5": [["Both old-school bars and modern bars have their own charm. But I usually go with modern ones. It just feels more like me.", "옛날 술집이랑 요즘 술집 둘 다 매력이 있어요. 하지만 저는 보통 요즘 스타일로 가요. 그게 더 제 취향에 맞아요."]], "t124-0": [["So, from the get-go, the biggest difference is how cafés became like lifestyle spaces, you know?", "처음부터 가장 큰 차이는 카페가 ‘라이프스타일 공간'처럼 변했다는 점이에요, 그쵸?"]], "t124-1": [["Cafés are much more stylish now. I like that. I can work or study there comfortably.", "요즘 카페는 훨씬 세련돼졌어요. 저는 그게 좋아요. 거기서 편하게 공부하거나 작업할 수 있거든요."]], "t124-2": [["In the past, cafés were mostly just for a quick coffee. Now they're totally different. They're bigger, nicer, and made for staying longer.", "예전에는 카페가 그냥 커피를 빨리 마시는 곳이었어요. 지금은 완전히 달라요. 더 넓고 예쁘고 오래 머물기 좋게 됐어요."]], "t124-3": [["And yeah, I've tried both, and to be real, I prefer modern cafés.", "둘 다 경험해 봤지만, 솔직히 저는 요즘 카페가 더 좋아요."]], "t124-4": [["I remember a time when there weren't many seats, and you couldn't stay long. This shows how different things were back then. Both old and modern cafés have their own charm, but I usually choose modern ones. It just feels more like me.", "좌석이 많지 않고 오래 있을 수도 없었던 때가 기억나요. 이게 그때랑 지금이 다르다는 걸 보여줘요. 옛날 카페랑 요즘 카페 둘 다 매력이 있지만, 저는 보통 요즘 카페를 선택해요. 그게 더 제 취향에 맞아요."]], "t125-0": [["To start with, what really stands out is how gatherings became smaller and more casual.", "먼저 가장 눈에 띄는 점은 모임이 더 작아지고 가벼워졌다는 점이에요."]], "t125-1": [["These days, it feels more flexible. This works better for me. People can meet without a lot of pressure.", "요즘은 훨씬 더 유연한 느낌이에요. 이게 저한테 더 잘 맞아요. 사람들이 부담 없이 만날 수 있거든요."]], "t125-2": [["In the past, big family get-togethers were basically required. Now things are different. People do smaller meetups, quick dinners, or even online calls.", "예전에는 큰 가족 모임이 거의 필수였어요. 지금은 달라요. 사람들은 소규모 모임이나 간단한 식사, 또는 영상통화로도 만나요."]], "t125-3": [["There was even a time when we spent the whole day visiting house after house. This really shows how things used to be.", "예전에 하루 종일 이 집 저 집 돌아다니던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t126-0": [["To start with, what really stands out is how upgraded and specialized hotels have become.", "먼저 가장 눈에 띄는 점은 호텔이 훨씬 업그레이드되고 전문화됐다는 점이에요."]], "t126-1": [["These days, hotels feel more premium. This works better for me. The service is smoother and the options are clearer.", "요즘은 호텔이 훨씬 고급스러운 느낌이에요. 이게 저한테 더 잘 맞아요. 서비스도 더 매끄럽고 선택지도 더 명확하거든요."]], "t126-2": [["In the past, hotels were pretty basic and similar. Now things are different. There are boutique hotels, themed stays, and smart check-in.", "예전에는 호텔이 대체로 단순하고 다 비슷했어요. 지금은 달라요. 부티크 호텔, 테마 숙소, 스마트 체크인도 있어요."]], "t126-3": [["There was even a time when we had to wait in line at the front desk for a long time. This really shows how things used to be.", "예전에 프런트에서 오래 줄을 서야 했던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t127-0": [["To start with, what really stands out is how digital banking has taken over.", "먼저 가장 눈에 띄는 점은 은행 업무가 디지털로 거의 넘어갔다는 점이에요."]], "t127-1": [["These days, banking feels more convenient. This works better for me. I can do almost everything on my phone.", "요즘은 은행 업무가 훨씬 편리한 느낌이에요. 이게 저한테 더 잘 맞아요. 거의 모든 걸 핸드폰으로 할 수 있거든요."]], "t127-2": [["In the past, banks were crowded and had a lot of paperwork. Now things are different. Mobile apps, kiosks, and quick transfers are normal now.", "예전에는 은행이 붐비고 서류도 많았어요. 지금은 달라요. 앱, 키오스크, 빠른 이체가 이제는 기본이에요."]], "t127-3": [["There was even a time when I waited a long time just to update a bankbook. This really shows how things used to be.", "예전에 통장 정리 하나 하려고 오래 기다렸던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t128-0": [["To start with, what really stands out is how online grocery shopping has grown.", "먼저 가장 눈에 띄는 점은 온라인 장보기가 크게 늘었다는 점이에요."]], "t128-1": [["These days, grocery shopping feels more efficient. This works better for me. It saves time and it reduces impulse buying.", "요즘은 장보기가 훨씬 효율적인 느낌이에요. 이게 저한테 더 잘 맞아요. 시간도 아끼고 충동구매도 줄여주거든요."]], "t128-2": [["In the past, people mostly went to local markets in person. Now things are different. Delivery apps and subscription-style shopping are common now.", "예전에는 사람들이 보통 직접 시장에 갔어요. 지금은 달라요. 배달 앱과 정기배송 같은 방식도 흔해요."]], "t128-3": [["There was even a time when we had to carry heavy bags all the way home. This really shows how things used to be.", "예전에 무거운 장바구니를 들고 집까지 와야 했던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t129-0": [["To start with, what really stands out is how connected and streamlined transportation has become.", "먼저 가장 눈에 띄는 점은 교통이 훨씬 더 연결되고 체계적이 됐다는 점이에요."]], "t129-1": [["These days, transportation feels more reliable. This works better for me. I can plan routes and timing instantly.", "요즘은 교통이 훨씬 믿을 만한 느낌이에요. 이게 저한테 더 잘 맞아요. 경로랑 시간을 바로 확인할 수 있거든요."]], "t129-2": [["In the past, people relied on fixed schedules and cash tickets. Now things are different. Apps, transit cards, and real-time updates are standard now.", "예전에는 사람들이 정해진 시간표와 현금 표에 의존했어요. 지금은 달라요. 앱, 교통카드, 실시간 정보가 이제는 기본이에요."]], "t129-3": [["There was even a time when I missed a bus. I had no idea when the next one was coming. This really shows how things used to be.", "예전에 버스를 놓친 적도 있었어요. 다음 버스가 언제 오는지도 몰랐어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t130-0": [["To start with, what really stands out is how strict and detailed recycling rules became.", "먼저 가장 눈에 띄는 점은 재활용 규칙이 훨씬 더 엄격하고 세분화됐다는 점이에요."]], "t130-1": [["These days, recycling feels more systematic. This works better for me. It reduces confusion and it reduces waste.", "요즘은 재활용이 훨씬 체계적인 느낌이에요. 이게 저한테 더 잘 맞아요. 헷갈림도 줄고 낭비도 줄여주거든요."]], "t130-2": [["In the past, we separated only the basics. Now things are different. We sort by material, wash containers, and follow specific bags.", "예전에는 기본적인 것만 대충 분리했어요. 지금은 달라요. 재질별로 나누고, 용기를 씻고, 전용 봉투도 지켜야 해요."]], "t130-3": [["There was even a time when I threw something in the wrong bin. Someone corrected me. This really shows how things used to be.", "예전에 분리수거를 잘못해서 지적받은 적도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t131-0": [["To start with, what really stands out is how fast trends move now.", "먼저 가장 눈에 띄는 점은 유행이 훨씬 빨리 바뀐다는 점이에요."]], "t131-1": [["These days, fashion feels more experimental. This works better for me. People can express themselves freely.", "요즘은 패션이 훨씬 다양하게 시도되는 느낌이에요. 이게 저한테 더 잘 맞아요. 사람들이 자유롭게 자기 표현을 할 수 있거든요."]], "t131-2": [["In the past, styles were more similar and focused on brands. Now things are different. Mix-and-match, thrifted items, and comfortable looks are huge now.", "예전에는 스타일이 더 비슷하고 브랜드 중심이었어요. 지금은 달라요. 믹스매치, 빈티지, 편한 룩이 요즘은 대세예요."]], "t131-3": [["There was even a time when everyone wore the same must-have item. This really shows how things used to be.", "예전에 다들 똑같은 '필수템'을 입던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t132-0": [["To start with, what really stands out is how smart and integrated tech has become.", "먼저 가장 눈에 띄는 점은 기술이 훨씬 더 똑똑하고 통합됐다는 점이에요."]], "t132-1": [["These days, technology feels more instant. This works better for me. It saves time in everyday tasks.", "요즘은 기술이 훨씬 즉각적인 느낌이에요. 이게 저한테 더 잘 맞아요. 일상 업무 시간을 줄여주거든요."]], "t132-2": [["In the past, devices were separate and slower. Now things are different. Everything is connected through apps and AI features.", "예전에는 기기들이 따로따로이고 느렸어요. 지금은 달라요. 이제는 앱과 AI 기능으로 모든 게 연결돼요."]], "t132-3": [["There was even a time when I had to use a desktop computer for basic things. This really shows how things used to be.", "예전에 간단한 일도 데스크톱으로 해야 했던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t133-0": [["To start with, what really stands out is how global and interconnected things feel now.", "먼저 가장 눈에 띄는 점은 요즘은 훨씬 더 글로벌하게 연결돼 있다는 느낌이에요."]], "t133-1": [["These days, things feel more international. This works better for me. We have more access to cultures and opportunities.", "요즘은 훨씬 국제적인 느낌이에요. 이게 저한테 더 잘 맞아요. 문화와 기회에 더 쉽게 접근할 수 있거든요."]], "t133-2": [["In the past, international exchange felt limited. Now things are different. Trade, travel, sports, and content cross borders much more easily now.", "예전에는 국제 교류가 제한적으로 느껴졌어요. 지금은 달라요. 무역, 여행, 스포츠, 콘텐츠가 이제는 훨씬 쉽게 국경을 넘나들어요."]], "t133-3": [["There was even a time when foreign culture felt far away and hard to access. This really shows how things used to be.", "예전에 외국 문화가 멀고 접근하기 어렵게 느껴지던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요."]], "t134-0": [["My free time has changed a lot over the years.", "제 자유 시간은 예전이랑 많이 달라졌어요."]], "t134-1": [["In the past, I had way more free time and could actually enjoy hobbies.", "예전에는 자유 시간이 더 많아서 취미도 제대로 즐길 수 있었어요."]], "t134-2": [["Now, because of work and responsibilities, I don't really have time for hobbies anymore.", "지금은 일이나 책임이 많아져서 취미를 할 시간이 거의 없어요."]], "t134-3": [["When I do have free time, it's usually short and I just use it to rest.", "가끔 자유 시간이 생겨도 보통 그냥 쉬는 데 쓰게 돼요."]], "t134-4": [["So compared to before, I definitely have less free time now.", "그래서 지금은 예전보다 자유 시간이 확실히 줄어들었어요."]], "t135-0": [["I'd like to talk about famous hotels in my country.", "저는 우리나라의 유명한 호텔들에 대해 이야기하고 싶어요."]], "t135-1": [["They're usually located in big cities like Seoul or Busan. They're often near popular tourist areas or along the coast. They have a very luxurious and elegant feeling.", "이 호텔들은 보통 서울이나 부산 같은 대도시에 있어요. 인기 있는 관광지 근처나 해안가에 있는 경우가 많아요. 전체적으로 아주 고급스럽고 우아한 느낌이에요."]], "t135-2": [["The first thing you notice is the grand lobby with chandeliers. The staff are very professional. The rooms have beautiful views of the city or the ocean. Overall, it feels modern and high-class.", "가장 먼저 눈에 띄는 건 샹들리에가 있는 웅장한 로비예요. 직원들도 매우 전문적이에요. 객실에서는 도시나 바다의 멋진 전망이 보여요. 전체적으로 현대적이고 고급스러운 느낌이에요."]], "t135-3": [["What I like most is that the rooms are comfortable and quiet. They also have great service and good amenities, like spas and buffets. Being there always makes me feel relaxed and pampered.", "제가 가장 좋아하는 점은 객실이 편안하고 조용하다는 거예요. 서비스도 좋고 스파나 뷔페 같은 시설도 잘 되어 있어요. 거기 있으면 항상 편안하고 대접받는 느낌이 들어요."]], "t135-4": [["That's basically why I like this place.", "그래서 저는 이런 호텔들을 정말 좋아해요."]], "t136-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음… 제 루틴이 어떻게 돌아가냐면요… 글쎄요… 제가 꽤 자주 하는 건 클린앤프레시 세탁소에 정장이랑 섬세한 옷을 맡기는 거예요."]], "t136-1": [["Something I do pretty regularly is dropping off my suits and delicate clothes at Clean & Fresh.", "특별한 건 아니고요… 보통 들어가서 옷 맡기고, 늘 하던 서비스로 부탁하는 정도인데, 그러면 정리가 된 느낌이 들고 마음이 좀 편해져요."]], "t136-2": [["It's nothing fancy… usually, I walk in, hand them my clothes, and ask for the usual service, and it helps me feel organized and relieved.", "이제는 그걸 굳이 의식하지도 않아요… 그냥… 제 생활을 안정적으로 유지해 주는 작은 습관 중 하나고, 이게 루틴이라는 것도 사실 잘 몰랐어요."]], "t136-3": [["I don't even think about it that much anymore… like… it's just one of those little habits that keeps my life steady and… I honestly didn't even know was a routine of mine. But yeah, I'd say that's my answer.", "네, 그게 제 답변이에요."]], "t137-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음… 제 루틴이 어떻게 돌아가냐면요… 글쎄요… 제가 꽤 자주 하는 건 강동우체국에 가서 소포를 보내는 일이에요."]], "t137-1": [["Something I do pretty regularly is going to Gangdong Post Office to send out packages.", "특별한 건 아니고요… 보통 소포 무게 재고, 운송장 출력해서 바로 발송하는데, 그렇게 하면 할 일을 제대로 끝냈다는 느낌이 들어요."]], "t137-2": [["It's nothing fancy… usually, I weigh my parcels, print the labels, and mail them out, and it helps me get the job done…", "이제는 그걸 그렇게 깊게 생각하지도 않아요… 그냥 제 생활을 안정적으로 유지해 주는 작은 습관 같은 거고, 솔직히 이게 제 루틴인지도 몰랐어요."]], "t137-3": [["I don't even think about it that much anymore… like… it's just one of those little habits that keeps my life steady and… I honestly didn't even know was a routine of mine. But yeah, I'd say that's my answer.", "네, 이 정도가 제 답변이에요."]], "t138-0": [["Okay, so as for how it goes down with my routine… well… hmm…", "음… 제 루틴이요… 어떻게 설명하면 좋을까… 제가 꽤 자주 하는 건 집중이 필요할 때 동네 도서관에 가는 거예요."]], "t138-1": [["Something I do pretty regularly is going to my neighborhood library when I need to focus.", "특별한 건 없고… 보통 조용한 자리에 앉아서 핸드폰을 무음으로 해 두고 과제나 작업을 해요, 그러면 머리가 좀 정리되고 집중도 잘 돼요."]], "t138-2": [["It's nothing fancy… usually, I find a quiet seat, put my phone on silent, and work on my assignments, and it helps me clear my head and concentrate.", "이젠 거의 생각 없이 가게 돼요… 그냥 제 삶의 리듬을 잡아주는 작은 습관 같은 거고, 이게 루틴인지도 몰랐어요."]], "t138-3": [["I don't even think about it that much anymore… like… it's just one of those little habits that keeps my life steady and… I honestly didn't even know was a routine of mine. But yeah, I'd say that's my answer.", "네, 이 정도가 제 답이에요."]]});

const BYID=Object.fromEntries(ALL.map(c=>[c.id,c]));
const TOPIC_IDS=TEMPLATES.filter(t=>t.group==="주제 연습").map(t=>t.id);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- 상태와 저장 ---------- */
let S={study:{},studyU:{},cards:{},fill:{mode:"start",n:3},audio:{rep:3,rate:0.9,each:1,gap:1,loop:false},units:null};  // cards[id] = {s:"m"} 모르겠어요 / {s:"k"} 알았어요
const LS_KEY="opic-srs-v1";
const store={ref:null,busy:false,dirty:false,timer:null,mode:"local"};
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function lsLoad(){try{const v=localStorage.getItem(LS_KEY);return v?JSON.parse(v):null}catch(e){return null}}
function showSync(){
  $("#sync").textContent=store.mode==="cloud"?"진도는 내 계정에 저장되어 기기를 바꿔도 이어져요.":"진도는 이 브라우저에만 저장돼요.";
}
function save(){
  lsSave();
  if(!store.ref)return;
  store.dirty=true;
  clearTimeout(store.timer);
  store.timer=setTimeout(flush,700);
}
async function flush(){
  if(store.busy||!store.dirty||!store.ref)return;
  store.busy=true;store.dirty=false;
  try{await store.ref.set({v:1,s:S})}
  catch(e){store.mode="local";store.ref=null;showSync()}
  store.busy=false;
  if(store.dirty)flush();
}
async function initStore(){
  const c=window.claude;
  if(!c||!c.use)return;
  try{
    const [db,user]=await Promise.all([c.use("db"),c.use("user")]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const ref=db.doc("data/users/"+id+"/progress");
    const snap=await ref.get();
    if(snap.exists&&snap.data()&&snap.data().s){
      S=normalize(snap.data().s);lsSave();
    }
    store.ref=ref;store.mode="cloud";showSync();
    if(!snap.exists){store.dirty=true;flush()}
    Q.q=[];W.id=null;F.q=[];BR.q=[];if(T1.done===0)startToday();
    renderAll();
  }catch(e){/* 로컬 저장으로 계속 */}
}
const STUDY_KEYS=["plan","today","quiz","fill","write","listen","wrong","ask","game","bracket"];
function cleanStudy(src,allowed){          // {날짜:{항목:초}} 에서 올바른 값만 남기고 최근 400일만 보관
  const out={};
  Object.keys(src||{}).sort().slice(-400).forEach(k=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k))return;
    const d=src[k],o={};
    allowed.forEach(it=>{const x=Number(d&&d[it]);if(x>0&&isFinite(x))o[it]=Math.round(x*10)/10});
    if(Object.keys(o).length)out[k]=o;
  });
  return out;
}
function normalize(s){
  s=s||{};
  const cards={};
  Object.keys(s.cards||{}).forEach(id=>{
    const c=s.cards[id];if(!c||!BYID[id])return;
    const o={};
    if(c.s==="m"||c.s==="k")o.s=c.s;
    if(c.w>0)o.w=Math.floor(c.w);
    if(c.n>0)o.n=Math.floor(c.n);
    if(o.s||o.w||o.n)cards[id]=o;
  });
  const fill=Object.assign({mode:"start",n:3},s.fill||{});
  if(!["start","key","end"].includes(fill.mode))fill.mode="start";
  if(![0,2,3,4].includes(fill.n))fill.n=3;
  let units=Array.isArray(s.units)?s.units.filter(id=>TEMPLATES.some(t=>t.id===id)):null;
  const OLD16=["d1","d2","d3","p1","m1","m2","x1","f1","r1","u1","u3","s1","c1","c2","a1","a2"];   // 단원이 16개이던 때의 전체 선택
  if(units&&!s.uv&&OLD16.every(id=>units.includes(id)))units=units.concat(["p2","m3","u2"].filter(id=>!units.includes(id)));
  if(!(s.uv>=2))units=TOPIC_IDS.slice();            // 주제 연습이 생긴 버전: 처음 한 번은 주제 연습만 선택
  return {uv:2,plan:cleanPlan(s.plan),study:cleanStudy(s.study,STUDY_KEYS),studyU:cleanStudy(s.studyU,TEMPLATES.map(t=>t.id)),cards:cards,fill:fill,audio:Object.assign({rep:3,rate:0.9,each:1,gap:1,loop:false},s.audio||{}),
    units:units,game:cleanGame(s.game),br:cleanBr(s.br)};
}

/* ---------- 모르는 문장 반복과 틀린 횟수 ---------- */
// cards[id] = {s:"m"|"k", w:틀린 횟수}. s가 없으면 아직 학습하지 않은 새 문장
const statusOf=id=>S.cards[id]&&S.cards[id].s;
const wrongOf=id=>(S.cards[id]&&S.cards[id].w)||0;
const seenOf=id=>(S.cards[id]&&S.cards[id].n)||0;       // 지금까지 게임에서 나온 횟수 (한 번도 안 나왔으면 0)
function entry(id){return S.cards[id]||(S.cards[id]={})}
/* ----- 랜덤 학습: 틀린 문장이 더 자주 나오는 가중치 뽑기 (별도 저장 없음) ----- */
const RS={};                       // 이번에 연 동안만 쓰는 보정값: 틀리면 +3, 맞히면 -2
const rsBad=id=>{RS[id]=Math.min(9,(RS[id]||0)+3)};
const rsGood=id=>{RS[id]=Math.max(-2,(RS[id]||0)-2)};
function wgt(id){return Math.max(0.4,1+2*Math.min(wrongOf(id),5)+(statusOf(id)==="m"?2:0)+(RS[id]||0))}
function wpick(ids,n){             // 가중치를 따라 겹치지 않게 n개 뽑기 (틀린 문장일수록 앞에 올 확률이 높음)
  return ids.map(id=>[id,-Math.log(Math.random()||1e-9)/wgt(id)]).sort((a,b)=>a[1]-b[1]).slice(0,n).map(x=>x[0]);
}
function grade(id,known){        // known=true 알았어요 → 졸업, false 모르겠어요 → 틀린 횟수 +1, 계속 반복
  const e=entry(id);
  e.s=known?"k":"m";
  if(!known){e.w=(e.w||0)+1;rsBad(id)}else rsGood(id);
  save();renderStats();
}
function addWrong(id){            // 퀴즈 오답, 쓰기 85점 미만
  const e=entry(id);e.w=(e.w||0)+1;rsBad(id);
  save();renderStats();
}
function active(){const set=new Set(S.units||TEMPLATES.map(t=>t.id));return ALL.filter(c=>set.has(c.tid))}
function buildQueue(){            // 모르겠다고 한 문장 먼저, 그다음 새 문장
  const act=active();
  const m=act.filter(c=>statusOf(c.id)==="m");
  const n=act.filter(c=>!statusOf(c.id));
  return m.concat(n).map(c=>c.id);
}
function renderStats(){
  const act=active();
  const missed=act.filter(c=>statusOf(c.id)==="m").length;
  const fresh=act.filter(c=>!statusOf(c.id)).length;
  const all=Object.keys(S.cards);
  const known=all.filter(id=>S.cards[id].s==="k").length;
  const wrong=all.reduce((n,id)=>n+(S.cards[id].w||0),0);
  $("#stats").innerHTML=
   '<div class="stat"><b>'+(missed+fresh)+'</b><span>남은 문장</span></div>'+
   '<div class="stat"><b>'+missed+'</b><span>다시 볼 문장</span></div>'+
   '<div class="stat"><b>'+known+'/'+ALL.length+'</b><span>외운 문장</span></div>'+
   '<div class="stat"><b>'+wrong+'</b><span>틀린 횟수</span></div>'+
   '<div class="stat"><b>'+fmtDur(todaySecs())+'</b><span>오늘 공부</span></div>';
}
/* ---------- 듣기: 반복 재생·중지·속도 ---------- */
const canSpeak=()=>typeof speechSynthesis!=="undefined"&&typeof SpeechSynthesisUtterance!=="undefined";
const AU={playing:false,token:0,count:0,timer:null};
const REPS=[[1,"1회"],[3,"3회"],[5,"5회"],[10,"10회"],[0,"계속"]];
const RATES=[[0.7,"느리게"],[0.9,"보통"],[1.1,"빠르게"]];
function audioRefresh(){
  document.querySelectorAll('[data-au="play"]').forEach(b=>{b.textContent=AU.playing?"다시 듣기":"▶ 듣기"});
  document.querySelectorAll('[data-au="stop"]').forEach(b=>{b.disabled=!AU.playing});
  const rep=S.audio.rep;
  const txt=AU.playing?(rep===0?(AU.count+1)+"번째 재생 중":(AU.count+1)+" / "+rep+"회"):"";
  document.querySelectorAll('[data-au="count"]').forEach(s=>{s.textContent=txt});
}
function audioStop(){
  AU.token++;clearTimeout(AU.timer);AU.playing=false;AU.count=0;
  try{speechSynthesis.cancel()}catch(e){}
  audioRefresh();
}
function audioPlay(text){
  if(!canSpeak())return;
  listStop();audioStop();
  const my=AU.token;AU.playing=true;AU.count=0;audioRefresh();
  const finish=()=>{if(my!==AU.token)return;AU.playing=false;AU.count=0;audioRefresh()};
  const once=()=>{
    if(my!==AU.token)return;
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang="en-US";u.rate=S.audio.rate;
      u.onend=()=>{
        if(my!==AU.token)return;
        AU.count++;
        const rep=S.audio.rep;
        if(rep===0||AU.count<rep){audioRefresh();AU.timer=setTimeout(once,800)}
        else finish();
      };
      u.onerror=finish;
      speechSynthesis.speak(u);
    }catch(e){finish()}
  };
  once();
}
function audioBar(){
  if(!canSpeak())return "";
  const opt=(list,cur)=>list.map(o=>'<option value="'+o[0]+'"'+(o[0]===cur?" selected":"")+'>'+o[1]+'</option>').join("");
  return '<div class="audio" role="group" aria-label="듣기">'+
   '<button class="btn primary ghost" data-au="play">▶ 듣기</button>'+
   '<button class="btn ghost" data-au="stop" disabled>■ 중지</button>'+
   '<label class="aulab">반복 <select data-au="rep" aria-label="반복 횟수">'+opt(REPS,S.audio.rep)+'</select></label>'+
   '<label class="aulab">속도 <select data-au="rate" aria-label="재생 속도">'+opt(RATES,S.audio.rate)+'</select></label>'+
   '<span class="aucount" data-au="count" aria-live="polite"></span></div>';
}
function bindAudio(root,text){
  const q=k=>root.querySelector('[data-au="'+k+'"]');
  const p=q("play");if(!p)return;
  p.onclick=()=>audioPlay(text);
  q("stop").onclick=audioStop;
  q("rep").onchange=e=>{S.audio.rep=+e.target.value;save();audioRefresh()};
  q("rate").onchange=e=>{S.audio.rate=+e.target.value;save()};
  audioRefresh();
}
function boxChip(id){const s=statusOf(id);return '<span class="chip box">'+(s==="m"?"다시 볼 문장":s==="k"?"아는 문장":"새 문장")+'</span>'}
function wrongChip(id){const n=wrongOf(id);return '<span class="chip wr'+(n?" on":"")+'">틀린 횟수 '+n+'회</span>'}
function highlight(c){return esc(c.en).replace(esc(c.key),"<mark>"+esc(c.key)+"</mark>")}

/* ---------- 정답을 볼 때 나타나는 문법 포인트 ---------- */
function gramBox(c){
  const gs=grammarFor(c.en);
  if(!gs.length)return "";
  return '<div class="gram"><p class="gl">문법 포인트</p>'+gs.map(g=>
    '<div class="gi"><p class="gt">'+esc(g[0])+'</p><p class="gr">'+esc(g[1])+'</p><p class="ge">'+esc(g[2])+'</p></div>').join("")+'</div>';
}
const emptyUnits=()=>'<div class="card empty"><h2>선택한 단원이 없어요</h2><p class="hint">위의 단원 선택에서 학습할 단원을 골라 주세요.</p></div>';

/* ---------- 단원 선택 ---------- */
let UOPEN=false;
function setUnits(arr){
  S.units=arr;save();audioStop();listStop();
  startToday();Q.q=[];W.id=null;W.res=null;F.q=[];BR.q=[];
  renderAll();
}
function renderUnits(){
  const box=$("#unitbar");
  if(TAB==="wrong"||TAB==="log"||TAB==="game"||TAB==="plan"){box.innerHTML="";return}
  const ids=TEMPLATES.map(t=>t.id);
  const sel=new Set(S.units||ids);
  const n=ALL.filter(c=>sel.has(c.tid)).length;
  const groups=[...new Set(TEMPLATES.map(t=>t.group))];
  box.innerHTML='<details class="units"'+(UOPEN?" open":"")+'><summary><span>단원 선택</span><span class="ucount">'+sel.size+'개 단원 · '+n+'문장</span></summary>'+
   '<div class="ubody">'+scopeRow()+'<div class="filter"><button data-all="1">전체 선택</button><button data-none="1">모두 해제</button>'+
   groups.map(g=>{const all=TEMPLATES.filter(t=>t.group===g).every(t=>sel.has(t.id));return '<button data-g="'+esc(g)+'" aria-pressed="'+all+'">'+esc(g)+'</button>'}).join("")+'</div>'+
   '<div class="filter">'+TEMPLATES.map(t=>'<button data-t="'+t.id+'" aria-pressed="'+sel.has(t.id)+'">'+esc(t.name)+' <span class="mono">'+t.cards.length+'</span></button>').join("")+'</div></div></details>';
  const det=box.querySelector("details");
  det.ontoggle=()=>{UOPEN=det.open};
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    UOPEN=true;
    if(b.dataset.sc)return setUnits(scopeIds(b.dataset.sc));
    const cur=new Set(S.units||ids);
    if(b.dataset.all)return setUnits(ids.slice());
    if(b.dataset.none)return setUnits([]);
    if(b.dataset.g){
      const gi=TEMPLATES.filter(t=>t.group===b.dataset.g).map(t=>t.id);
      const all=gi.every(id=>cur.has(id));
      gi.forEach(id=>all?cur.delete(id):cur.add(id));
    }else{
      const id=b.dataset.t;cur.has(id)?cur.delete(id):cur.add(id);
    }
    setUnits(ids.filter(id=>cur.has(id)));
  });
}
/* ---------- 카드 학습: 순서대로 / 랜덤 복습. 모르겠어요를 누른 문장은 알 때까지 반복 ---------- */
const T1={q:[],i:0,shown:false,hint:false,done:0,total:0,mode:"seq",count:10};
function startToday(){
  T1.q=T1.mode==="rand"?wpick(active().map(c=>c.id),T1.count||9999):buildQueue();   // 랜덤: 모든 단원에서, 틀린 문장이 더 자주
  T1.i=0;T1.shown=false;T1.hint=false;T1.done=0;T1.total=T1.q.length;
}
function leftCount(){return new Set(T1.q.slice(T1.i)).size}
function modeBar(){
  const r=T1.mode==="rand";
  return '<div class="mode"><div class="filter"><button data-m="seq" aria-pressed="'+!r+'">순서대로 학습</button><button data-m="rand" aria-pressed="'+r+'">🎲 전체 랜덤</button></div>'+
   (r?'<label class="aulab">문장 수 <select id="rcount" aria-label="랜덤 복습 문장 수">'+
      [[10,"10문장"],[20,"20문장"],[0,"전체"]].map(o=>'<option value="'+o[0]+'"'+(o[0]===T1.count?" selected":"")+'>'+o[1]+'</option>').join("")+
      '</select></label><button class="btn ghost" id="reshuffle">다시 섞기</button><span class="note">선택한 단원에서 · 틀린 문장이 더 자주 나와요</span>':'')+'</div>';
}
function bindMode(v){
  v.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{audioStop();T1.mode=b.dataset.m;startToday();renderToday()});
  const rc=v.querySelector("#rcount");if(rc)rc.onchange=()=>{audioStop();T1.count=+rc.value;startToday();renderToday()};
  const rs=v.querySelector("#reshuffle");if(rs)rs.onclick=()=>{audioStop();startToday();renderToday()};
}
function renderToday(){
  const v=$("#v-today");
  if(!active().length){v.innerHTML=emptyUnits();return}
  const bar=modeBar(),rand=T1.mode==="rand";
  if(T1.i>=T1.q.length){
    v.innerHTML=bar+'<div class="card empty"><h2>'+(rand?"랜덤 복습을 마쳤어요":"선택한 단원을 모두 외웠어요")+'</h2>'+
      '<p class="hint">'+(T1.total?T1.total+"문장을 마쳤어요. ":"")+(rand?"다시 섞으면 새로운 순서로 복습해요.":"복습하려면 랜덤 복습을 쓰거나, 처음부터 다시 외울 수 있어요.")+'</p>'+
      '<div class="row"><button class="btn primary" id="again">'+(rand?"다시 섞기":"랜덤 복습 시작")+'</button>'+
      (rand?'':'<button class="btn" id="reset">처음부터 다시</button>')+'</div></div>';
    $("#again").onclick=()=>{if(!rand)T1.mode="rand";startToday();renderToday()};
    const rb=$("#reset");if(rb)rb.onclick=()=>{active().forEach(c=>{if(S.cards[c.id])delete S.cards[c.id].s});save();startToday();renderAll()};
    bindMode(v);return;
  }
  const c=BYID[T1.q[T1.i]];
  const hint=c.en.split(" ").slice(0,3).join(" ")+" …";
  v.innerHTML=bar+'<div class="progress"><i style="width:'+Math.round(T1.done/Math.max(1,T1.total)*100)+'%"></i></div>'+
   '<div class="card"><div class="chips"><span class="chip">'+esc(c.tname)+'</span>'+boxChip(c.id)+wrongChip(c.id)+'<span class="chip">남은 문장 '+leftCount()+'</span></div>'+
   '<p class="cue">'+esc(c.ko)+'</p>'+
   '<p class="hint">'+(T1.shown?"소리 내어 말한 뒤 아래 정답과 비교하세요.":"영어로 소리 내어 먼저 말해 보세요.")+(T1.hint&&!T1.shown?" 힌트: "+esc(hint):"")+'</p>'+
   (T1.shown?'<div class="reveal"><p class="en">'+highlight(c)+'</p>'+
     '<div class="row">'+audioBar()+'</div>'+gramBox(c)+
     '<div class="row"><button class="btn bad" data-g="0">모르겠어요</button><button class="btn good" data-g="2">알았어요</button></div></div>'
    :'<div class="row"><button class="btn ghost" id="hint">힌트</button><button class="btn primary" id="show">정답 보기</button></div>')+
   '</div>';
  if(T1.shown){
    bindAudio(v,c.en);
    v.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      audioStop();
      const known=b.dataset.g==="2";
      grade(c.id,known);
      if(known)T1.done++;
      else T1.q.splice(Math.min(T1.i+4,T1.q.length),0,c.id);   // 모르는 문장은 3장 뒤에 다시, 알 때까지 반복
      T1.i++;T1.shown=false;T1.hint=false;renderToday();
    });
  }else{
    $("#show").onclick=()=>{T1.shown=true;renderToday()};
    $("#hint").onclick=()=>{T1.hint=true;renderToday()};
  }
  bindMode(v);
}

/* ---------- 퀴즈 (빈칸 고르기) ---------- */
const Q={q:[],i:0,score:0,picked:null};
function startQuiz(){
  const pool=active();
  Q.q=shuffle(pool).slice(0,10).map(c=>{
    const others=shuffle(ALL.filter(o=>o.key!==c.key)).slice(0,3).map(o=>o.key);
    return {id:c.id,opts:shuffle([c.key].concat(others))};
  });
  Q.i=0;Q.score=0;Q.picked=null;
}
function renderQuiz(){
  const v=$("#v-quiz");
  if(!Q.q.length)startQuiz();
  if(!Q.q.length){v.innerHTML=emptyUnits();return}
  if(Q.i>=Q.q.length){
    v.innerHTML='<div class="card empty"><h2>'+Q.score+' / '+Q.q.length+'</h2><p class="hint">틀린 문장은 카드 학습에서 다시 외워 보세요.</p><div class="row"><button class="btn primary" id="again">한 번 더</button></div></div>';
    $("#again").onclick=()=>{startQuiz();renderQuiz()};return;
  }
  const item=Q.q[Q.i],c=BYID[item.id];
  const blanked=esc(c.en).replace(esc(c.key),'<span class="blank">'+"_".repeat(4)+'</span>');
  v.innerHTML='<div class="progress"><i style="width:'+Math.round(Q.i/Q.q.length*100)+'%"></i></div>'+
   '<div class="card"><div class="chips"><span class="chip">'+esc(c.tname)+'</span>'+wrongChip(c.id)+'<span class="chip">'+(Q.i+1)+' / '+Q.q.length+'</span></div>'+
   '<p class="en">'+blanked+'</p><p class="hint" style="margin-top:8px">'+esc(c.ko)+'</p>'+
   '<div class="opts">'+item.opts.map((o,k)=>{
      let cls="opt";
      if(Q.picked!==null){if(o===c.key)cls+=" right";else if(k===Q.picked)cls+=" wrong"}
      return '<button class="'+cls+'" data-k="'+k+'"'+(Q.picked!==null?" disabled":"")+'>'+esc(o)+'</button>';
   }).join("")+'</div>'+
   (Q.picked!==null?'<div class="reveal"><p class="en">'+highlight(c)+'</p><div class="row">'+audioBar()+'</div>'+gramBox(c)+'<div class="row"><button class="btn primary" id="next">다음</button></div></div>':'')+
   '</div>';
  if(Q.picked===null){
    v.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k,ok=item.opts[k]===c.key;
      Q.picked=k;if(ok)Q.score++;else addWrong(c.id);
      renderQuiz();
    });
  }else{
    bindAudio(v,c.en);
    $("#next").onclick=()=>{audioStop();Q.i++;Q.picked=null;renderQuiz()};
  }
}

/* ---------- 쓰기 (받아쓰기식 재현) ---------- */
const W={id:null,res:null,text:""};
function pickWrite(){
  const pool=active();
  W.id=pool.length?shuffle(pool)[0].id:null;W.res=null;W.text="";
}
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[…,.;:!?"“”()—–-]/g," ").split(/\s+/).filter(Boolean);
function lcsMark(exp,got){
  const n=exp.length,m=got.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)dp[i][j]=exp[i-1]===got[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const ok=new Array(n).fill(false);let i=n,j=m;
  while(i>0&&j>0){if(exp[i-1]===got[j-1]){ok[i-1]=true;i--;j--}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--}
  return {ok,score:n?dp[n][m]/n:0};
}
function renderWrite(){
  const v=$("#v-write");
  if(!W.id)pickWrite();
  if(!W.id){v.innerHTML=emptyUnits();return}
  const c=BYID[W.id];
  const firsts=c.en.split(" ").map(w=>w[0]+"_".repeat(Math.max(0,w.replace(/[^A-Za-z']/g,"").length-1))).join(" ");
  let res="";
  if(W.res){
    const raw=c.en.split(" "),ex=raw.map(w=>norm(w).join(""));
    const flags=W.res.ok;
    // 단어 단위 표시: norm으로 쪼갠 단어와 원문 단어를 1:1로 맞추기 위해 원문 단어를 다시 norm
    let idx=0;
    const parts=raw.map(w=>{const n=norm(w);const okAll=n.every(()=>flags[idx++]);return '<span class="'+(okAll?"ok":"miss")+'">'+esc(w)+'</span>'});
    res='<div class="reveal"><p class="score">'+Math.round(W.res.score*100)+'점</p><p class="diff">'+parts.join(" ")+'</p><p class="hint" style="margin-top:8px">빨간 표시가 빠졌거나 틀린 단어예요. 85점 미만이면 틀린 횟수에 1회 더해져요.</p>'+
      '<div class="row">'+audioBar()+'</div>'+gramBox(c)+'<div class="row"><button class="btn primary" id="nx">다음 문장</button></div></div>';
  }
  v.innerHTML='<div class="card"><div class="chips"><span class="chip">'+esc(c.tname)+'</span>'+boxChip(c.id)+wrongChip(c.id)+'</div>'+
   '<p class="cue">'+esc(c.ko)+'</p><p class="hint" style="font-family:var(--f-mono)">'+esc(firsts)+'</p>'+
   '<textarea id="wt" aria-label="영어로 쓰기" placeholder="영어 문장을 써 보세요" '+(W.res?"readonly":"")+'>'+esc(W.text)+'</textarea>'+
   (W.res?"":'<div class="row"><button class="btn primary" id="chk">채점</button></div>')+res+'</div>';
  const ta=$("#wt");ta.oninput=()=>{W.text=ta.value};
  if(!W.res){
    $("#chk").onclick=()=>{
      W.text=ta.value;
      const exp=norm(c.en),got=norm(W.text);
      W.res=lcsMark(exp,got);
      if(W.res.score<.85)addWrong(c.id);
      renderWrite();
    };
  }else{
    bindAudio(v,c.en);
    $("#nx").onclick=()=>{audioStop();pickWrite();renderWrite()};
  }
}
/* ---------- 듣기 탭: 문장별 · 단원별 · 전체 듣기 ---------- */
const LP={playing:false,token:0,ids:[],idx:0,count:0,timer:null};
let showKo=true;
const EACHS=[[1,"1회"],[2,"2회"],[3,"3회"],[5,"5회"]];
const GAPS=[[1,"1초"],[2,"2초"],[3,"3초"]];

function lpStatus(){
  if(!LP.playing)return "";
  const n=LP.ids.length;
  return (n>1?(LP.idx+1)+" / "+n+" 문장":"재생 중")+(S.audio.each>1?" · "+(LP.count+1)+" / "+S.audio.each+"회":"")+(S.audio.loop?" · 계속 반복":"");
}
function listRefresh(){
  const cur=LP.playing?LP.ids[LP.idx]:null;
  document.querySelectorAll(".lrow").forEach(r=>r.classList.toggle("playing",r.dataset.id===cur));
  const single=LP.playing&&LP.ids.length===1?LP.ids[0]:null;
  document.querySelectorAll('[data-lp="one"]').forEach(b=>{b.textContent=b.dataset.id===single?"■":"▶"});
  document.querySelectorAll('[data-lp="stop"]').forEach(b=>{b.disabled=!LP.playing});
  document.querySelectorAll('[data-lp="prev"],[data-lp="next"]').forEach(b=>{b.disabled=!(LP.playing&&LP.ids.length>1)});
  const st=$("#lpstat");if(st)st.textContent=lpStatus();
  const el=document.querySelector(".lrow.playing");
  if(el&&el.scrollIntoView){
    try{el.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){}
  }
}
function listStop(){
  LP.token++;clearTimeout(LP.timer);LP.playing=false;LP.count=0;
  try{if(canSpeak())speechSynthesis.cancel()}catch(e){}
  listRefresh();
}
function lpStep(my){
  if(my!==LP.token||!LP.playing)return;
  const c=BYID[LP.ids[LP.idx]];
  listRefresh();
  try{
    const u=new SpeechSynthesisUtterance(c.en);
    u.lang="en-US";u.rate=S.audio.rate;
    u.onend=()=>{
      if(my!==LP.token)return;
      LP.count++;
      if(LP.count<S.audio.each){LP.timer=setTimeout(()=>lpStep(my),S.audio.gap*1000);return}   // 같은 문장 다시
      LP.count=0;
      if(LP.idx+1<LP.ids.length)LP.idx++;
      else if(S.audio.loop)LP.idx=0;
      else{LP.playing=false;listRefresh();return}
      LP.timer=setTimeout(()=>lpStep(my),S.audio.gap*1000);
    };
    u.onerror=()=>{if(my===LP.token){LP.playing=false;listRefresh()}};
    speechSynthesis.speak(u);
  }catch(e){LP.playing=false;listRefresh()}
}
function listPlay(ids,start){
  if(!canSpeak()||!ids.length)return;
  audioStop();listStop();
  LP.ids=ids.slice();LP.idx=start||0;LP.count=0;LP.playing=true;
  lpStep(LP.token);
}
function listJump(d){
  if(!LP.playing||LP.ids.length<2)return;
  listPlay(LP.ids,Math.max(0,Math.min(LP.ids.length-1,LP.idx+d)));
}

     '<label class="aulab">문장 간격 <select id="lp-gap" data-lp="gap" aria-label="문장 간격">'+opt(GAPS,a.gap)+'</select></label>'+
     '<label class="aulab">속도 <select id="lp-rate" data-lp="rate" aria-label="재생 속도">'+opt(RATES,a.rate)+'</select></label>'+
     '<label class="aulab"><input type="checkbox" id="lp-loop" data-lp="loop"'+(a.loop?" checked":"")+'> 끝나면 처음부터 계속</label>'+

   groups.map(t=>'<div class="lgroup"><div class="lhead"><h3>'+esc(t.name)+'</h3><button class="btn ghost" data-lp="unit" data-t="'+t.id+'">▶ 단원 듣기</button></div>'+
     ALL.filter(c=>c.tid===t.id&&act.has(c.id)).map(c=>

  v.querySelectorAll("[data-lp]").forEach(el=>{

    if(k==="all")el.onclick=()=>listPlay(active().map(c=>c.id),0);

    else if(k==="one")el.onclick=()=>{const id=el.dataset.id;if(LP.playing&&LP.ids.length===1&&LP.ids[0]===id)listStop();else listPlay([id],0)};
    else if(k==="stop")el.onclick=listStop;
    else if(k==="prev")el.onclick=()=>listJump(-1);
    else if(k==="next")el.onclick=()=>listJump(1);

    else if(k==="gap")el.onchange=()=>{S.audio.gap=+el.value;save()};
    else if(k==="rate")el.onchange=()=>{S.audio.rate=+el.value;save()};
    else if(k==="loop")el.onchange=()=>{S.audio.loop=el.checked;save();listRefresh()};
    else if(k==="ko")el.onchange=()=>{showKo=el.checked;renderListen()};
  });
  listRefresh();
}
/* ---------- 빈칸 채우기: 문장 앞부분(기본) / 핵심 표현 / 문장 뒷부분 ---------- */
const F={q:[],i:0,score:0,res:null,text:"",hint:false};
const FMODES=[["start","문장 앞부분"],["key","핵심 표현"],["end","문장 뒷부분"]];
const FLEN=[[2,"2단어"],[3,"3단어"],[4,"4단어"],[0,"절반"]];

/* 문장을 [빈칸 앞, 빈칸, 빈칸 뒤]로 나눈다 */
function blankSplit(c){
  const mode=S.fill.mode,w=c.en.split(" "),len=w.length;
  if(mode==="key"){
    const i=c.en.indexOf(c.key);
    return [c.en.slice(0,i).trim(),c.key,c.en.slice(i+c.key.length).trim()];
  }
  const n=S.fill.n===0?Math.ceil(len/2):Math.min(S.fill.n,len-1);   // 최소 한 단어는 남겨 둔다
  if(mode==="end")return [w.slice(0,len-n).join(" "),w.slice(len-n).join(" "),""];
  return ["",w.slice(0,n).join(" "),w.slice(n).join(" ")];
}
function startFill(){F.q=shuffle(active().map(c=>c.id)).slice(0,10);F.i=0;F.score=0;F.res=null;F.text="";F.hint=false}
const firstLetters=s=>s.split(" ").map(w=>w[0]+"_".repeat(Math.max(0,w.replace(/[^A-Za-z']/g,"").length-1))).join(" ");
function fillDiff(blank,ok){
  let idx=0;
  return blank.split(" ").map(w=>{
    const good=norm(w).every(()=>ok[idx++]);
    return '<span class="'+(good?"ok":"miss")+'">'+esc(w)+'</span>';
  }).join(" ");
}
function renderFill(){
  const v=$("#v-fill");
  if(!active().length){v.innerHTML=emptyUnits();return}
  if(!F.q.length)startFill();
  const mode=S.fill.mode;
  const bar='<div class="mode"><div class="filter">'+FMODES.map(m=>'<button data-fm="'+m[0]+'" aria-pressed="'+(m[0]===mode)+'">'+m[1]+'</button>').join("")+'</div>'+
    (mode!=="key"?'<label class="aulab">빈칸 길이 <select id="fl-len" aria-label="빈칸 길이">'+FLEN.map(o=>'<option value="'+o[0]+'"'+(o[0]===S.fill.n?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></label>':'')+'</div>';
  const bindBar=()=>{
    v.querySelectorAll("[data-fm]").forEach(b=>b.onclick=()=>{audioStop();S.fill.mode=b.dataset.fm;save();startFill();renderFill()});
    const sel=v.querySelector("#fl-len");
    if(sel)sel.onchange=()=>{audioStop();S.fill.n=+sel.value;save();startFill();renderFill()};
  };
  if(F.i>=F.q.length){
    v.innerHTML=bar+'<div class="card empty"><h2>'+F.score+' / '+F.q.length+'</h2><p class="hint">틀린 문장은 틀린 문장 탭에서 횟수를 확인할 수 있어요.</p>'+
      '<div class="row"><button class="btn primary" id="fa">한 번 더</button></div></div>';
    $("#fa").onclick=()=>{startFill();renderFill()};
    bindBar();return;
  }
  const c=BYID[F.q[F.i]];
  const parts=blankSplit(c),pre=parts[0],blank=parts[1],post=parts[2];
  const nWords=blank.split(" ").length;
  const width=Math.max(8,blank.length+2);
  v.innerHTML=bar+'<div class="progress"><i style="width:'+Math.round(F.i/F.q.length*100)+'%"></i></div>'+
   '<div class="card"><div class="chips"><span class="chip">'+esc(c.tname)+'</span>'+wrongChip(c.id)+'<span class="chip">'+(F.i+1)+' / '+F.q.length+'</span></div>'+
   '<p class="cue">'+esc(c.ko)+'</p>'+
   '<p class="hint">빈칸 '+nWords+'단어'+(F.hint?' · <span style="font-family:var(--f-mono)">'+esc(firstLetters(blank))+'</span>':'')+'</p>'+
   '<div class="fillline">'+(pre?'<span class="fpart">'+esc(pre)+'</span>':'')+
     '<input id="fb" class="fb" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="빈칸에 들어갈 말" style="width:'+width+'ch" value="'+esc(F.text)+'"'+(F.res?' readonly':'')+'>'+
     (post?'<span class="fpart">'+esc(post)+'</span>':'')+'</div>'+
   (F.res
     ?'<div class="reveal"><p class="score" style="color:var(--'+(F.res.correct?'good':'bad')+')">'+(F.res.correct?'정답':'오답')+'</p>'+
       '<p class="diff">'+(pre?esc(pre)+' ':'')+fillDiff(blank,F.res.ok)+(post?' '+esc(post):'')+'</p>'+
       '<div class="row">'+audioBar()+'</div>'+gramBox(c)+
       '<div class="row"><button class="btn primary" id="fn">다음 문장</button></div></div>'
     :'<div class="row"><button class="btn ghost" id="fh">힌트</button><button class="btn primary" id="fc">확인</button></div>')+
   '</div>';
  const inp=$("#fb");
  if(!F.res){
    inp.oninput=()=>{F.text=inp.value};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("#fc").click()}};
    $("#fh").onclick=()=>{F.text=inp.value;F.hint=true;renderFill()};
    $("#fc").onclick=()=>{
      F.text=inp.value;
      const exp=norm(blank),got=norm(F.text);
      const r=lcsMark(exp,got);
      const correct=r.score===1&&got.length===exp.length;
      F.res={ok:r.ok,correct:correct};
      if(correct)F.score++;else addWrong(c.id);
      renderFill();
    };
    try{inp.focus({preventScroll:true})}catch(e){}
  }else{
    bindAudio(v,c.en);
    $("#fn").onclick=()=>{audioStop();F.i++;F.res=null;F.text="";F.hint=false;renderFill()};
  }
  bindBar();
}
/* ---------- 괄호 채우기: 절 단위 · 괄호 안 한글 뜻을 보고 알맞은 영어 절을 3개 중에서 고르기 (1~3레벨) ---------- */
// 1레벨: 핵심 절 1개 / 2레벨: 절 2개 / 3레벨: 모든 절(최대 4개)
const BR={q:[],i:0,score:0,k:0,picked:[],res:null,rev:false,resumed:false,rand:false};
const BRLV=[[1,"1레벨","핵심 절 1개"],[2,"2레벨","절 2개"],[3,"3레벨","모든 절 (최대 4개)"]];
const wcount=s=>s.trim().split(/\s+/).length;
const BRPOOL=[];
Object.keys(SEG).forEach(id=>SEG[id].forEach(s=>{if(wcount(s[0])>=3)BRPOOL.push({id:id,en:s[0]})}));
function brS(){return S.br||(S.br={lv:1})}
function brW(){const s=brS();return s.w||(s.w={})}            // 괄호에서 틀린 문장: {문장 id: 마지막으로 틀린 날짜}
function brLv(){const v=brS().lv;return v===2||v===3?v:1}
function brDue(){                                              // 날짜가 바뀐 뒤 복습할 문장 (오늘 이전에 틀린 것, 오래된 순)
  const w=brW(),today=dayKey(),set=new Set(active().map(c=>c.id));
  return Object.keys(w).filter(id=>BYID[id]&&set.has(id)&&w[id]<today).sort((a,b)=>w[a]<w[b]?-1:w[a]>w[b]?1:0);
}
/* ----- 저장 · 불러오기: 닫았다 열어도 하던 곳에서 이어서 ----- */
function cleanBr(x){
  const out={lv:1,w:{},run:null};
  try{
    x=x||{};
    if(x.lv===2||x.lv===3)out.lv=x.lv;
    const ok=k=>typeof k==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(k);
    Object.keys(x.w||{}).slice(0,200).forEach(id=>{if(BYID[id]&&ok(x.w[id]))out.w[id]=x.w[id]});
    const r=x.run,int=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;
    if(r&&ok(r.day)&&int(r.lv,1,3)&&Array.isArray(r.q)&&r.q.length>=1&&r.q.length<=14&&int(r.i,0,r.q.length)&&int(r.k,0,4)&&int(r.score,0,10)){
      const q=[];
      for(const it of r.q){
        if(!it||!BYID[it.id]||!Array.isArray(it.bl)||it.bl.length<1||it.bl.length>4)return out;
        const bl=[];
        for(const b of it.bl){
          if(!int(b.i,0,SEG[it.id].length-1)||!Array.isArray(b.opts)||b.opts.length!==3||!b.opts.every(t=>typeof t==="string"&&t.length<200)||!int(b.ans,0,2))return out;
          bl.push({i:b.i,opts:b.opts.slice(),ans:b.ans});
        }
        q.push({id:it.id,bl:bl});
      }
      const picked=Array.isArray(r.picked)?r.picked.filter(v=>int(v,0,2)):[];
      if(r.i<q.length&&r.k<=q[r.i].bl.length&&picked.length===r.k)
        out.run={day:r.day,lv:r.lv,q:q,i:r.i,k:r.k,score:r.score,picked:picked,rev:!!r.rev,res:r.res&&typeof r.res==="object"?{ok:!!r.res.ok}:null};
    }
  }catch(e){}
  return out;
}
function brSave(){
  const s=brS();
  s.run=(BR.q.length&&BR.i<BR.q.length)?{day:dayKey(),lv:brLv(),q:BR.q,i:BR.i,k:BR.k,score:BR.score,picked:BR.picked,rev:BR.rev,res:BR.res}:null;
  save();
}
function brRestore(){                                           // 저장된 판이 있으면 이어서 (새 날이고 복습할 문제가 있으면 복습이 먼저)
  const s=brS(),r=s.run;
  if(!r)return false;
  if(r.day!==dayKey()&&brDue().length)return false;
  const set=new Set(active().map(c=>c.id));
  if(!r.q.every(it=>set.has(it.id)))return false;               // 단원 선택이 바뀌었으면 새로 시작
  s.lv=r.lv;
  BR.q=r.q;BR.i=r.i;BR.k=r.k;BR.score=r.score;BR.picked=r.picked.slice();BR.res=r.res;BR.rev=r.rev;BR.resumed=true;
  return true;
}
function brBlanks(c,lv){                      // 빈칸이 될 절의 번호들 (추임새처럼 짧은 절은 빈칸으로 만들지 않음)
  const segs=SEG[c.id];
  const can=segs.map((s,i)=>wcount(s[0])>=3?i:-1).filter(i=>i>=0);
  if(!can.length)return [];
  const kw=new Set(norm(c.key));
  const hit=i=>norm(segs[i][0]).filter(w=>kw.has(w)).length;
  const core=can.slice().sort((a,b)=>hit(b)-hit(a)||wcount(segs[b][0])-wcount(segs[a][0]))[0];   // 핵심 표현이 들어 있는 절
  let pick=[core];
  const others=can.filter(i=>i!==core).sort((a,b)=>wcount(segs[b][0])-wcount(segs[a][0]));
  if(lv===2)pick=pick.concat(others.slice(0,1));
  if(lv===3)pick=pick.concat(others.slice(0,3));
  return pick.sort((a,b)=>a-b);
}
function brOpts(id,en){                       // 정답 + 비슷한 길이의 다른 문장 절 2개
  const ow=new Set(norm(en)),n=wcount(en);
  const sim=t=>{const w=norm(t);return w.filter(x=>ow.has(x)).length/Math.max(1,Math.min(w.length,ow.size))};
  let pool=BRPOOL.filter(p=>p.id!==id&&p.en.toLowerCase()!==en.toLowerCase()&&sim(p.en)<0.5);
  let near=pool.filter(p=>Math.abs(wcount(p.en)-n)<=2);
  if(near.length<8)near=pool.filter(p=>Math.abs(wcount(p.en)-n)<=4);
  if(near.length<2)near=pool;
  const dis=uniqText(shuffle(near).map(p=>p.en),[en]).slice(0,2);
  const opts=shuffle(dis.concat([en]));
  return {opts:opts,ans:opts.indexOf(en)};
}
function uniqText(list,not){const seen=new Set(not.map(x=>x.toLowerCase())),out=[];list.forEach(x=>{const k=x.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(x)}});return out}

function cleanGame(g){
  const d=gameDefault();g=g||{};
  const num=(x,max)=>{x=Math.floor(Number(x));return x>0&&isFinite(x)?Math.min(x,max||1e9):0};
  const isDay=k=>typeof k==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(k);
  d.xp=num(g.xp);
  Object.keys(g.best||{}).forEach(k=>{if(k==="boss"||TEMPLATES.some(t=>t.id===k)){const v=num(g.best[k],3);if(v)d.best[k]=v}});
  d.streak=num(g.streak,9999);
  d.last=isDay(g.last)?g.last:"";
  const dy=g.day||{};
  if(isDay(dy.k))d.day={k:dy.k,q:num(dy.q),c:num(dy.c),a:dy.a?1:0,b:dy.b?1:0};
  Object.keys(g.badges||{}).forEach(k=>{if(BADGES.some(b=>b.id===k))d.badges[k]=String(g.badges[k]).slice(0,10)});
  Object.keys(d.stat).forEach(k=>{d.stat[k]=num((g.stat||{})[k])});
