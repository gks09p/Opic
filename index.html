<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OPIc 템플릿 암기장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 한 칼럼 학습 앱. 상단 요약 → 고정 탭 → 카드 한 장씩 집중 */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#16212B; --muted:#5B6B78; --line:#D3DAE0;
  --accent:#0B7A6B; --accent-ink:#FFFFFF; --accent-soft:#D9EFEA;
  --mark:#F6D257; --mark-ink:#3A2F00; --bad:#B9400C; --bad-soft:#F8E1D5; --good:#15803D; --good-soft:#DCF1E3;
  --f-display:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#16212A; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3844;
  --accent:#3CC4AE; --accent-ink:#06211C; --accent-soft:#12332E;
  --mark:#E0B020; --mark-ink:#1E1700; --bad:#F08A5D; --bad-soft:#3A2218; --good:#5FD38A; --good-soft:#14301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16212A; --ink:#E6EDF2; --muted:#93A4B1; --line:#2A3844;
  --accent:#3CC4AE; --accent-ink:#06211C; --accent-soft:#12332E;
  --mark:#E0B020; --mark-ink:#1E1700; --bad:#F08A5D; --bad-soft:#3A2218; --good:#5FD38A; --good-soft:#14301F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 88px}
.wrap{max-width:720px;margin-inline:auto}
header.top{padding-block:20px 12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:76px}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.3}
.stat span{font-size:11px;color:var(--muted)}
.nojs{margin-top:16px;padding:12px 14px;border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:12px;font-size:14px}
.sync{font-size:11px;color:var(--muted);margin:0 0 4px}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:8px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{flex:1 0 auto;font:inherit;font-weight:500;color:var(--muted);background:transparent;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px}
[hidden]{display:none!important}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.chip.wr.on{color:var(--bad);border-color:var(--bad)}
.chip.box{font-family:var(--f-mono);color:var(--accent);border-color:var(--accent)}
.cue{word-break:keep-all;font-size:19px;font-weight:500;line-height:1.55;margin:0 0 6px;text-wrap:balance}
.hint{font-size:13px;color:var(--muted);margin:0}
.en{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.4;margin:0}
.en mark,.blank{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 4px}
.blank{display:inline-block;min-width:5ch;text-align:center;font-family:var(--f-mono);font-size:.8em;letter-spacing:.1em}
.reveal{border-top:1px dashed var(--line);margin-top:18px;padding-top:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.btn{font:inherit;font-weight:500;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;cursor:pointer;flex:1 1 auto;min-width:0}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.good{color:var(--good);border-color:var(--good)}
.btn.ghost{flex:0 0 auto;font-size:13px;padding:6px 12px}
.btn:disabled{opacity:.5;cursor:default}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
.empty{text-align:center;padding:36px 12px}
.empty h2{font-family:var(--f-display);margin:0 0 6px;font-size:22px}

.opts{display:grid;gap:8px;margin-top:16px}
.opt{font:inherit;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
textarea{width:100%;min-height:96px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;resize:vertical;margin-top:14px}
.diff{font-size:17px;line-height:1.9;margin:0}
.diff .ok{color:var(--good)}
.diff .miss{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 4px;font-weight:700}
.score{font-family:var(--f-mono);font-size:20px;margin:0 0 8px}

.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter button{font:inherit;font-size:13px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.filter button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}


.gram{margin-top:18px;border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.gl{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin:0}
.gi{background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.gt{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0}
.gr{margin:0;font-size:14px}
.ge{margin:0;font-family:var(--f-display);font-size:14px;color:var(--muted)}
details.units{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px;margin-bottom:16px}
details.units summary{cursor:pointer;padding:12px 0;font-weight:700;display:flex;gap:10px;align-items:baseline;list-style:none}
details.units summary::after{content:"▾";color:var(--muted)}
details.units[open] summary::after{content:"▴"}
.ucount{font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--accent);margin-left:auto}
.ubody{padding-bottom:6px}
.filter .mono{font-family:var(--f-mono);font-size:11px;opacity:.7}
.mode{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
.mode .filter{margin:0}
.lbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--bg);padding-block:8px;margin-bottom:8px}
.lbar .row{margin-top:0;gap:6px}
.lbar .btn{padding:8px 10px;font-size:14px}
.lset{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.lset input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px}
.lgroup{margin-bottom:18px}
.lhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.lhead h3{font-family:var(--f-display);font-size:17px;margin:0}
.lrow{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.lrow.playing{background:var(--accent-soft);border-color:var(--accent)}
.lplay{width:44px;flex:0 0 44px;text-align:center;padding:8px 0}
.ltxt{min-width:0;flex:1}
.len{font-family:var(--f-display);font-size:18px;line-height:1.4;margin:0;overflow-wrap:anywhere}
.lko{font-size:13px;color:var(--muted);margin:2px 0 0}
.fillline{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline;margin-top:14px}
.fpart{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.fb{font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--ink);background:var(--bg);border:2px solid var(--mark);border-radius:8px;padding:2px 10px;min-width:8ch;max-width:100%}
.fb[readonly]{border-color:var(--line)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.askpanel{position:fixed;left:0;right:0;bottom:0;z-index:30;margin-inline:auto;max-width:720px;height:min(82vh,720px);height:min(82dvh,720px);max-height:90dvh;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 34px rgba(0,0,0,.25)}
@media (min-width:760px){.askpanel:not(.free){left:auto;right:16px;margin:0;width:432px;max-width:432px}}
.askedge{position:absolute;z-index:2;touch-action:none}
.ed-n{left:14px;right:14px;top:-4px;height:10px;cursor:ns-resize}
.ed-s{left:14px;right:26px;bottom:-4px;height:10px;cursor:ns-resize}
.ed-e{top:14px;bottom:26px;right:-4px;width:10px;cursor:ew-resize}
.ed-w{top:14px;bottom:14px;left:-4px;width:10px;cursor:ew-resize}
.ed-ne{top:-4px;right:-4px;width:18px;height:18px;cursor:nesw-resize}
.ed-nw{top:-4px;left:-4px;width:18px;height:18px;cursor:nwse-resize}
.ed-sw{bottom:-4px;left:-4px;width:18px;height:18px;cursor:nesw-resize}
.askhead{display:flex;align-items:center;gap:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.askmv{font-family:var(--f-body);font-size:11px;font-weight:400;color:var(--muted);margin-left:6px}
.askpanel.free{right:auto;bottom:auto;margin:0;max-width:none;max-height:none;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.askpanel.moving{opacity:.92}
.askpanel.moving .askhead{cursor:grabbing}
.askgrip{position:absolute;right:2px;bottom:2px;width:22px;height:22px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,var(--muted) 50%,var(--muted) 56%,transparent 56%,transparent 70%,var(--muted) 70%,var(--muted) 76%,transparent 76%);border-bottom-right-radius:16px;opacity:.7}
.askhead h2{font-family:var(--f-display);font-size:18px;margin:0;margin-right:auto}
.askctx{align-items:flex-start}
.askctx input,.askpanel input[type="checkbox"]{accent-color:var(--accent);width:16px;height:16px;margin-top:2px;flex:0 0 auto}
.askchips{display:flex;gap:6px;flex-wrap:wrap}
.askout{flex:1 1 auto;min-height:72px;overflow-y:auto;background:var(--bg);border-radius:10px;padding:12px 14px}
.aq{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 4px;overflow-wrap:anywhere}
.aq:not(:first-child){margin-top:14px}
.aa{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.7}
.think{color:var(--muted)}
.aerr{margin:6px 0 0;color:var(--bad);font-size:13px;white-space:normal}
.askform{display:flex;gap:8px}
.askq{flex:1 1 auto;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.askform .btn{flex:0 0 auto}
.lstats{margin-bottom:14px}
.drow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.drow.today{border-color:var(--accent);background:var(--accent-soft)}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dd{font-weight:700}
.dt{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.dbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 6px}
.dbar i{display:block;height:100%;background:var(--accent)}
.ditems{margin:2px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ditems b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.dunits{display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.dunits .dact{text-align:right;margin-top:4px}
.dkill{font:inherit;font-size:12px;color:var(--muted);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline}
.dkill.armed{color:var(--bad);font-weight:700}
.lgform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.lgform .aulab{flex-direction:column;align-items:stretch;gap:4px}
.lgform input,.lgform select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.lgform .btn{align-self:end}
.dk{margin-top:2px}
.utags{display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.utag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px;background:var(--surface)}
.utag b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.dk{display:inline-block;min-width:2.4em;font-size:11px;font-weight:700;color:var(--accent)}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
table{border-collapse:collapse;width:100%;min-width:420px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
tr.today td{background:var(--accent-soft)}
td.mono{font-family:var(--f-mono);font-size:13px}
h2.sec{font-family:var(--f-display);font-size:19px;margin:22px 0 8px}
.note{color:var(--muted);font-size:13px}
.audio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%}
.aulab{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.aucount{font-family:var(--f-mono);font-size:12px;color:var(--accent);min-width:7ch}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
/* 게임 */
:root{--gold:#C98A00;--heart:#D6336C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#F2C230;--heart:#FF7A9C}}
:root[data-theme="dark"]{--gold:#F2C230;--heart:#FF7A9C}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.gplayer{display:flex;gap:14px;align-items:center}
.gmascot{font-size:40px;line-height:1;width:68px;height:68px;flex:0 0 68px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;animation:gfloat 3s ease-in-out infinite}
.ginfo{flex:1;min-width:0}
.gtitle{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 6px;line-height:1.25}
.gxp{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.gxp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .5s}
.gstreak{text-align:center;flex:0 0 auto}
.gstreak b{font-family:var(--f-mono);font-weight:500;font-size:20px;display:block;line-height:1.3}
.gh{font-family:var(--f-display);font-size:17px;margin:0 0 10px}
.gqst{margin-bottom:10px}
.gqst:last-child{margin-bottom:0}
.gqt{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:4px}
.gqt b{font-family:var(--f-mono);font-weight:500}
.gqst.done .gqt{color:var(--good)}
.gqst .progress{margin:0}
.gboss{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--accent-ink);background:var(--accent);border:0;border-bottom:4px solid rgba(0,0,0,.25);border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:10px}
.gboss:active{transform:translateY(2px);border-bottom-width:2px}
.gboss .gbi{font-size:30px;line-height:1}
.gboss .st small{display:block;opacity:.85;font-size:12px}
.gboss .st b{font-family:var(--f-display);font-size:18px}
.gboss .gstars i.on{color:#FFE27A}
.gboss .gstars i{color:rgba(255,255,255,.35)}
.st{flex:1;min-width:0}
.gnote{margin:0 0 6px}
.gsec{margin:18px 0 8px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.stage{display:flex;gap:10px;align-items:center;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:56px}
.stage:hover{border-color:var(--accent)}
.stage:active{transform:translateY(1px)}
.stage.hot{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.gtag{font-size:11px;font-weight:500;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 7px;margin-left:4px;vertical-align:1px}
.stage.done{background:var(--accent-soft);border-color:var(--accent)}
.stage .sn{flex:0 0 30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px}
.stage small{display:block;color:var(--muted);font-size:12px}
.gstars{letter-spacing:1px;white-space:nowrap;font-size:16px}
.gstars i{font-style:normal;color:var(--line)}
.gstars i.on{color:var(--gold)}
.gbadges{margin-top:18px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:1px;opacity:.55}
.badge.got{opacity:1;background:var(--accent-soft);border-color:var(--accent)}
.badge .bi{font-size:22px}
.badge b{font-size:13px}
.badge small{font-size:11px;color:var(--muted)}
.gset{display:flex;gap:6px 18px;flex-wrap:wrap}
.gset input{accent-color:var(--accent);width:16px;height:16px}
.ghud{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ghearts{font-size:24px;letter-spacing:2px;color:var(--heart);line-height:1}
.ghearts i{font-style:normal}
.ghearts i.lost{color:var(--line)}
.gcombo{font-family:var(--f-mono);font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 10px;animation:gpop .3s}
.gxpv{margin-left:auto;font-family:var(--f-mono);font-size:14px;color:var(--gold)}
.gtype{color:var(--accent);border-color:var(--accent)}
.gsline{font-family:var(--f-display);font-size:22px;font-weight:500;line-height:1.5;margin:10px 0 0;overflow-wrap:anywhere}

 ["I went there because I needed something warm for winter.","겨울에 입을 따뜻한 게 필요해서 거기에 갔어요.","I went there because"],
 ["I ended up buying a gray one, and, you know, I tried on a few sizes first.","결국 회색 재킷을 사게 됐고, 있잖아요, 먼저 사이즈를 몇 개 입어 봤어요.","I ended up buying"],
 ["Overall, the experience was great, and honestly, it was totally worth it.","전반적으로 그 경험은 훌륭했고, 솔직히 완전히 그럴 만한 가치가 있었어요.","it was totally worth it"]
]}
];
TEMPLATES.push(
{ id:"u1", name:"루틴 A", group:"루틴", cards:[
 ["Something I do pretty often is going for a walk, and um, it's honestly become part of my lifestyle.","제가 꽤 자주 하는 일은 산책을 하는 건데, 음, 솔직히 그게 제 생활방식의 일부가 됐어요.","it's honestly become part of my lifestyle"],
 ["The whole thing's pretty relaxing, and what I notice most is just how quiet it is.","그 모든 게 꽤 편안하고, 제가 가장 많이 느끼는 건 정말 조용하다는 점이에요.","what I notice most is"],
 ["Whenever I walk, I feel more connected and get to kinda clear my head.","걸을 때마다 더 연결된 느낌이 들고, 머리를 좀 비울 수 있게 돼요.","get to kinda clear my head"],
 ["So yeah, I guess it's more than just a habit; it's like a small but meaningful part of life here.","그래서요, 그건 단순한 습관 이상인 것 같아요. 여기서의 삶의 작지만 의미 있는 한 부분 같아요.","more than just a habit"]
]},
{ id:"u2", name:"루틴 B", group:"루틴", cards:[
 ["Something I do pretty regularly is going for a walk, and it's actually become a part of my lifestyle.","제가 꽤 규칙적으로 하는 일은 산책을 하는 건데, 사실 그게 제 생활방식의 일부가 됐어요.","Something I do pretty regularly is"],
 ["It may sound simple, but it really shows something about daily life here.","단순하게 들릴 수도 있지만, 그건 여기 일상에 대해 뭔가를 정말 보여 줘요.","It may sound simple, but"],
 ["It's usually quiet, and what stands out is how peaceful the streets are.","보통 조용하고, 눈에 띄는 건 거리가 얼마나 평화로운지예요.","what stands out is"],
 ["Whenever I walk, I feel like I can clear my head.","걸을 때마다 머리를 비울 수 있을 것 같은 기분이 들어요.","I feel like I can"],
 ["One time, I walked in the rain, and I still remember that.","한번은 비 오는 날 걸었는데, 저는 아직도 그걸 기억해요.","I still remember that"],
 ["So yeah, walking is just a small thing, but it really matters to me.","그래서요, 산책은 작은 일일 뿐이지만 저에게는 정말 중요해요.","it really matters to me"]
]},
{ id:"u3", name:"루틴 C (간단)", group:"루틴", cards:[
 ["It's nothing fancy… usually, I grab my usual drink, and it helps me clear my head.","대단한 건 아니에요… 보통 저는 늘 마시던 음료를 집어 드는데, 그게 머리를 맑게 해 줘요.","it helps me clear my head"],
 ["I don't even think about it that much anymore… it's just one of those little habits that keep my life steady.","이제는 그것에 대해 그렇게 많이 생각하지도 않아요… 제 생활을 안정적으로 유지해 주는 작은 습관들 중 하나일 뿐이에요.","it's just one of those little habits"]
]},
{ id:"s1", name:"루틴 안전·책임", group:"루틴", cards:[
 ["One part of my daily life is recycling. It's something I've gotten used to, and I've realized it matters more than people think.","제 일상의 한 부분은 재활용이에요. 그건 제가 익숙해진 일이고, 사람들이 생각하는 것보다 더 중요하다는 걸 깨달았어요.","It's something I've gotten used to"],
 ["Whenever I sort trash, I try to do it right. It helps me stay responsible.","쓰레기를 분류할 때마다 저는 제대로 하려고 노력해요. 그게 제가 책임감을 유지하는 데 도움이 돼요.","I try to do it right"],
 ["I remember once, I did it wrong and had to fix it. That stuck with me.","한번은 제가 잘못해서 고쳐야 했던 게 기억나요. 그 일이 저에게 오래 남았어요.","had to fix it"],
 ["In the end, this habit might seem small, but it shows how people take care of things in daily life here.","결국, 이 습관은 작아 보일 수 있지만, 이곳 사람들이 일상에서 어떻게 물건을 챙기고 관리하는지 보여 줘요.","it shows how people take care of things"]
]},
{ id:"c1", name:"비교하기 A", group:"비교", cards:[
 ["So, from the get-go, the biggest difference is the size, you know?","그러니까, 처음부터 가장 큰 차이는 크기예요, 아시죠?","from the get-go, the biggest difference is"],
 ["It's way more convenient than before, and honestly, I kinda like it that way because it saves time.","예전보다 훨씬 더 편리하고, 솔직히 시간을 절약해 주기 때문에 저는 그게 그런 식인 게 좀 좋아요.","way more convenient than before"],
 ["Back in the day, it was small and crowded, but now, it's totally different… it's big and modern.","예전에는 작고 붐볐지만, 지금은 완전히 달라요… 크고 현대적이에요.","Back in the day"],
 ["And yeah, I've tried both, and to be real, I prefer the new one.","그리고 네, 저는 둘 다 써 봤고, 솔직히 말해서 새것이 더 좋아요.","I've tried both"],
 ["I still remember one time when I got lost there, and that just shows how different things were back then.","저는 거기서 길을 잃었던 적이 한 번 있었던 게 아직도 기억나는데, 그게 그때 상황이 얼마나 달랐는지를 보여 줘요.","I still remember one time when"],
 ["So yeah, even though both have their own charm, I usually go with the new one… it just feels more me, you know?","그러니까요, 둘 다 나름의 매력이 있긴 하지만, 저는 보통 새것을 골라요… 그냥 더 저다운 느낌이에요, 아시죠?","even though both have their own charm"]
]},
{ id:"c2", name:"비교하기 B", group:"비교", cards:[
 ["To start with, what really stands out is the size.","우선, 정말 눈에 띄는 건 크기예요.","what really stands out is"],
 ["These days, it feels a lot more comfortable, and honestly, that works better for me because it's quiet.","요즘은 훨씬 더 편하게 느껴지고, 솔직히 조용하기 때문에 저한테 더 잘 맞아요.","These days"],
 ["I've been through both, and personally, I find the new one way more enjoyable.","저는 둘 다 겪어 봤고, 개인적으로 새것이 훨씬 더 즐겁다고 생각해요.","I've been through both"],
 ["All in all, both versions have something special, but if I had to choose, I'd stick with the new one.","대체로 두 버전 모두 특별한 점이 있지만, 고르라면 새것을 계속 쓸 거예요.","if I had to choose, I'd stick with"]
]},
{ id:"a1", name:"어드밴스 묘사", group:"어드밴스", cards:[
 ["I'd like to tell you about recycling in Korea.","한국의 재활용에 대해 말씀드리고 싶어요.","in Korea"],
 ["It's something we're actually pretty proud of because it's well-organized.","그건 체계가 잘 잡혀 있기 때문에 우리가 사실 꽤 자랑스러워하는 거예요.","we're actually pretty proud of because"],
 ["You'll notice how seriously people follow the system, and most people see this as part of our culture.","사람들이 그 제도를 얼마나 진지하게 따르는지 알게 되실 거고, 대부분의 사람들은 이걸 우리 문화의 일부로 봐요.","most people see this as"],
 ["Personally, I think it really shows what we value as a society.","개인적으로, 그건 우리가 사회로서 무엇을 가치 있게 여기는지를 정말 보여 준다고 생각해요.","what we value as a society"],
 ["So yeah, recycling isn't just a system here… it's something we take pride in.","그래서요, 여기서 재활용은 단순한 제도가 아니에요… 우리가 자부심을 느끼는 것이에요.","isn't just a system"]
]},
{ id:"a2", name:"어드밴스 돌발 과거", group:"어드밴스", cards:[
 ["Okay, so one problem I had while recycling happened a few weeks ago.","좋아요, 제가 재활용하면서 겪었던 문제 하나는 몇 주 전에 일어났어요.","one problem I had while"],
 ["I think I was just tired or something, I mixed up the bins and it was a mess.","제가 그냥 피곤했거나 그랬던 것 같은데, 분리수거함을 헷갈려서 엉망이 됐어요.","I think I was just tired or something"],
 ["I still don't know why I made such a stupid mistake, but I had to spend my entire evening sorting everything again.","제가 왜 그런 어리석은 실수를 했는지 아직도 모르겠지만, 저녁 시간 전부를 써서 모든 걸 다시 분류해야 했어요.","I had to spend my entire evening"]
]}
);

TEMPLATES.push(
{"id": "t1", "name": "거주지 (Home)", "group": "주제 연습", "qs": [["You indicated that you live in an apartment. Please describe your house to me. What does it look like? How many rooms does it have? Tell me in detail.", "아파트에 살고 계신다고 하셨네요. 집에 대해 말씀해 주세요. 집이 어떻게 생겼나요? 방은 몇 개나 있나요? 자세히 설명해 주세요."], ["I'd like to know about the place where you live. Do you live in an apartment or a house? What does it look like? What can you see through your windows? Describe your home in as much detail as possible.", "당신이 사는 곳에 대해 알고 싶어요. 아파트에 사시나요, 아니면 주택에 사시나요? 집이 어떻게 생겼는지, 창문 밖으로는 무엇이 보이는지 말씀해 주세요. 가능한 한 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about the place where I live.", "제가 살고 있는 곳에 대해 이야기해 드리고 싶어요.", "the place where I live"], ["It is located in a quiet neighborhood in Incheon, and it has a very cozy and peaceful atmosphere.", "그곳은 인천의 조용한 동네에 있고, 아주 아늑하고 평화로운 분위기를 가지고 있어요.", "a quiet neighborhood in Incheon"], ["When you come in, the first thing you notice is the open living room connected to the kitchen.", "들어서면 가장 먼저 눈에 들어오는 건 주방과 연결된 탁 트인 거실이에요.", "the open living room connected to the kitchen"], ["It has three rooms… a bedroom, a living room, and a small study, and the overall vibe is modern and clean.", "방이 세 개 있는데… 침실, 거실, 그리고 작은 서재가 있고, 전체적인 분위기는 모던하고 깔끔해요.", "a bedroom, a living room, and a small study"], ["Through the windows, I can see trees and a small park.", "창문으로는 나무들과 작은 공원이 보여요.", "trees and a small park"], ["One thing I like about my home is how warm and bright it feels because of the sunlight.", "제 집에서 제가 좋아하는 한 가지는 햇빛 덕분에 집이 얼마나 따뜻하고 밝게 느껴지는가예요.", "how warm and bright it feels"], ["It also has a small balcony and a quiet environment, which makes it even better.", "작은 발코니와 조용한 환경도 있어서, 그게 집을 더 좋게 만들어 줘요.", "a small balcony and a quiet environment"], ["Every time I stay home, I feel really calm and comfortable.", "집에 있을 때마다 저는 정말 차분하고 편안해져요.", "calm and comfortable"], ["That's why I love my apartment.", "그래서 저는 우리 아파트를 정말 좋아해요.", "I love my apartment"]]},
{"id": "t2", "name": "거주지 어드밴스 (Home)", "group": "주제 연습", "qs": [["What housing issues are there in your country? Explain the problem and further explore why people were interested in discussing it.", "당신의 나라에는 어떤 주택 문제가 있나요? 그 문제를 설명하고, 사람들이 왜 그것을 논의하는 데 관심을 가졌는지 더 자세히 살펴봐 주세요."]], "cards": [["I'd like to tell you about housing issues in Korea.", "한국의 주택 문제에 대해 이야기해 드리고 싶어요.", "housing issues"], ["It's something we're actually pretty concerned about because housing prices and rent can be really high, especially in big cities like Seoul.", "그건 우리가 사실 꽤 걱정하는 문제인데, 집값과 월세가 정말 비쌀 수 있기 때문이고, 특히 서울 같은 대도시에서 그래요.", "housing prices and rent can be really high"], ["You'll notice how competitive the whole system feels, and how many people talk about things like rent deposits and monthly payments, and most people see this as something worth protecting, because housing feels tied to stability and your future.", "전체 제도가 얼마나 경쟁적으로 느껴지는지, 얼마나 많은 사람들이 보증금과 월세 같은 이야기를 하는지 알게 되실 거고, 대부분의 사람들은 이걸 지킬 가치가 있는 것으로 보는데, 집이 안정과 미래에 묶여 있다고 느껴지기 때문이에요.", "something worth protecting"], ["Personally, I think it really shows what we value as a society… security, fairness, and having a stable life.", "개인적으로 그건 우리가 사회로서 가치 있게 여기는 것을 정말 보여 준다고 생각해요… 안전, 공정함, 그리고 안정된 삶이요.", "security, fairness, and having a stable life"], ["So yeah, housing isn't just a personal issue here… it's something a lot of people care about and seriously discuss.", "그러니까요, 여기서 주거는 단순한 개인 문제가 아니라… 많은 사람들이 신경 쓰고 진지하게 논의하는 문제예요.", "isn't just a personal issue"]]},
{"id": "t3", "name": "동네 (Neighborhood)", "group": "주제 연습", "qs": [["Let's talk about where you live. What does your neighborhood look like? Where is it located? What kinds of amenities are there in your neighborhood? Tell me about a place around your house.", "당신이 사는 곳에 대해 이야기해 봅시다. 당신의 동네는 어떤가요? 어디에 위치해 있나요? 동네에는 어떤 편의시설이 있나요? 집 주변의 장소에 대해 말씀해 주세요."]], "cards": [["I'd like to tell you about my neighborhood.", "우리 동네에 대해 이야기해 드리고 싶어요.", "my neighborhood"], ["It is located in the southern part of Seoul, and it has a very safe and family-friendly atmosphere.", "그곳은 서울 남쪽에 있고, 아주 안전하고 가족 친화적인 분위기를 가지고 있어요.", "the southern part of Seoul"], ["When you walk around, the first thing you notice is the wide sidewalks and many trees along the road.", "걸어 다녀 보면 가장 먼저 눈에 들어오는 건 넓은 인도와 길을 따라 늘어선 많은 나무예요.", "the wide sidewalks and many trees along the road"], ["It has a park, a library, a few cafes, and some convenience stores, and the overall vibe is relaxed and pleasant.", "공원, 도서관, 카페 몇 군데, 그리고 편의점 몇 곳이 있고, 전체적인 분위기는 여유롭고 쾌적해요.", "a park, a library, a few cafes, and some convenience stores"], ["There are also playgrounds and a small community center nearby.", "근처에 놀이터와 작은 주민센터도 있어요.", "playgrounds and a small community center"], ["People usually walk their dogs or exercise here, and I also go out for a walk almost every day.", "사람들은 보통 여기서 강아지를 산책시키거나 운동하고, 저도 거의 매일 산책하러 나가요.", "walk their dogs or exercise"], ["Every time I spend time in my neighborhood, I feel really refreshed.", "우리 동네에서 시간을 보낼 때마다 저는 정말 상쾌해져요.", "spend time in my neighborhood"], ["That's why I really like living here.", "그래서 저는 여기 사는 게 정말 좋아요.", "I really like living here"]]},
{"id": "t4", "name": "가족·이웃 (Family & Neighbors)", "group": "주제 연습", "qs": [["Describe one of your family members or friends. What is he or she like? How often do you meet him or her?", "가족이나 친구 중 한 명을 묘사해 주세요. 그 사람은 어떤 사람인가요? 얼마나 자주 만나나요?"], ["Can you tell me about your neighbors? Who are they, and what are they like? Are you close to your neighbors? What do you typically do when you meet them?", "당신의 이웃에 대해 말해 주실래요? 그들은 누구이고 어떤 사람들인가요? 이웃들과 친한가요? 이웃을 만나면 보통 무엇을 하나요?"]], "cards": [["I'd like to tell you about my neighbor… my older sister.", "제 이웃이자… 언니에 대해 이야기해 드리고 싶어요.", "my older sister"], ["She's really thoughtful and dependable, and what stands out the most is how she always checks in on me, even when she's busy.", "언니는 정말 사려 깊고 믿음직한 사람이고, 가장 눈에 띄는 점은 바쁠 때조차 언니가 늘 저를 챙겨 준다는 거예요.", "thoughtful and dependable"], ["Whenever I bump into her in the hallway or chat with her, I feel relieved and supported.", "복도에서 언니를 우연히 마주치거나 이야기를 나눌 때마다 저는 마음이 놓이고 힘이 돼요.", "bump into her in the hallway"], ["One time, I was sick, and she brought me homemade soup without me even asking.", "한번은 제가 아팠는데, 제가 부탁하지도 않았는데 언니가 집에서 만든 수프를 가져다줬어요.", "homemade soup"], ["That made me appreciate her even more.", "그 일로 저는 언니가 더 고맙게 느껴졌어요.", "appreciate her even more"], ["So yeah, she's not just my family… she's the best neighbor I could ask for.", "그러니까요, 언니는 단순한 가족이 아니라… 제가 바랄 수 있는 최고의 이웃이에요.", "the best neighbor I could ask for"]]},
{"id": "t5", "name": "음악 가수 (Music)", "group": "주제 연습", "qs": [["You indicated in the survey that you like listening to music. What types of music do you like? Who is your favorite singer or composer? Why do you like him or her?", "설문에서 음악 듣는 것을 좋아한다고 하셨네요. 어떤 종류의 음악을 좋아하시나요? 좋아하는 가수나 작곡가는 누구인가요? 왜 그 사람을 좋아하시나요?"]], "cards": [["I'd like to tell you about one of my favorite singers, Brown Eyed Soul.", "제가 가장 좋아하는 가수 중 한 팀인 브라운 아이드 소울에 대해 이야기해 드리고 싶어요.", "Brown Eyed Soul"], ["They're really emotional and soulful, and what stands out the most is how their harmonies create such a rich, warm sound that touches your heart.", "그들은 정말 감성적이고 소울풀하고, 가장 눈에 띄는 점은 그들의 하모니가 마음을 울리는 풍부하고 따뜻한 소리를 만들어 낸다는 거예요.", "emotional and soulful"], ["Whenever I listen to their songs, especially late at night, I feel calm and deeply moved.", "그들의 노래를 들을 때마다, 특히 늦은 밤에는, 저는 차분해지고 깊은 감동을 받아요.", "especially late at night"], ["One time, I was feeling really overwhelmed, and their song “Love Ballad” helped me feel at peace, which made me appreciate Brown Eyed Soul even more.", "한번은 제가 정말 벅차고 지쳐 있었는데, 그들의 노래 “Love Ballad”가 마음을 편안하게 해 줬고, 그 덕분에 브라운 아이드 소울이 더 고맙게 느껴졌어요.", "helped me feel at peace"], ["So yeah, they really mean a lot to me.", "그러니까요, 그들은 저에게 정말 큰 의미가 있어요.", "mean a lot to me"]]},
{"id": "t6", "name": "음악 기기 (Music)", "group": "주제 연습", "qs": [["You indicated in the survey that you like listening to music. What kind of device do you use when you listen to music? Which gadget do you usually use? Please explain the devices in detail.", "설문에서 음악 듣는 것을 좋아한다고 하셨네요. 음악을 들을 때 어떤 기기를 사용하시나요? 보통 어떤 장치를 쓰시나요? 그 기기들을 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about my wireless earbuds and my phone.", "제 무선 이어버드와 휴대폰에 대해 이야기해 드리고 싶어요.", "my wireless earbuds and my phone"], ["They're really convenient and comfortable, and what stands out the most is the active noise canceling and clear sound… even at low volume… plus a long battery life with the charging case.", "정말 편리하고 편해서, 가장 눈에 띄는 점은 액티브 노이즈 캔슬링과 낮은 볼륨에서도 선명한 소리… 거기에 충전 케이스까지 있어서 배터리가 오래 간다는 거예요.", "the active noise canceling and clear sound"], ["Whenever I stream music on my phone (using Spotify/YouTube Music) and connect via Bluetooth, I feel focused and relaxed.", "휴대폰으로 (스포티파이나 유튜브 뮤직으로) 음악을 스트리밍하고 블루투스로 연결할 때마다, 저는 집중되고 편안해져요.", "connect via Bluetooth"], ["One time, I was working in a noisy café, but the earbuds blocked most of the background noise, and the earbuds fit snugly for hours, and that made me appreciate this setup even more.", "한번은 시끄러운 카페에서 일하고 있었는데, 이어버드가 주변 소음 대부분을 막아 줬고 몇 시간 동안 딱 맞게 착용돼서, 이 구성이 더 고맙게 느껴졌어요.", "blocked most of the background noise"], ["So yeah, this combo (earbuds + phone) means a lot to me.", "그러니까요, 이 조합(이어버드 + 휴대폰)은 저에게 큰 의미가 있어요.", "this combo (earbuds + phone)"]]},
{"id": "t7", "name": "영화·TV (Marvel)", "group": "주제 연습", "qs": [["You indicated in the survey that you like to watch movies. What kinds of movies do you like? What is your favorite genre of movies? Why do you like that type of movie? Tell me about it in detail.", "설문에서 영화 보는 것을 좋아한다고 하셨습니다. 어떤 종류의 영화를 좋아하시나요? 가장 좋아하는 영화 장르는 무엇인가요? 왜 그 장르를 좋아하시나요? 자세히 말씀해 주세요."], ["In your background survey, you indicated that you like to see movies. What is your favorite genre of movie? Can you also tell me about your favorite actor or actress?", "배경 설문에서 영화를 좋아한다고 하셨는데요. 가장 좋아하는 영화 장르는 무엇인가요? 좋아하는 배우도 말씀해 주실 수 있나요?"], ["You indicated that you enjoy watching TV shows. What is your favorite TV show? What is it about? Why do you like it? Please tell me in as much detail as possible.", "TV 프로그램 보는 것을 즐긴다고 하셨습니다. 가장 좋아하는 TV 프로그램은 무엇인가요? 어떤 내용인가요? 왜 좋아하시나요? 가능한 한 자세히 말씀해 주세요."]], "cards": [["I'd like to tell you about the Marvel series.", "마블 시리즈에 대해 이야기해 드리고 싶어요.", "the Marvel series"], ["It's really exciting and well-made, and what stands out the most is how all the characters and stories are connected across movies and shows.", "정말 흥미진진하고 완성도가 높고, 가장 눈에 띄는 점은 모든 인물과 이야기가 영화와 드라마 전반에 걸쳐 연결되어 있다는 거예요.", "exciting and well-made"], ["Whenever I watch something from Marvel, I feel pulled into the story and totally entertained.", "마블 작품을 볼 때마다 저는 이야기에 빨려 들어가고 완전히 즐거워져요.", "pulled into the story"], ["One time, I watched Avengers: Infinity War in a packed theater, and everyone gasped at the ending, which made me appreciate it even more.", "한번은 사람들이 꽉 찬 극장에서 어벤져스: 인피니티 워를 봤는데, 엔딩에서 모두가 헉 하고 숨을 들이켰고, 그 일로 마블이 더 고맙게 느껴졌어요.", "everyone gasped at the ending"], ["So yeah, Marvel has been a big part of my free time, and I never get tired of it.", "그러니까요, 마블은 제 여가 시간의 큰 부분이었고, 아무리 봐도 질리지 않아요.", "a big part of my free time"]]},
{"id": "t8", "name": "리얼리티 쇼 (Reality Shows)", "group": "주제 연습", "qs": [["You indicated that you enjoy watching reality TV shows. What is your favorite reality TV show? What is it about? Why do you like it? Please tell me in as much detail as possible.", "리얼리티 쇼 보는 것을 즐긴다고 하셨습니다. 가장 좋아하는 리얼리티 쇼는 무엇인가요? 어떤 내용인가요? 왜 좋아하시나요? 가능한 한 자세히 말씀해 주세요."]], "cards": [["I'd like to tell you about my favorite reality show… Street Woman Fighter.", "제가 가장 좋아하는 리얼리티 쇼… 스트릿 우먼 파이터에 대해 이야기해 드리고 싶어요.", "Street Woman Fighter"], ["It's really energetic and inspiring, and what stands out the most is the passion the dancers show in every performance.", "정말 에너지가 넘치고 영감을 주고, 가장 눈에 띄는 점은 댄서들이 모든 무대에서 보여 주는 열정이에요.", "energetic and inspiring"], ["Whenever I watch it, I feel amazed and motivated.", "그걸 볼 때마다 저는 감탄하고 의욕이 생겨요.", "amazed and motivated"], ["One time, I got goosebumps during a team battle because the choreography was perfect, and that made me respect the dancers even more.", "한번은 안무가 완벽해서 팀 배틀 중에 소름이 돋았고, 그 일로 댄서들을 더 존경하게 됐어요.", "got goosebumps during a team battle"], ["So yeah, Street Woman Fighter is one of the few shows I always look forward to.", "그러니까요, 스트릿 우먼 파이터는 제가 늘 기다리는 몇 안 되는 프로그램 중 하나예요.", "one of the few shows I always look forward to"]]},
{"id": "t9", "name": "카페 (Cafes)", "group": "주제 연습", "qs": [["You indicated in the survey that you go to cafes or coffee shops. Tell me about the café you often go to. Where is the café located? What does it look like? Is there something special about that café?", "설문에서 카페나 커피숍에 간다고 하셨습니다. 자주 가는 카페에 대해 이야기해 주세요. 그 카페는 어디에 있나요? 어떻게 생겼나요? 특별한 점이 있나요?"], ["Tell me about your favorite coffee shop. Where is it located? What does it look like? Describe it in as much detail as possible.", "가장 좋아하는 커피숍에 대해 이야기해 주세요. 어디에 있나요? 어떻게 생겼나요? 가능한 한 자세히 묘사해 주세요."]], "cards": [["I'd like to tell you about a café I often go to.", "제가 자주 가는 카페에 대해 이야기해 드리고 싶어요.", "a café I often go to"], ["It is located near my school, and it has a very cozy and quiet atmosphere.", "그곳은 학교 근처에 있고, 아주 아늑하고 조용한 분위기를 가지고 있어요.", "near my school"], ["When you go there, the first thing you notice is the warm lighting and the smell of freshly brewed coffee.", "거기 가면 가장 먼저 눈에 들어오는 건 따뜻한 조명과 갓 내린 커피 향이에요.", "the warm lighting and the smell of freshly brewed coffee"], ["It has wooden tables, soft chairs, and some indoor plants, and the overall vibe is calm and comfortable.", "나무 테이블, 푹신한 의자, 그리고 실내 식물 몇 개가 있고, 전체적인 분위기는 차분하고 편안해요.", "wooden tables, soft chairs, and some indoor plants"], ["One thing I like about this café is that they play soft jazz music, which helps me focus when I study.", "이 카페에서 제가 좋아하는 한 가지는 부드러운 재즈 음악을 틀어 준다는 건데, 그게 공부할 때 집중하는 데 도움이 돼요.", "soft jazz music"], ["It also has free Wi-Fi and a quiet study room, which makes it even better.", "무료 와이파이와 조용한 스터디룸도 있어서, 그게 더 좋게 만들어 줘요.", "free Wi-Fi and a quiet study room"], ["I usually go there about twice a week, and every time I visit, I feel really relaxed and productive.", "저는 보통 일주일에 두 번 정도 가는데, 갈 때마다 정말 편안하고 일이 잘 되는 느낌이에요.", "about twice a week"], ["That's why this café is one of my favorite places to spend time.", "그래서 이 카페는 제가 시간을 보내기 가장 좋아하는 장소 중 하나예요.", "one of my favorite places to spend time"]]},
{"id": "t10", "name": "바 (Bars)", "group": "주제 연습", "qs": [["I'd like to know about the bar you often go to. Where is your favorite bar? What does it look like? Please describe everything about that bar in detail.", "당신이 자주 가는 바에 대해 알고 싶습니다. 가장 좋아하는 바는 어디에 있나요? 어떻게 생겼나요? 그 바에 대해 모든 것을 자세히 묘사해 주세요."]], "cards": [["I'd like to tell you about a bar I sometimes go to with my friends.", "제가 가끔 친구들과 가는 바에 대해 이야기해 드리고 싶어요.", "a bar I sometimes go to with my friends"], ["It is located in the Hongdae area of Seoul, and it has a very lively and trendy atmosphere.", "그곳은 서울 홍대 지역에 있고, 아주 활기차고 트렌디한 분위기를 가지고 있어요.", "the Hongdae area of Seoul"], ["When you go there, the first thing you notice is the colorful neon lights and upbeat music playing in the background.", "거기 가면 가장 먼저 눈에 들어오는 건 알록달록한 네온 불빛과 배경에 흐르는 신나는 음악이에요.", "the colorful neon lights and upbeat music"], ["It has a long bar counter, several high tables, and private booths, and the overall vibe is casual but stylish.", "긴 바 카운터, 높은 테이블 여러 개, 그리고 프라이빗 부스가 있고, 전체적인 분위기는 캐주얼하지만 세련됐어요.", "a long bar counter, several high tables, and private booths"], ["One thing I like about this bar is that they serve unique cocktails and sometimes have live DJs on weekends.", "이 바에서 제가 좋아하는 한 가지는 독특한 칵테일을 내고 주말에는 가끔 라이브 DJ도 있다는 거예요.", "unique cocktails"], ["It also has friendly staff and a fun crowd, which makes it even better.", "친절한 직원들과 즐거운 손님들도 있어서, 그게 더 좋게 만들어 줘요.", "friendly staff and a fun crowd"], ["I usually go there once or twice a month, and every time I visit, I feel really recharged and excited.", "저는 보통 한 달에 한두 번 가는데, 갈 때마다 정말 에너지가 충전되고 신나요.", "once or twice a month"], ["That's why this bar is one of my favorite places to hang out with friends.", "그래서 이 바는 친구들과 어울리기 가장 좋아하는 장소 중 하나예요.", "hang out with friends"]]},
{"id": "t11", "name": "공원·산책·조깅 (Park)", "group": "주제 연습", "qs": [["You indicated in the survey that you like to go to parks. Tell me about one of the parks that you often visit. What makes it so special?", "설문에서 공원에 가는 것을 좋아한다고 하셨습니다. 자주 가는 공원 중 하나에 대해 이야기해 주세요. 무엇이 그 공원을 특별하게 만드나요?"], ["You indicated in the survey that you like to go walking. How often do you go walking? When and where do you normally go walking? Please describe your routine when you are walking.", "설문에서 산책을 좋아한다고 하셨습니다. 얼마나 자주 산책하나요? 보통 언제, 어디에서 산책하나요? 산책할 때의 일과를 설명해 주세요."], ["You indicated in the survey that you like to go jogging. How often do you go jogging? When and where do you normally go jogging? Please describe your routine when you are jogging.", "설문에서 조깅을 좋아한다고 하셨습니다. 얼마나 자주 조깅하나요? 보통 언제, 어디에서 조깅하나요? 조깅할 때의 일과를 설명해 주세요."]], "cards": [["I'd like to tell you about a park I often visit.", "제가 자주 가는 공원에 대해 이야기해 드리고 싶어요.", "a park I often visit"], ["It is located near my apartment, and it has a very peaceful and natural atmosphere.", "그곳은 우리 아파트 근처에 있고, 아주 평화롭고 자연스러운 분위기를 가지고 있어요.", "near my apartment"], ["When you enter the park, the first thing you notice is the green grass and the walking trails.", "공원에 들어서면 가장 먼저 눈에 들어오는 건 푸른 잔디와 산책로예요.", "the green grass and the walking trails"], ["It has tall trees, benches, and a small pond, and the overall vibe is quiet and relaxing.", "키 큰 나무들, 벤치, 그리고 작은 연못이 있고, 전체적인 분위기는 조용하고 편안해요.", "tall trees, benches, and a small pond"], ["One thing I like about this park is the sound of birds and the fresh air.", "이 공원에서 제가 좋아하는 한 가지는 새소리와 맑은 공기예요.", "the sound of birds and the fresh air"], ["I usually come here to walk, jog, or have a picnic, and I go there almost every weekend.", "저는 보통 여기에 와서 걷거나, 조깅하거나, 소풍을 즐기고, 거의 매 주말에 가요.", "walk, jog, or have a picnic"], ["Every time I visit the park, I feel really refreshed.", "공원에 갈 때마다 저는 정말 상쾌해져요.", "visit the park"], ["That's why it's one of my favorite places.", "그래서 그곳은 제가 가장 좋아하는 장소 중 하나예요.", "one of my favorite places"]]},
{"id": "t12", "name": "해변 (Beach)", "group": "주제 연습", "qs": [["You indicated in your survey that you like to go to beaches. Tell me about your favorite beach. Where is it located? What does it look like? Why do you like that beach? Give me all the details.", "설문에서 해변에 가는 것을 좋아한다고 하셨습니다. 가장 좋아하는 해변에 대해 이야기해 주세요. 어디에 있나요? 어떻게 생겼나요? 왜 그 해변을 좋아하나요? 모든 세부 사항을 알려 주세요."]], "cards": [["I'd like to tell you about my favorite beach.", "제가 가장 좋아하는 해변에 대해 이야기해 드리고 싶어요.", "my favorite beach"], ["It is located in Gangwon-do, and it has a very open and beautiful atmosphere.", "그곳은 강원도에 있고, 아주 탁 트이고 아름다운 분위기를 가지고 있어요.", "Gangwon-do"], ["When you arrive, the first thing you notice is the soft sand and the sound of waves.", "도착하면 가장 먼저 눈에 들어오는 건 부드러운 모래와 파도 소리예요.", "the soft sand and the sound of waves"], ["It has clean water, lots of space, and some snack shops nearby, and the overall vibe is very relaxing.", "깨끗한 물, 넓은 공간, 그리고 근처에 간식 가게 몇 곳이 있고, 전체적인 분위기는 아주 편안해요.", "clean water, lots of space, and some snack shops nearby"], ["One thing I like about this beach is the amazing sunset view in the evening.", "이 해변에서 제가 좋아하는 한 가지는 저녁에 보이는 멋진 노을 풍경이에요.", "the amazing sunset view in the evening"], ["I usually come here to swim, take pictures, or just relax, and I go there every summer.", "저는 보통 여기에 와서 수영하거나, 사진을 찍거나, 그냥 쉬고, 매년 여름마다 가요.", "swim, take pictures, or just relax"], ["Every time I go to this beach, I feel really happy and free.", "이 해변에 갈 때마다 저는 정말 행복하고 자유로워져요.", "happy and free"], ["That's why I really love it.", "그래서 저는 그곳을 정말 사랑해요.", "I really love it"]]},
{"id": "t13", "name": "캠핑 (Camping)", "group": "주제 연습", "qs": [["You indicated in the survey that you like camping. Where do you go camping? How often do you go camping? Describe your camping in detail.", "설문에서 캠핑을 좋아한다고 하셨습니다. 어디로 캠핑을 가나요? 얼마나 자주 캠핑을 가나요? 캠핑을 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about a camping site I often go to.", "제가 자주 가는 캠핑장에 대해 이야기해 드리고 싶어요.", "a camping site I often go to"], ["It is located in a forest area in Gangwon-do, and it has a very quiet and natural atmosphere.", "그곳은 강원도의 숲 지역에 있고, 아주 조용하고 자연스러운 분위기를 가지고 있어요.", "a forest area in Gangwon-do"], ["When you get there, the first thing you notice is the tall trees and the fresh smell of the woods.", "거기 도착하면 가장 먼저 눈에 들어오는 건 키 큰 나무들과 숲의 상쾌한 향기예요.", "the tall trees and the fresh smell of the woods"], ["It has places for tents, a campfire area, and a small river nearby, and the overall vibe is peaceful.", "텐트를 칠 자리, 모닥불 구역, 그리고 근처에 작은 강이 있고, 전체적인 분위기는 평화로워요.", "places for tents, a campfire area, and a small river nearby"], ["One thing I like about this campsite is the night sky full of stars.", "이 캠핑장에서 제가 좋아하는 한 가지는 별이 가득한 밤하늘이에요.", "the night sky full of stars"], ["I usually come here to relax and enjoy nature, and I go camping about twice a year.", "저는 보통 쉬면서 자연을 즐기려고 여기에 오고, 1년에 두 번 정도 캠핑을 가요.", "relax and enjoy nature"], ["Every time I go, I feel really peaceful and recharged.", "갈 때마다 저는 정말 평화롭고 에너지가 충전돼요.", "peaceful and recharged"], ["That's why I enjoy camping so much.", "그래서 저는 캠핑을 정말 즐겨요.", "I enjoy camping so much"]]},
{"id": "t14", "name": "이웃 (Neighbors) [묘사]", "group": "주제 연습", "qs": [["Can you tell me about your neighbors? Who are they, and what are they like? Are you close to your neighbors? What do you typically do when you meet them?", "당신의 이웃들에 대해 말해 주실래요? 그들은 누구이고 어떤 가요? 당신은 이웃들과 친한 가요? 일반적으로 그들을 만나면 무엇을 하시나요?"]], "cards": [["I'd like to tell you about my neighbor...my older sister.", "저는 저희 이웃이자 언니에 대해 이야기해보고 싶어요.", "my older sister."], ["She is very thoughtful and dependable. She always checks on me. She does this even when she is busy.", "언니는 정말 사려 깊고 믿음직해요. 언니는 항상 저를 챙겨줘요. 바쁠 때도 그렇게 해줘요.", "always checks on me"], ["Whenever I bump into her in the hallway or chat with her, I feel relieved and supported.", "복도에서 우연히 마주치거나 잠깐 얘기만 나눠도 마음이 놓이고 위로가 됩니다.", "bump into her in the hallway or chat with her"], ["One time, I was sick, and she brought me homemade soup without me even asking.", "한 번은 제가 아플 때, 아무 말도 안 했는데 언니가 직접 끓인 수프를 가져다 줬어요.", ", I was sick, and she brought me homemade soup without me even asking"], ["That made me appreciate her even more.", "그 일 덕분에 언니에 대한 고마움이 더 커졌어요.", "made me appreciate her even more"], ["So yeah, she's not just my family...she's the best neighbor I could ask for.", "그래서 저에게 언니는 단순한 가족이 아니라, 가장 든든한 이웃이기도 해요.", "she's the best neighbor I could ask for."]]},
{"id": "t15", "name": "음악 가수 (Music) [묘사]", "group": "주제 연습", "qs": [["You indicated in the survey that you like listening to music. What types of music do you like? Who is your favorite singer or composer? Why do you like him or her?", "설문지에서 음악 듣는 것을 좋아한다고 하셨네요. 어떤 종류의 음악을 좋아하시나요? 좋아하는 가수나 작곡가는 누구인가요? 왜 그 사람을 좋아하시나요?"]], "cards": [["I'd like to tell you about one of my favorite singers, Brown Eyed Soul.", "제가 가장 좋아하는 가수 중 하나는 브라운 아이드 소울이에요.", "Brown Eyed Soul"], ["They are really emotional and soulful. Their harmonies sound rich and warm. This touches my heart.", "이 팀은 정말 감성적이고 소울풀해요. 하모니가 풍부하고 따뜻해요. 그래서 마음이 울려요.", "Their harmonies sound rich and warm"], ["Whenever I listen to their songs, especially late at night, I feel calm and deeply moved.", "저는 특히 밤에 이들의 노래를 들을 때마다, 정말 마음이 차분해지고 깊은 감동을 받아요.", "listen to their songs, especially late at night"], ["One time, I was feeling really overwhelmed. Their song “Love Ballad” helped me feel at peace. This made me appreciate Brown Eyed Soul even more.", "한 번은 정신적으로 너무 지쳐 있었어요. 그런데 'Love Ballad'라는 노래를 듣고 마음이 편해졌어요. 그래서 브라운 아이드 소울이 더 좋아졌어요.", "helped me feel at peace"], ["So yeah, they really mean a lot to me.", "그래서 저에게 브라운 아이드 소울은 정말 의미 있는 팀이에요.", "they really mean a lot to me"]]},
{"id": "t16", "name": "음악기기 (Music) [묘사]", "group": "주제 연습", "qs": [["You indicated in the survey that you like listening to music. What kind of device do you use when you listen to music? Which gadget do you usually use? Please explain the devices in detail.", "설문지에서 음악 듣는 것을 좋아한다고 하셨네요. 음악을 들을 때 어떤 기기를 사용하시나요? 보통 어떤 장치를 주로 사용하세요? 그 기기에 대해 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about my wireless earbuds and my phone.", "저는 무선 이어버드와 휴대폰에 대해 말하고 싶어요.", "my wireless earbuds and my phone"], ["They are really convenient and comfortable. They have active noise canceling. The sound is clear, even at low volume. The battery lasts a long time with the charging case.", "둘 다 정말 편하고 실용적이에요. 액티브 노이즈 캔슬링 기능이 있어요. 낮은 볼륨에서도 소리가 선명해요. 충전 케이스 덕분에 배터리도 오래가요.", "They have active noise canceling"], ["Whenever I stream music on my phone (using Spotify/YouTube Music) and connect via Bluetooth, I feel focused and relaxed.", "저는 휴대폰으로 음악 스트리밍 앱(스포티파이/유튜브 뮤직)을 켜서 블루투스로 연결할 때 집중되고 편안한 느낌이 들어요.", "stream music on my phone (using Spotify/YouTube Music) and connect via Bluetooth"], ["One time, I was working in a noisy café. The earbuds blocked most of the noise. They also fit well for hours. This made me like this setup even more.", "한 번은 시끄러운 카페에서 일하고 있었어요. 이어폰이 소음을 대부분 막아줬어요. 착용감도 오래 편했어요. 그래서 이 세팅이 더 좋아졌어요.", "blocked most of the noise"], ["So yeah, this combo (earbuds + phone) means a lot to me.", "그래서 이어버드+휴대폰 조합이 저에게는 정말 소중해요.", "this combo (earbuds + phone)"]]},
{"id": "t17", "name": "카페 (Cafes) [묘사]", "group": "주제 연습", "qs": [["You indicated in the survey that you go to cafes or coffee shops. Tell me about the café you often go to. Where is the café located? What does it look like? Is there something special about that café?", "설문조사에서 카페나 커피숍에 간다고 적어 주셨습니다. 주로 가는 카페에 대해 이야기해 주세요. 그 카페는 어디에 있나요? 그곳은 어떤 모습인가요? 특별한 점이 있나요?"], ["Tell me about your favorite coffee shop. Where is it located? What does it look like? Describe it in as much detail as possible.", "가장 좋아하는 커피숍에 대해 이야기해 주세요. 어디에 위치해 있나요? 그곳은 어떤 모습인가요? 가능한 한 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about a café I often go to.", "제가 자주 가는 카페에 대해 소개해드릴게요.", "I often go to"], ["It is located near my school, and it has a very cozy and quiet atmosphere.", "학교 근처에 위치해 있고, 아늑하고 조용한 분위기가 매력적인 곳이에요.", "near my school"], ["When you go there, the first thing you notice is the warm lighting and the smell of freshly brewed coffee.", "그곳에 들어서면 가장 먼저 느껴지는 건 따뜻한 조명과 갓 내린 커피 향기예요.", "the warm lighting and the smell of freshly brewed coffee"], ["It has wooden tables, soft chairs, and some indoor plants, and the overall vibe is calm and comfortable.", "나무 테이블, 푹신한 의자, 그리고 실내 식물들이 있어서 전체적인 분위기가 차분하고 편안해요.", "wooden tables, soft chairs, and some indoor plants"], ["One thing I like about this café is the soft jazz music. It helps me focus when I study.", "이 카페에서 제가 좋아하는 점 중 하나는 부드러운 재즈 음악이에요. 공부할 때 집중하는 데 도움이 돼요.", "helps me focus when I study"], ["It also has free Wi-Fi. It has a quiet study room too. These things make it even better.", "무료 와이파이도 있어요. 조용한 스터디룸도 있어요. 이런 점들이 카페를 더 좋게 만들어줘요.", "make it even better"], ["I usually go there about twice a week, and every time I visit, I feel really relaxed and productive.", "저는 일주일에 보통 두 번 정도 가는데, 갈 때마다 기분이 편안해지고, 일도 잘 되는 느낌이에요.", "relaxed and productive"], ["That's why this café is one of my favorite places to spend time.", "그래서 이 카페는 제가 시간을 보내기에 가장 좋아하는 장소 중 하나예요", "is one of my favorite places to spend time"]]},
{"id": "t18", "name": "바 (Bars) [묘사]", "group": "주제 연습", "qs": [["I'd like to know about the bar you often go to. Where is your favorite bar? What does it look like? Please describe everything about that bar in detail.", "당신이 자주 가는 술집에 대해 알고 싶습니다. 당신이 가장 좋아하는 술집은 어디에 있나요? 어떻게 생겼나요? 그 술집에 대해 모든 것을 자세히 묘사해주세요."]], "cards": [["I'd like to tell you about a bar I sometimes go to with my friends.", "가끔 친구들이랑 함께 가는 바에 대해 소개해드릴게요.", "a bar I sometimes go to with my friends"], ["It is located in the Hongdae area of Seoul, and it has a very lively and trendy atmosphere.", "서울 홍대에 위치한 곳인데, 분위기가 정말 활기차고 트렌디해요.", "the Hongdae area of Seoul"], ["When you go there, the first thing you notice is the colorful neon lights and upbeat music playing in the background.", "그곳에 들어서면 가장 먼저 보이는 건 형형색색의 네온 조명과 신나는 배경 음악이에요.", "the colorful neon lights and upbeat music playing in the background"], ["It has a long bar counter, several high tables, and private booths, and the overall vibe is casual but stylish.", "긴 바 카운터, 높은 테이블들, 그리고 프라이빗한 부스 자리들이 있어서 전체적으로 편안하면서도 세련된 분위기예요.", "a long bar counter, several high tables, and private booths"], ["One thing I like about this bar is that they serve unique cocktails and sometimes have live DJs on weekends.", "이 바에서 제가 가장 좋아하는 점은, 독특한 칵테일을 제공하고, 주말에는 가끔 라이브 DJ 공연도 있다는 거예요.", "that they serve unique cocktails and sometimes have live DJs on weekends"], ["It also has friendly staff. The crowd is fun too. These things make it even better.", "직원들도 친절해요. 손님들도 활기차요. 이런 점들이 더 즐겁게 만들어줘요.", "make it even better"], ["I usually go there once or twice a month, and every time I visit, I feel really recharged and excited.", "저는 보통 한 달에 한두 번쯤 가는데, 갈 때마다 기분이 전환되고 에너지가 생기는 느낌이에요.", "once or twice a month"], ["That's why this bar is one of my favorite places to hang out with friends.", "그래서 이 바는 친구들과 어울리기에 가장 좋아하는 장소 중 하나예요.", "this bar is one of my favorite places to hang out with friends"]]},
{"id": "t19", "name": "공원 (Park) / 산책 (Walking) / 조깅 (Jogging) [묘사]", "group": "주제 연습", "qs": [["You indicated in the survey that you like to go to parks. Tell me about one of the parks that you often visit. What makes it so special?", "설문조사에서 공원에 가는 것을 좋아한다고 하셨는데, 자주 방문하는 공원 중 하나에 대해 이야기해 주세요. 그 공원이 특별한 이유는 무엇인가요?"], ["You indicated in the survey that you like to go walking. How often do you go walking? When and where do you normally go walking? Please describe your routine when you are walking.", "설문조사에서 산책을 좋아한다고 하셨는데, 얼마나 자주 산책을 하시나요? 보통 언제, 어디에서 산책하시나요? 산책 할 때의 일상을 자세히 설명해 주시겠어요?"], ["You indicated in the survey that you like to go jogging. How often do you go jogging? When and where do you normally go jogging? Please describe your routine when you are jogging.", "설문조사에서 조깅을 좋아한다고 하셨는데, 얼마나 자주 조깅을 하시나요? 보통 언제, 어디에서 조깅 하시나요? 조깅 할 때의 일상을 자세히 설명해 주시겠어요?"]], "cards": [["I'd like to tell you about a park I often visit.", "제가 자주 가는 공원에 대해 이야기해드릴게요.", "a park I often visit"], ["It is located near my apartment, and it has a very peaceful and natural atmosphere.", "집 근처에 있는 공원인데, 분위기가 정말 평화롭고 자연 친화적이에요.", "peaceful and natural"], ["When you enter the park, the first thing you notice is the green grass and the walking trails.", "공원에 들어서면 가장 먼저 보이는 건 푸른 잔디밭과 산책로예요.", "the green grass and the walking trails"], ["It has tall trees, benches, and a small pond, and the overall vibe is quiet and relaxing.", "키 큰 나무들과 벤치, 작은 연못도 있어서 전체적으로 조용하고 여유로운 분위기를 느낄 수 있어요.", "tall trees, benches, and a small pond"], ["One thing I like about this park is the sound of birds and the fresh air.", "제가 이 공원을 좋아하는 이유는, 새소리와 맑은 공기 덕분에 기분이 맑아진다는 점이에요.", "the sound of birds and the fresh air"], ["I usually come here to walk, jog, or have a picnic, and I go there almost every weekend.", "저는 보통 여기서 산책하거나 조깅을 하고, 가끔은 피크닉도 즐기는데, 거의 매주 주말마다 방문해요.", "I usually come here to walk, jog, or have a picnic"], ["Every time I visit the park, I feel really refreshed. That's why it's one of my favorite places.", "공원에 갈 때마다 몸과 마음이 상쾌해지는 느낌이 들어서 이곳은 제가 가장 좋아하는 장소 중 하나예요.장소 묘사하기 템플릿 A", "it's one of my favorite places"]]},
{"id": "t20", "name": "해변 (Beach) [묘사]", "group": "주제 연습", "qs": [["You indicated in your survey that you like to go to beaches. Tell me about your favorite beach. Where is it located? What does it look like? Why do you like that beach? Give me all the details.", "설문조사에서 해변에 가는 것을 좋아한다고 하셨는데, 가장 좋아하는 해변에 대해 이야기해 주세요. 그 해변은 어디에 있나요? 어떻게 생겼나요? 그 해변을 좋아하는 이유는 무엇인가요? 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about my favorite beach.", "제가 가장 좋아하는 해변에 대해 이야기해드릴게요.", "my favorite beach"], ["It is located in Gangwon-do, and it has a very open and beautiful atmosphere.", "강원도에 위치한 곳인데, 분위기가 정말 탁 트이고 아름다워요.", "open and beautiful"], ["When you arrive, the first thing you notice is the soft sand and the sound of waves.", "해변에 도착하면 가장 먼저 눈에 띄는 건 부드러운 모래와 파도 소리예요.", "the soft sand and the sound of waves"], ["It has clean water, lots of space, and some snack shops nearby, and the overall vibe is very relaxing.", "물이 맑고 공간도 넓으며, 근처에는 간단한 간식 가게들도 있어서 전체적인 분위기가 정말 편안하고 여유로워요.", "clean water, lots of space, and some snack shops nearby"], ["One thing I like about this beach is the amazing sunset view in the evening.", "제가 이 해변을 좋아하는 이유 중 하나는 저녁에 볼 수 있는 멋진 노을 풍경이에요.", "the amazing sunset view in the evening"], ["I usually come here to swim, take pictures, or just relax, and I go there every summer.", "보통 여기서 수영을 하거나, 사진을 찍거나, 그냥 쉬기도 하고, 매년 여름마다 꼭 방문해요.", "I usually come here to swim, take pictures, or just relax"], ["Every time I go to this beach, I feel really happy and free. That's why I really love it.", "이 해변에 갈 때마다 기분이 정말 행복하고 자유로워져서, 그래서 이곳을 정말 사랑하게 되었어요.", "go to this beach"]]},
{"id": "t21", "name": "캠핑 (Camping) [묘사]", "group": "주제 연습", "qs": [["You indicated in the survey that you like camping. Where do you go camping? How often do you go camping? Describe your camping in detail.", "설문조사에서 캠핑을 좋아한다고 하셨는데, 주로 어디에서 캠핑을 하시나요? 얼마나 자주 캠핑을 가시나요? 캠핑 경험에 대해 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about a camping site I often go to.", "제가 자주 가는 캠핑장에 대해 말씀드릴게요.", "a camping site I often go to"], ["It is located in a forest area in Gangwon-do, and it has a very quiet and natural atmosphere.", "그곳은 강원도 숲속에 위치해 있고, 아주 조용하고 자연스러운 분위기를 가지고 있습니다.", "a forest area in Gangwon-do"], ["When you get there, the first thing you notice is the tall trees and the fresh smell of the woods.", "그곳에 도착하면 가장 먼저 눈에 띄는 것은 키 큰 나무들과 숲의 상쾌한 향기예요.", "the tall trees and the fresh smell of the woods"], ["It has places for tents, a campfire area, and a small river nearby, and the overall vibe is peaceful.", "텐트를 칠 수 있는 공간, 모닥불을 피울 수 있는 구역, 그리고 근처에 작은 강이 있어서 전체적으로 매우 평화로운 느낌이 납니다.", "places for tents, a campfire area, and a small river nearby"], ["One thing I like about this campsite is the night sky full of stars.", "이 캠핑장에서 제가 가장 좋아하는 점은 별이 가득한 밤하늘이에요.", "the night sky full of stars"], ["I usually come here to relax and enjoy nature, and I go camping about twice a year.", "저는 주로 휴식을 취하고 자연을 즐기기 위해 이곳에 오는데, 1년에 두 번 정도 캠핑을 갑니다.", "I usually come here to relax and enjoy nature"], ["Every time I go, I feel really peaceful and recharged.", "갈 때마다 정말 평화롭고 에너지가 충전되는 느낌이에요.", "peaceful and recharged"], ["That's why I enjoy camping so much.", "그래서 저는 캠핑을 정말 좋아합니다.", "I enjoy camping so much"]]},
{"id": "t22", "name": "거주지 (House) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["What are some of the new technologies that have been introduced in the housing industry in recent years? Describe how these technologies have changed the way homes are built and lived in. What benefits do these new technologies offer, and are there any drawbacks or challenges that come with adopting them?", "최근 몇 년간 주택 산업에 도입된 새로운 기술에는 어떤 것들이 있나요? 이 기술들이 집이 지어지고 거주하는 방식에 어떤 변화를 가져왔는지 설명해주세요. 이러한 새로운 기술들이 제공하는 이점은 무엇이며, 이를 채택함으로써 발생하는 단점이나 어려움은 무엇인가요"]], "cards": [["I'd like to tell you about new technology in Korean homes. We are proud of this. Our homes have become very high-tech.", "한국 가정의 새로운 기술에 대해 이야기해볼게요. 우리는 이걸 자랑스러워해요. 요즘 집들은 정말 하이테크가 되었어요.", "We are proud of this."], ["You'll notice things like smart lighting, voice-controlled devices, and energy-saving systems in many apartments today.", "이건 우리가 꽤 자랑스러워하는 부분이에요, 왜냐면 요즘 집들이 정말 하이테크(첨단화) 되었거든요.", "smart lighting, voice-controlled devices, and energy-saving systems"], ["Most people see this as a sign of new technology.", "요즘 아파트에 가보면 스마트 조명, 음성 인식 기기, 에너지 절약 시스템 같은 걸 쉽게 볼 수 있어요.", "a sign of new technology"], ["Personally, I think it shows how much we value efficiency and innovation.", "대부분의 사람들은 이런 걸 기술 발전의 상징으로 보고요, 저 개인적으로는 이게 우리가 얼마나 효율성과 혁신을 중요하게 생각하는지 보여준다고 생각해요.", "efficiency and innovation"], ["Smart housing is more than just a system here. It is something we are proud of.", "그래서 스마트 하우징은 단순한 시스템이 아니라, 우리가 자부심을 느끼는 문화의 한 부분인 것 같아요.", "something we are proud of"]]},
{"id": "t23", "name": "가구 (Furniture) [묘사]", "group": "주제 연습", "qs": [["Tell me about your favorite piece of furniture in your house. What furniture do you have? What does it look like, and what do you like about the furniture? Describe it in detail.", "집에서 가장 좋아하는 가구에 대해 말해 주세요. 어떤 가구가 있나요? 그것은 어떻게 생겼고, 그 가구에서 무엇이 마음에 드나요? 자세히 설명해 주세요."]], "cards": [["I'd like to tell you about my sofa at home.", "저는 우리 집 소파에 대해 이야기하고 싶어요.", "my sofa at home"], ["It's really comfortable and cozy. It's perfect for relaxing after a long day.", "정말 편하고 아늑한 소파예요. 긴 하루 끝에 쉬기에 딱 좋아요.", "perfect for relaxing after a long day"], ["Whenever I lie down and watch something on my phone or just take a nap, I feel completely at ease.", "저는 거기 누워서 핸드폰으로 영상 보거나 잠깐 눈 붙일 때마다, 정말 편안함을 느껴요.", "lie down and watch something on my phone or just take a nap"], ["One time, I fell asleep there while reading a book. I slept better than I do in my bed. This made me appreciate that sofa even more.", "한 번은 책을 읽다가 거기서 잠들었어요. 침대보다 더 잘 잤어요. 그래서 그 소파가 더 소중하게 느껴졌어요.", "slept better than I do in my bed"], ["So yeah, that sofa means a lot to me.", "그래서 저한테 그 소파는 참 의미 있는 가구예요.", "that sofa"]]},
{"id": "t24", "name": "영화 감상 (Watching Movies) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["What topics or issues regarding movies do you discuss when talking with your friends or family members? Why are these issues interesting to your friends and why are they so important?", "친구나 가족과 영화에 대해 이야기할 때 주로 어떤 주제나 이슈를 논의하나요? 이런 이슈들이 친구들에게 왜 흥미로운지, 그리고 왜 그렇게 중요한지 설명해 주세요."]], "cards": [["Well, if I had to point out one thing about the kinds of movie topics we talk about, it would be social messages in films.", "영화에 대해 이야기할 때 한 가지를 꼽자면 영화 속 사회적 메시지인 것 같아요.", "the kinds of movie topics we talk about"], ["I say this because my friends like talking about movies. They like how movies show real issues. These issues include mental health, equality, and the environment.", "이렇게 말하는 이유는 제 친구들이 영화에 대해 이야기하는 걸 좋아하기 때문이에요. 친구들은 영화가 실제 문제를 어떻게 보여주는지 좋아해요. 이런 문제에는 정신 건강, 평등, 환경 문제가 있어요.", "how movies show real issues"], ["That's the main thing I notice about our movie talks. I think it's worth mentioning.", "이게 저희 영화 대화에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요.", "the main thing I notice"], ["These issues are interesting to them. These issues make people think more deeply about society. They are also important. Movies can influence people's awareness and behavior.", "이런 주제들은 사람들에게 흥미로워요. 사람들이 사회를 더 깊이 생각하게 만들기 때문이에요. 이런 주제들은 또한 중요해요. 영화가 사람들의 인식과 행동에 영향을 줄 수 있기 때문이에요.", "influence people's awareness and behavior"]]},
{"id": "t25", "name": "음악 감상하기 (Music) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["I'd like to know what gadgets or electronic equipment people are interested in these days? Why do people in your country like those music gadgets or equipment? What new products excite them and why? Tell me what people talk about it.", "요즘 사람들이 관심을 갖는 기기들이나 전자제품이 무엇인지 알고 싶습니다. 왜 당신의 나라 사람들은 그러한 음악 기기나 장비를 좋아하나요? 어떤 신제품이 그들을 흥분 시키고 그 이유는 무엇인가요? 사람들이 그것에 대해 무슨 말을 하는지 말해주세요."], ["What kind of music gadgets or equipment do people like to use in your country? Can you tell me about the popular ones?", "당신 나라 사람들은 어떤 음악 기기나 장비를 좋아하나요? 인기 있는 것들에 대해 이야기해 주세요."]], "cards": [["I'd like to tell you about music gadgets and audio equipment in Korea.", "한국의 음악 기기랑 오디오 장비에 대해 이야기해보려고 해요.", "music gadgets and audio equipment in Korea"], ["We are proud of this because Korea has a strong tech culture. People compare brands carefully and read reviews. Some people even customize their setups with high-end headphones, Bluetooth speakers, or digital audio players.", "우리는 이걸 꽤 자랑스러워해요. 한국은 기술 문화가 강하기 때문이에요. 사람들은 브랜드를 꼼꼼히 비교하고 리뷰도 찾아봐요. 어떤 사람들은 고급 헤드폰, 블루투스 스피커, 디지털 오디오 플레이어로 자신만의 세팅을 만들기도 해요.", "People compare brands carefully"], ["Most people see this as a lifestyle choice. I think it shows what our society values. We value things like quality and trends.", "대부분의 사람들은 이걸 라이프스타일의 한 부분으로 봐요. 저는 이게 우리 사회가 중요하게 여기는 걸 보여준다고 생각해요. 우리는 품질과 트렌드 같은 걸 중요하게 생각해요.", "what our society values"], ["Music gadgets in Korea are more than just tools. They are something we are proud of.", "한국의 음악 기기들은 단순한 도구가 아니에요. 우리가 자부심을 느끼는 부분이에요.", "something we are proud of"]]},
{"id": "t26", "name": "기술 (Technology) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["Tell me about the technologies that are popular in your country. Which technology do people use the most there? What is it used for? Can you tell me why they like to use it?", "당신 나라에서 인기 있는 기술에 대해 이야기해 주세요. 사람들이 가장 많이 사용하는 기술은 무엇인가요? 그 기술은 무엇을 위해 사용되나요? 사람들이 그것을 좋아하는 이유를 말해 주세요."], ["Tell me about recent news you read or watched related to technology. What was the news regarding technology? Do people talk about that issues often? How do people handle these issues?", "최근에 읽었거나 본 기술과 관련된 뉴스를 말해주세요. 그 기술에 관한 뉴스는 무엇이었나요? 사람들이 그 문제에 대해 자주 이야기하나요? 사람들은 이 문제들을 어떻게 다루나요?"]], "cards": [["Well, if I had to point out one thing about technology in my country, it would be how deeply AI and mobile technology are integrated into daily life.", "음, 제 나라의 기술에 대해 한 가지 말해야 한다면, AI랑 모바일 기술이 일상 속에 얼마나 깊게 스며들어 있는지를 꼽을 것 같아요.", "how deeply AI and mobile technology are integrated into daily life"], ["I say this because people use smart devices, payment apps, and AI tools for everything. They use them for studying, shopping, and managing schedules. This is the main thing I notice about technology in Korea. I think it's worth mentioning.", "그 이유는 사람들이 스마트기기, 결제 앱, AI 도구를 모든 일에 사용하기 때문이에요. 공부할 때, 쇼핑할 때, 일정을 관리할 때도 사용해요. 이게 한국 기술에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요.", "the main thing I notice about technology in Korea"]]},
{"id": "t27", "name": "현지 복장 (Fashion) [묘사]", "group": "주제 연습", "qs": [["What kind of clothes do people in your country usually wear? Do they wear different clothes when they go to work and when they are relaxing? Describe the local attire in as much detail as possible.", "당신의 나라 사람들은 보통 어떤 옷을 입나요? 출근할 때와 쉴 때 입는 옷이 다른가요? 현지 복장을 가능한 한 자세히 설명해 주세요."]], "cards": [["Well, if I had to point out one thing about local fashion in my country, it would be how neat and season-focused it is.", "(현지 복장) 우리나라 현지 복장에 대해 한 가지를 꼽자면 깔끔하고 계절에 맞게 입는 스타일이에요.", "how neat and season-focused it is"], ["I say this because people dress for the weather. They dress formally at work. They dress more comfortably on weekends.", "그렇게 말하는 이유는 사람들이 날씨에 맞게 옷을 입기 때문이에요. 출근할 때는 단정하게 입어요. 주말에는 더 편하게 입어요.", "dress formally at work"], ["That's the main thing I notice about Korean fashion. I think it's worth mentioning.", "이게 한국 패션에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요.", "the main thing I notice about Korean fashion"]]},
{"id": "t28", "name": "음식 (Food) [묘사]", "group": "주제 연습", "qs": [["What is popular food or dishes in your country? Why is this food popular? What is special about that dish? What food do people in your country typically eat? Describe it in detail.", "당신의 나라에서 인기 있는 음식이나 음식은 무엇인가요? 왜 이 음식이 인기가 있나요? 그 요리의 특별한 점은 무엇인가요? 당신의 나라 사람들은 보통 어떤 음식을 먹나요? 자세히 설명해 주세요."]], "cards": [["Well, if I had to point out one thing about popular food in my country, it would be Korean barbecue.", "우리나라의 인기 있는 음식을 한 가지 꼽자면 한국식 바비큐(고기구이) 예요.", "popular food in my country"], ["I say this because people love grilling meat together at the table. It is not just about the taste. It is also about spending time together.", "그렇게 말하는 이유는 사람들이 함께 테이블에서 고기를 구워 먹는 걸 좋아하기 때문이에요. 이건 맛 때문만이 아니에요. 함께 시간을 보내는 것도 중요해요.", "not just about the taste"], ["That's the main thing I notice about Korean food culture. I think it's worth mentioning.", "이게 한국 음식 문화에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요.", "the main thing I notice about Korean food culture"]]},
{"id": "t29", "name": "개인 패션 스타일 (Fashion) [묘사]", "group": "주제 연습", "qs": [["What kind of clothes do you like to wear personally? What are you wearing today? What kind of fashion style do you like? Give me all the details about your fashion style.", "당신은 개인적으로 어떤 옷을 즐겨 입나요? 오늘은 어떤 옷을 입고 있나요? 어떤 패션 스타일을 좋아하시나요? 당신의 패션 스타일에 대해 모든 것을 자세히 말해 주세요."]], "cards": [["Well, if I had to point out one thing about my personal fashion style, it would be clean and comfortable basics.", "제 개인 패션 스타일에서 한 가지를 꼽자면 깔끔하고 편안한 기본템 위주의 스타일이에요.", "clean and comfortable basics"], ["I say this because I like simple outfits. They look neat. They also let me move freely all day.", "그렇게 말하는 이유는 단순한 옷을 좋아하기 때문이에요. 깔끔해 보여요. 또 하루 종일 편하게 움직일 수 있어요.", "let me move freely all day"], ["That's the main thing I notice about my style. I think it's worth mentioning.", "이게 제 스타일에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요.", "the main thing I notice about my style"]]},
{"id": "t30", "name": "미용실 (Hair Salon) [묘사]", "group": "주제 연습", "qs": [["Describe the place where you usually get your hair cut. What does it look like? What kind of atmosphere does it have? Why do you prefer going there?", "자주 가는 미용실에 대해 설명해 주세요. 그곳은 어떤 모습인가요? 분위기는 어떤 가요? 왜 그곳에 가는 걸 선호하나요?"]], "cards": [["Well, if I had to point out one thing about my hair salon, it would be its calm, cozy vibe.", "제 미용실에 대해 한 가지만 꼽자면, 아늑하고 차분한 분위기예요.", "its calm, cozy vibe"], ["I say this because the space is small but nicely designed. It has soft lighting, light-wood mirrors, and quiet indie music. So I can relax while I get my hair done.", "그렇게 말하는 이유는 공간은 작지만 멋지게 꾸며져 있기 때문이에요. 조명도 부드럽고, 원목 거울과 잔잔한 음악도 있어요. 그래서 머리를 하는 동안 편하게 쉴 수 있어요.", "I can relax while I get my hair done"], ["That's the main thing I notice about this place. I also prefer it because the stylist remembers my preferences and doesn't rush. The results always look natural.", "이게 이곳에서 가장 눈에 띄는 점이에요. 또 디자이너가 제 취향을 기억하고 서두르지 않아서 좋아요. 결과도 항상 자연스러워요.", "results always look natural"]]},
{"id": "t31", "name": "치과 (Dentist) [묘사]", "group": "주제 연습", "qs": [["I'd like to discuss your dental clinic. Tell me where it is located, and describe the clinic in as much detail as possible.", "다니시는 치과에 대해 얘기하고 싶습니다. 어디 있나요, 치과를 최대한 자세히 묘사해주세요."]], "cards": [["Well, if I had to point out one thing about my dental clinic, it would be how clean and efficiently organized it is.", "음, 제가 다니는 치과에 대해 한 가지 말해야 한다면, 정말 깨끗하고 효율적으로 잘 정돈되어 있다는 점을 꼽을 것 같아요.", "how clean and efficiently organized it is."], ["I say this because it's located on the 3rd floor near the subway. Inside, everything feels organized. There is a bright reception area, consultation rooms, and modern equipment.", "그 이유는 지하철 근처 3층에 있기 때문이에요. 안에 들어가면 모든 게 잘 정돈되어 있어요. 밝은 접수대, 진료실, 최신 장비가 있어요.", "everything feels organized"], ["That's the main thing I notice about this clinic. I think it's worth mentioning.", "이게 이 치과에서 가장 눈에 띄는 점이에요. 짚고 넘어갈 만하다고 생각해요.", "the main thing I notice about this clinic"]]},
{"id": "t32", "name": "은행 (Banks) [묘사]", "group": "주제 연습", "qs": [["Describe the banks in your country. Where are they usually located, and what are they like? What hours are banks typically open there? Give me as many details as possible.", "당신 나라의 은행을 묘사해주세요. 주로 어디에 있고 어떻게 생겼나요? 영업 시간이 어떻게 되나요?"]], "cards": [["I'd like to talk about banks in my country.", "저는 우리나라의 은행들에 대해 이야기하고 싶어요.", "banks in my country."], ["They're usually located in busy downtown areas or near subway stations, and they've got a really clean and professional vibe.", "은행들은 주로 도심 지역이나 지하철역 근처에 위치해 있고, 전체적으로 깔끔하고 전문적인 분위기예요.", "in busy downtown areas or near subway stations"], ["The first thing you notice is the bright lighting and digital kiosks. Staff also help customers with online banking. Overall, it feels modern and efficient.", "가장 먼저 눈에 띄는 건 밝은 조명과 디지털 키오스크예요. 직원들도 온라인 뱅킹을 도와줘요. 전체적으로 현대적이고 효율적인 느낌이에요.", "it feels modern and efficient"], ["What I like most is the service. It is organized and polite. It always makes me feel safe and well taken care of.", "제가 가장 좋아하는 점은 서비스예요. 서비스가 체계적이고 친절해요. 항상 안전하고 잘 보살핌을 받는 느낌이 들어요.", "It always makes me feel safe"], ["That's basically why I like this place.", "제가 가장 좋아하는 점은 서비스가 매우 체계적이고 직원들이 친절하다는 점이에요.", "basically why I like this place"], ["Oh, and most banks are open from around 9 a.m. to 4 p.m. on weekdays, but they're closed on weekends.", "그래서 갈 때마다 안심되고 잘 돌봄을 받는 느낌이 들어요. 그래서 저는 은행을 꽤 좋아해요. 아, 그리고 대부분의 은행은 평일 오전 9시부터 오후 4시까지 운영하고, 주말에는 문을 닫아요.", "most banks are open from around 9 a.m. to 4 p.m. on weekdays, but they're closed on weekends."]]},
{"id": "t33", "name": "지형 (Geography) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["Tell me about your country's geography. Are there many mountains, rivers, or other landforms? Tell me about the layout of your country's land in detail.", "당신의 나라 지형에 대해 말해주세요. 산, 강 또는 다른 지형이 많이 있나요? 당신의 나라 지형 구성에 대해 자세히 말해주세요."], ["Describe the geography of your country. What is special about it? Please give me all the details.", "당신 나라의 지리에 대해 설명해 주세요. 무엇이 특별한가요? 모든 세부 사항을 알려 주세요."]], "cards": [["I'd like to talk about the geography of my country, Korea.", "저는 한국의 지리에 대해 이야기하고 싶어요.", "the geography of my country, Korea."], ["It's in East Asia, and it's got a really beautiful and natural vibe with lots of mountains and rivers.", "한국은 동아시아에 있고, 산과 강이 많아서 자연이 참 아름다워요.", "East Asia, and it's got a really beautiful and natural vibe with lots of mountains and rivers."], ["The first thing you notice is the mountains. They are almost everywhere. There is also a big river called the Han River. It runs through Seoul.", "가장 먼저 눈에 띄는 건 산이에요. 거의 모든 곳에 산이 있어요. 한강이라는 큰 강도 있어요. 이 강은 서울을 가로질러 흘러요.", "There is also a big river"], ["Overall, it feels peaceful and green. There are beaches, islands, and small towns around the country.", "전체적으로 평화롭고 초록빛이 가득해요. 해변, 섬, 작은 마을들이 나라 곳곳에 있어요.", "it feels peaceful and green"], ["What I like most is that you can see many different kinds of nature nearby. You don't have to travel far. This always makes me feel relaxed and proud.", "제가 가장 좋아하는 점은 가까운 곳에서도 다양한 자연을 볼 수 있다는 거예요. 멀리 갈 필요가 없어요. 그래서 항상 편안하고 자랑스러운 느낌이 들어요.", "don't have to travel far"], ["That's basically why I like this place.", "그래서 저는 우리나라의 지리를 정말 좋아해요.", "basically why I like this place"]]},
{"id": "t34", "name": "재활용 (Recycling) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["Recycling is a common practice. How do people in your country recycle? What kinds of items do people usually recycle? What is special about recycling? Please tell me about the recycling system in your country in detail.", "재활용은 흔한 관행입니다. 당신의 나라에서는 사람들이 어떻게 재활용을 하나요? 사람들이 보통 재활용하는 품목은 어떤 것들인가요? 재활용에 대해 특별한 점은 무엇인가요? 당신 나라의 재활용 시스템에 대해 자세히 말해 주세요."]], "cards": [["I'd like to tell you about recycling in Korea.", "한국의 재활용 문화에 대해 이야기해보려고 해요.", "recycling"], ["We are proud of this. It is well-organized and efficient.", "우리는 이걸 자랑스러워해요. 체계적이고 효율적으로 운영되고 있어요.", "well-organized and efficient"], ["You will see color-coded bins for plastics, cans, and glass in many neighborhoods. You will also see RFID machines for food waste. Most people see this as a normal daily habit. We also use special trash bags and stickers for big items.", "많은 동네에서 플라스틱, 캔, 유리병을 색깔별로 분리하는 쓰레기통을 볼 수 있어요. 음식물 쓰레기용 RFID 기계도 있어요. 대부분의 사람들은 이걸 당연한 일상 습관으로 여겨요. 종량제 봉투나 큰 물건용 스티커도 사용해요.", "a normal daily habit"], ["I think this shows what our society values. We value order and shared responsibility. Recycling is more than just a system here. It is something we are proud of.", "저는 이게 우리 사회가 중요하게 여기는 걸 보여준다고 생각해요. 우리는 질서와 공동 책임을 중요하게 생각해요. 재활용은 단순한 시스템이 아니에요. 우리가 자부심을 느끼는 부분이에요.", "something we are proud of"]]},
{"id": "t35", "name": "휴일 (Holidays) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["Let's talk about one of the major holidays in your country. What kinds of holidays are there? How do you celebrate them? Please give me all the details.", "당신 나라의 주요 명절에 대해 이야기해 봅시다. 어떤 명절들이 있나요? 그 명절들을 어떻게 축하하나요? 모든 세부 사항을 알려 주세요."]], "cards": [["I'd like to tell you about Chuseok, one of the major holidays in Korea.", "한국의 대표 명절 중 하나인 추석에 대해 말씀드릴게요.", "Chuseok"], ["It's something we're actually pretty proud of because it's meaningful and brings families together.", "가족이 함께 모여 의미 있는 시간을 보내는 날이라 우리가 정말 자부심을 갖고 있어요.", "it's meaningful and brings families together"], ["During Chuseok, people travel to their hometowns. They cook traditional food like songpyeon. They also visit family graves to show respect. Most people use this time to thank their family and relax a little.", "추석에는 사람들이 고향에 내려가요. 송편 같은 전통 음식을 만들어요. 조상님 묘소에도 가서 성묘를 해요. 대부분 이 시간에 가족에게 감사하고 조금 쉬어요.", "travel to their hometowns"], ["Personally, I think it really shows what we value as a society… family, respect, and tradition.", "개인적으로 이건 우리가 사회적으로 중요하게 여기는 가족, 존중, 전통을 잘 보여준다고 생각해요.", "family, respect, and tradition"], ["So yeah, Chuseok isn't just a holiday here… it's something we take pride in.", "그래서 추석은 단순한 명절이 아니라 우리가 자부심을 갖는 문화예요.", "Chuseok"]]},
