{"id": "t92", "name": "교통수단(Transportation)어드밴스 [과거경험]", "group": "주제 연습", "qs": [["Sometimes riding the subway or bus can be uncomfortable. Have you ever had any problems related to transportation? Were there traffic jams, or did something uncomfortable happen? What was the problem, and how did you deal with the situation?", "때때로 지하철이나 버스를 타는 것은 불편할 수 있습니다. 당신은 교통수단과 관련된 문제를 겪은 적이 있나요? 교통체증이 있었나요, 아니면 불편한 일이 있었나요? 무엇이 문제였고, 그 상황에 어떻게 대처했나요?"]], "cards": [["Okay, so one problem I had while I was taking the bus home, happened a few weeks ago.", "음, 그러니까 몇 주 전에 버스 타고 집에 가다가 겪었던 문제가 하나 있었어요.", "taking the bus home"], ["I think I was just tired or something. I took the wrong bus. I was also on the wrong side. It was a mess.", "그냥 좀 피곤했던 것 같아요. 버스를 잘못 탔어요. 반대편에서 탔던 것 같아요. 완전 엉망이었어요.", "It was a mess"], ["I still don't know why I made such a silly mistake. I had to spend my whole evening traveling back home again.", "왜 그런 멍청한 실수를 했는지 아직도 모르겠어요. 저녁 내내 다시 집으로 돌아가야 했어요.", "traveling back home again"]]},
{"id": "t93", "name": "휴일 (Holidays) 어드밴스 1 [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable or unforgettable holiday memory you had in your childhood. Where were you on that day? Who did you spend that holiday with? What did you do? Explain all the experiences in detail.", "어렸을 때 기억하거나 잊을 수 없는 휴일의 경험에 대해 말해주세요. 그날 당신은 어디에 있었나요? 그 휴일을 누구랑 보냈나요? 무엇을 하셨나요? 모든 경험을 자세히 설명해주세요."]], "cards": [["Honestly, I don't usually get excited about holidays or family gatherings. But I decided to try it once. I'm glad I did.", "솔직히 저는 보통 명절이나 가족 모임에 그렇게 신나하는 편은 아니에요. 그런데 한 번 제대로 해보기로 했어요. 해보길 잘했다고 생각해요.", "I'm glad I did"], ["It was when I was in elementary school, around fourth grade, and I was with my family.", "그때가 초등학교 4학년쯤이었고, 가족들이랑 같이 있었어.", "when I was in elementary school, around fourth grade"], ["We went to my grandparents' house in the countryside. We cooked holiday food together. We also played games in the living room. At first, I wasn't really into it.", "우리는 시골에 있는 할머니 할아버지 댁에 갔어요. 같이 명절 음식을 만들었어요. 거실에서 게임도 했어요. 처음에는 별로 흥미가 없었어요.", "wasn't really into it"], ["But it turned out to be really fun and meaningful, and it totally changed how I see it.", "근데 막상 해보니까 진짜 재밌고 의미 있더라.", "really fun and meaningful"], ["Now I actually enjoy simple family holidays like that. I even look forward to them. That still surprises me.", "지금은 오히려 그런 소소한 가족 명절을 좋아해요. 심지어 기대까지 하게 돼요. 그게 아직도 좀 신기해요.", "still surprises me"]]},
{"id": "t94", "name": "휴일 (Holidays) 어드밴스 2 [과거경험]", "group": "주제 연습", "qs": [["Talk about the last holiday you had. What holiday was it? How did you spend it?", "마지막으로 보낸 휴일에 대해 이야기해 주세요. 어떤 연휴였나요? 어떻게 지냈나요?"]], "cards": [["Well… it was this past Chuseok, and I was with my family.", "음… 지난 추석 때였고, 가족이랑 같이 있었어요.", "this past Chuseok"], ["We went to my grandparents' house in the countryside. We cooked holiday food together, played games in the living room, and even set off fireworks. At first, I wasn't really into it.", "시골에 있는 할머니 할아버지 댁에 갔어요. 같이 명절 음식도 만들고, 거실에서 게임도 하고, 폭죽도 터뜨렸어요. 처음에는 별로 흥미가 없었어요.", "even set off fireworks"], ["But it turned out to be really fun and meaningful, and it totally changed how I see it.", "그런데 알고 보니 정말 재미있고 뜻깊었고, 그게 제가 그걸 보는 방식을 완전히 바꿔 놨어요.", "really fun and meaningful"], ["Now I actually enjoy simple family holidays like that. I even look forward to them. That still surprises me.", "지금은 오히려 그런 소소한 가족 명절을 좋아해요. 심지어 기대까지 하게 돼요. 그게 아직도 좀 신기해요.", "still surprises me"]]},
{"id": "t95", "name": "호텔 (Hotels) [과거경험]", "group": "주제 연습", "qs": [["When was the last time you stayed in a hotel? Where did you stay? Why were you there? What did you do at the hotel? Tell me everything from beginning to end.", "마지막으로 호텔에 묵은 게 언제 인가요? 어디에 머물렀나요? 왜 거기 있었나요? 당신은 호텔에서 무엇을 했나요? 처음부터 끝까지 모두 말해 주세요."]], "cards": [["Well… it was when I this Chuseok, and I was with my family.", "음… 그건 이번 추석이었고, 그리고 저는 가족과 함께 있었어요.", "when I this Chuseok"], ["We went to a resort in Jeju Island. At first, I wasn't that into it. I'm more of a city hotel person.", "우리는 제주도에 있는 리조트에 갔어요. 처음에는 별로 끌리지 않았어요. 저는 원래 도시 호텔을 더 좋아하는 편이에요.", "more of a city hotel person"], ["But it turned out to be amazing, and it totally changed how I saw resorts.", "하지만 결국 정말 놀라운 경험이었고, 리조트에 대한 제 생각을 완전히 바꿔 놓았어요.", "amazing"], ["Now I actually look forward to family holidays like that. I also look forward to nature resorts. That still surprises me.", "지금은 오히려 그런 가족 휴가를 기대하게 됐어요. 자연 속 리조트도 기대하게 됐어요. 그게 아직도 좀 신기해요.", "still surprises me"]]},
{"id": "t96", "name": "지형(Geography) 어드밴스 1 [과거경험]", "group": "주제 연습", "qs": [["Tell me about a unique landform you saw when you were a child. When was it, and where did you go? Who did you go with? What was the occasion? Describe what you saw and what happened in detail.", "어렸을 때 봤던 독특한 지형에 대해 말해주세요. 그게 언제였고, 어디로 갔었나요? 누구랑 갔나요? 어떤 이유로 갔나요? 무엇을 보고, 어떤 일이 있었는지 자세히 묘사해주세요."]], "cards": [["I wanna tell you about a memorable experience I had at Jeju Island.", "제주도에서 진짜 독특한 지형을 봤던 경험을 말해볼게.", "at Jeju Island"], ["Honestly, I don't usually pay much attention to nature. But I decided to try it once. I'm glad I did.", "솔직히 저는 보통 자연에 그렇게 관심이 많은 편은 아니에요. 그런데 한 번 제대로 보기로 했어요. 보길 잘했다고 생각해요.", "I'm glad I did"], ["It was back when I was in elementary school on a school trip, and I was with my classmates and teachers.", "그때는 초등학교 때 수학여행이었고, 친구들이랑 선생님들이랑 같이 갔어.", "back when I was in elementary school on a school trip"], ["We hiked up to a huge volcanic crater. We looked down into the middle of it. At first, I wasn't that into it.", "우리는 큰 화산 분화구까지 올라갔어요. 그 가운데를 내려다봤어요. 처음에는 별로 흥미가 없었어요.", "huge volcanic crater"], ["But it turned out to be really cool, and it totally changed how I see it.", "근데 막상 보니까 진짜 멋있더라, 그래서 내가 자연을 보는 눈이 좀 달라진 것 같아.", "really cool"], ["Now, when I travel, I like noticing different landforms. For example, I enjoy looking at mountains and cliffs. That still surprises me.", "지금은 여행 갈 때 다양한 지형을 관심 있게 봐요. 예를 들어 산이나 절벽 같은 걸 좋아해요. 그게 아직도 좀 신기해요.", "mountains and cliffs"]]},
{"id": "t97", "name": "지형(Geography) 어드밴스 2 [과거경험]", "group": "주제 연습", "qs": [["I would like you to think about a specific historical event that affected the relationship between your country and one of its neighboring nations. It could be a treaty signed between countries, a cultural event, the visit of a minister of a president, etc. Tell me everything in detail that happened concerning this event.", "당신 나라와 다른 나라들 간의 관계에서 변화한 점에 대해 자세히 설명해주세요. 변화는 경제, 스포츠, 예술, 문화, 정치 등과 관련이 있을 수 있습니다. 그 변화들에 대해 자세히 설명해주세요."]], "cards": [["Let me tell you about a hard part of history between Korea and Japan.", "한국과 일본 사이의 어려운 역사 중 하나에 대해 이야기해볼게요.", "of history between Korea and Japan"], ["During World War II, many Korean women were taken by Japan and forced to work as “comfort women.” It was a very painful time.", "2차 세계대전 동안, 많은 한국 여성들이 일본에 의해 끌려가 ‘위안부'로 강제로 일하게 되었어요. 그 시기는 정말 고통스러운 시간이었습니다.", "many Korean women were taken by Japan and forced to work as “comfort women.” It was a very painful time"], ["After the war, Korea wanted Japan to say sorry and take responsibility.", "전쟁이 끝난 후, 한국은 일본이 사과하고 책임을 인정하길 원했어요.", "Korea wanted Japan to say sorry and take responsibility"], ["But Japan didn't really apologize for many years.", "하지만 일본은 오랫동안 제대로 사과하지 않았습니다.", "didn't really apologize for many years"], ["Even now, this issue still causes tension.", "지금까지도 이 문제는 양국 사이에 긴장을 일으켜요.", "this issue still causes tension"], ["Many Koreans are still hurt by it, and it affects how the two countries get along.", "많은 한국인들이 여전히 상처를 가지고 있고, 이 때문에 두 나라의 관계에도 영향을 끼칩니다.", "and it affects how the two countries get along"]]},
{"id": "t98", "name": "음식 (Food) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you had while you were eating something. What food did you eat? Was it good or bad? What happened, and what did you do? Tell me about it in detail.", "당신이 무언가를 먹으면서 겪었던 기억에 남는 경험에 대해 말해주세요. 어떤 음식을 먹었나요? 맛있었나요, 맛없었나요? 무슨 일이 일어났고, 당신은 무엇을 했나요? 그것에 대해 자세히 말해주세요."]], "cards": [["Wow!", "와!", "Wow"], ["For sure… it was the time I tried Durian for the first time.", "진짜요… 제가 기억에 남는 건 처음으로 두리안을 먹어보려고 했던 때예요.", "Durian"], ["I was hosting a little get-together at home and my friend brought over a giant durian from an international market.", "집에서 작은 모임을 열었는데, 친구가 국제 마켓에서 엄청 큰 두리안을 사 와서 가져왔거든요.", "a giant durian"], ["All I remember is the stench.", "제가 기억하는 건 그 냄새뿐이에요.", "stench"], ["The potent, pungent stench.", "강하고, 톡 쏘고, 진짜 말도 안 되게 독한 냄새…", "pungent stench"], ["Man, I tell you, it stunk up the whole house… I was kind of angry at my friend.", "와, 집 전체에 냄새가 퍼져서 순간 친구한테 좀 화도 났어요.", "it stunk up the whole house"], ["But yeah, that durian. I never ate it. It smelled too bad. That is still my memorable food experience.", "그래도 그 두리안 얘기예요. 저는 결국 못 먹었어요. 냄새가 너무 심했거든요. 그래도 그게 제 기억에 남는 음식 경험이에요.", "I never ate it"]]},
{"id": "t99", "name": "기술 (Technology) [과거경험]", "group": "주제 연습", "qs": [["What kind of technology did you mostly use recently? It could be a mobile phone or a laptop computer. What did you use it for? Tell me about your experience in detail.", "최근에 주로 어떤 기술을 사용하셨나요? 그것은 휴대폰일 수도 있고 노트북일 수도 있습니다. 어떻게 그것을 사용하셨나요? 당신의 경험에 대해 자세히 말해 주세요."]], "cards": [["Well… recently, the technology I've been using the most is my laptop, uh, pretty much every day.", "음… (잠깐 멈춤) 최근에 제가 가장 많이 사용하는 기술은 노트북이에요. 어…, 거의 매일 써요.", "laptop"], ["I mainly use it for work and studying… ummm… writing documents, making lesson materials, and sometimes editing videos.", "주로 일이랑 공부할 때 쓰는데, 문서 작성도 하고 수업 자료도 만들고, 가끔 영상 편집도 해요.", "work and studying"], ["And you know, I also keep a bunch of tabs open for research, so I try to stay organized with folders and bookmarks.", "그리고 있잖아요, 자료 찾느라 탭을 엄청 많이 열어두는 편이라 폴더랑 북마크로 정리하려고 해요.", "organized with folders and bookmarks"], ["Overall, it has been very convenient. Honestly, it helps me get a lot done.", "전체적으로 정말 편리했어요. 솔직히 말하면, 덕분에 일을 훨씬 많이 처리할 수 있어요.", "very convenient"]]},
{"id": "t100", "name": "기술(Technology) 어드밴스 / 전자기기(Electronics) / 휴대폰(Phone) [과거경험]", "group": "주제 연습", "qs": [["Problems often come up related to technology. Tell me about an experience you had when you used technology. Was it not working properly, or was there any trouble with it? What happened, and how did you solve the problem?", "기술과 관련된 문제가 종종 발생합니다. 당신이 기술을 사용했을 때 겪은 경험에 대해 말해 주세요. 제대로 작동하지 않았나요, 아니면 어떤 문제가 있었나요? 무슨 일이 있었고, 그 문제를 어떻게 해결했나요?"], ["Have you ever experienced any problems with your electronics? Describe the difficulty you faced and how you solved that problem.", "전자제품에서 문제가 생긴 적이 있나요? 겪었던 어려움과 그 문제를 어떻게 해결했는지 설명해 주세요."], ["Have you ever experienced any problems using your phone? What was the problem? How did you deal with it? Give me many details.", "휴대폰 사용에 문제가 생긴 적이 있나요? 무엇이 문제였나요? 어떻게 대처하셨나요? 자세히 이야기해 주세요."]], "cards": [["Okay, so one problem I had with my phone, happened a few weeks ago.", "휴대폰을 사용하다가 한 번 문제가 생긴 적이 있는데, 몇 주 전에 있었던 일이에요.", "had with my phone"], ["I think I was just tired that day. I dropped my phone so many times. Then I cracked the screen. It was a mess.", "그날은 그냥 너무 피곤했던 것 같아요. 휴대폰을 정말 여러 번 떨어뜨렸어요. 그러다가 화면이 깨졌어요. 완전 난리였죠.", "dropped my phone so many times"], ["I still don't know why I made such a stupid mistake. I had to go to the repair store. I waited there all evening for my screen to be fixed.", "왜 그런 바보 같은 실수를 했는지 아직도 모르겠어요. 결국 수리점에 가야 했어요. 거기서 화면을 고치는 동안 저녁 내내 기다렸어요.", "I had to go to the repair store"], ["It was the worst.", "진짜 최악이었어요.", "It was the worst"]]},
{"id": "t101", "name": "가구 (Furniture) [과거경험]", "group": "주제 연습", "qs": [["Can you tell me about a piece of furniture you bought recently for some reasons?", "최근에 산 가구에 대해 이야기해 주세요."], ["When was the last time you bought a new piece of furniture? Where did you buy it? Who did you go with?", "마지막으로 새 가구를 산 경험에 대해 이야기해 주세요."]], "cards": [["Well… the last piece of furniture I bought was a desk, uh, a few months ago.", "음… 제가 최근에 산 가구는 책상인데요, 어…, 몇 달 전에 샀어요.", "a desk"], ["I bought it online. I work from home a lot. So I needed something more ergonomic.", "온라인으로 구매했어요. 재택근무를 많이 하거든요. 그래서 좀 더 인체공학적인 책상이 필요했어요.", "something more ergonomic"], ["I didn't go with anyone, but I spent some time kind of comparing reviews and measurements beforehand.", "누구랑 같이 간 건 아니지만, 구매 전에 약간 리뷰랑 사이즈를 비교해 봤어요.", "kind of"], ["I set it up at home. It made my workspace much more comfortable. Honestly, it really improved my productivity.", "집에 설치했어요. 작업 공간이 훨씬 편해졌어요. 솔직히 말하면, 생산성이 정말 많이 좋아졌어요.", "much more comfortable"]]},
{"id": "t102", "name": "가구 (Furniture) 2 [과거경험]", "group": "주제 연습", "qs": [["Have you ever experienced any problems with your furniture? Describe the difficulty you faced and how you solved that problem.", "가구에서 문제가 생긴 적이 있나요? 겪었던 어려움과 그 문제를 어떻게 해결했는지 설명해 주세요."]], "cards": [["Okay, so one problem I had with a new furniture I got, happened a few weeks ago.", "새로 산 가구 때문에 한 번 문제가 생긴 적이 있는데, 몇 주 전에 있었던 일이에요.", "a new furniture I got"], ["I think I was just tired when I ordered it. I bought a lamp from Temu. It turned out to be a mess.", "주문할 때 그냥 너무 피곤했던 것 같아요. Temu에서 램프를 하나 샀어요. 그런데 결국 완전 난리가 났어요.", "I bought a lamp from Temu"], ["It was a lego lamp. I thought it would arrive already built. But it was actually a DIY lego lamp.", "레고 램프였어요. 저는 이미 완성되어 올 줄 알았어요. 그런데 사실은 직접 조립해야 하는 DIY 레고 램프였어요.", "It was a lego lamp"], ["I still don't know why I made such a stupid mistake. I had to spend the whole evening building the lamp.", "왜 그런 바보 같은 실수를 했는지 아직도 모르겠어요. 결국 저녁 내내 램프를 조립해야 했어요.", "building the lamp"], ["It was the worst.", "진짜 최악이었어요.", "It was the worst"]]},
{"id": "t103", "name": "패션 (Fashion) [과거경험]", "group": "주제 연습", "qs": [["Please tell me about the last time you went clothes shopping. Where did you go to buy it? What items did you buy?", "마지막으로 옷 사러 간 게 언제 인지 말해 주세요. 당신은 그것을 사러 어디로 갔었나요? 당신은 어떤 것들을 샀나요?"]], "cards": [["Well… (slight pause) the last time I went clothes shopping was a few weeks ago, uh, at a department store near my place.", "음… (잠깐 멈춤) 마지막으로 옷을 사러 간 건 몇 주 전이었고, 어…, 집 근처 백화점에 갔어요.", "department store near my place"], ["I went there because I needed some basic everyday clothes, nothing too fancy.", "일상에서 입을 기본 아이템들이 필요해서 그쪽으로 가게 됐어요.", "basic everyday clothes"], ["I ended up buying a jacket and a couple of tops. I tried them on a few times. I wanted to check the fit.", "결국 재킷 하나랑 상의 몇 벌을 샀어요. 몇 번 입어봤어요. 핏을 확인하고 싶었거든요.", "a jacket and a couple of tops"], ["Overall, the whole experience was pretty smooth, and honestly, it was totally worth it.", "전체적으로 되게 수월한 쇼핑이었고, 솔직히 말하면, 완전 만족스러운 선택이었어요.", "totally worth it"]]},
{"id": "t104", "name": "헬스장 (Gyms) 1 [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable moment you had at the gym. What happened? Who were you with? Why was it memorable? Tell me in as much detail as you can.", "헬스장에서 있었던 기억에 남는 순간에 대해 이야기해 주세요. 무슨 일이 있었나요? 누구와 함께 있었나요? 왜 그 순간이 기억에 남나요? 가능한 한 자세하게 말해 주세요."]], "cards": [["This one's kinda random, but I ran into someone I knew at the gym.", "이건 좀 뜬금없는 이야기인데, 헬스장에서 아는 사람을 우연히 만났어요.", "at the gym."], ["I wasn't expecting to see them there, so it kinda caught me off guard.", "거기서 볼 줄은 전혀 몰라서 좀 당황했죠.", "so it kinda caught me off guard"], ["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "그래서 잠깐 이야기를 나눴어요. 그냥 근황이랑 이런저런 얘기를 했어요. 덕분에 하루가 기분 좋아졌어요.", "made my day"], ["It felt nice to see a familiar face out of nowhere. It reminded me that the world is small.", "갑자기 아는 얼굴을 보니까 기분이 좋았어요. 세상이 참 좁다는 생각이 들었어요.", "the world is small"]]},
{"id": "t105", "name": "헬스장 (Gyms) 2 [과거경험]", "group": "주제 연습", "qs": [["Tell me about a time where you faced a problem at the gym. What was it about? What was the problem? How did you resolve the problem? Tell me in as much detail as you can.", "헬스장에서 문제를 겪었던 경험에 대해 이야기해 주세요. 어떤 상황이었나요? 문제는 무엇이었고, 그 문제를 어떻게 해결했나요? 가능한 한 자세하게 말해 주세요."]], "cards": [["Okay, great, so a problem hmm… Alright, I only have one thing on my mind and it's this.", "음… 좋아요, 그러니까 문제 하나가 있었는데요… 지금 딱 떠오르는 건 이거예요.", "I only have one thing on my mind and it's this"], ["The last time I went to the gym, I forgot to bring my smart watch and it just felt so wrong.", "지난번에 헬스장에 갔을 때 스마트워치를 깜빡하고 안 가져온 거예요.", "the gym"], ["I always log my workouts, so without my watch, everything felt kind of worthless.", "근데 그게 진짜 너무 이상하게 느껴졌어요.", "everything felt kind of worthless"], ["I thought about running home to grab it. But then I would have to come back, and that felt like extra work. So I just did the workout without my watch.", "집에 뛰어가서 가져올까 생각했어요. 그런데 다시 돌아와야 하니까 너무 번거로울 것 같았어요. 그래서 그냥 워치 없이 운동했어요.", "did the workout without my watch"], ["I mean, it was not a huge disaster. But it still annoyed me a lot.", "그러니까, 엄청 큰일은 아니었어요. 그런데 그래도 많이 짜증 났어요.", "it still annoyed me a lot"], ["I told myself, “Today is about consistency.” I finished my routine. Later, I wrote down what I did from memory.", "저는 스스로에게 “오늘은 꾸준함이 중요해”라고 말했어요. 루틴을 끝냈어요. 나중에 기억나는 대로 운동한 걸 적었어요.", "wrote down what I did"], ["I swear, it was a horrible memory.", "진짜로 말하면… 꽤 별로였던 기억이에요.", "it was a horrible memory"]]},
{"id": "t106", "name": "헬스장 (Gyms) 어드밴스 1 [과거경험]", "group": "주제 연습", "qs": [["Tell me about a time you reached your goal at the gym. What was your goal? What steps did you to take to accomplish your goals? Tell me in as much detail as you can.", "헬스장에서 목표를 달성했던 경험에 대해 이야기해 주세요. 그때의 목표는 무엇이었나요? 그 목표를 이루기 위해 어떤 과정과 노력을 했나요? 가능한 한 자세하게 설명해 주세요."]], "cards": [["Umm… that's a great question…", "음… 좋은 질문이에요…", "that's a great question"], ["So for my New Year's resolution, I planned to lose weight, but honestly, I didn't fully achieve that goal.", "그래서 새해 목표로는 살을 빼는 걸 계획했었는데, 솔직히 말하면 그 목표를 완전히 이루지는 못했어요.", "I didn't fully achieve that goal"], ["At first I was disappointed, but over time, my focus shifted.", "처음에는 좀 실망했는데, 시간이 지나면서 생각이 바뀌었어요.", "my focus shifted"], ["Instead of results, I focused on just going to the gym regularly.", "결과보다는 그냥 꾸준히 헬스장에 가는 것에 집중하게 됐거든요.", "just going to the gym regularly"], ["I stopped putting pressure on myself, and little by little, the gym became part of my routine.", "스스로에게 부담을 주는 걸 멈추니까, 조금씩 헬스장이 제 일상이 됐어요.", "the gym became part of my routine"], ["So I didn't reach my original goal. But it was still meaningful. Now going to the gym feels normal, not stressful.", "그래서 처음 목표는 이루지 못했어요. 그래도 충분히 의미 있었어요. 이제는 헬스장에 가는 게 스트레스가 아니라 자연스러운 일이 됐어요.", "feels normal, not stressful"]]},
{"id": "t107", "name": "헬스장 (Gyms) 어드밴스 2 [과거경험]", "group": "주제 연습", "qs": [["Have you ever made a friend at the gym? How did it happen? Tell me about your experience in as much detail as you can.", "헬스장에서 친구를 사귄 적이 있나요? 어떻게 친해지게 되었나요? 그 경험에 대해 가능한 한 자세하게 이야기해 주세요."]], "cards": [["Yeah, I actually met my best friend at the gym.", "네, 실제로 저는 헬스장에서 절친을 만났어요.", "I actually met my best friend at the gym"], ["I first noticed him because he was lifting a huge amount of weight. I was honestly impressed.", "그가 정말 무거운 무게를 들고 있어서 처음 눈에 들어왔어요. 솔직히 정말 인상적이었어요.", "I was honestly impressed"], ["After his set, I went up to him and asked how long he'd been training.", "그 세트를 끝내고 나서 제가 다가가서 얼마나 오래 운동했는지 물어봤어요.", "how long he'd been training"], ["That simple question started a conversation.", "그 간단한 질문 하나로 대화가 시작됐어요.", "That simple question started a conversation"], ["After that, we kept running into each other. We worked out together. We started talking more about life, not just the gym. Over time, we got really close. Now he is one of my best friends.", "그 후로 자주 마주치게 됐어요. 같이 운동도 했어요. 헬스장 얘기뿐만 아니라 삶에 대한 얘기도 많이 했어요. 시간이 지나면서 정말 친해졌어요. 지금은 제 가장 친한 친구 중 한 명이에요.", "one of my best friends"]]},
{"id": "t108", "name": "세탁소 (Dry Cleaners) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you had at a dry cleaner or laundry. What happened? How did you feel at the time, and why was it memorable?", "세탁소에서 있었던 기억에 남는 경험에 대해 이야기해 주세요. 무슨 일이 있었고, 그때 어떤 기분이었나요? 왜 기억에 남나요?"]], "cards": [["I wanna tell you about a memorable experience I had at my dry cleaner.", "세탁소에서 있었던 기억에 남는 경험 하나를 이야기해 볼게요.", "at my dry cleaner"], ["Honestly, I don't usually pay attention to customer service. But I decided to trust them this time. I am glad I did.", "솔직히 저는 보통 고객 서비스에 크게 신경 쓰지 않아요. 그런데 이번에는 한 번 믿어보기로 했어요. 그게 정말 잘한 선택이었어요.", "pay attention to customer service"], ["It was a few weeks ago. I went by myself.", "몇 주 전 일이었어요. 혼자 갔어요.", "I went by myself"], ["We dropped off my coat. We asked for same-day pickup. At first, I did not expect much.", "코트를 맡겼어요. 당일 수거를 부탁했어요. 처음엔 별 기대가 없었어요.", "dropped off my coat"], ["But it turned out to be really reassuring, and it totally changed how I see it.", "그런데 생각보다 마음이 놓이고 안심되는 경험이었고, 그 이후로 그곳을 바라보는 시선이 완전히 달라졌어요.", "really reassuring"], ["Now I actually feel more comfortable using that place regularly. That still surprises me.", "지금은 오히려 그 세탁소를 더 편하게, 자주 이용하게 됐어요. 그게 아직도 좀 놀라워요.", "feel more comfortable using that place regularly"]]},
{"id": "t109", "name": "우체국 (Post Office) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you had at a post office. What happened? Who were you with or who did you meet? Why was it memorable?", "우체국에서 있었던 기억에 남는 경험에 대해 이야기해 주세요. 무슨 일이 있었나요? 누구를 만났나요? 왜 기억에 남나요?"]], "cards": [["I wanna tell you about a memorable experience I had at the post office.", "우체국에서 있었던 기억에 남는 경험에 대해 이야기해 볼게요.", "at the post office"], ["Honestly, I don't usually talk to people there. But that day, I decided to say hi. I am glad I did.", "솔직히 저는 보통 거기서 사람들과 말을 잘 안 해요. 그런데 그날은 한 번 인사를 해봤어요. 그게 꽤 좋았어요.", "talk to people there"], ["It was a few months ago, and I was with just myself.", "몇 달 전 일이었고, 혼자 갔어요.", "a few months ago"], ["We stood in line, and at first I wasn't that into it.", "줄을 서 있다가 자연스럽게 대화를 하게 됐는데, 처음엔 크게 관심이 없었어요.", "stood in line"], ["But it turned out to be really fun, and it totally changed how I see it.", "그런데 그게 의외로 재미있고 기분 좋은 경험이었고, 그 이후로 그곳에 대한 생각이 좀 바뀌었어요.", "really fun"], ["Now I actually don't mind small talk in random places. That still surprises me.", "지금은 오히려 일상적인 장소에서 가벼운 대화를 나누는 것도 괜찮다고 느껴요. 그게 아직도 신기해요.", "don't mind small talk in random places"]]},
{"id": "t110", "name": "도서관 (Library) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you had at a library. What happened? Who did you meet? How did you feel, and why was it memorable? Please tell me in as much detail as you can.", "도서관에서 있었던 기억에 남는 경험에 대해 이야기해 주세요. 무슨 일이 있었나요? 누구를 만났나요? 그때 기분은 어땠고, 왜 기억에 남나요? 가능한 한 자세하게 말해 주세요."]], "cards": [["I wanna tell you about a memorable experience I had at the library.", "도서관에서 있었던 기억에 남는 경험 하나를 이야기해 볼게요.", "at the library"], ["Honestly, I don't usually run into people from my past. But I decided to talk to them that day. I am glad I did.", "솔직히 저는 보통 과거에 알던 사람을 우연히 만나지 않아요. 그런데 그날은 한 번 말을 걸어봤어요. 그게 정말 잘한 선택이었어요.", "run into people from my past"], ["It was a couple of years ago. I went alone.", "몇 년 전 일이었어요. 혼자 갔어요.", "a couple of years ago"], ["We bumped into each other. We started catching up. At first, it felt a little awkward.", "우연히 마주쳤어요. 근황을 나누기 시작했어요. 처음엔 조금 어색했어요.", "bumped into each other"], ["But it turned out to be really meaningful, and it totally changed how I see it.", "그런데 그 시간이 생각보다 의미 있고 따뜻한 경험이었고, 도서관에 대한 인식도 달라졌어요.", "really meaningful"], ["Now I actually enjoy reconnecting with people when it happens. That still surprises me.", "지금은 오히려 이렇게 우연히 다시 만나는 걸 즐기게 됐어요. 그게 아직도 놀라워요.", "enjoy reconnecting with people when it happens"]]},
{"id": "t111", "name": "건강한 사람 (Health) [과거경험]", "group": "주제 연습", "qs": [["Have you had some health problems? Did you have to stop or give up something for health reasons? What was the problem? Did you return to good health? Tell me about it in detail.", "건강상의 문제가 있었나요? 건강상의 이유로 무언가를 중단하거나 포기해야 했나요? 무엇이 문제였나요? 건강은 회복 되셨나요? 자세히 말해 주세요."]], "cards": [["Yeah, I had a health problem before.", "네, 예전에 건강 문제가 있었어요.", "I had a health problem before"], ["I had a bad stomach issue, so I had to stop drinking coffee and avoid greasy food for a while.", "위장에 문제가 생겨서 한동안 커피를 끊고 기름진 음식도 피했어요.", "so I had to stop drinking coffee and avoid greasy food for a while"], ["I went to the clinic, took medicine, and rested at home.", "병원에 가서 약을 먹고 집에서 쉬었어요.", "and rested at home"], ["After a few days, I recovered and went back to my normal routine.", "며칠 지나고 나서 회복해서 다시 평소 생활로 돌아갔어요.", "I recovered and went back to my normal routine"], ["Now I'm healthy again, and it taught me to take better care of my body.", "지금은 다시 건강해졌고, 몸 관리를 더 잘해야겠다고 느꼈어요.", "and it taught me to take better care of my body"]]},
{"id": "t112", "name": "거주지 (Home) 어드밴스 [비교]", "group": "주제 연습", "qs": [["Please tell me about the home you lived in when you were a child. How was that home different from the home you live in now? Give me many details.", "어렸을 때 살았던 집에 대해 이야기해 주세요. 그 집은 지금 살고 있는 집과 어떻게 달랐나요? 가능한 한 자세히 설명해 주세요."], ["Explain how the styles of homes have changed within the past five to ten years in the area where you reside. Describe the differences between the homes built today versus 10 years ago. What changes or developments have you noted?", "당신이 살고 있는 지역에서 지난 5~10년 동안 집의 스타일이 어떻게 변했는지 설명해 주세요. 오늘날 지어진 집들과 10년 전에 지어진 집들 사이의 차이점은 무엇인가요? 어떤 변화나 발전이 있었는지 이야기해 주세요."]], "cards": [["So, from the get-go, the biggest difference is the overall design, you know?", "처음부터 가장 큰 차이는 전체적인 디자인이에요, 알죠?", "the overall design"], ["It's way more modern than before. Honestly, I like it that way. It feels more convenient.", "예전보다 훨씬 모던해졌어요. 솔직히 말하면 저는 이런 점이 좋아요. 훨씬 편리하게 느껴지거든요.", "feels more convenient"], ["Back in the day, homes felt smaller and more closed. Now, it's totally different. Homes are more open and brighter.", "예전에는 집이 좀 더 작고 답답하게 느껴졌어요. 지금은 완전히 달라요. 집이 훨씬 트여 있고 밝아요.", "homes felt smaller and more closed"], ["And yeah, I've tried both, and to be real, I prefer newer homes.", "그리고 둘 다 살아본 입장에서 솔직히 말하면, 저는 요즘 집이 더 좋아요.", "newer homes"], ["I still remember one time. My old place had poor insulation. That shows how different things were back then.", "지금도 기억나는 일이 있어요. 예전에 살던 집은 단열이 안 좋았어요. 그걸 보면 그때랑 지금이 얼마나 다른지 알 수 있어요.", "My old place had poor insulation"], ["So yeah, old and new homes both have their own charm. But I usually go with the modern one. It just feels more like me.", "그래서 결국 옛날 집이랑 요즘 집 둘 다 나름의 매력이 있어요. 하지만 저는 보통 모던한 집을 선택해요. 그냥 제 취향에 더 맞거든요.", "old and new homes"]]},
{"id": "t113", "name": "가구 (Furniture) [비교]", "group": "주제 연습", "qs": [["How would you compare the furniture you had when you were growing up to the furniture you currently have in your home? Discuss any differences in style, functionality, or significance between the two sets of furniture.", "어렸을 때 가지고 있던 가구와 지금 집에 있는 가구를 어떻게 비교하나요? 두 가구 세트 간에 스타일, 기능, 또는 중요성에서 어떤 차이가 있나요?"]], "cards": [["To start with, what really stands out is the change in style and functionality.", "먼저 가장 눈에 띄는 점은 스타일과 기능의 변화예요.", "the change in style and functionality"], ["These days, furniture feels a lot more minimal and practical. Honestly, that works better for me. It's easier to manage and keep organized.", "요즘 가구는 훨씬 미니멀하고 실용적이에요. 솔직히 저한테는 이게 더 잘 맞아요. 정리하기도 쉽고 관리하기도 편하거든요.", "easier to manage and keep organized"], ["Back then, furniture was heavier and more decorative. Now things have changed. It's lighter, simpler, and often multi-purpose.", "예전에는 가구가 더 무겁고 장식적이었어요. 지금은 많이 달라졌어요. 가볍고 단순하면서 다용도로 쓸 수 있는 가구가 많아졌어요.", "lighter, simpler, and often multi-purpose"], ["I've been through both, and personally, I find modern furniture way more enjoyable.", "둘 다 써봤지만, 개인적으로는 요즘 가구가 훨씬 더 마음에 들어요.", "modern furniture"], ["There was even a time when we had a huge wooden cabinet. It took up half the living room. That really shows what furniture used to be like.", "한번은 거실에 큰 나무 장이 있었어요. 거실 절반을 차지할 정도였어요. 그걸 보면 예전 가구 스타일이 어땠는지 잘 알 수 있어요.", "huge wooden cabinet"], ["All in all, both versions have something special. But if I had to choose, I would stick with the furniture I have now.", "결국 둘 다 나름의 매력이 있어요. 하지만 하나를 골라야 한다면, 지금 쓰는 가구를 선택할 것 같아요.", "the furniture I have now"]]},
{"id": "t114", "name": "집안일 (Household chores) [비교]", "group": "주제 연습", "qs": [["What were your childhood experiences with household chores like? Describe the chores you were assigned and your feelings about them.", "어린 시절 집안일에 대한 경험은 어땠나요? 맡았던 집안일과 그것에 대해 느꼈던 감정을 설명해 주세요."]], "cards": [["To start with, what really stands out is how strict chores felt back then.", "먼저 가장 눈에 띄는 점은 어릴 때 집안일이 훨씬 엄격하게 느껴졌다는 점이에요.", "how strict chores felt back then"], ["These days, chores feel a lot more manageable. Honestly, that works better for me. I have more control over my time.", "요즘은 집안일이 훨씬 부담이 적게 느껴져요. 솔직히 저한테는 이게 더 잘 맞아요. 제 시간을 스스로 조절할 수 있거든요.", "more control over my time"], ["Back then, I was in charge of basic chores. I cleaned my room and washed dishes. Now things have changed. I split chores more flexibly on my own schedule.", "예전에는 기본적인 집안일을 맡았어요. 방 청소나 설거지 같은 거였어요. 지금은 많이 달라졌어요. 제 일정에 맞춰 좀 더 자유롭게 나눠서 하고 있어요.", "I was in charge of basic chores"], ["I've been through both, and personally, I find doing chores now way more enjoyable.", "둘 다 경험해 봤지만, 개인적으로는 지금 집안일을 하는 방식이 훨씬 더 좋아요.", "doing chores now"], ["There was even a time when I forgot to take out the trash. I got scolded for it. That really shows what things used to be like.", "한번은 쓰레기 버리는 걸 깜빡한 적이 있어요. 그래서 혼났어요. 그걸 보면 예전 분위기가 어땠는지 잘 알 수 있어요.", "I got scolded for it"], ["All in all, both ways have something special. But if I had to choose, I would stick with how chores are handled now.", "결국 두 방식 모두 나름의 의미가 있어요. 하지만 하나를 골라야 한다면, 지금의 방식을 선택할 것 같아요.", "how chores are handled now"]]},
{"id": "t115", "name": "동네 (Neighborhood) [비교]", "group": "주제 연습", "qs": [["How has the place where you live changed or developed over the past ten years? What was the city like, and what about now? Please tell me in as much detail as possible.", "최근 10년간 당신이 사는 지역은 어떻게 변했거나 발전했나요? 그 도시는 예전에 어땠고, 지금은 어떤가요? 가능한 한 자세히 말해 주세요."]], "cards": [["So, from the get-go, the biggest difference is how much more built-up and convenient it's gotten, you know?", "처음부터 가장 큰 차이는 주변이 훨씬 더 개발되고 편리해졌다는 점이에요, 알죠?", "how much more built-up and convenient it's gotten"], ["It's way more developed than before. Honestly, I like it that way. Everything I need is close by now.", "예전보다 훨씬 발전했어요. 솔직히 말하면 저는 이런 변화가 좋아요. 필요한 게 다 가까이에 있거든요.", "Everything I need is close by now"], ["Back in the day, the area was quieter. There were fewer places to go. Now, it's totally different. There are more cafés, bigger apartment complexes, and better public facilities.", "예전에는 동네가 더 조용했어요. 갈 만한 곳도 많지 않았어요. 지금은 완전히 달라요. 카페도 많아졌고, 아파트 단지도 더 커졌고, 공공시설도 좋아졌어요.", "bigger apartment complexes"], ["And yeah, I've experienced both, and to be real, I prefer how it is now.", "그리고 네, 저는 둘 다 겪어 봤고, 솔직히 말해서 지금이 더 좋아요.", "how it is now"], ["I still remember one time. I had to travel far just to find a decent café or a nice study spot. That shows how different things were back then.", "지금도 기억나는 일이 있어요. 괜찮은 카페나 공부할 만한 곳을 찾으려고 멀리까지 가야 했어요. 그걸 보면 그때랑 지금이 얼마나 다른지 알 수 있어요.", "had to travel far"], ["So yeah, both the old neighborhood and the current one have their own charm. But I usually go with the newer vibe. It just feels more like me.", "그래서 예전 동네랑 지금 동네 둘 다 나름의 매력이 있어요. 하지만 저는 보통 요즘 분위기를 선택해요. 그냥 제 취향에 더 맞거든요.", "the old neighborhood and the current one"]]},
{"id": "t116", "name": "집에서 보내는 휴가(Staycation) [비교]", "group": "주제 연습", "qs": [["Explain how most people choose to spend vacation time in your country. Compare this to how people spent their vacations while you were growing up. Are people vacationing in different ways? How and why have things changed regarding vacationing these days?", "설명해 주세요. 당신의 나라에서 대부분의 사람들이 어떻게 휴가 시간을 보내는지요. 어렸을 때 사람들이 휴가를 어떻게 보냈는지와 비교해 보세요. 사람들이 휴가를 보내는 방식이 달라졌나요? 요즘 휴가 보내는 방식은 어떻게 달라졌고, 왜 그런 변화가 일어났나요?"]], "cards": [["To start with, what really stands out is how popular staycations have become.", "먼저 가장 눈에 띄는 점은 요즘 스테이케이션이 정말 흔해졌다는 점이에요.", "how popular staycations have become"], ["These days, staycations feel a lot more relaxed and flexible. Honestly, that works better for people. It saves money and reduces travel stress.", "요즘 스테이케이션은 훨씬 여유롭고 유연하게 느껴져요. 솔직히 사람들한테 이게 더 잘 맞아요. 돈도 아끼고 이동 스트레스도 줄여주거든요.", "saves money and reduces travel stress"], ["Back then, most families traveled far or visited relatives during vacations. Now things have changed. Many people stay home, go to cafés, or take short local trips instead.", "예전에는 가족들이 멀리 여행을 가거나 친척 집을 방문하는 경우가 많았어요. 지금은 많이 달라졌어요. 집에서 쉬거나 근처 카페에 가거나 짧은 국내 여행을 즐기는 사람이 많아졌어요.", "most families traveled far"], ["I've been through both, and personally, I find staycations way more enjoyable.", "둘 다 경험해 봤지만, 개인적으로는 스테이케이션이 훨씬 더 좋아요.", "staycations"], ["There was even a time when my whole family had to travel together during peak season. That really shows what vacations used to be like.", "한번은 성수기에 가족 모두가 함께 이동해야 했던 적이 있어요. 그걸 보면 예전 휴가 문화가 어땠는지 잘 알 수 있어요.", "my whole family had to travel together"], ["All in all, both ways have something special. But if I had to choose, I would stick with how people vacation these days.", "결국 두 방식 모두 장점이 있어요. 하지만 하나를 골라야 한다면, 요즘 휴가 방식을 선택할 것 같아요.", "how people vacation these days"]]},
{"id": "t117", "name": "공원 (Park) 어드밴스 1 [비교]", "group": "주제 연습", "qs": [["Compare the activities that children do at the park as opposed to what adults do while at parks. Discuss the many facilities at parks that are intended to accommodate both children and adults alike.", "공원에서 어린이들이 하는 활동과 성인들이 하는 활동을 비교해 주세요. 공원에 있는 시설 중에서 어린이와 성인 모두를 위한 시설에 대해 이야기해 주세요."]], "cards": [["To start with, what really stands out is the difference in how kids and adults use parks.", "먼저 가장 눈에 띄는 점은 공원을 이용하는 어린이와 성인의 방식 차이예요.", "the difference in how kids and adults use parks"], ["These days, parks feel a lot more multi-purpose. Honestly, that works better. Parks are designed for all age groups now.", "요즘 공원은 훨씬 다목적 공간처럼 느껴져요. 솔직히 이게 더 잘 맞는 것 같아요. 모든 연령대를 고려해서 설계됐거든요.", "designed for all age groups now"], ["Back then, kids mainly played on playgrounds. Adults just watched. Now things have changed. Kids play, and adults exercise, walk, or relax at the same time.", "예전에는 아이들은 주로 놀이터에서 놀았어요. 어른들은 그냥 지켜보기만 했어요. 지금은 많이 달라졌어요. 아이들은 놀고, 어른들은 운동하거나 산책하거나 쉬기도 해요.", "Kids play, and adults exercise"], ["I've seen both sides, and personally, I find modern parks way more enjoyable.", "두 모습을 다 봐왔지만, 개인적으로는 요즘 공원이 훨씬 더 좋아요.", "modern parks"], ["There was even a time when parks only had basic playground equipment. That really shows what parks used to be like.", "한번은 기본적인 놀이기구만 있는 공원도 있었어요. 그걸 보면 예전 공원이 어땠는지 잘 알 수 있어요.", "parks only had basic playground equipment"], ["All in all, both styles have something special. But if I had to choose, I would stick with today's parks.", "결국 두 방식 모두 매력이 있어요. 하지만 하나를 골라야 한다면, 지금의 공원을 선택할 것 같아요.", "today's parks"]]},
{"id": "t118", "name": "공원 (Park) 어드밴스 2 [비교]", "group": "주제 연습", "qs": [["Pick two different parks you know of and tell me about the differences and similarities. What do you like better, and why? Give me all the details.", "여러분이 알고 있는 두 개의 공원을 비교해 주세요. 두 공원의 차이점과 공통점을 설명해 주시겠어요? 어떤 공원을 더 좋아하시나요? 그리고 그 이유는 무엇인가요? 자세히 이야기해 주세요."]], "cards": [["So, from the get-go, the biggest difference is the atmosphere, you know?", "처음부터 가장 큰 차이는 분위기예요, 알죠?", "the atmosphere"], ["It's much more different now. I like that. Each park has a different purpose.", "지금은 훨씬 더 다르게 느껴져요. 저는 그게 좋아요. 공원마다 목적이 달라요.", "a different purpose"], ["In the past, one park was small. It was mostly for families. Now it's different. The other park is bigger and more natural.", "예전에는 한 공원이 작았어요. 주로 가족들을 위한 곳이었어요. 지금은 달라요. 다른 공원은 더 크고 더 자연스러워요.", "bigger and more natural"], ["And yeah, I've tried both, and to be real, I prefer the larger park.", "그리고 둘 다 가본 입장에서 솔직히 말하면, 저는 큰 공원이 더 좋아요.", "the larger park"], ["I remember one time. The small park was super crowded. This shows how things were different back then.", "한번 기억나는 게 있어요. 작은 공원이 정말 붐볐어요. 이게 그때랑 지금이 다르다는 걸 보여줘요.", "was super crowded"], ["Both parks have their own charm. But I usually choose the bigger one. It just feels more like me.", "두 공원 다 매력이 있어요. 하지만 저는 보통 더 큰 공원을 선택해요. 그게 더 제 취향에 맞아요.", "feels more like me"]]},
{"id": "t119", "name": "Travel (여행) [비교]", "group": "주제 연습", "qs": [["Explain how most people choose to spend vacation time in your country. Compare this to how people spent their vacations while you were growing up. Are people vacationing in different ways? How and why have things changed regarding vacationing these days?", "설명해 주세요. 당신의 나라에서 대부분의 사람들이 어떻게 휴가 시간을 보내는지요. 어렸을 때 사람들이 휴가를 어떻게 보냈는지와 비교해 보세요. 사람들이 휴가를 보내는 방식이 달라졌나요? 요즘 휴가 보내는 방식은 어떻게 달라졌고, 왜 그런 변화가 일어났나요?"]], "cards": [["To start with, what really stands out is how flexible travel has become.", "먼저 가장 눈에 띄는 점은 여행이 훨씬 더 유연해졌다는 점이에요.", "how flexible travel has become"], ["These days, travel feels more casual. This works better for people. They don't need long breaks to travel anymore.", "요즘은 여행이 훨씬 가벼운 느낌이에요. 이게 사람들에게 더 잘 맞아요. 긴 휴가가 없어도 여행할 수 있거든요.", "don't need long breaks"], ["In the past, families planned one big trip every year. Now things are different. Short trips are more common now.", "예전에는 가족들이 1년에 한 번 큰 여행을 계획했어요. 지금은 달라요. 요즘은 짧은 여행을 더 자주 가요.", "more common now"], ["I've been through both, and personally, I find modern travel way more enjoyable.", "저는 두 방식 다 경험해 봤는데, 개인적으로는 요즘 여행이 훨씬 더 즐거워요.", "modern travel"], ["There was even a time when everyone traveled during peak season. This really shows how things used to be.", "예전에 모두가 성수기에 한꺼번에 여행 가던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "traveled during peak season"], ["Both old and new ways of traveling have something special. But if I had to choose, I'd pick how people travel today.", "옛날 방식이랑 요즘 방식 둘 다 나름의 매력이 있어요. 하지만 하나를 골라야 한다면, 저는 요즘 사람들이 여행하는 방식을 선택할 것 같아요.", "how people travel today"]]},
{"id": "t120", "name": "영화 보기(Movies) [비교]", "group": "주제 연습", "qs": [["How has your taste in movies changed over the years? How are the movies you enjoy now different from those in the past?", "시간이 지나면서 영화 취향이 어떻게 변했나요? 지금 즐겨 보는 영화와 예전에 즐겨 보던 영화는 어떻게 다른가요?"], ["Please compare the movies today to the movies you watched when you were young. What are the differences and the similarities? Tell me how movies have changed over the years.", "오늘날의 영화를 어렸을 때 봤던 영화와 비교해 보세요. 차이점과 유사점은 무엇인가요? 지난 몇 년 동안 영화가 어떻게 변했는지 말해 주세요."]], "cards": [["Back then, movies were more creative and felt new. You would watch a movie and think, 'Wow, this is new.' But nowadays, movies feel different. Now I often think, 'I've seen this before.'", "예전에는 영화가 더 창의적이고 새로운 느낌이었어요. 영화를 보면서 '오, 이거 새롭다'라는 생각이 들었죠. 근데 요즘은 느낌이 달라요. 요즘은 '이거 예전에 본 것 같은데'라는 생각이 자주 들어요.", "I've seen this before"], ["And this goes across all genres, adventure, romance, history and so forth.", "이건 장르를 가리지 않아요. 모험, 로맨스, 역사물 등 전반적으로 다 그래요.", "adventure, romance, history"], ["Personally, I don't care much about the genre. I care more about the quality. But these days, I'm just not feeling it.", "저는 개인적으로 장르는 별로 신경 안 써요. 퀄리티를 더 중요하게 생각해요. 근데 요즘은 그게 잘 느껴지지 않아요.", "not feeling it"], ["So, I guess that's my answer.", "그래서… 네, 그게 제 답변이에요.", "that's my answer"]]},
{"id": "t121", "name": "음악감상하기(Music) 취향 변화 [비교]", "group": "주제 연습", "qs": [["Tell me about how your taste in music has changed over the years. What kind of music did you like to listen to when you were young? And what about now? Provide as many details as possible.", "시간이 지나면서 음악 취향이 어떻게 변했는지 말해 주세요. 어릴 때는 어떤 음악을 좋아했나요? 그리고 지금은 어떤가요? 가능한 한 자세히 설명해 주세요."]], "cards": [["Back then, music was more creative and felt new. You would listen to a song and think, 'Wow, this is new.' But nowadays, music feels different. Now I often think, 'Oh, this again?'", "예전에는 음악이 더 창의적이고 새로운 느낌이었어요. 노래를 들으면서 '오, 이거 새롭다'라는 생각이 들었죠. 근데 요즘은 느낌이 달라요. 요즘은 '어, 또 이 느낌이야?'라는 생각이 자주 들어요.", "Oh, this again?"], ["And this goes across all genres, kpop, pop, ballads and so forth.", "그리고 이건 장르를 가리지 않아요. 케이팝, 팝, 발라드 등 전반적으로 다 그래요.", "all genres"], ["Personally, I don't care much about the genre. I care more about the quality. But these days, I'm just not feeling it.", "저는 개인적으로 장르는 별로 신경 안 써요. 퀄리티를 더 중요하게 생각해요. 근데 요즘은 그게 잘 느껴지지 않아요.", "not feeling it"], ["So, I guess that's my answer.", "그래서… 네, 그게 제 답변이에요.", "that's my answer"]]},
{"id": "t122", "name": "음악 감상하기(Music) 어드밴스 비교 [비교]", "group": "주제 연습", "qs": [["Please tell me about two different music genres you like. Why do you like those music genres? What are some differences and similarities between them?", "좋아하는 두 가지 음악 장르에 대해 말해 주세요. 왜 그 장르들을 좋아하시나요? 두 장르의 차이점과 공통점을 알려 주세요."], ["Please pick two different kinds of music or musicians you like. Compare those two, and what are their differences and similarities? Give as many details as you can.", "당신이 좋아하는 두 종류의 음악이나 음악가를 골라 주세요. 이 두 가지를 비교해 보세요. 그리고 그들의 차이점과 유사점은 무엇인가요? 할 수 있는 한 많은 세부 사항을 말해 주세요."]], "cards": [["Generally speaking, there is mainstream music and indie music. Mainstream musicians are famous, like Ejae, who made the soundtrack for Kpop Demon Hunters. Indie musicians are less famous, like Ed Sheeran before he became famous. The biggest difference between them is fame.", "일반적으로 보면 대중 음악과 인디 음악이 있어요. 대중 음악 뮤지션은 이재(Ejae)처럼 유명한 사람들인데, 이재는 케이팝 데몬 헌터즈의 OST를 만들었어요. 인디 뮤지션은 유명해지기 전의 에드 시런처럼 덜 알려진 사람들이에요. 둘의 가장 큰 차이는 유명세예요.", "biggest difference between them"], ["But other than that, music is just music. I love all kinds of music. Fame isn't everything. So yeah, that's my answer.", "그거 말고는 음악은 그냥 음악이에요. 저는 모든 음악을 다 좋아해요. 유명한 게 다는 아니에요. 그래서 그게 제 답변이에요.", "Fame isn't everything"]]},
{"id": "t123", "name": "바 (Bars) [비교]", "group": "주제 연습", "qs": [["How have bars changed over the last several years? What do you think about the changes? How were they in the past, and what about now? What are the differences and the similarities? Tell me all the changes in detail.", "최근 몇 년간 술집들은 어떻게 변화했나요? 그 변화들에 대해 어떻게 생각하시나요? 술집들은 과거에 어땠고, 지금은 어떤가요? 차이점은 무엇이고, 비슷한 점은 무엇인가요? 모든 변화에 대해 자세히 말해 주세요."]], "cards": [["So, from the get-go, the biggest difference is the vibe and the concept, you know?", "처음부터 가장 큰 차이는 분위기랑 콘셉트예요, 그쵸?", "the vibe and the concept"], ["It's much more trendy now. I like that. It feels safer and more comfortable.", "지금은 훨씬 트렌디해졌어요. 저는 그게 좋아요. 더 안전하고 편한 느낌이거든요.", "safer and more comfortable"], ["In the past, bars were louder, darker, and pretty basic. Now they're totally different. They're more themed, cleaner, and even good for photos.", "예전에는 술집이 더 시끄럽고 어둡고 단순했어요. 지금은 완전히 달라요. 테마도 있고 더 깔끔하고 사진 찍기도 좋아요.", "good for photos"], ["And yeah, I've tried both, and to be real, I prefer modern bars.", "둘 다 가봤지만, 솔직히 저는 요즘 술집이 더 좋아요.", "modern bars"], ["I remember one time. The old-style place was so smoky and noisy. This shows how different things were back then.", "한번 기억나는 게 있어요. 예전 스타일의 술집은 담배 연기도 많고 너무 시끄러웠어요. 이게 그때랑 지금이 다르다는 걸 보여줘요.", "smoky and noisy"], ["Both old-school bars and modern bars have their own charm. But I usually go with modern ones. It just feels more like me.", "옛날 술집이랑 요즘 술집 둘 다 매력이 있어요. 하지만 저는 보통 요즘 스타일로 가요. 그게 더 제 취향에 맞아요.", "feels more like me"]]},
{"id": "t124", "name": "카페(Cafes) [비교]", "group": "주제 연습", "qs": [["How have coffee shops changed over the years? How were they like in the past, and what about now? Tell me all the changes in detail.", "카페는 몇 년 동안 어떻게 변해 왔나요? 과거에는 어땠고, 지금은 어떤가요? 모든 변화에 대해 자세히 말해 주세요."]], "cards": [["So, from the get-go, the biggest difference is how cafés became like lifestyle spaces, you know?", "처음부터 가장 큰 차이는 카페가 ‘라이프스타일 공간'처럼 변했다는 점이에요, 그쵸?", "s became like lifestyle spaces"], ["Cafés are much more stylish now. I like that. I can work or study there comfortably.", "요즘 카페는 훨씬 세련돼졌어요. 저는 그게 좋아요. 거기서 편하게 공부하거나 작업할 수 있거든요.", "work or study there comfortably"], ["In the past, cafés were mostly just for a quick coffee. Now they're totally different. They're bigger, nicer, and made for staying longer.", "예전에는 카페가 그냥 커피를 빨리 마시는 곳이었어요. 지금은 완전히 달라요. 더 넓고 예쁘고 오래 머물기 좋게 됐어요.", "made for staying longer"], ["And yeah, I've tried both, and to be real, I prefer modern cafés.", "둘 다 경험해 봤지만, 솔직히 저는 요즘 카페가 더 좋아요.", "modern caf"], ["I remember a time when there weren't many seats, and you couldn't stay long. This shows how different things were back then. Both old and modern cafés have their own charm, but I usually choose modern ones. It just feels more like me.", "좌석이 많지 않고 오래 있을 수도 없었던 때가 기억나요. 이게 그때랑 지금이 다르다는 걸 보여줘요. 옛날 카페랑 요즘 카페 둘 다 매력이 있지만, 저는 보통 요즘 카페를 선택해요. 그게 더 제 취향에 맞아요.", "weren't many seats"]]},
{"id": "t125", "name": "Holidays (휴일) [비교]", "group": "주제 연습", "qs": [["People have gatherings and celebrations for particular reasons. How were gatherings and celebrations when you were a child? How were they different from now? How do people get together nowadays? Tell me how gatherings have changed over the years.", "사람들은 특별한 이유로 모임과 축하 행사를 합니다. 당신이 어렸을 때 모임과 축하 행사는 어땠나요? 그것들은 지금과 어떻게 달랐나요? 요즘 사람들은 어떻게 모이나요? 지난 몇 년 동안 모임이 어떻게 변했는지 말해 주세요."]], "cards": [["To start with, what really stands out is how gatherings became smaller and more casual.", "먼저 가장 눈에 띄는 점은 모임이 더 작아지고 가벼워졌다는 점이에요.", "how gatherings became smaller and more casual"], ["These days, it feels more flexible. This works better for me. People can meet without a lot of pressure.", "요즘은 훨씬 더 유연한 느낌이에요. 이게 저한테 더 잘 맞아요. 사람들이 부담 없이 만날 수 있거든요.", "without a lot of pressure"], ["In the past, big family get-togethers were basically required. Now things are different. People do smaller meetups, quick dinners, or even online calls.", "예전에는 큰 가족 모임이 거의 필수였어요. 지금은 달라요. 사람들은 소규모 모임이나 간단한 식사, 또는 영상통화로도 만나요.", "even online calls"], ["There was even a time when we spent the whole day visiting house after house. This really shows how things used to be.", "예전에 하루 종일 이 집 저 집 돌아다니던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "visiting house after house"]]},
{"id": "t126", "name": "호텔 (Hotels) [비교]", "group": "주제 연습", "qs": [["How has the hotel industry in your country developed over the years? How were they like in the past, and what about now? Tell me about it with specific examples.", "당신의 나라 호텔 산업은 몇 년 동안 어떻게 발전해 왔나요? 과거에는 어땠고, 지금은 어떤가요? 구체적인 예시와 함께 이야기해 주세요."]], "cards": [["To start with, what really stands out is how upgraded and specialized hotels have become.", "먼저 가장 눈에 띄는 점은 호텔이 훨씬 업그레이드되고 전문화됐다는 점이에요.", "how upgraded and specialized hotels have become"], ["These days, hotels feel more premium. This works better for me. The service is smoother and the options are clearer.", "요즘은 호텔이 훨씬 고급스러운 느낌이에요. 이게 저한테 더 잘 맞아요. 서비스도 더 매끄럽고 선택지도 더 명확하거든요.", "smoother and the options are clearer"], ["In the past, hotels were pretty basic and similar. Now things are different. There are boutique hotels, themed stays, and smart check-in.", "예전에는 호텔이 대체로 단순하고 다 비슷했어요. 지금은 달라요. 부티크 호텔, 테마 숙소, 스마트 체크인도 있어요.", "boutique hotels, themed stays"], ["There was even a time when we had to wait in line at the front desk for a long time. This really shows how things used to be.", "예전에 프런트에서 오래 줄을 서야 했던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "line at the front desk"]]},
{"id": "t127", "name": "은행(Banks) [비교]", "group": "주제 연습", "qs": [["How have banks changed over the years? What did the bank look like in the past? How was the bank different from now? And what do they look like now?", "지난 몇 년 동안 은행은 어떻게 변해 왔나요? 과거에 은행은 어떻게 생겼나요? 은행은 지금과 어떻게 달랐나요? 그리고 지금은 어떻게 생겼나요?"]], "cards": [["To start with, what really stands out is how digital banking has taken over.", "먼저 가장 눈에 띄는 점은 은행 업무가 디지털로 거의 넘어갔다는 점이에요.", "how digital banking has taken over"], ["These days, banking feels more convenient. This works better for me. I can do almost everything on my phone.", "요즘은 은행 업무가 훨씬 편리한 느낌이에요. 이게 저한테 더 잘 맞아요. 거의 모든 걸 핸드폰으로 할 수 있거든요.", "almost everything on my phone"], ["In the past, banks were crowded and had a lot of paperwork. Now things are different. Mobile apps, kiosks, and quick transfers are normal now.", "예전에는 은행이 붐비고 서류도 많았어요. 지금은 달라요. 앱, 키오스크, 빠른 이체가 이제는 기본이에요.", "quick transfers are normal"], ["There was even a time when I waited a long time just to update a bankbook. This really shows how things used to be.", "예전에 통장 정리 하나 하려고 오래 기다렸던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "update a bankbook"]]},
{"id": "t128", "name": "음식 (Food) [비교]", "group": "주제 연습", "qs": [["How has grocery shopping changed over the years? What food do people regularly buy at the grocery store? What are the trends in food in your country? How is grocery shopping nowadays different compared to grocery shopping in the past?", "지난 몇 년간 식료품 쇼핑은 어떻게 변해 왔나요? 사람들은 식료품점에서 정기적으로 어떤 음식을 사나요? 당신 나라의 음식 트렌드는 무엇인가요? 요즘 장보기는 과거의 장보기와 어떻게 다른가요?"]], "cards": [["To start with, what really stands out is how online grocery shopping has grown.", "먼저 가장 눈에 띄는 점은 온라인 장보기가 크게 늘었다는 점이에요.", "how online grocery shopping has grown"], ["These days, grocery shopping feels more efficient. This works better for me. It saves time and it reduces impulse buying.", "요즘은 장보기가 훨씬 효율적인 느낌이에요. 이게 저한테 더 잘 맞아요. 시간도 아끼고 충동구매도 줄여주거든요.", "reduces impulse buying"], ["In the past, people mostly went to local markets in person. Now things are different. Delivery apps and subscription-style shopping are common now.", "예전에는 사람들이 보통 직접 시장에 갔어요. 지금은 달라요. 배달 앱과 정기배송 같은 방식도 흔해요.", "subscription-style shopping"], ["There was even a time when we had to carry heavy bags all the way home. This really shows how things used to be.", "예전에 무거운 장바구니를 들고 집까지 와야 했던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "carry heavy bags"]]},
{"id": "t129", "name": "교통수단 (Transportation) 어드밴스 [비교]", "group": "주제 연습", "qs": [["Transportation systems have been improved. Have there been any changes to transportation in your country since you were young? What are the changes between the past and the present?", "교통 시스템은 발전해 왔습니다. 어렸을 때부터 당신의 나라의 교통수단에 변화가 있었나요? 과거와 현재의 변화는 무엇인가요?"]], "cards": [["To start with, what really stands out is how connected and streamlined transportation has become.", "먼저 가장 눈에 띄는 점은 교통이 훨씬 더 연결되고 체계적이 됐다는 점이에요.", "how connected and streamlined transportation has become"], ["These days, transportation feels more reliable. This works better for me. I can plan routes and timing instantly.", "요즘은 교통이 훨씬 믿을 만한 느낌이에요. 이게 저한테 더 잘 맞아요. 경로랑 시간을 바로 확인할 수 있거든요.", "plan routes and timing instantly"], ["In the past, people relied on fixed schedules and cash tickets. Now things are different. Apps, transit cards, and real-time updates are standard now.", "예전에는 사람들이 정해진 시간표와 현금 표에 의존했어요. 지금은 달라요. 앱, 교통카드, 실시간 정보가 이제는 기본이에요.", "transit cards, and real-time updates"], ["There was even a time when I missed a bus. I had no idea when the next one was coming. This really shows how things used to be.", "예전에 버스를 놓친 적도 있었어요. 다음 버스가 언제 오는지도 몰랐어요. 이게 그때가 어땠는지 잘 보여줘요.", "missed a bus"]]},
{"id": "t130", "name": "재활용(Recycling) 어드밴스 [비교]", "group": "주제 연습", "qs": [["Tell me about the ways you did recycling when you were a child. How is the way you recycle now different from those in the past? What are the differences and the similarities? Use as many details as possible to explain it.", "당신이 어렸을 때 재활용을 했던 방법에 대해 말해 주세요. 당신이 지금 재활용하는 방법은 과거와 어떻게 다른가요? 차이점과 유사점은 무엇인가요? 그것을 설명하기 위해 가능한 한 많은 세부 사항을 말해 주세요."]], "cards": [["To start with, what really stands out is how strict and detailed recycling rules became.", "먼저 가장 눈에 띄는 점은 재활용 규칙이 훨씬 더 엄격하고 세분화됐다는 점이에요.", "how strict and detailed recycling rules became"], ["These days, recycling feels more systematic. This works better for me. It reduces confusion and it reduces waste.", "요즘은 재활용이 훨씬 체계적인 느낌이에요. 이게 저한테 더 잘 맞아요. 헷갈림도 줄고 낭비도 줄여주거든요.", "it reduces waste"], ["In the past, we separated only the basics. Now things are different. We sort by material, wash containers, and follow specific bags.", "예전에는 기본적인 것만 대충 분리했어요. 지금은 달라요. 재질별로 나누고, 용기를 씻고, 전용 봉투도 지켜야 해요.", "sort by material"], ["There was even a time when I threw something in the wrong bin. Someone corrected me. This really shows how things used to be.", "예전에 분리수거를 잘못해서 지적받은 적도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "threw something in the wrong bin"]]},
{"id": "t131", "name": "패션 (Fashion) [비교]", "group": "주제 연습", "qs": [["Fashion trends change over time. What kind of clothes were popular when you were young? How were the styles? And what about now? Please compare the fashion trends in the past and now.", "패션 트렌드는 시간이 지남에 따라 변화합니다. 당신이 어렸을 때는 어떤 종류의 옷이 인기가 있었나요? 스타일은 어땠나요? 지금은 어떤가요? 과거의 패션 트렌드와 현재의 패션 트렌드를 비교해 보세요."]], "cards": [["To start with, what really stands out is how fast trends move now.", "먼저 가장 눈에 띄는 점은 유행이 훨씬 빨리 바뀐다는 점이에요.", "how fast trends move now"], ["These days, fashion feels more experimental. This works better for me. People can express themselves freely.", "요즘은 패션이 훨씬 다양하게 시도되는 느낌이에요. 이게 저한테 더 잘 맞아요. 사람들이 자유롭게 자기 표현을 할 수 있거든요.", "express themselves freely"], ["In the past, styles were more similar and focused on brands. Now things are different. Mix-and-match, thrifted items, and comfortable looks are huge now.", "예전에는 스타일이 더 비슷하고 브랜드 중심이었어요. 지금은 달라요. 믹스매치, 빈티지, 편한 룩이 요즘은 대세예요.", "Mix-and-match, thrifted items"], ["There was even a time when everyone wore the same must-have item. This really shows how things used to be.", "예전에 다들 똑같은 '필수템'을 입던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "the same must-have item"]]},
{"id": "t132", "name": "기술 (Technology) 어드밴스 [비교]", "group": "주제 연습", "qs": [["I'd like to know about popular technology in your country. How has that technology developed over the years? How was it different compared to technology now? How does it affect people's lives?", "당신의 나라에서 인기 있는 기술에 대해 알고 싶습니다. 그 기술은 몇 년 동안 어떻게 발전해 왔나요? 지금 기술과 비교했을 때 어떻게 달랐나요? 그것이 사람들의 삶에 어떻게 영향을 미치나요?"]], "cards": [["To start with, what really stands out is how smart and integrated tech has become.", "먼저 가장 눈에 띄는 점은 기술이 훨씬 더 똑똑하고 통합됐다는 점이에요.", "how smart and integrated tech has become"], ["These days, technology feels more instant. This works better for me. It saves time in everyday tasks.", "요즘은 기술이 훨씬 즉각적인 느낌이에요. 이게 저한테 더 잘 맞아요. 일상 업무 시간을 줄여주거든요.", "time in everyday tasks"], ["In the past, devices were separate and slower. Now things are different. Everything is connected through apps and AI features.", "예전에는 기기들이 따로따로이고 느렸어요. 지금은 달라요. 이제는 앱과 AI 기능으로 모든 게 연결돼요.", "connected through apps and AI features"], ["There was even a time when I had to use a desktop computer for basic things. This really shows how things used to be.", "예전에 간단한 일도 데스크톱으로 해야 했던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "a desktop computer for basic things"]]},
{"id": "t133", "name": "지형 (Geography) 어드밴스 [비교]", "group": "주제 연습", "qs": [["Tell me in detail about the changes you have observed concerning the relationship between your country and other countries. The changes might relate to economics, sports, art, culture, or politics. Describe those changes in detail.", "당신 나라와 다른 나라들 간의 관계에서 변화한 점에 대해 자세히 설명해 주세요. 변화는 경제, 스포츠, 예술, 문화, 정치 등과 관련이 있을 수 있습니다. 그 변화들에 대해 자세히 설명해 주세요."]], "cards": [["To start with, what really stands out is how global and interconnected things feel now.", "먼저 가장 눈에 띄는 점은 요즘은 훨씬 더 글로벌하게 연결돼 있다는 느낌이에요.", "how global and interconnected things feel now"], ["These days, things feel more international. This works better for me. We have more access to cultures and opportunities.", "요즘은 훨씬 국제적인 느낌이에요. 이게 저한테 더 잘 맞아요. 문화와 기회에 더 쉽게 접근할 수 있거든요.", "access to cultures and opportunities"], ["In the past, international exchange felt limited. Now things are different. Trade, travel, sports, and content cross borders much more easily now.", "예전에는 국제 교류가 제한적으로 느껴졌어요. 지금은 달라요. 무역, 여행, 스포츠, 콘텐츠가 이제는 훨씬 쉽게 국경을 넘나들어요.", "cross borders much more easily"], ["There was even a time when foreign culture felt far away and hard to access. This really shows how things used to be.", "예전에 외국 문화가 멀고 접근하기 어렵게 느껴지던 때도 있었어요. 이게 그때가 어땠는지 잘 보여줘요.", "far away and hard to access"]]},
{"id": "t134", "name": "여가 시간 (Free time) [비교]", "group": "주제 연습", "qs": [["How has your free time changed over the years? What did you do when you had free time in the past? Did you have more or less free time than now? How was it different from now?", "당신의 자유시간은 몇 년 동안 어떻게 변했나요? 당신은 과거에 자유 시간이 있었을 때 무엇을 했나요? 당신은 지금보다 자유시간이 많거나 적었나요? 지금과 어떻게 달랐나요?"]], "cards": [["My free time has changed a lot over the years.", "제 자유 시간은 예전이랑 많이 달라졌어요.", "changed a lot over the years"], ["In the past, I had way more free time and could actually enjoy hobbies.", "예전에는 자유 시간이 더 많아서 취미도 제대로 즐길 수 있었어요.", "I had way more free time and could actually enjoy hobbies"], ["Now, because of work and responsibilities, I don't really have time for hobbies anymore.", "지금은 일이나 책임이 많아져서 취미를 할 시간이 거의 없어요.", "I don't really have time for hobbies anymore"], ["When I do have free time, it's usually short and I just use it to rest.", "가끔 자유 시간이 생겨도 보통 그냥 쉬는 데 쓰게 돼요.", "it's usually short and I just use it to rest"], ["So compared to before, I definitely have less free time now.", "그래서 지금은 예전보다 자유 시간이 확실히 줄어들었어요.", "I definitely have less free time now"]]},
{"id": "t135", "name": "호텔 (Hotels) [묘사]", "group": "주제 연습", "qs": [["Tell me about some famous hotels in your country. What are they look like? Where are they usually located? Describe it in detail.", "당신의 나라에서 유명한 호텔 몇가지를 말해주세요. 호텔들은 어떤가요? 주로 어디에 위치해 있나요? 자세히 설명해주세요."]], "cards": [["I'd like to talk about famous hotels in my country.", "저는 우리나라의 유명한 호텔들에 대해 이야기하고 싶어요.", "famous hotels in my country."], ["They're usually located in big cities like Seoul or Busan. They're often near popular tourist areas or along the coast. They have a very luxurious and elegant feeling.", "이 호텔들은 보통 서울이나 부산 같은 대도시에 있어요. 인기 있는 관광지 근처나 해안가에 있는 경우가 많아요. 전체적으로 아주 고급스럽고 우아한 느낌이에요.", "luxurious and elegant feeling"], ["The first thing you notice is the grand lobby with chandeliers. The staff are very professional. The rooms have beautiful views of the city or the ocean. Overall, it feels modern and high-class.", "가장 먼저 눈에 띄는 건 샹들리에가 있는 웅장한 로비예요. 직원들도 매우 전문적이에요. 객실에서는 도시나 바다의 멋진 전망이 보여요. 전체적으로 현대적이고 고급스러운 느낌이에요.", "modern and high-class"], ["What I like most is that the rooms are comfortable and quiet. They also have great service and good amenities, like spas and buffets. Being there always makes me feel relaxed and pampered.", "제가 가장 좋아하는 점은 객실이 편안하고 조용하다는 거예요. 서비스도 좋고 스파나 뷔페 같은 시설도 잘 되어 있어요. 거기 있으면 항상 편안하고 대접받는 느낌이 들어요.", "relaxed and pampered"], ["That's basically why I like this place.", "그래서 저는 이런 호텔들을 정말 좋아해요.", "basically why I like this place"]]},
{"id": "t136", "name": "세탁소 (Dry Cleaners) [루틴]", "group": "주제 연습", "qs": [["Tell me about something you routinely do at a dry cleaner or laundry. Where do you usually go? What do you do there? How long does it usually take?", "자주 이용하는 세탁소에서 보통 어떤 일을 하나요? 어디에 가고, 무엇을 하며, 보통 얼마나 시간이 걸리나요?"]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음… 제 루틴이 어떻게 돌아가냐면요… 글쎄요…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is dropping off my suits and delicate clothes at Clean & Fresh.", "제가 꽤 자주 하는 건 클린앤프레시 세탁소에 정장이랑 섬세한 옷을 맡기는 거예요.", "dropping off my suits and delicate clothes at Clean & Fresh"], ["It's nothing fancy… usually, I walk in, hand them my clothes, and ask for the usual service, and it helps me feel organized and relieved.", "특별한 건 아니고요… 보통 들어가서 옷 맡기고, 늘 하던 서비스로 부탁하는 정도인데, 그러면 정리가 된 느낌이 들고 마음이 좀 편해져요.", "walk in, hand them my clothes, and ask for the usual service"], ["I don't even think about it that much anymore… like… it's just one of those little habits that keeps my life steady and… I honestly didn't even know was a routine of mine. But yeah, I'd say that's my answer.", "이제는 그걸 굳이 의식하지도 않아요… 그냥… 제 생활을 안정적으로 유지해 주는 작은 습관 중 하나고, 이게 루틴이라는 것도 사실 잘 몰랐어요. 네, 그게 제 답변이에요.", "I'd say that's my answer"]]},
{"id": "t137", "name": "우체국 (Post Office) [루틴]", "group": "주제 연습", "qs": [["Tell me about something you routinely do at the post office. What do you usually do there? How long does it take? Why do you go there regularly?", "우체국에서 보통 어떤 일을 하나요? 그 일은 얼마나 시간이 걸리나요? 왜 정기적으로 가나요?"]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음… 제 루틴이 어떻게 돌아가냐면요… 글쎄요…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is going to Gangdong Post Office to send out packages.", "제가 꽤 자주 하는 건 강동우체국에 가서 소포를 보내는 일이에요.", "going to Gangdong Post Office to send out packages"], ["It's nothing fancy… usually, I weigh my parcels, print the labels, and mail them out, and it helps me get the job done…", "특별한 건 아니고요… 보통 소포 무게 재고, 운송장 출력해서 바로 발송하는데, 그렇게 하면 할 일을 제대로 끝냈다는 느낌이 들어요.", "weigh my parcels, print the labels, and mail them out"], ["I don't even think about it that much anymore… like… it's just one of those little habits that keeps my life steady and… I honestly didn't even know was a routine of mine. But yeah, I'd say that's my answer.", "이제는 그렇게 깊게 생각하지도 않아요… 그냥 제 생활을 안정적으로 유지해 주는 작은 습관 같은 거고, 솔직히 이게 제 루틴인지도 몰랐어요. 네, 이 정도가 제 답변이에요.", "I'd say that's my answer"]]},
{"id": "t138", "name": "도서관 (Library) [루틴]", "group": "주제 연습", "qs": [["Tell me about something you routinely do at the library. Why do you go there? What do you usually do, and how long do you stay? Tell me in as much detail as you can.", "도서관에서 정기적으로 하는 일에 대해 이야기해 주세요. 왜 그곳에 가나요? 보통 무엇을 하고, 얼마나 오래 머무르나요? 가능한 한 자세하게 설명해 주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음… 제 루틴이요… 어떻게 설명하면 좋을까…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is going to my neighborhood library when I need to focus.", "제가 꽤 자주 하는 건 집중이 필요할 때 동네 도서관에 가는 거예요.", "going to my neighborhood library when I need to focus"], ["It's nothing fancy… usually, I find a quiet seat, put my phone on silent, and work on my assignments, and it helps me clear my head and concentrate.", "특별한 건 없고… 보통 조용한 자리에 앉아서 핸드폰을 무음으로 해 두고 과제나 작업을 해요, 그러면 머리가 좀 정리되고 집중도 잘 돼요.", "find a quiet seat, put my phone on silent, and work on my assignments"], ["I don't even think about it that much anymore… like… it's just one of those little habits that keeps my life steady and… I honestly didn't even know was a routine of mine. But yeah, I'd say that's my answer.", "이젠 거의 생각 없이 가게 돼요… 그냥 제 삶의 리듬을 잡아주는 작은 습관 같은 거고, 이게 루틴인지도 몰랐어요. 네, 이 정도가 제 답이에요.", "I'd say that's my answer"]]}
);

/* 문법 노트: [표현, 규칙, 쉬운 예, 이 표현이 들어 있는 문장을 찾는 패턴] — 정답을 볼 때 해당 문장에 맞는 노트만 나타남 */
const GRAMMAR = [
 ["would like to + 동사원형","would like to는 want to의 공손한 말. 뒤에는 항상 동사원형이 와요.","I'd like to tell you about my dog. (제 강아지 얘기를 하고 싶어요)",/I'd like to/],
