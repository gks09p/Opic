{"id": "t36", "name": "교통수단 (Transportation System) 어드밴스 [묘사]", "group": "주제 연습", "qs": [["Can you tell me about the public transportation system in your country? What forms of transportation do people use? Do they drive their own cars or use public transportation?", "당신 나라의 대중교통 시스템에 대해 말씀해 주세요. 사람들은 어떤 종류의 교통수단을 이용하나요? 자가용을 운전하나요, 아니면 대중교통을 이용하나요?"]], "cards": [["I'd like to tell you about the public transportation system in Korea.", "한국의 대중교통 시스템에 대해 말씀드릴게요.", "the public transportation system"], ["It's something we're actually pretty proud of because it's clean, fast, and incredibly efficient.", "깨끗하고 빠르며 정말 효율적이라 우리가 자부심을 갖고 있어요.", "it's clean, fast, and incredibly efficient"], ["Subways, buses, and trains all run on time. People can use one transit card for everything. This makes transferring very easy.", "지하철, 버스, 기차가 모두 제시간에 운행돼요. 사람들은 교통카드 하나로 모든 걸 이용할 수 있어요. 그래서 환승이 정말 쉬워요.", "run on time"], ["Most people see it as a daily habit and a symbol of convenience and order in city life.", "대부분의 사람들은 이를 도시 생활의 편리함과 질서를 상징하는 일상의 일부로 생각해요.", "a daily habit and a symbol of convenience and order in city life"], ["Personally, I think it really shows what we value as a society… punctuality, organization, and public responsibility.", "개인적으로 이건 우리가 사회적으로 중요하게 여기는 시간 엄수, 체계성, 공공의식을 잘 보여준다고 생각해요.", "punctuality, organization, and public responsibility"], ["So yeah, our transportation system isn't just a system here… it's something we take pride in.", "그래서 한국의 교통 시스템은 단순한 서비스가 아니라 우리가 자부심을 갖는 문화예요.", "our transportation system"]]},
{"id": "t37", "name": "공원 (Park) 어드밴스 1 [묘사]", "group": "주제 연습", "qs": [["Talk about some problems with parks in your country these days. What are the challenges parks face, and what is the biggest problem? What things do people need to do to solve the issues?", "요즘 당신의 나라 공원과 관련된 몇 가지 문제에 대해 이야기해주세요. 공원이 직면한 어려움은 무엇 이고, 가장 큰 문제는 무엇인가요? 문제를 해결하기 위해 사람들이 해야 할 일은 무엇인가요?"]], "cards": [["Parks in my country have one problem. They are not well maintained these days. They are also not very clean.", "우리나라 공원에는 한 가지 문제가 있어요. 요즘 관리가 잘 안 돼요. 그리고 별로 깨끗하지도 않아요.", "not well maintained these days"], ["Many parks have trash bins that are always full. Some benches are broken. Also, some people don't follow the rules, like cleaning up after a picnic or keeping their dog on a leash.", "많은 공원에 쓰레기통이 항상 넘쳐요. 벤치가 망가진 곳도 있어요. 또 어떤 사람들은 규칙을 안 지켜요. 예를 들면 피크닉 후에 청소를 안 하거나 반려견 목줄을 안 해요.", "trash bins that are always full"], ["That's the biggest problem I see in parks these days. To fix it, people need to be more careful with their trash. Local governments should also spend more money on cleaning and better facilities.", "이게 요즘 공원에서 제가 가장 크게 느끼는 문제예요. 이걸 해결하려면 사람들이 쓰레기를 더 조심해서 버려야 해요. 지자체도 청소와 시설 개선에 돈을 더 써야 해요.", "the biggest problem I see in parks"]]},
{"id": "t38", "name": "산업 (Industry) 어드밴스 1 / 산업 (Industry) 어드밴스 2 [묘사]", "group": "주제 연습", "qs": [["I'd like to know about the rising industries in your country. What industries do people talk about these days? What is this industry about? How has that industry changed over the years? How was it different compared to the industry now?", "당신의 나라에서 떠오르는 산업에 대해 알고 싶습니다. 요즘 사람들은 어떤 산업에 대해 이야기 하나요? 이 산업은 무엇에 관한 것인가요? 그 산업은 몇 년 동안 어떻게 변해 왔나요? 지금의 그 산업과 비교했을 때 과거에는 어떻게 달랐나요?"], ["Have the industry you just mentioned ever released a new product that couldn't meet people's expectations? What was the product about? Why were people disappointed about it? How did people react to this issue?", "방금 말씀하신 업계에서 사람들의 기대에 미치지 못하는 신제품을 출시한 적이 있나요? 그 제품은 무엇에 관한 것이었나요? 왜 사람들은 그것에 대해 실망했나요? 사람들은 이 문제에 대해 어떻게 반응 했나요?"]], "cards": [["I'd like to tell you about AI, which is a rising industry in my country.", "제가 이야기하고 싶은 것은 AI, 즉 우리나라에서 떠오르는 산업이에요.", "AI"], ["AI is really smart and powerful. It stands out the most in education, healthcare, and even art.", "AI는 정말 똑똑하고 강력해요. 특히 교육, 의료, 그리고 예술 분야에서 가장 눈에 띄어요.", "education, healthcare, and even art"], ["Whenever I use AI tools like ChatGPT, I feel more confident and focused.", "저는 ChatGPT 같은 AI 도구를 사용할 때마다 자신감이 생기고 집중력이 높아지는 느낌이 들어요.", "more confident and focused"], ["One time, I used it to prepare a project very quickly. It saved me a lot of time. That made me appreciate AI even more.", "한 번은 AI를 사용해서 프로젝트를 아주 빠르게 준비했어요. 시간을 많이 절약할 수 있었어요. 그 일로 AI가 더 고마워졌어요.", "saved me a lot of time"], ["Sometimes, AI makes mistakes. This can be disappointing, especially if you pay for it. But I think it's still improving.", "가끔 AI가 실수를 해요. 특히 유료 버전을 쓸 때는 좀 실망스러울 수 있어요. 하지만 아직 발전하는 중이라고 생각해요.", "AI makes mistakes"], ["So yeah, AI means a lot to me and to our future.", "그래서 저는 AI가 저뿐만 아니라 우리의 미래에도 아주 중요한 의미가 있다고 생각해요.", "AI"]]},
{"id": "t39", "name": "세탁소 (Dry Cleaners) [묘사]", "group": "주제 연습", "qs": [["Tell me about a dry cleaner or laundry place you usually go to. Where is it located? How long have you been going there? What does the place look like, and what kind of services do they offer? Why do you like using that dry cleaner or laundry?", "자주 이용하는 세탁소에 대해 이야기해 주세요. 그곳은 어디에 있나요? 얼마나 오래 다녔나요? 그 장소는 어떤 모습이고, 어떤 서비스를 제공하나요? 왜 그 세탁소를 자주 이용하나요?"]], "cards": [["I'd like to talk about a dry cleaner I go to often.", "제가 자주 가는 세탁소 한 곳에 대해 이야기해 볼게요.", "a dry cleaner I go to often"], ["It's in my neighborhood, right across the street from my apartment, and it's got a really clean and reliable vibe.", "제 집 바로 맞은편, 같은 동네에 있고, 분위기는 정말 깔끔하고 믿음직한 편이에요.", "my neighborhood, right across the street from my apartment"], ["The first thing you notice is how organized everything is. The clothes are arranged neatly, and there's a simple counter. Overall, it feels pretty casual and efficient.", "들어가면 가장 먼저 모든 게 정리되어 있다는 걸 느껴요. 옷들이 깔끔하게 정리돼 있고, 카운터도 단순해요. 전체적으로 편안하면서 효율적인 느낌이에요.", "how organized everything is"], ["What I like most is their same-day pickup service, and it always makes me feel relieved and stress-free when I'm there.", "제가 가장 좋아하는 건 당일 수거 서비스인데, 그곳에 가면 항상 마음이 놓이고 스트레스가 줄어드는 기분이 들어요.", "their same-day pickup service"], ["That's basically why I like this place.", "그래서 이 세탁소를 좋아해요.", "basically why I like this place"]]},
{"id": "t40", "name": "우체국 (Post Office) [묘사]", "group": "주제 연습", "qs": [["Tell me about a post office you usually go to. Where is it located? What does it look like inside? What kind of services do they offer, and how often do you go there?", "자주 가는 우체국에 대해 이야기해 주세요. 어디에 있고, 내부는 어떤 모습인가요? 어떤 서비스를 제공하나요? 얼마나 자주 가나요?"]], "cards": [["I'd like to talk about a post office I go to often.", "제가 자주 가는 우체국 한 곳에 대해 이야기해 볼게요.", "a post office I go to often"], ["It's in my neighborhood near the subway station, and it's got a really busy but efficient vibe.", "집 근처 지하철역 근처에 있고, 분위기는 바쁘지만 효율적인 편이에요.", "my neighborhood near the subway station"], ["The first thing you notice is the ticket machine. There are also counters with glass dividers. Overall, it feels pretty clean and organized.", "들어가면 가장 먼저 번호표 기계가 보여요. 유리 칸막이가 있는 창구들도 있어요. 전체적으로 깔끔하고 정돈된 느낌이에요.", "the ticket machine"], ["What I like most is the self-service area. There, I can weigh and label my own packages. It always makes me feel productive.", "제가 가장 좋아하는 건 셀프 서비스 공간이에요. 거기서 소포 무게도 재고 라벨도 직접 붙일 수 있어요. 그걸 할 때마다 뭔가 생산적인 기분이 들어요.", "the self-service area"], ["That's basically why I like this place.", "그래서 이곳을 좋아해요.", "basically why I like this place"]]},
{"id": "t41", "name": "도서관 (Library) [묘사]", "group": "주제 연습", "qs": [["Tell me about a library you often go to. Where is it located? How long have you been going there? What does it look like inside, and what do you usually do there? Please tell me in as much detail as you can.", "자주 가는 도서관에 대해 이야기해 주세요. 어디에 있고, 얼마나 오래 다녔나요? 내부는 어떤 모습이며, 그곳에서 보통 무엇을 하나요? 가능한 한 자세하게 말해 주세요."]], "cards": [["I'd like to talk about a library I go to often.", "제가 자주 가는 도서관 한 곳에 대해 이야기해 볼게요.", "a library I go to often"], ["It's in my neighborhood near the park, and it's got a really quiet and cozy vibe.", "동네 공원 근처에 있고, 분위기는 조용하고 아늑한 편이에요.", "my neighborhood near the park"], ["The first thing you notice is the big windows and wooden bookshelves, and overall it feels pretty calm and relaxing.", "들어가면 가장 먼저 큰 창문이랑 나무 책장이 눈에 띄고, 전체적으로 차분하고 편안한 느낌이에요.", "the big windows and wooden bookshelves"], ["What I like most is the study zone and computer area, and it always makes me feel focused and recharged when I'm there.", "제가 가장 좋아하는 건 스터디존이랑 컴퓨터 공간인데, 그곳에 있으면 항상 집중도 잘 되고 리프레시되는 기분이 들어요.", "the study zone and computer area"], ["That's basically why I like this place.", "그래서 이 도서관을 좋아해요.", "basically why I like this place"]]},
{"id": "t42", "name": "건강한 사람 (Health) [묘사]", "group": "주제 연습", "qs": [["Tell me about a healthy person you know. Who is it? What does he or she look like? What do they typically do to stay healthy? What makes that person healthy? Why do you think that person is healthy?", "당신이 아는 건강한 사람에 대해 말해주세요. 누구인가요? 그 또는 그녀는 어떻게 생겼나요? 그들은 건강을 유지하기 위해 보통 무엇을 하나요? 무엇이 그 사람을 건강하게 만드나요? 당신은 왜 그 사람이 건강하다고 생각하나요?"]], "cards": [["I'd like to tell you about my older sister.", "저는 제 언니에 대해 말씀드리고 싶어요.", "my older sister"], ["She's really energetic and disciplined, and what stands out the most is how consistent she is with her routine.", "언니는 정말 활기차고 자기관리가 잘 되는 사람인데, 특히 생활 루틴을 꾸준히 지킨다는 점이 가장 인상 깊어요.", "how consistent she is with her routine"], ["She's fit with clear skin, and she usually looks well-rested.", "몸이 건강해 보이고 피부도 맑은 편이고, 보통 피곤해 보이지 않아요.", "fit with clear skin"], ["Whenever I spend time with her, I notice a few things. She eats balanced meals. She works out regularly. She also gets enough sleep.", "언니와 시간을 보낼 때마다 몇 가지가 눈에 보여요. 균형 잡힌 식사를 해요. 규칙적으로 운동도 해요. 잠도 충분히 자요.", "She eats balanced meals"], ["One time, she stuck to her healthy habits even during a very busy time at work, and that made me appreciate her mindset even more.", "한번은 일이 아주 바쁜 시기에도 건강한 습관을 계속 유지하는 모습을 보고, 언니의 마인드를 더 존경하게 됐어요.", "she stuck to her healthy habits even during a very busy time at work"], ["So yeah, that's why I think she's a healthy person.", "그래서 저는 언니가 건강한 사람이라고 생각해요.", "that's why I think she's a healthy person"]]},
{"id": "t43", "name": "여가 시간 (Free time) [묘사]", "group": "주제 연습", "qs": [["Tell me about how you spend your free time. What do you usually do on your free time, tell me in as much detail as you can.", "여가 시간을 어떻게 보내는지 말씀해 주세요. 보통 자유 시간이 있을 때 무엇을 하나요? 가능한 한 자세히 이야기해 주세요."]], "cards": [["Ah, my free time… that's a good question.", "아, 제 여가 시간이요… 좋은 질문이네요.", "that's a good question"], ["I usually try to balance being active and relaxing.", "저는 보통 활동적인 시간과 휴식 시간을 균형 있게 보내려고 해요.", "balance being active and relaxing"], ["I work out a few times a week, and I also like going to cafés where I can listen to music and unwind.", "일주일에 몇 번은 운동을 하고, 음악을 들으면서 카페에 가서 쉬는 것도 좋아해요.", "and I also like going to cafés where I can listen to music and unwind"], ["When I want to fully relax, I watch Netflix.", "완전히 쉬고 싶을 때는 넷플릭스를 봐요.", "I watch Netflix"], ["Lately, I've been watching a show called The Witcher, and I've been enjoying it a lot.", "요즘에는 The Witcher 라는 드라마를 보고 있는데, 정말 재미있게 보고 있어요.", "and I've been enjoying it a lot"], ["Overall, I use my free time to recharge and enjoy myself.", "전반적으로 저는 여가 시간을 재충전하고 즐기는 데 사용해요.", "recharge and enjoy myself"]]},
{"id": "t44", "name": "거주지 (Home) [루틴]", "group": "주제 연습", "qs": [["What activities do you usually do when you are at home? What things do you do during the weekdays and on weekends? Tell me about your normal routine at home in detail.", "집에 있을 때 보통 어떤 활동을 하나요? 평일과 주말에 하는 일은 무엇인가요? 집에서의 일상적인 루틴에"]], "cards": [["Something I do pretty often is just chill at home, and um, it's honestly become part of my lifestyle.", "저는 집에서 그냥 쉬는 걸 자주 해요.", "just chill at home"], ["It might sound simple, but yeah, it really shows a lot about daily life here in Korea.", "음… 이제는 진짜 제 생활의 일부가 된 것 같아요.", "daily life here in Korea"], ["The whole thing's pretty relaxing, and what I notice most is just how comfortable and peaceful it feels to have my own space.", "좀 단순하게 들릴 수도 있지만, 이게 한국에서의 일상을 잘 보여주는 것 같아요.", "how comfortable and peaceful it feels to have my own space"], ["People say staying home is one of the best ways to recharge, and I'd say I totally agree with that.", "전체적으로 되게 편안하고, 특히 자기 공간에서 느껴지는 여유로움이 제일 좋아요.", "staying home is one of the best ways to recharge"], ["Whenever I watch Netflix or cook something simple, I feel more connected to myself and get to kinda slow down after a busy day.", "많은 사람들이 집콕이 제일 좋은 휴식 방법이라고 하는데, 저도 완전 공감해요.", "watch Netflix or cook something simple"], ["Oh, and one time, I tried baking bread for the first time and… that moment really stuck with me.", "저는 집에서 넷플릭스 보거나 간단하게 요리할 때, 마음이 좀 편해지고 하루의 피로가 풀리는 느낌이에요.", "I tried baking bread for the first time and… that moment really stuck with me."], ["So yeah, staying home isn't just a habit for me. It's a small but meaningful part of my everyday life.", "그래서 저한테 집에 있는 건 단순한 습관이 아니에요. 제 일상에서 작지만 의미 있는 부분이에요.", "isn't just a habit for me"]]},
{"id": "t45", "name": "집안일 (Household Chores) / 가족 (가족 집안일) [루틴]", "group": "주제 연습", "qs": [["What is your responsibility at home? What things do you usually do to keep your house clean and comfortable? What is your role, and what are the different responsibilities in your family? Tell me about it in detail.", "집에서 당신의 책임은 무엇인가요? 집을 깨끗하고 편안하게 유지하기 위해 보통 어떤 일을 하나요? 당신의 역할은 무엇이고, 가족 안에서 각자 어떤 책임을 맡고 있나요? 자세히 말씀해주세요."], ["Everyone must do housework regularly. What kind of chores do you usually do at home? What is your responsibility at home? Tell me in detail.", "집안일을 할 때 가족 구성원마다 맡은 일이 있을 거예요. 각자 어떤 집안일을 맡고 있고, 어떻게 하는지 말해 주세요."], ["Your family probably has different responsibilities at home. Which chores is each family member responsible for? And how do they do that?", "모든 가족 구성원은 정기적으로 집안일을 해야 해요. 집에서 보통 어떤 집안일을 하나요? 집에서 맡고 있는 책임은 무엇인가요? 자세히 말해 주세요."]], "cards": [["Something I do pretty often is clean and organize my home, and um, it's honestly become part of my lifestyle.", "제가 자주 하는 건 집을 청소하고 정리하는 거예요.", "clean and organize my home"], ["It might sound simple, but yeah, it really shows a lot about how much we care about our living space.", "이것도 이제 제 라이프스타일의 일부가 됐어요.", "how much we care about our living space."], ["The whole thing's pretty satisfying, and what I notice most is just how much calmer it feels after cleaning.", "단순하지만, 사람들이 얼마나 집을 중요하게 생각하는지 보여주는 것 같아요.", "how much calmer it feels after cleaning."], ["Whenever I clean up or cook with my family, I feel more connected and get to kinda create a cozy vibe at home.", "보통은 뿌듯하고, 청소 끝나고 집이 훨씬 편안해지는 게 제일 좋아요.", "clean up or cook with my family"], ["So yeah, doing household chores is more than just a habit for me. It's a small but meaningful part of life here.", "그래서 집안일은 저한테 단순한 습관 이상이에요. 여기서의 일상 속 작지만 의미 있는 부분이에요.", "more than just a habit for me"]]},
{"id": "t46", "name": "집에서 보내는 휴가 (Staycation) [루틴]", "group": "주제 연습", "qs": [["Most people want to travel during their vacations. Can you tell me why you prefer to stay at home during your vacation? What makes a vacation at home enjoyable?", "대부분의 사람들은 휴가 동안 여행을 하고 싶어 합니다. 왜 휴가 동안 집에 있는 것을 선호하는지 말 해 줄 수 있나요? 왜 집에서의 휴가가 좋은 가요?"]], "cards": [["Something I do pretty often is spend my vacation at home, and um, it's honestly become part of my lifestyle.", "저는 휴가 때 집에서 보내는 걸 자주 해요.", "spend my vacation at home"], ["It might sound simple, but yeah, it really shows a lot about how I like to rest and recharge.", "음… 이제는 진짜 제 생활의 일부가 된 것 같아요.", "how I like to rest and recharge"], ["The whole thing's pretty peaceful, and what I notice most is just how nice it feels to relax without any plans or pressure.", "좀 단순하게 들릴 수도 있지만, 제가 어떻게 쉬고 충전하는지 잘 보여주는 것 같아요.", "how nice it feels to relax without any plans or pressure"], ["People say traveling is the best way to spend a vacation, but honestly, I totally enjoy just staying home and doing nothing for a change.", "전체적으로 되게 평화롭고, 특히 아무 계획이나 부담 없이 푹 쉬는 그 느낌이 너무 좋아요.", "just staying home and doing nothing for a change"], ["Whenever I watch movies, take long naps, or order good food, I feel recharged. I also get to slow down and enjoy my own space.", "영화를 보거나, 낮잠을 자거나, 맛있는 음식을 시켜 먹을 때마다 재충전되는 느낌이에요. 그리고 천천히 제 공간을 즐길 수 있어요.", "I feel recharged"], ["Oh, and one time, I spent the whole day in pajamas watching dramas, and… that moment really stuck with me.", "집에서 영화 보고, 낮잠 자고, 맛있는 거 시켜 먹을 때, 몸도 마음도 충전되는 느낌이에요.", "I spent the whole day in pajamas watching dramas"], ["So yeah, staying home for vacation isn't boring at all. It's actually a small but meaningful way for me to rest.", "그래서 집에서 보내는 휴가는 전혀 지루하지 않아요. 저한테는 작지만 의미 있는 휴식 방법이에요.", "isn't boring at all"]]},
{"id": "t47", "name": "영화 보기 (Movie) / TV 쇼 시청하기 (TV Show) & 리얼리티쇼 시청하기 (Reality Show) [루틴]", "group": "주제 연습", "qs": [["When you go to the movies, who do you usually go with? Are there any reasons you go to the movies with that person? What do you do with that person before going to a movie theater and after watching the movie?", "영화를 보러 갈 때 보통 누구와 함께 가나요? 그 사람과 영화를 보러 가는 특별한 이유가 있나요? 영화관에 가기 전과 영화를 본 후에 그 사람과 무엇을 하나요?"], ["Where do you watch TV shows / reality TV shows? How do you watch them? Please tell me how you usually watch TV shows / reality TV shows in as much detail as you can. TV", "쇼는 어디에서 보시나요? 어떻게 보시나요? 보통 TV 쇼를 어떻게 시청하시는지 가능한 한 자세히 말씀해주세요."]], "cards": [["Something I do pretty regularly is watch stuff with family on Netflix, and it's actually become a part of my lifestyle.", "저는 가족이랑 넷플릭스로 이것저것 보는 걸 자주 해요. 이제는 진짜 제 생활의 일부가 된 것 같아요.", "stuff with"], ["It may sound simple, but it really shows something about how these platforms changed everything.", "좀 단순하게 들릴 수도 있지만, 이런 플랫폼들이 우리의 일상을 얼마나 바꿨는지를 잘 보여주는 것 같아요.", "how these platforms changed everything."], ["It's usually convenient and what stands out is how easy it is to satisfy my family's different tastes.", "그리고 보통 편리하고요, 가장 눈에 띄는 건 가족들마다 좋아하는 게 다 다른데도 그걸 맞추기가 쉽다는 거예요.", "satisfy my family's different tastes."], ["Also, whenever we eat snacks and scroll through Netflix to pick something, we usually watch it together. I feel like I can relax and spend real quality time with them.", "또 간식을 먹으면서 넷플릭스에서 뭘 볼지 고를 때, 보통 같이 봐요. 그럴 때 마음이 편해지고 가족과 좋은 시간을 보내는 느낌이 들어요.", "relax and spend real quality time"], ["One time, we ended up marathoning a whole series in one night, and I still remember that.", "예전에 하룻밤 동안 시리즈 한 시즌을 다 본 적이 있는데, 그때가 아직도 기억에 남아요.", "series in one night"], ["So yeah, watching stuff together at home is just a small thing, but it really matters to me.", "그래서 그런지 집에서 가족이랑 같이 보는 시간은 작은 일이지만, 저한테는 정말 의미 있는 시간이 된 것 같아요.", "watching stuff together at home"]]},
{"id": "t48", "name": "음악 듣기 루틴 (Music) [루틴]", "group": "주제 연습", "qs": [["When and where do you usually listen to music? Do you listen to the radio or go to concerts? Please tell me how you listen to music.", "보통 언제 어디서 음악을 들으시나요? 라디오를 듣거나 콘서트에 가시나요? 음악을 어떻게 즐기시는지 알려 주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 음악이 어떻게 들어가는지 말하자면… 글쎄요, 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is listen to music on my phone when I'm commuting or working at my desk.", "저는 출퇴근할 때나 책상에서 일할 때 휴대폰으로 음악을 자주 들어요.", "listen to music on my phone when I'm commuting or working at my desk."], ["It's nothing fancy. Usually, I put on my headphones and open YouTube Music. I play my go-to playlist. It helps me focus or just clear my head a bit.", "별거 아니에요. 보통 이어폰을 끼고 유튜브 뮤직을 켜요. 자주 듣는 플레이리스트를 틀어요. 그러면 집중이 잘 되거나 머리가 좀 맑아져요.", "I play my go-to playlist"], ["I don't even think about it anymore. It's just one of my small habits. It keeps my day flowing and sets the mood, without me even noticing.", "이제는 딱히 의식하지도 않아요. 그냥 제 작은 습관 중 하나예요. 하루의 흐름을 만들어주고 분위기도 잡아주는데, 저도 모르게 그렇게 돼요.", "one of my small habits"], ["Oh, and once in a while, I do go to small concerts or live café gigs, but most of the time, it's just me and my playlist.", "아, 가끔은 작은 콘서트나 라이브 카페 공연에도 가지만, 대부분은 그냥 저랑 제 플레이리스트만의 시간이에요.", "go to small concerts or live caf"], ["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변인 것 같아요.", "I'd say that's my answer"]]},
{"id": "t49", "name": "카페 가기 (Cafe) [루틴]", "group": "주제 연습", "qs": [["What do you normally do when you go to a café? Or do you have meetings or gatherings? Please tell me what you like to do at the café in detail.", "카페에 가면 보통 무엇을 하시나요? 아니면 회의나 모임을 가지시나요? 카페에서 주로 무엇을 하는지 자세히 말씀해 주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 카페가 어떻게 들어가는지 말하자면… 글쎄요, 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is go to cafés to work or study on my laptop.", "저는 노트북 가지고 카페에 가서 일하거나 공부하는 걸 자주 해요.", "s to work or study on my laptop."], ["It's nothing fancy. Usually, I grab an iced Americano and find a quiet corner. I put on some background music. It helps me focus and get into a productive mood.", "별거 아니에요. 보통 아이스 아메리카노를 사고 조용한 자리를 잡아요. 배경음악을 틀어요. 그러면 집중도 잘 되고 생산적인 기분이 들어요.", "I grab an iced Americano"], ["I don't even think about it that much anymore… like… it's just one of those little habits that keep my days balanced and make me feel calm.", "이제는 딱히 의식하지도 않아요… 그냥… 그런 작은 습관들이 하루를 안정적으로 만들어주고 마음을 편안하게 해줘요.", "keep my days balanced and make me feel calm."], ["Oh, and sometimes I meet friends or coworkers there to talk or plan something, but most of the time, it's just me and my laptop. But yeah, I'd say that's my answer.", "아, 가끔은 친구들이나 동료들이랑 만나서 얘기하거나 계획을 세우기도 하는데, 대부분은 그냥 저랑 제 노트북만의 시간이에요. 음, 네, 그게 제 답변인 것 같아요.", "meet friends or coworkers there to talk or plan something"]]},
{"id": "t50", "name": "바 가기 (Bar) [루틴]", "group": "주제 연습", "qs": [["What do you typically do at the bar? Who do you usually go with? What menu do you like to order? Let me know what you do at the bar in detail.", "술집에서 일반적으로 무엇을 하시나요? 누구와 주로 같이 가나요? 어떤 메뉴를 좋아하시나요? 술집에 서 무엇을 하는지 자세히 알려주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 술집이 어떻게 들어가는지 말하자면… 글쎄요, 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is go to a bar with a few close friends after a long week.", "저는 한 주가 끝날 때쯤 가까운 친구들이랑 술집에 가는 걸 자주 해요.", "go to a bar with a few close friends after a long week."], ["It's nothing fancy. Usually, we find a cozy spot and order a few cocktails or some draft beer. We also share a couple of side dishes. It helps me unwind and just talk about life.", "별거 아니에요. 보통 아늑한 자리를 잡고 칵테일이나 생맥주를 몇 잔 시켜요. 안주도 같이 시켜요. 그러면 스트레스가 풀리고 그냥 삶에 대해 이야기할 수 있어요.", "find a cozy spot"], ["I don't even think about it that much anymore… like… it's just one of those little habits that let me recharge and stay connected with my friends.", "이제는 딱히 의식하지도 않아요… 그냥… 그런 작은 습관들이 저를 재충전해주고 친구들과 계속 연결된 느낌을 갖게 해줘요.", "let me recharge and stay connected with my friends."], ["Oh, and one time, we kept talking until the bar closed. We realized it was almost 3 a.m. I still remember that. But yeah, I'd say that's my answer.", "아, 그리고 한 번은 술집이 문 닫을 때까지 계속 얘기했어요. 벌써 새벽 3시가 다 된 걸 알았죠. 그때가 아직도 기억에 남아요. 음, 네, 그게 제 답변인 것 같아요.", "it was almost 3 a.m."]]},
{"id": "t51", "name": "공원 (Park) [루틴]", "group": "주제 연습", "qs": [["How often do you go to the park? What things do you usually do at the park? Describe your typical day at the park from the moment you arrive at the park to the time you leave the park.", "공원에 얼마나 자주 가시나요? 공원에서 보통 어떤 일을 하시나요? 공원에 도착하는 순간부터 공원을 떠날 때까지의 전형적인 하루를 자세히 설명해 주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 공원이 어떻게 들어가는지 말하자면… 글쎄요, 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is head to the park a couple of times a week, usually in the late afternoon.", "저는 일주일에 두세 번 정도, 보통 늦은 오후에 공원에 가요.", "head to the park a couple of times a week, usually in the late afternoon."], ["It's nothing fancy. Usually, I grab a coffee nearby and start a walking route on my phone. I put on a light podcast. It helps me clear my head and reset after the day.", "별거 아니에요. 보통 근처에서 커피를 사고 폰으로 걷기 코스를 켜요. 가벼운 팟캐스트를 틀어요. 그러면 머리가 맑아지고 하루를 리셋하는 데 도움이 돼요.", "I put on a light podcast"], ["I don't even think about it that much anymore. It's just one of those little habits. It keeps my mood steady. It also gets me moving without me overthinking it.", "이제는 딱히 의식하지도 않아요. 그냥 작은 습관 중 하나예요. 기분을 안정시켜줘요. 또 너무 깊게 생각하지 않고 몸을 움직이게 해줘요.", "one of those little habits"], ["From the moment I arrive, I do a few things. I stretch a bit by the entrance. I do a brisk lap. I slow down near the trees to cool off. Then I sit on a bench to journal or check in with family.", "도착하면 몇 가지를 해요. 입구 쪽에서 가볍게 스트레칭을 해요. 빠르게 한 바퀴 돌아요. 나무가 많은 쪽에서는 속도를 줄여서 몸을 식혀요. 그다음 벤치에 앉아서 일기를 쓰거나 가족에게 연락해요.", "I stretch a bit by the entrance"], ["Before I leave, I do a few more stretches. I refill my water and log my steps. And then I'm out. But yeah, I'd say that's my answer.", "나가기 전에는 스트레칭을 한 번 더 해요. 물도 채우고 걸음 수도 기록해요. 그러고 나서 나가요. 음, 네, 그게 제 답변인 것 같아요.", "I do a few more stretches"]]},
{"id": "t52", "name": "산책 (Walking) / 조깅 (Jogging) [루틴]", "group": "주제 연습", "qs": [["Safety is important. What items do you bring or wear when you go for a walk? What do you take to avoid injury? Tell me about your items for safety in detail.", "안전은 중요합니다. 산책할 때 어떤 물건을 가져가거나 착용하시나요? 부상을 피하기 위해 어떤 준비를 하시나요? 안전을 위해 준비하는 물품들에 대해 자세히 말씀해주세요."], ["Safety is important. What items do you bring or wear when you go jogging? What do you take to avoid injury? Tell me about your items for safety in detail.", "안전은 중요합니다. 조깅할 때 어떤 물건을 가져가거나 착용하시나요? 부상을 피하기 위해 어떤 준비를 하시나요? 안전을 위해 준비하는 물품들에 대해 자세히 말씀해주세요."]], "cards": [["Well… Hmm…", "음… 흐음…", "Well… Hmm…"], ["It's nothing fancy. Usually, I warm up first by doing some stretches. This helps me avoid injury during my little workout.", "별거 아니에요. 보통 운동 전에 스트레칭으로 먼저 몸을 풀어요. 이렇게 하면 작은 운동이라도 부상 없이 할 수 있어요.", "warm up first by doing some stretches"], ["I don't even think about it that much anymore. It's just one of those little habits that keeps me safe. Honestly, I didn't even know it was a routine of mine.", "이제는 딱히 크게 생각하지도 않아요. 그냥 나를 안전하게 지켜주는 작은 습관 중 하나예요. 솔직히 이게 제 루틴인 줄도 몰랐어요.", "keeps me safe"], ["But yeah, I'd say that's my answer.", "네, 그게 제 답인 것 같아요.", "I'd say that's my answer"]]},
{"id": "t53", "name": "가구 (Furniture) [루틴]", "group": "주제 연습", "qs": [["Is there a particular process you follow when purchasing new furniture? Do you bring your friends or family members when you are deciding which furniture to buy? Do you shop for your furniture at different stores or all in one place?", "새 가구를 살 때 특별한 절차가 있나요? 가구를 살 때 친구나 가족을 데리고 가나요? 여러 가게에서 가구를 사나요, 아니면 한 곳에서만 사나요?"]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴에서 가구를 사는 게 어떻게 진행되는지 말하자면… 글쎄요, 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is browse for new furniture online or visit a few stores before deciding what to buy.", "제가 꽤 자주 하는 일은 새 가구를 살 때 온라인으로 찾아보거나, 결정하기 전에 몇 군데 매장을 들러보는 거예요.", "browse for new furniture online or visit a few stores before deciding what to buy."], ["It's nothing fancy. Usually, I measure the space at home and compare styles and prices on different websites. I also save photos that match my room's vibe. This helps me picture how everything will fit together.", "별거 아니에요. 보통 집 공간을 재보고 여러 사이트에서 스타일과 가격을 비교해요. 제 방 분위기에 맞는 사진도 저장해둬요. 그러면 전체적인 배치를 미리 상상할 수 있어요.", "I measure the space at home"], ["I don't even think about it that much anymore… like… it's just one of those little habits that keep my place organized and make it feel more like home.", "이제는 딱히 의식하지도 않아요… 그냥 집을 깔끔하게 정리하고, 내 공간을 더 내답게 만드는 작은 습관인 것 같아요.", "keep my place organized and make it feel more like home."], ["When it comes to big pieces, I ask my family for opinions. Sometimes I bring a friend along to check the quality in person. But for smaller items, I just order online.", "큰 가구를 살 때는 가족에게 의견을 물어봐요. 가끔은 친구랑 같이 가서 품질을 직접 확인하기도 해요. 하지만 작은 물건은 그냥 온라인으로 주문해요.", "ask my family for opinions"], ["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변인 것 같아요.", "I'd say that's my answer"]]},
{"id": "t54", "name": "해변 (Beach) [루틴]", "group": "주제 연습", "qs": [["What activities do you usually do when you go to the beach? Describe your routine from the moment you arrive until you leave.", "해변에 가면 보통 어떤 활동을 하시나요? 도착한 순간 부터 떠날 때 까지의 일정을 자세히 설명해 주세요."]], "cards": [["Something I do pretty regularly is going to the beach, and it's actually become a part of my lifestyle.", "제가 꽤 자주 하는 것 중 하나는 해변에 가는 것인데, 이게 이제는 제 라이프스타일의 한 부분이 되었어요.", "Something I do pretty regularly is going to the beach"], ["It may sound simple, but it really shows something about daily life here.", "단순하게 들릴 수도 있지만, 이걸 보면 여기서의 일상적인 삶이 어떤지 느껴질 수 있어요.", "but it really shows something about daily life here"], ["It's usually super relaxing there. I love the vibe. There's salty air, the sound of waves, and people just relaxing.", "거기는 보통 정말 편안해요. 분위기가 마음에 들어요. 짠 바닷바람이 불고, 파도 소리가 들리고, 사람들이 그냥 쉬고 있어요.", "I love the vibe"], ["Whenever I arrive, I feel like I can reset my mood. So I usually find a spot and put my stuff down. Then I take a few minutes just to look at the ocean.", "도착할 때마다 기분이 리셋되는 느낌이 들어요. 그래서 보통 자리를 잡고 짐을 내려놓아요. 그다음 잠깐 바다를 바라보는 시간을 가져요.", "I feel like I can reset my mood"], ["One time, I got there a bit early. The beach was almost empty. I still remember that.", "한 번은 조금 일찍 도착했어요. 해변이 거의 비어 있었어요. 아직도 그 기억이 남아 있어요.", "The beach was almost empty"], ["So yeah, my beach routine is just a small thing, but it really matters to me.", "그래서 제 해변 루틴은 작은 일이지만, 저한테는 정말 의미가 있어요.", "my beach routine"]]},
{"id": "t55", "name": "캠핑 (Camping) [루틴]", "group": "주제 연습", "qs": [["What do you usually do when you go camping? When and where do you usually go? Who do you go with? Tell me what activities you do when you go camping.", "캠핑을 가면 보통 무엇을 하시나요? 주로 언제, 어디에서 캠핑을 하시나요? 누구와 함께 가시나요? 캠핑할 때 어떤 활동을 하는지 말씀해주세요."]], "cards": [["Something I do pretty regularly is go camping with my friends, and it's actually become a part of my lifestyle.", "제가 자주 하는 일 중 하나는 친구들이랑 캠핑 가는 거예요. 이게 이제 제 라이프스타일의 일부가 된 것 같아요.", "go camping with my friends"], ["It may sound simple, but it really shows something about how people here enjoy nature.", "단순하게 들릴 수도 있지만, 한국 사람들이 자연을 얼마나 즐기는지 잘 보여주는 것 같아요.", "how people here enjoy nature."], ["It's usually peaceful, and what stands out is the view and fresh air.", "보통은 되게 평화롭고, 특히 공기랑 풍경이 진짜 좋아요.", "the view and fresh air."], ["Whenever I set up the tent and cook together, I feel like I can just unwind.", "텐트 치고 같이 요리할 때, 그냥 완전히 쉬는 느낌이에요.", "set up the tent and cook together"], ["One time, we talked by the fire all night, and I still remember that.", "한 번은 밤새 모닥불 옆에서 얘기했는데, 아직도 기억에 남아요.", "we talked by the fire all night"], ["So yeah, camping is just a small thing, but it really matters to me.", "그래서 캠핑은 작은 일이지만, 저한테는 진짜 의미 있는 시간이에요.", "camping"]]},
{"id": "t56", "name": "교통수단 (Transportation) [루틴]", "group": "주제 연습", "qs": [["Tell me about the type of transportation you usually use. What types of transportation are there? Tell me in as much detail as possible.", "당신이 보통 이용하는 교통수단에 대해 말씀해주세요. 어떤 교통수단이 있나요? 가능한 한 자세히 말씀해주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is take the subway or bus to work every morning.", "제가 꽤 자주 하는 일은 매일 아침 버스나 지하철을 타고 출근하는 거예요.", "take the subway or bus to work every morning."], ["I don't do anything special. I usually put on my earphones and check my messages. I sit down if there's a seat. This helps me wake up slowly and get ready for work.", "특별한 건 없어요. 보통 이어폰을 끼고 메시지를 확인해요. 자리가 있으면 앉아요. 이렇게 하면 천천히 깨어나고 일할 준비가 돼요.", "I usually put on my earphones and check my messages"], ["I don't think about it much anymore. It's just a small habit for me now. It keeps my day on time.", "이제는 별로 신경 쓰지 않아요. 그냥 작은 습관이 됐어요. 이게 하루를 제시간에 맞게 해줘요.", "It keeps my day on time"], ["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요.", "I'd say that's my answer"]]},
{"id": "t57", "name": "재활용 (Recycling) [루틴]", "group": "주제 연습", "qs": [["Tell me, how do you recycle at home? What items do you usually recycle? How often do you take out recyclable items? Where do you take the recycling items to? Describe each step you take when you recycle at home.", "집에서 재활용을 어떻게 하시나요? 보통 어떤 품목들을 재활용하나요? 얼마나 자주 재활용품을 내놓으시나요? 재활용품을 어디로 가져가나요? 재활용을 할 때 어떤 단계들을 거치는지 하나씩 설명해주세요."]], "cards": [["Something I do pretty regularly is sorting the trash ASAP, and it's actually become a part of my lifestyle.", "제가 꽤 자주 하는 일은 쓰레기가 생기면 바로바로 분리수거하는 거예요. 이제는 제 생활 패턴의 한 부분이 되었어요.", "Something I do pretty regularly is"], ["It may sound simple, but it really shows something about daily life here.", "단순하게 들릴 수도 있지만, 이게 한국의 일상적인 모습을 잘 보여주는 행동이기도 해요.", "but it really shows something about daily life here"], ["It's usually pretty straightforward, and what stands out is it's become such an automatic thing now.", "보통은 꽤 간단한 편이에요. 그리고 이제는 그냥 자동으로 몸이 움직이는 느낌이에요.", "pretty straightforward"], ["Whenever I finish using something, like a bottle, a can, or cardboard, I sort it right away. This keeps my home cleaner. It also saves me trouble later.", "병, 캔, 박스 같은 걸 다 쓰면 바로 분리해요. 이렇게 하면 집이 더 깨끗해져요. 나중에 번거로운 일도 줄어들어요.", "I sort it right away"], ["One time, I forgot to sort some plastic containers. It took forever to recycle everything. I still remember that.", "한 번은 플라스틱 용기들을 분리 안 했어요. 그래서 다 분리수거하는 데 한참 걸렸어요. 그 일이 아직도 기억나요.", "It took forever to recycle everything"]]},
{"id": "t58", "name": "지형 (Geography) [루틴]", "group": "주제 연습", "qs": [["What kinds of activities do people in your country do using geographical features? Do they go hiking, swimming, or riding a bicycle? What are the differences from other countries? Please give me all the details.", "당신의 나라 사람들은 지리적 특성을 활용해 어떤 활동을 하나요? 하이킹, 수영, 또는 자전거 타기를 하나요? 다른 나라와 다른 점은 무엇인가요? 모든 세부 사항을 알려주세요."]], "cards": [["Something I do pretty often is go hiking or walk along rivers, and um, it's honestly become part of my lifestyle.", "제가 자주 하는 건 등산하거나 강가를 걷는 거예요.", "go hiking or walk along rivers"], ["It might sound simple, but yeah, it really shows a lot about how people here enjoy nature.", "이제는 제 생활의 일부가 된 것 같아요.", "how people here enjoy nature."], ["The whole thing's pretty energizing, and what I notice most is just how clean and easy the trails are.", "단순하지만, 한국 사람들이 자연을 얼마나 즐기는지 잘 보여주는 것 같아요.", "how clean and easy the trails are."], ["Whenever I go for a hike or take a riverside walk, I feel more connected and get to kinda refresh my mind and body.", "보통은 활기차고 기분이 좋아지고, 특히 길이 깨끗하고 걷기 편해서 좋아요.", "go for a hike or take a riverside walk"], ["So I think enjoying outdoor activities is more than just a habit for me. It's a small but meaningful part of my life here.", "그래서 야외 활동을 즐기는 건 저에게 단순한 습관 그 이상인 것 같아요. 제 삶에서 작지만 의미 있는 부분이에요.", "more than just a habit for me"]]},
{"id": "t59", "name": "휴일 (Holidays) [루틴]", "group": "주제 연습", "qs": [["What activities do you usually do during the holidays? Do you have gatherings with friends or family? Tell me about all the activities in as much detail as you can.", "그 명절 동안 보통 어떤 활동을 하나요? 친구들이나 가족과 모임을 가지나요? 가능한 한 모든 활동에 대해 자세히 설명해주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 글쎄요, 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is spend the holidays with my family, usually at my parents' place.", "제가 꽤 자주 하는 일은 명절이나 휴일에 가족들이랑 부모님 댁에서 시간을 보내는 거예요.", "spend the holidays with my family, usually at my parents' place."], ["I don't do anything special. I usually help prepare food. After dinner, we watch a movie and chat over dessert. This makes me feel grounded and thankful.", "특별한 건 없어요. 보통 음식 준비를 도와요. 저녁 먹고 나서 영화 보고 디저트 먹으면서 얘기해요. 이렇게 하면 마음이 편안하고 감사한 기분이 들어요.", "This makes me feel grounded and thankful"], ["I don't think about it much anymore. It's just a small habit for me now. It keeps my family relationships strong. It reminds me what matters most.", "이제는 별로 신경 쓰지 않아요. 그냥 작은 습관이 됐어요. 이게 가족 관계를 단단하게 해줘요. 그리고 가장 중요한 게 뭔지 다시 생각하게 해줘요.", "It keeps my family relationships strong"], ["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요.", "I'd say that's my answer"]]},
{"id": "t60", "name": "병원 (Dentist) [루틴]", "group": "주제 연습", "qs": [["As a child, explain your reaction to seeing a doctor or dentist. Did you enjoy these visits? What typically happened during the visits? Provide a lot of details regarding these visits.", "어린 시절, 의사나 치과의사를 보러 갔을 때의 반응을 설명해주세요. 이런 방문을 즐겼나요? 보통 방문 중에 어떤 일이 있었나요? 이 방문들에 대해 자세히 이야기해주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I used to do pretty regularly as a kid was go to the dentist every few months for checkups.", "제가 어릴 때 꽤 자주 했던 일은 두세 달에 한 번씩 치과 검진을 받으러 가는 거였어요.", "go to the dentist every few months for checkups."], ["It wasn't anything special. I usually sat in the big chair and listened to the buzzing sound. I tried not to get scared. This helped me stay calm around doctors later.", "특별한 건 없었어요. 보통 큰 의자에 앉아서 윙윙거리는 소리를 들었어요. 무서워하지 않으려고 노력했어요. 이게 나중에 병원에서 차분하게 있는 데 도움이 됐어요.", "This helped me stay calm around doctors later"], ["I don't think about it much anymore. It's just a memory that stayed with me. It made me less scared of hospitals later on.", "이제는 별로 생각하지 않아요. 그냥 기억에 남은 일이에요. 이게 나중에 병원을 덜 무서워하게 해줬어요.", "It made me less scared of hospitals later on"], ["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요.", "I'd say that's my answer"]]},
{"id": "t61", "name": "헬스장 (Gyms) [루틴]", "group": "주제 연습", "qs": [["Tell me about how you first started going to the gym and tell me about your routine when you go to the gym.", "헬스장에 처음 다니기 시작하게 된 계기에 대해 이야기해 주세요. 그리고 헬스장에 갈 때 보통 어떤 루틴으로 운동하는지도 말해 주세요."]], "cards": [["I first started going to the gym a few years ago… you know…", "제가 헬스장에 처음 다니기 시작한 건 몇 년 전이었어요… 그거 아시죠…", "a few years ago… you know…"], ["I wanted to drop some weight and… get fit.", "살도 좀 빼고… 몸도 좀 만들고 싶어서요.", "drop some weight and… get fit"], ["As for my routine, I follow a three-day split. I do a pull day, a push day, and a leg day.", "루틴은 3분할로 하고 있어요. 풀 데이, 푸시 데이, 레그 데이로 나눠서 해요.", "I follow a three-day split"], ["On my pull days, I do my back and forceps…On my push day I do my chest and triceps… and umm.. on my leg days, I do my legs.", "풀 데이에는 등이랑 이두 운동하고요, 푸시 데이에는 가슴이랑 삼두 운동해요. 그리고 레그 데이에는 하체 운동을 해요.", "I do my legs"], ["It's nothing special.", "특별한 건 없어요.", "It's nothing special"]]},
{"id": "t62", "name": "헬스장 (Gyms) 어드밴스 [루틴]", "group": "주제 연습", "qs": [["What effect does going to the gym have on your health? Tell me in as much detail as you can.", "헬스장에 다니는 것이 당신의 건강에 어떤 영향을 미치나요? 가능한 한 자세하게 설명해 주세요."]], "cards": [["Honestly, going to the gym had a big impact on my health.", "솔직히 말하면, 헬스장에 다니는 건 제 건강에 정말 큰 영향을 줬어요.", "going to the gym had a big impact on my health"], ["Physically, it gave me more energy and stamina, so I don't get tired as easily during the day.", "신체적으로는 에너지랑 체력이 좋아져서 하루 중에 쉽게 피곤해지지 않게 됐어요.", "so I don't get tired as easily during the day"], ["It also helped with posture and muscle balance, especially since I sit a lot.", "또 제가 오래 앉아 있는 편이라 자세나 근육 밸런스에도 도움이 됐어요.", "especially since I sit a lot"], ["My body just feels less stiff and sore.", "몸이 전보다 덜 뻐근하고 덜 아파요.", "less stiff and sore"], ["Mentally, it helped even more.", "정신적인 면에서는 오히려 그 효과가 더 컸어요.", "Mentally, it helped even more"], ["After a workout, I feel less stressed. My mood gets better too. I also sleep better at night. Overall, the gym helps me stay healthy, both physically and mentally. That's why I try to make it part of my routine.", "운동하고 나면 스트레스가 줄어요. 기분도 더 좋아져요. 밤에 잠도 더 잘 자요. 전반적으로 헬스장은 몸과 마음 모두 건강하게 해줘요. 그래서 이걸 제 일상의 한 부분으로 유지하려고 해요.", "the gym helps me stay healthy"]]},
{"id": "t63", "name": "미용실 (Hair Salon) [루틴]", "group": "주제 연습", "qs": [["Explain your routine when you go to get a haircut. What steps do you follow from the moment you enter the salon to the moment you leave? Include details about the interaction with the staff, the services you usually receive, and any other relevant details.", "머리 자를 때의 루틴을 설명해주세요. 미용실에 들어간 순간부터 나올 때까지 어떤 절차를 따르시나요? 직원 들과의 상호작용, 보통 받는 서비스, 그리고 그 외의 관련된 세부 사항도 포함해서 말씀해주세요."]], "cards": [["Okay, so as for how it goes down with my routine… well… hmm…", "음, 제 루틴이 어떻게 되는지 말하자면… 글쎄요, 흠…", "so as for how it goes down with my routine… well… hmm…"], ["Something I do pretty regularly is go to the salon every couple of months to get a haircut and trim my bangs.", "저는 두 달에 한 번 정도 미용실에 가서 머리를 다듬고 앞머리를 정리해요.", "go to the salon every couple of months to get a haircut and trim my bangs."], ["I don't do anything special. I usually say hi to my stylist and sit down. Then I show a few reference photos. This helps me get exactly the look I want, without thinking too much.", "특별한 건 없어요. 보통 디자이너에게 인사하고 자리에 앉아요. 그리고 참고 사진 몇 장을 보여줘요. 이렇게 하면 너무 고민하지 않고도 딱 원하는 스타일로 할 수 있어요.", "This helps me get exactly the look I want"], ["I don't think about it much anymore. It's just a small habit now. It keeps me looking fresh and feeling put together. Honestly, I didn't even realize it was a routine of mine.", "이제는 별로 신경 쓰지 않아요. 그냥 작은 습관이 됐어요. 이게 저를 깔끔하고 정돈된 느낌으로 만들어줘요. 사실 이게 제 루틴인지도 몰랐어요.", "It keeps me looking fresh and feeling put together"], ["But yeah, I'd say that's my answer.", "음, 네, 그게 제 답변이에요.", "I'd say that's my answer"]]},
{"id": "t64", "name": "호텔 (Hotels) [루틴]", "group": "주제 연습", "qs": [["Please tell me what you do when you arrive at a hotel. What steps do you take? Tell me everything from beginning to end.", "호텔에 도착하면 무슨 일을 하나요? 어떤 절차를 거치시나요? 처음부터 끝까지 모두 말씀해주세요."]], "cards": [["Something I do pretty regularly is stay at hotels when I travel, and it's actually become a part of my lifestyle.", "제가 가끔 하는 일은 여행할 때 호텔에 머무는 거예요. 이것도 이제 제 생활 패턴 중 하나가 됐어요.", "stay at hotels when I travel"], ["It may sound simple, but it really shows something about how people value comfort.", "단순하지만, 사람들이 얼마나 편안함을 중요하게 생각하는지 보여주는 것 같아요.", "how people value comfort."], ["It's usually relaxing, and what stands out is the clean rooms and cozy vibe.", "보통은 되게 편하고, 특히 깨끗한 방이랑 아늑한 분위기가 좋아요.", "the clean rooms and cozy vibe."], ["Whenever I check in and lie on the bed, I feel like I can totally recharge.", "체크인하고 침대에 눕는 순간, 그냥 모든 피로가 사라지는 느낌이에요.", "check in and lie on the bed"], ["One time, I watched the sunrise from my hotel window, and I still remember that.", "한 번은 호텔 창문 너머로 해 뜨는 걸 봤는데, 아직도 그게 기억에 남아요.", "I watched the sunrise from my hotel window"], ["So yeah, staying at hotels is just a small thing, but it really matters to me.", "그래서 호텔에서 쉬는 시간은 작지만, 저한테는 꽤 소중해요.", "staying at hotels"]]},
{"id": "t65", "name": "기술 (Technology) [루틴]", "group": "주제 연습", "qs": [["What kind of technology do you use the most these days? A computer, mobile phone, or any other handheld devices? Please tell me about your experiences using technology.", "요즘 가장 많이 사용하는 기술은 무엇인가요? 컴퓨터, 휴대폰, 또는 다른 휴대용 장치인가요? 그 기술을 사용하는 경험에 대해 말씀해주세요."]], "cards": [["Something I do pretty often is use my phone and laptop for almost everything, and um, it's honestly become part of my lifestyle.", "제가 자주 하는 일 중 하나는 휴대폰이랑 노트북을 거의 매일 쓰는 거예요.", "use my phone and laptop for almost everything"], ["It might sound simple, but yeah, it really shows a lot about how digitalized life is here in Korea.", "이제는 완전히 제 생활의 일부가 됐어요.", "how digitalized life is here in Korea."], ["The whole thing's pretty convenient, and what I notice most is just how easy everything feels.", "단순하게 들릴 수도 있지만, 한국이 얼마나 디지털화된 사회인지 잘 보여주는 것 같아요.", "how easy everything feels."], ["Whenever I use AI tools or manage my schedule on my phone, I feel more connected and get to kinda save time and stay organized.", "보통은 되게 편하고, 특히 모든 게 쉽게 연결되어 있다는 점이 좋아요.", "use AI tools or manage my schedule on my phone"], ["So I think using technology is more than just a habit for me. It's a small but meaningful part of my life here.", "그래서 기술을 사용하는 건 저에게 단순한 습관 그 이상인 것 같아요. 제 삶에서 작지만 의미 있는 부분이에요.", "more than just a habit for me"]]},
{"id": "t66", "name": "건강한 사람 (Health)  1 / 건강한 사람 (Health)  2 [루틴]", "group": "주제 연습", "qs": [["What kinds of things do you usually do to stay healthy? What healthy food do you eat? Do you regularly work out? Please tell me what activities you do to stay healthy in detail.", "건강을 유지하기 위해 주로 어떤 것을 하나요? 건강식품을 드시나요? 규칙적으로 운동 하시나요? 건강을 유지하기 위해 어떤 활동을 하는지 자세히 알려주세요."], ["What do people in your country usually do to stay healthy? What food do people eat to become healthy? What exercises do people do? Tell me about how people stay healthy.", "당신의 나라 사람들은 건강을 유지하기 위해 보통 무엇을 하나요? 사람들은 건강해지기 위해 어떤 음식을 먹나요? 사람들은 어떤 운동을 하나요? 사람들이 어떻게 건강을 유지하는지 말해주세요."]], "cards": [["Something we do pretty often is trying to live an active and balanced lifestyle, and um, it's honestly become part of our daily routine.", "저희가 꽤 자주 하는 것 중 하나는 활동적이고 균형 잡힌 생활을 하려고 노력하는 것인데요, 솔직히 이제는 일상 루틴의 일부가 됐어요.", "trying to live an active and balanced lifestyle"], ["It might sound simple, but yeah, it really shows a lot about everyday life here.", "단순하게 들릴 수도 있지만, 이런 모습이 여기서의 일상생활을 잘 보여준다고 생각해요.", "it really shows a lot about everyday life here"], ["The whole thing's pretty practical, and what we notice most is just how much people focus on consistency rather than extremes.", "전반적으로 꽤 실용적인 방식이고, 특히 극단적인 방법보다는 꾸준함을 중요하게 여긴다는 점이 가장 눈에 띄어요.", "how much people focus on consistency rather than extremes"], ["Whenever we eat balanced meals, walk a lot, or work out regularly, we feel more energized and get to maintain both our physical and mental health.", "저희는 균형 잡힌 식사를 하고, 많이 걷거나 규칙적으로 운동할 때, 몸과 마음이 더 활력 있어지는 걸 느껴요.", "eat balanced meals, walk a lot, or work out regularly"], ["So I think staying healthy is more than just a habit for us. It's a small but meaningful part of life here.", "그래서 건강을 유지하는 건 단순한 습관 그 이상인 것 같아요. 여기서의 삶에서 작지만 의미 있는 부분이에요.", "more than just a habit for us"]]},
{"id": "t67", "name": "여가 시간 (Free time) [루틴]", "group": "주제 연습", "qs": [["Tell me about your routine with your free time. What do you do when you have your free time? Tell me in as much detail as you can.", "여가 시간에 대한 당신의 일상적인 루틴을 말씀해 주세요. 자유 시간이 있을 때 보통 무엇을 하나요? 가능한 한 자세히 이야기해 주세요."]], "cards": [["When I have free time, I usually like to slow down and relax.", "자유 시간이 있을 때는 보통 천천히 쉬는 편이에요.", "I usually like to slow down and relax"], ["Most evenings, I watch Netflix after dinner to unwind.", "대부분의 저녁에는 저녁을 먹고 나서 넷플릭스를 보면서 하루를 마무리해요.", "I watch Netflix after dinner to unwind"], ["I usually watch just one episode so it doesn't take up too much time.", "시간을 너무 많이 쓰지 않으려고 보통 한 편만 보는 편이에요.", "doesn't take up too much time"], ["Lately, I've been watching The Witcher, and it's been a great way for me to relax.", "요즘에는 [The Witcher](chatgpt://generic-entity?number=0)라는 드라마를 보고 있는데, 편하게 쉬기에 딱 좋아요.", "and it's been a great way for me to relax"], ["So overall, my free-time routine is pretty simple and helps me recharge.", "그래서 제 여가 시간 루틴은 전반적으로 단순하고, 재충전하는 데 도움이 돼요.", "my free-time routine is pretty simple and helps me recharge"]]},
{"id": "t68", "name": "음식 (Food) [루틴]", "group": "주제 연습", "qs": [["What food do you usually eat? Tell me everything about the food you eat on a regular day.", "당신은 주로 어떤 음식을 먹나요? 당신이 평소에 먹는 음식에 대해 모든 것을 말해 주세요."]], "cards": [["Hmm… what food do I usually eat?", "음… 제가 보통 어떤 음식을 먹냐고요?", "what food do I usually eat"], ["As a Korean, I'm not sure if you know this, but rice is on my plate three meals a day, every day.", "한국 사람이라서 아실지 모르겠지만, 제 식탁에는 매일 세 끼 모두 밥이 올라와요.", "every day"], ["But it's not just rice.", "하지만 밥만 먹는 건 아니고요.", "But it's not just rice"], ["I also have some side dishes and meat.", "반찬도 먹고 고기도 같이 먹어요.", "have some side dishes and meat"], ["Honestly, that's just how I've eaten my whole life, so I don't really think much about it.", "솔직히 이런 식으로 평생 먹어 와서 평소에는 별로 의식하지 않는 것 같아요.", "so I don't really think much about it"]]},
{"id": "t69", "name": "동네(Neighborhood) [과거경험]", "group": "주제 연습", "qs": [["Now, talk about an interesting or memorable experience in your neighborhood. When and where did it occur? Why was it interesting or memorable?", "이제, 동네에서 겪은 흥미롭거나 기억에 남는 경험에 대해 말해주세요. 언제 어디서 그것이 발생했나요? 왜 그 경험이 흥미롭거나 기억에 남나요?"]], "cards": [["I wanna tell you about a memorable experience I had in my neighborhood park.", "제가 이야기하고 싶은 기억에 남는 경험은 동네 공원에서 있었던 일이에요.", "in my neighborhood park"], ["Honestly, I don't usually go to the park at night. But I decided to try it once. I'm glad I did.", "솔직히 저는 보통 밤에 공원에 잘 안 가요. 하지만 그날은 한 번 가보기로 했어요. 그리고 정말 잘한 선택이었어요.", "I'm glad I did"], ["It was last spring. I was there with one of my neighbors. This neighbor also likes taking evening walks.", "지난 봄이었어요. 동네 이웃 한 명과 함께 있었어요. 그 이웃도 저녁 산책을 좋아해요.", "This neighbor also likes taking evening walks"], ["We walked around the park. We talked about life and enjoyed the cool breeze. At first, I wasn't that into it.", "우리는 공원을 걸었어요. 이런저런 이야기를 하고 시원한 밤공기를 즐겼어요. 처음엔 별로 내키지 않았어요.", "At first, I wasn't that into it"], ["But it turned out to be really relaxing, and it totally changed how I see my neighborhood.", "하지만 정말 편안한 경험이었고, 제 동네에 대한 인식이 완전히 바뀌었어요.", "really relaxing"], ["Now I actually take short evening walks there a few times a week, which still surprises me.", "이제는 일주일에 여러 번 저녁 산책을 나갈 정도로 좋아하게 되었어요, 저도 아직 놀라워요.", "take short evening walks there a few times a week"]]},
{"id": "t70", "name": "거주지 (Home) [과거경험]", "group": "주제 연습", "qs": [["We always have some problems that happen at home. For example, it could be noise from your neighbors, something in your home broken, or someone you live with not cooperating. Please tell me about some problems that have happened in your home.", "우리는 집에서 항상 몇가지 문제가 생기 곤해요. 예를 들면, 이웃의 소음, 집안에 고장이 난 물건, 아니면 같이 사는 사람이 협조하지 않는 경우 등이 있을 수 있죠. 집에서 생겼던 문제에 대해 얘기해주세요."], ["Have you ever had any problems with your home? What was the problem and how did you deal with it? How did the problem turn out? Give me as many details as possible.", "혹시 집에서 어떤 문제가 있었나요? 그 문제는 무엇이었고, 어떻게 해결했나요? 그 문제는 어떻게 되었나요? 가능한 한 많은 세부 사항을 알려주세요."]], "cards": [["I wanna tell you about a memorable experience I had at home.", "집에서 겪었던 기억에 남는 경험에 대해 이야기 해 볼게요.", "at home"], ["Honestly, I don't usually deal with home maintenance myself. But I decided to handle it once. I'm glad I did.", "솔직히 저는 보통 집 수리를 직접 하지 않아요. 하지만 한 번 제가 해결해보기로 했어요. 그리고 정말 잘한 결정이었어요.", "I decided to handle it once"], ["So..", "그래서…", "So"], ["I noticed that water was leaking under the kitchen sink. At first, I didn't want to fix it. I thought it would be complicated.", "주방 싱크대 아래에서 물이 새는 걸 발견했어요. 처음에는 고치고 싶지 않았어요. 복잡할 것 같았거든요.", "I thought it would be complicated"], ["But it turned out to be easier than I expected. It actually felt meaningful to solve it myself. Now I do most home repairs myself. That still surprises me.", "그런데 생각보다 훨씬 쉽게 해결했어요. 혼자 해결했다는 게 꽤 의미 있게 느껴졌어요. 이제는 집에서 생기는 수리를 거의 직접 해요. 그게 아직도 좀 놀라워요.", "Now I do most home repairs myself"]]},
{"id": "t71", "name": "집에서 보내는 휴가 (Staycation) 1 [과거경험]", "group": "주제 연습", "qs": [["Can you tell me about a recent vacation you spent at home? When was it, who were you with, and what did you do?", "최근에 집에서 보낸 휴가에 대해 이야기해 주세요. 언제였나요? 누구와 있었고 무엇을 했나요?"]], "cards": [["I wanna tell you about a memorable experience I had during a staycation at home.", "제가 이야기하고 싶은 기억에 남는 경험은 집에서 보낸 스테이케이션이에요.", "during a staycation at home"], ["Honestly, I don't usually spend my vacation at home. But I decided to try it once. I'm glad I did.", "솔직히 저는 평소에 휴가를 집에서 보내지 않아요. 하지만 그때는 한 번 해보기로 했어요. 그리고 정말 만족했어요.", "I decided to try it once"], ["It was last summer break, and I was with my family at home.", "그게 지난 여름 방학이었고, 가족들과 집에 함께 있었어요.", "last summer break"], ["We ordered good food. We watched movies all day and just rested. At first, I wasn't that excited about it.", "맛있는 음식을 시켜 먹었어요. 하루 종일 영화를 보고 그냥 쉬었어요. 처음엔 별로 기대되지 않았어요.", "At first, I wasn't that excited about it"], ["But it turned out to be really meaningful and refreshing, and it totally changed how I see staycations.", "하지만 정말 의미 있고 힐링되는 경험이었고, 집에서 보내는 휴가에 대한 제 생각이 완전히 달라졌어요.", "really meaningful and refreshing"], ["Now I actually look forward to resting at home during long breaks, which still surprises me.", "이제는 긴 방학 때 집에서 쉬는 걸 기대할 정도로 좋아하게 되었어요, 저도 아직 신기해요.", "look forward to resting at home during long breaks"]]},
{"id": "t72", "name": "집에서 보내는 휴가 (Staycation) 2 [과거경험]", "group": "주제 연습", "qs": [["Most people want to travel during their vacations. Can you tell me why you prefer to stay at home during your vacation? What makes a vacation at home enjoyable?", "대부분의 사람들은 휴가 동안 여행을 하고 싶어합니다. 왜 휴가 동안 집에 있는 것을 선호하는지 말해줄 수 있나요? 왜 집에서의 휴가가 좋은가요?"]], "cards": [["Well, that's easy.", "음, 그건 쉬운 질문이에요.", "that's easy"], ["Why wouldn't you want to stay home during your vacation?", "휴가 때 집에 있고 싶지 않을 이유가 있나요?", "to stay home during your vacation"], ["It's the best place there is to go… at least for me it is.", "저한테는요… 집이 사실 가장 좋은 휴가지거든요.", "at least for me it is"], ["I can't speak for everyone. But I think many of us stay home because our vacation days are short. Also, vacations are for relaxing. And it's much more relaxing to lie in bed and look at your phone than to travel.", "모두를 대표해서 말할 수는 없어요. 하지만 많은 사람들이 집에 머무는 이유는 휴가가 짧기 때문인 것 같아요. 그리고 휴가는 원래 쉬려고 있는 거잖아요. 여행보다 침대에 누워서 핸드폰 보는 게 훨씬 편하죠.", "vacations are for relaxing"], ["So yeah, I guess that's why some people stay home.", "그래서 뭐, 그런 이유로 집에서 휴가를 보내는 사람들이 있는 것 같아요.", "I guess that's why some people stay home"]]},
{"id": "t73", "name": "집에서 보내는 휴가 (Staycation) 3 [과거경험]", "group": "주제 연습", "qs": [["Sometimes problems can occur when you stay at home for vacations. Maybe it's something interesting, satisfying, or unexpected that happens. What happened? And how did you deal with it? Tell me everything in detail.", "때때로 휴가 동안 집에 있을 때 문제가 발생할 수 있습니다. 어쩌면 흥미롭고, 만족스럽거나, 예상치 못한 일이 일어날지도 모릅니다. 무슨 일이 있었나요? 그 일에 어떻게 대처하셨나요? 모든 것을 자세히 말해주세요."]], "cards": [["Something I do pretty regularly for vacations is staying at home, and once my water pipes just burst, completely out of the blue.", "휴가 때 내가 꽤 자주 하는 건 집에 머무르는 건데, 어느 한 번은 정말 예상도 못 하게 집 수도관이 갑자기 터졌어.", "water pipes just burst"], ["Water started flooding the floor. I had to deal with it right away. So I canceled my plans immediately.", "물이 바닥으로 쏟아지기 시작했어요. 바로 처리해야 했어요. 그래서 바로 약속을 취소했어요.", "I canceled my plans immediately"], ["I already called the repair guy, but honestly, I wasn't sure how long it would take.", "이미 수리 기사님은 불렀지만, 솔직히 얼마나 걸릴지는 잘 모르겠더라.", "called the repair guy"], ["To make it up to my friend, I offered to buy dinner or go somewhere nice. They were totally okay with it.", "친구한테 미안해서 저녁을 사거나 어디 괜찮은 곳에 가자고 했어요. 친구도 흔쾌히 좋다고 했어요.", "They were totally okay with it"], ["It was unexpected and stressful, but you know things happen.", "완전 예상 밖의 일이라 스트레스도 받았지만, 뭐 이런 일도 생기잖아.", "but you know things happen"]]},
{"id": "t74", "name": "카페 (Cafe) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you have had at a coffee shop. When and where was it? Who were you with? What happened? Talk about the experience in detail.", "카페에서 겪었던 기억에 남는 경험에 대해 말씀해주세요. 언제, 어디서였나요? 누구와 함께 있었나요? 무슨 일이 있었나요? 그 경험에 대해 자세히 이야기해주세요."], ["Let's talk about the first coffee shop you went to. What was special about that place? Why did you decide to go to the cafe for the first time?", "처음 방문했던 카페에 대해 이야기해 봅시다. 그곳은 어떤 점이 특별했나요? 왜 처음으로 그 카페에 가게 되었나요?"]], "cards": [["Hmm, I think I'll talk about the first time I went to a coffee shop.", "음… 처음 카페에 갔던 때에 대해 이야기해볼게요.", "went to a coffee shop"], ["To be honest, it was such a long time ago that I don't remember all the details clearly.", "솔직히 너무 오래전이라 모든 디테일이 선명하게 기억나는 건 아니에요.", "it was such a long time ago that I don't remember all the details clearly"], ["I just remember it was exciting. Everything felt new to me. I remember the smell of coffee, the cozy lights, and the quiet atmosphere.", "그냥 신기하고 재미있었던 기억만 남아 있어요. 모든 게 새로웠거든요. 커피 향, 따뜻한 조명, 조용한 분위기가 기억나요.", "Everything felt new to me"], ["Nothing big happened. It was just a typical first experience for a kid. I mainly went there because my parents wanted to grab a drink and take a break.", "특별한 일은 없었어요. 그냥 어린아이의 평범한 첫 경험이었어요. 부모님이 잠깐 쉬면서 음료를 마시고 싶어서 간 거였어요.", "Nothing big happened"], ["Looking back now, it's not a super special memory. But it's still nice to think about sometimes. That small café is why I like coffee shops today.", "지금 돌이켜보면 엄청 특별한 기억은 아니에요. 하지만 가끔 생각하면 여전히 좋아요. 그 작은 카페 덕분에 지금도 카페를 좋아하게 됐어요.", "it's still nice to think about sometimes"]]},
{"id": "t75", "name": "바 (Bar) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable incident that happened at a bar. What exactly happened, and why was it so special? How did you deal with it? Please tell me everything about that incident in detail.", "술집에서 일어났던 기억에 남는 사건에 대해 말해주세요. 정확히 무슨 일이 일어났고, 왜 그 일이 특별하나요? 어떻게 대처하셨나요? 그 사건에 대한 모든 것을 자세히 말해주세요."]], "cards": [["This one's kinda random, but I ran into someone I knew at a bar near my neighborhood.", "이건 좀 랜덤한 이야기인데, 제가 아는 사람을 동네 근처 술집에서 우연히 마주친 적이 있어요.", "at a bar near my neighborhood"], ["I wasn't expecting to see them there, so it kinda caught me off guard.", "거기서 그 사람을 볼 거라고 전혀 예상하지 못해서, 순간 조금 당황했어요.", "so it kinda caught me off guard"], ["We ended up talking for a bit. We caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 근황도 나누고 이것저것 얘기했어요. 그날 하루가 훨씬 좋아졌어요.", "It actually made my day"], ["It felt nice to see a familiar face out of nowhere… I don't know, it just reminded me how small the world can be.", "아무 준비도 없이 익숙한 얼굴을 마주치니까 기분이 묘하게 좋았고… 글쎄요, 세상이 참 좁다는 생각이 다시 들었어요.", "it just reminded me how small the world can be"], ["I had been feeling a bit stressed that day. Talking with them and laughing over a drink really helped. It helped me relax and feel better.", "그날 좀 스트레스를 받고 있었어요. 그 친구랑 얘기하고 웃으면서 마시니까 도움이 많이 됐어요. 기분이 풀리고 편안해졌어요.", "Talking with them and laughing over a drink really helped"]]},
{"id": "t76", "name": "음악 (Music) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a particular time when you went to listen to some live music. Did you go to concerts or a live café? What did you do there, and what happened? What made this experience memorable?", "라이브 음악을 들으러 갔던 특별한 경험에 대해 말해주세요. 콘서트에 갔나요, 아니면 라이브 카페에 갔나요? 거기서 무엇을 했고, 어떤 일이 있었나요? 무엇이 그 경험을 특별하게 만들었나요?"], ["How did you first become interested in listening to music? What kind of music did you listen to when you were young? What was your favorite song? How has your taste in music changed over time?", "음악 듣기에 처음 관심을 가지게 된 계기가 무엇인가요? 어릴 때는 어떤 음악을 들었나요? 좋아했던 노래는 무엇이었나요? 그리고 시간이 지나면서 음악 취향은 어떻게 바뀌었나요?"]], "cards": [["Hmm, I think I'll talk about the first time I really got interested in listening to music.", "음… 제가 처음 음악 듣기에 관심을 가졌던 때에 대해 이야기해볼게요.", "really got interested in listening to music"], ["To be honest, it was such a long time ago that I don't remember all the details clearly.", "솔직히 너무 오래전이라 모든 세부 내용이 선명하게 기억나는 건 아니에요.", "it was such a long time ago that I don't remember all the details clearly"], ["I just remember that it was pretty fun. Everything sounded new and catchy to me. When I was young, I mostly listened to simple pop songs. Those songs were popular on TV.", "그냥 정말 재밌었던 것만 기억나요. 모든 게 새롭고 귀에 잘 들어왔어요. 어릴 때는 주로 단순한 팝송을 들었어요. 그 노래들은 TV에서 인기였어요.", "sounded new and catchy"], ["Nothing huge happened. It was just a normal childhood moment. My favorite song back then was an upbeat kids' pop song. I played it over and over again.", "특별한 일은 없었어요. 그냥 평범한 어린 시절의 순간이었어요. 그때 제가 가장 좋아했던 노래는 신나는 어린이 팝송이었어요. 그 노래를 계속 반복해서 들었어요.", "played it over and over again"], ["Looking back now, it's not a super special memory. But it's nice to think about once in a while. My taste has changed a lot. Now I enjoy calmer, more relaxing music instead of loud pop.", "지금 돌아보면 엄청 특별한 기억은 아니에요. 하지만 가끔 생각하면 좋아요. 제 취향이 많이 바뀌었어요. 지금은 시끄러운 팝 음악보다 차분하고 편안한 음악을 더 좋아해요.", "calmer, more relaxing music"]]},
{"id": "t77", "name": "영화 (Movies) [과거경험]", "group": "주제 연습", "qs": [["Tell me about the last time you went to see a movie. What movie did you see? Who did you go with? What did you do before and after the movie? Tell me about the recent movie you have seen in detail.", "마지막으로 보러 간 영화에 대해 말해주세요. 무슨 영화를 봤나요? 누구와 함께 갔나요? 영화 시작 전과 후에 무엇을 했나요? 최근에 본 영화에 대해 자세히 말해주세요."]], "cards": [["Umm… one of the movies I watched as a kid was Finding Nemo.", "음… 제가 어릴 때 봤던 영화 중 하나가 파인딩 니모였어요.", "one of the movies"], ["Everyone was talking about it. I don't really like following trends, but I ended up watching it anyway. I'm glad I did. It became one of my favorite movies.", "다들 그 얘기만 했어요. 저는 유행을 따라가는 걸 별로 안 좋아하지만, 어쨌든 보게 됐어요. 보길 잘했다고 생각해요. 그 영화는 제가 가장 좋아하는 영화 중 하나가 됐어요.", "one of my favorite movies"], ["I don't remember any specific scenes now. It was so long ago. But it was an animation-adventure movie. It was super creative.", "지금은 구체적인 장면이 기억나지 않아요. 너무 오래전 일이거든요. 하지만 애니메이션 어드벤처 영화였어요. 정말 창의적이었어요.", "animation-adventure movie"], ["It totally changed how I feel about animated movies.", "그 영화를 보고 나서, 제가 애니메이션을 바라보는 시각 자체가 완전 바뀌었어요.", "animated"], ["There's a whole series you can watch, so I'd definitely recommend it.", "시리즈도 있어서 계속 볼 수 있고, 저는 정말 추천하고 싶어요.", "so I'd definitely recommend it"]]},
{"id": "t78", "name": "TV 쇼 시청하기 (TV Show) [과거경험]", "group": "주제 연습", "qs": [["Please tell me about a memorable scene you have seen from a tv show. Why was it so memorable? What happened? Please tell me in as much detail as you can. TV", "쇼에서 본 기억에 남는 장면에 대해 말씀해주세요. 왜 그렇게 기억에 남았나요? 무슨 일이 있었나요? 가능한 한 자세히 말씀해주세요."]], "cards": [["Umm… one of the tv shows I watched as a kid was Coffee Prince.", "음… 제가 어릴 때 봤던 TV 쇼 중 하나가 <커피프린스>였어요.", "one of the tv"], ["Everyone was talking about it. I don't really like following trends, but I ended up watching it anyway. I'm glad I did. It became one of my favorites.", "다들 그 얘기만 했어요. 저는 유행을 따라가는 걸 별로 안 좋아하지만, 어쨌든 보게 됐어요. 보길 잘했다고 생각해요. 그게 제가 가장 좋아하는 것 중 하나가 됐어요.", "one of my favorites"], ["I don't remember any specific scenes now. It was so long ago. But it was a romance comedy TV show. It was super creative.", "지금은 구체적인 장면이 기억나지 않아요. 너무 오래전 일이거든요. 하지만 로맨스 코미디 드라마였어요. 정말 창의적이었어요.", "romance comedy TV show"], ["It totally changed how I feel about k-dramas.", "그 드라마를 보고 나서, 제가 K-드라마를 바라보는 시각 자체가 완전 바뀌었어요.", "k-dramas."], ["There's a whole series you can watch, so I'd definitely recommend it.", "시리즈도 그대로 있어서 쭉 볼 수 있고, 저는 정말 추천하고 싶어요.", "so I'd definitely recommend it"]]},
{"id": "t79", "name": "리얼리티 쇼 시청하기 (Reality Show) [과거경험]", "group": "주제 연습", "qs": [["Please tell me about a memorable scene you have seen from a reality tv show. Why was it so memorable? What happened? Please tell me in as much detail as you can.", "리얼리티 쇼에서 본 기억에 남는 장면에 대해 말씀해주세요. 왜 그렇게 기억에 남았나요? 무슨 일이 있었나요? 가능한 한 자세히 말씀해주세요."]], "cards": [["Umm… one of the movies I watched as a kid was Infinity Challenge.", "음… 제가 어릴 때 봤던 영화 중 하나가 무한도전이었어요.", "Infinity Challenge"], ["Everyone was talking about it. I don't really like following trends, but I ended up watching it anyway. I'm glad I did. It became one of my favorites.", "다들 그 얘기만 했어요. 저는 유행을 따라가는 걸 별로 안 좋아하지만, 어쨌든 보게 됐어요. 보길 잘했다고 생각해요. 그게 제가 가장 좋아하는 것 중 하나가 됐어요.", "one of my favorites"], ["I don't remember any specific scenes now. It was so long ago. But it was a reality TV show about crazy challenges. It was super creative.", "지금은 구체적인 장면이 기억나지 않아요. 너무 오래전 일이거든요. 하지만 특이한 도전들을 보여주는 리얼리티 TV 쇼였어요. 정말 창의적이었어요.", "reality TV show about crazy challenges"], ["It totally changed how I feel about reality TV shows.", "그 프로그램을 보고 나서, 제가 리얼리티 TV 쇼를 바라보는 시각 자체가 완전 바뀌었어요.", "reality TV shows"], ["There's a whole series you can watch, so I'd definitely recommend it.", "시리즈도 있고 스핀오프도 있어서 한번 정주행해보라고 추천하고 싶어요.", "so I'd definitely recommend it"]]},
{"id": "t80", "name": "공원(Park) [과거경험]", "group": "주제 연습", "qs": [["Tell me about the last time you went to a park. Where did you go? Who did you go with? What did you do there?", "마지막으로 공원에 간 경험에 대해 이야기해주세요. 어디에 갔고, 누구와 함께 갔나요? 그곳에서 무엇을 했는지 말씀해주세요"], ["Please tell me about something interesting or memorable that has happened at a park. When was it? What were you doing? Who were you with? Please describe why it was so memorable in detail.", "공원에서 있었던 재미있거나 기억에 남는 경험에 대해 이야기해주세요. 언제였나요? 무엇을 하고 있었나요? 누구와 함께 있었나요? 그 경험이 왜 그렇게 기억에 남았는지 자세히 설명해주세요."], ["Tell me one memorable or unforgettable experience you had at a park. Who were you with, and what did you do there? Was there a special event, or did something unexpected happen? Please explain what happened in detail.", "공원에서 있었던 잊을 수 없는 경험 하나를 말씀해주세요. 누구와 함께 있었고, 그곳에서 무엇을 했나요? 특별한 이벤트가 있었나요, 아니면 예상치 못한 일이 일어났나요? 무슨 일이 있었는지 자세히 설명해주세요."]], "cards": [["I'd like to tell you about a memorable experience I had at a park.", "제가 공원에서 겪었던 기억에 남는 경험에 대해 이야기해보고 싶어요.", "at a park"], ["To be honest, I normally didn't go there very often.", "솔직히 저는 평소에 그곳에 자주 가는 편이 아니었어요.", "go there very often"], ["But this time, I decided to try something different… and I'm so glad I did.", "하지만 그날은 뭔가 다르게 해보고 싶었고… 정말 잘한 선택이었어요.", "I decided to try something different… and I'm so glad I did"], ["It happened quite recently, and I was with a friend.", "그 일은 꽤 최근에 있었고, 저는 친구와 함께 있었어요.", "quite recently"], ["We were going for a jog, and at first, I wasn't really excited about it.", "우리는 조깅을 하고 있었는데, 처음에는 사실 별로 기대되지 않았어요.", "were going for a jog"], ["We kept walking a little further. Then we found a small outdoor concert. It was really relaxing.", "우리는 좀 더 걸어갔어요. 그러다가 작은 야외 콘서트를 발견했어요. 정말 편안했어요.", "small outdoor concert"], ["That experience completely changed my opinion.", "그 경험은 제 생각을 완전히 바꿔 놓았어요.", "That experience completely changed my opinion"], ["Before that day, I thought parks were boring.", "그날 전까지 저는 공원이 지루한 곳이라고 생각했거든요.", "parks were boring"], ["But after trying it myself, I felt differently.", "하지만 직접 경험해보니까 느낌이 달라졌어요.", "I felt differently"], ["Now, I go more often and even recommend it to others.", "지금은 더 자주 가기도 하고, 다른 사람들에게 추천까지 해요.", "go more often and even recommend it to others"], ["I still think about this memory. It helped me try something new. It gave me a new way of thinking.", "저는 이 기억을 지금도 종종 떠올려요. 그 경험은 저에게 새로운 걸 시도하게 해줬어요. 그리고 새로운 생각의 방식을 갖게 해줬어요.", "try something new"]]},
{"id": "t81", "name": "조깅 (Jogging) [과거경험]", "group": "주제 연습", "qs": [["Have you ever had a particularly memorable experience while jogging? What was it? When and where did you go jogging? Who did you go with? What happened, and how did you feel? Tell me about the experience from beginning to end.", "조깅을 하면서 특히 기억에 남는 경험이 있나요? 어떤 경험이었나요? 언제, 어디에서 조깅을 했나요? 누구와 함께 있었나요? 어떤 일이 있었고, 그때 어떤 기분이었는지 말씀해주세요. 처음부터 끝까지 그 경험에 대해 이야기해주세요."]], "cards": [["I'd like to tell you about a memorable experience I had at a park.", "제가 공원에서 겪었던 기억에 남는 경험에 대해 이야기해보고 싶어요.", "at a park"], ["To be honest, I normally didn't go there very often.", "솔직히 저는 평소에 그곳에 자주 가는 편이 아니었어요.", "go there very often"], ["But this time, I decided to try something different… and I'm so glad I did.", "하지만 그날은 뭔가 다르게 해보고 싶었고… 정말 잘한 선택이었어요.", "I decided to try something different… and I'm so glad I did"], ["It happened quite recently, and I was with a friend.", "그 일은 꽤 최근에 있었고, 저는 친구와 함께 있었어요.", "quite recently"], ["We were going for a jog, and at first, I wasn't really excited about it.", "우리는 조깅을 하고 있었는데, 처음에는 사실 별로 기대되지 않았어요.", "were going for a jog"], ["We kept walking a little further. Then we found a small outdoor concert. It was really relaxing.", "우리는 좀 더 걸어갔어요. 그러다가 작은 야외 콘서트를 발견했어요. 정말 편안했어요.", "small outdoor concert"], ["That experience completely changed my opinion.", "그 경험은 제 생각을 완전히 바꿔 놓았어요.", "That experience completely changed my opinion"], ["Before that day, I thought parks were boring.", "그날 전까지 저는 공원이 지루한 곳이라고 생각했거든요.", "parks were boring"], ["But after trying it myself, I felt differently.", "하지만 직접 경험해보니까 느낌이 달라졌어요.", "I felt differently"], ["Now, I go more often and even recommend it to others.", "지금은 더 자주 가기도 하고, 다른 사람들에게 추천까지 해요.", "go more often and even recommend it to others"], ["I still think about this memory. It helped me try something new. It gave me a new way of thinking.", "저는 이 기억을 지금도 종종 떠올려요. 그 경험은 저에게 새로운 걸 시도하게 해줬어요. 그리고 새로운 생각의 방식을 갖게 해줬어요.", "try something new"]]},
{"id": "t82", "name": "해변 (Beach) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable trip to the beach. Which beach were you at, and who were you with? What did you do there? What made this trip so special?", "기억에 남는 해변 여행에 대해 말해주세요. 당신은 어느 해변에 있었고, 누구와 함께 있었나요? 거기서 무엇을 하셨나요? 무엇이 이 여행을 그렇게 특별하게 만들었나요?"]], "cards": [["To be honest, I normally don't surf or do water sports at all.", "솔직히 저는 보통 서핑을 전혀 하지 않고, 수상 스포츠도 거의 안 해요.", "surf or do water sports at all"], ["But this time, I decided to try something different… and I'm so glad I did.", "그런데 이번에는 색다른 걸 한 번 해보고 싶어서 도전해 봤고, 정말 잘한 선택이었어요.", "I decided to try something different… and I'm so glad I did"], ["It happened last summer, and I was with my friends.", "작년 여름에 있었던 일이고, 친구들과 함께 있었어요.", "last summer"], ["We signed up for a surfing lesson. We went into the ocean. At first, I wasn't really excited about it.", "우리는 서핑 강습을 신청해서 바다에 들어갔는데, 처음에는 별로 기대가 되지 않았어요.", "surfing lesson"], ["But once I got into it, I realized it was actually really fun and challenging.", "하지만 막상 해보니까 정말 재미있고 도전적인 경험이라는 걸 알게 됐어요.", "really fun and challenging"], ["That experience completely changed my opinion.", "그 경험 덕분에 제 생각이 완전히 바뀌었어요.", "That experience completely changed my opinion"]]},
{"id": "t83", "name": "캠핑(Camping) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you had while camping. Where did you go, and what did you do there? What happened? How did you deal with it? What made this experience so memorable?", "캠핑을 하면서 겪은 기억에 남는 경험에 대해 말해주세요. 당신은 어디에 갔었고, 거기서 무엇을 했었나요? 무슨 일이 있었나요? 어떻게 대처하셨나요? 무엇이 이 경험을 그렇게 기억에 남게 했나요?"]], "cards": [["I'd like to tell you about a memorable experience I had while camping in my car.", "기억에 남는 경험 하나를 차에서 캠핑을 하면서 겪었던 이야기로 말씀드리고 싶어요.", "while camping in my car"], ["To be honest, I normally don't camp in a car or sleep in such a small space.", "솔직히 저는 보통 차에서 캠핑을 하거나 그렇게 좁은 공간에서 자는 편이 아니에요.", "camp in a car or sleep in such a small space"], ["But this time, I decided to try something different… and I'm so glad I did.", "그런데 이번에는 색다른 걸 해보고 싶어서 도전했고, 정말 잘한 선택이었어요.", "I decided to try something different… and I'm so glad I did"], ["It happened a while ago, and I was with my friends.", "그 일은 조금 전 있었고, 친구들과 함께 갔어요.", "with my friends"], ["We parked near a campsite. We set up simple bedding in the car. We also cooked some easy food. At first, I wasn't really excited about it.", "우리는 캠핑장 근처에 차를 세웠어요. 차 안에 간단한 침구를 준비했어요. 그리고 간단한 음식도 해 먹었어요. 처음에는 별로 기대하지 않았어요.", "set up simple bedding in the car"], ["But once I got into it, I realized it was actually really comfortable and convenient.", "하지만 막상 해보니까 의외로 편하고 효율적인 경험이라는 걸 알게 됐어요.", "really comfortable and convenient"], ["That experience completely changed my opinion.", "그 경험 덕분에 차박에 대한 제 생각이 완전히 바뀌었어요.", "That experience completely changed my opinion"]]},
{"id": "t84", "name": "미용실 (Hair Salon) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience related to getting a haircut. What happened? Why was it memorable? How did you feel about it?", "머리 자르는 것과 관련된 기억에 남는 경험을 말해주세요. 어떤 일이 있었나요? 왜 그 경험이 기억에 남았나요? 그 경험에 대해 어떻게 느꼈나요?"]], "cards": [["This one's kinda random, but I ran into someone I knew at my regular hair salon.", "이건 좀 뜬금없긴 한데, 제가 다니는 단골 미용실에서 아는 사람을 우연히 만났어요.", "my regular hair salon."], ["I wasn't expecting to see them there, so it kinda caught me off guard.", "거기서 볼 줄은 전혀 몰라서 순간 좀 당황했죠.", "so it kinda caught me off guard"], ["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요.", "made my day"], ["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요.", "world can feel really small"]]},
{"id": "t85", "name": "치과 (Dentist) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you had while visiting the doctor or dentist. When and where did this appointment take place? Why did you see the doctor or dentist? What made this experience so memorable to you?", "의사나 치과 의사를 방문했던 기억에 남는 경험에 대해 이야기해주세요. 이 방문은 언제, 어디서 이루어졌나요? 왜 의사나 치과 의사를 만나게 되었나요? 그 경험이 왜 그렇게 기억에 남았나요?"]], "cards": [["This one is a bit random. I ran into someone I knew at my dentist. I wasn't expecting to see them there. It caught me off guard.", "이건 좀 랜덤한 이야기예요. 치과에서 아는 사람을 만났어요. 거기서 그 사람을 볼 줄은 몰랐어요. 그래서 좀 당황했어요.", "caught me off guard"], ["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요.", "made my day"], ["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요.", "world can feel really small"]]},
{"id": "t86", "name": "은행 (Banks) 1 [과거경험]", "group": "주제 연습", "qs": [["When was the last time you went to a bank? Which bank did you visit? Why did you go there? Please describe your recent experience in detail.", "은행에 마지막으로 간 게 언제인가요? 당신은 어느 은행을 방문했나요? 왜 그 은행에 갔나요? 당신의 최근 경험에 대해 자세히 설명해 주세요."]], "cards": [["This one is a bit random. I ran into someone I knew at my dentist. I wasn't expecting to see them there. It caught me off guard.", "이건 좀 랜덤한 이야기예요. 치과에서 아는 사람을 만났어요. 거기서 그 사람을 볼 줄은 몰랐어요. 그래서 좀 당황했어요.", "caught me off guard"], ["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요.", "made my day"], ["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요.", "world can feel really small"]]},
{"id": "t87", "name": "은행 (Banks) 2 [과거경험]", "group": "주제 연습", "qs": [["When was the last time you went to a bank? Which bank did you visit? Why did you go there? Please describe your recent experience in detail.", "은행에 마지막으로 간 게 언제 인가요? 당신은 어느 은행을 방문했나요? 왜 그 은행에 갔나요? 당신의 최근 경험에 대해 자세히 설명해 주세요."]], "cards": [["This one's kinda random, but I ran into someone I knew at the bank.", "이건 좀 뜬금없는 얘기인데, 은행에서 아는 사람을 우연히 만났어요.", "but I ran into someone I knew at the bank"], ["I went in to open a new account. I wasn't expecting to see them there. It kinda caught me off guard.", "저는 새 계좌를 만들려고 들어갔어요. 거기서 그 사람을 볼 줄은 몰랐어요. 그래서 좀 당황했어요.", "caught me off guard"], ["We ended up talking for a bit. We just caught up about life and random stuff. It actually made my day.", "우리는 잠깐 얘기를 나눴어요. 그냥 서로 사는 얘기랑 이런저런 얘기를 했어요. 그게 제 하루를 좋게 만들어줬어요.", "made my day"], ["It felt nice to see a familiar face when I wasn't expecting it. It reminded me that the world can feel really small.", "예상치 못하게 아는 얼굴을 보니까 기분이 좋았어요. 세상이 생각보다 좁다는 걸 다시 느꼈어요.", "world can feel really small"]]},
{"id": "t88", "name": "은행 (Banks) 3 [과거경험]", "group": "주제 연습", "qs": [["Tell me the time when you had any problems at a bank. What was the problem? And how did you deal with the situation? Please describe all the details.", "은행에서 문제가 있었던 때에 대하여 말해 주세요. 무엇이 문제였나요? 그리고 당신은 그 상황을 어떻게 처리했나요? 모든 세부 사항을 설명해 주세요."]], "cards": [["Okay, great, so a problem hmm...", "좋아, 그러니까… 문제 하나가 딱 떠오르는데요.", "so a problem hmm"], ["Alright, I only have one thing on my mind and it's this.", "음… 솔직히 이것밖에 생각이 안 나요.", "I only have one thing on my mind and it's this"], ["The last time I went to the bank, there wasn't a single bathroom in the vicinity.", "마지막으로 은행에 갔을 때였는데, 근처에 화장실이 하나도 없는 거예요.", "the bank,"], ["I know this isn't really related to the question. But it was a horrifying experience. It was also a very real problem.", "질문이랑 완전히 관련 있는 이야기는 아니에요. 하지만 정말 끔찍한 경험이었어요. 그리고 진짜 현실적인 문제이기도 했어요.", "horrifying experience"], ["I was trying to find a bathroom. I almost died doing it. But thank God, I found one in another store nearby.", "저는 화장실을 찾고 있었어요. 거의 죽을 것 같았어요. 그런데 다행히 근처 다른 가게에서 화장실을 찾았어요.", "found one in another store nearby"], ["I swear, it was a horrible memory.", "진짜로 맹세하는데, 아직도 생각하면 끔찍한 기억이에요.", "it was a horrible memory"]]},
{"id": "t89", "name": "재활용 (Recycling) [과거경험]", "group": "주제 연습", "qs": [["Tell me about a memorable experience you had while recycling. What incident or event was it? What happened? And how did you deal with it? Why was it so special? Tell me all the experiences in detail.", "재활용을 하면서 기억에 남는 경험에 대해 이야기해주세요. 어떤 사건이었나요? 무슨 일이 일어났나요? 어떻게 대처했나요? 왜 그 경험이 그렇게 특별했나요? 그 경험을 자세히 이야기해주세요."]], "cards": [["Ah… this is such a difficult question because… like, c'mon it's recycling.", "아… 이건 좀 어려운 질문이네요, 왜냐면… 솔직히 말해서 이거 재활용이잖아요.", "recycling"], ["I don't think you can have a memorable experience with recycling. Let me think for a second. Honestly, I can't remember anything special about recycling. So, that's all I have for this one.", "재활용에는 특별히 기억에 남는 경험이 있을 수 없다고 생각해요. 잠깐 생각해볼게요. 솔직히 재활용에 관해서는 특별히 기억나는 게 없어요. 그래서 이 질문에 대해서는 이 정도가 다예요.", "can't remember anything special about recycling"]]},
{"id": "t90", "name": "재활용 (Recycling) 어드밴스 1 [과거경험]", "group": "주제 연습", "qs": [["Sometimes, problems can occur while recycling. Perhaps, the pick-up service did not come as planned, or the recycling items were too big for the containers, so you spilled the recycling items. Tell me what happened and how you dealt with it in detail.", "가끔 재활용 중에 문제가 생길 수 있습니다. 예를 들어, 수거 서비스가 계획대로 오지 않았거나, 재활용 품목이 너무 커서 컨테이너에 넣다가 흘렸을 수도 있습니다. 당신은 어떤 문제가 있었고, 어떻게 해결했는지 자세히 이야기해 주세요."]], "cards": [["Okay, so one problem I had while recycling happened a few weeks ago.", "재활용을 하다가 한 번 문제가 생긴 적이 있는데, 몇 주 전에 있었던 일이에요.", "so one problem I had while recycling happened a few weeks ago"], ["I think I was just tired or something. I put all the plastics in the paper bins. I also put all the paper in the vinyl bins. It was a mess.", "그냥 좀 피곤했던 것 같아요. 플라스틱을 전부 종이함에 넣었어요. 종이도 전부 비닐함에 넣었어요. 완전 엉망이었어요.", "It was a mess"], ["I still don't know why I made such a silly mistake. I had to spend my whole Sunday evening fixing it. I had to re-recycle everything.", "왜 그런 멍청한 실수를 했는지 아직도 모르겠어요. 일요일 저녁 내내 그걸 고쳐야 했어요. 모든 걸 다시 재활용해야 했어요.", "re-recycle everything"], ["It was the worst.", "정말 최악이었어요.", "It was the worst"]]},
{"id": "t91", "name": "재활용 (Recycling) 어드밴스 2 [과거경험]", "group": "주제 연습", "qs": [["Tell me about some articles you have recently seen about recycling in the news.", "최근 뉴스에서 본 재활용 기사에 대해 이야기해 주세요."]], "cards": [["So, unfortunately, I think this is going to be it for this one.", "음, 아쉽지만 이번 이야기는 이걸로 마무리일 것 같아요.", "I think this is going to be it for this one"], ["I'd like to talk about a recent experience I had.", "최근에 겪었던 한 가지 경험에 대해 이야기해볼게요.", "about a recent experience I had"], ["Earlier this month, I was reading the news on my phone and came across an article about new recycling laws in my city.", "이번 달 초에 휴대폰으로 뉴스를 보다가 제가 사는 도시의 새로운 재활용 규정에 관한 기사를 보게 됐어요.", "I was reading the news on my phone and came across an article about new recycling laws in my city"], ["I didn't expect much at first. But I learned something new. Some items I thought were recyclable are actually not recyclable. For example, oily food containers can't be recycled.", "처음에는 큰 기대를 안 했어요. 그런데 새로운 걸 알게 됐어요. 재활용이 된다고 생각했던 것들이 사실은 안 되는 경우가 있었어요. 예를 들어 기름 묻은 음식 용기는 재활용이 안 돼요.", "oily food containers"], ["Since then, I've been more careful about how I recycle at home. Overall, it was a small but memorable experience.", "그 이후로는 집에서 재활용할 때 더 신경 쓰게 됐어요. 전반적으로 작지만 기억에 남는 경험이었어요.", "it was a small but memorable experience"]]},
